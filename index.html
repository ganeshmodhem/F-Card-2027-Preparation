ns": [{"letter": "A", "text": "128"}, {"letter": "B", "text": "127"}, {"letter": "C", "text": "129"}, {"letter": "D", "text": "130"}], "answer": "C", "answer_text": "Section 129", "explanation": "CESTAT = Customs, Excise and Service Tax Appellate Tribunal. Customs Act च्या Section 129 अंतर्गत CESTAT ची constitution आहे.", "golden": "CESTAT → Section 129"}, {"no": 70, "q": "Q70. In order to conform to principles of natural justice while issuing Show Cause Notice under Section 124, essential ingredients are—", "options": [{"letter": "A", "text": "It must mention grounds for acting"}, {"letter": "B", "text": "Give opportunity of making representation against the grounds"}, {"letter": "C", "text": "Give opportunity of being heard in the matter"}, {"letter": "D", "text": "All of these"}], "answer": "D", "answer_text": "All of these", "explanation": "Natural Justice म्हणजे affected person ला fair opportunity देणे. SCN मध्ये: Grounds स्पष्ट असावेत ✔️ Representation ची संधी ✔️ Personal hearing ची संधी ✔️ म्हणून D.", "golden": "Natural Justice → Grounds + Representation + Hearing"}, {"no": 71, "q": "Q71. Whoever makes false declaration or submits false documents in the transaction of any business relating to Customs shall be punishable with—", "options": [{"letter": "A", "text": "Imprisonment up to 1 year or fine or both"}, {"letter": "B", "text": "Fine only"}, {"letter": "C", "text": "Imprisonment up to 2 years or fine or both"}, {"letter": "D", "text": "None of these"}], "answer": "C", "answer_text": "", "explanation": "Customs Act Section 132 नुसार false declaration किंवा false documents बाबत punishment: 👉 Up to 2 years imprisonment, किंवा fine, किंवा दोन्ही.", "golden": "False Declaration/Documents → Section 132 → 2 Years"}, {"no": 72, "q": "Q72. Under provisions of Customs Act, 1962, “culpable mental state” includes—", "options": [{"letter": "A", "text": "Intention"}, {"letter": "B", "text": "Knowledge of a fact"}, {"letter": "C", "text": "Reason to believe"}, {"letter": "D", "text": "All of these"}], "answer": "D", "answer_text": "All of these", "explanation": "Culpable mental state मध्ये intention, knowledge, belief/reason to believe इत्यादी मानसिक घटकांचा समावेश होतो.", "golden": "Culpable Mental State → Intention + Knowledge + Reason to Believe"}, {"no": 73, "q": "Q73. Offences by companies under Customs Act, 1962 are dealt under which section?", "options": [{"letter": "A", "text": "140"}, {"letter": "B", "text": "138"}, {"letter": "C", "text": "127"}, {"letter": "D", "text": "131"}], "answer": "A", "answer_text": "Section 140", "explanation": "Customs Act Section 140 company कडून झालेले offences आणि त्या वेळी company च्या conduct साठी responsible persons यांच्याशी संबंधित आहे.", "golden": "Offences by Companies → Section 140"}, {"no": 74, "q": "Q74. Conveyances and goods in a Customs area are subject to control of whom?", "options": [{"letter": "A", "text": "Custodian of goods"}, {"letter": "B", "text": "Central Industrial Security Force"}, {"letter": "C", "text": "Officer of Customs"}, {"letter": "D", "text": "None of these"}], "answer": "C", "answer_text": "Officer of Customs", "explanation": "Customs area मध्ये conveyances आणि goods वर Customs Officer चे control असते. Customs clearance, examination, movement इत्यादी Customs control अंतर्गत होतात.", "golden": "Customs Area → Control of Customs Officer"}, {"no": 75, "q": "Q75. Which of the following under Section 138C of Customs Act, 1962 is admissible as evidence?", "options": [{"letter": "A", "text": "Microfilm of a document"}, {"letter": "B", "text": "Facsimile copy of a document"}, {"letter": "C", "text": "Statement contained in a document and included in printed material produced by a computer"}, {"letter": "D", "text": "All of these"}], "answer": "D", "answer_text": "All of these", "explanation": "Section 138C electronic/computer-generated records आणि specified reproductions ना evidence म्हणून स्वीकारण्याची provision देते. Paper मध्ये: Microfilm ✔️ Facsimile copy ✔️ Computer-generated printed statement ✔️ म्हणून D.", "golden": "Section 138C → Electronic/Computer Records as Evidence"}, {"no": 76, "q": "Q76. Under Section 143AA, CBIC may simplify/provide different procedures in order to—", "options": [{"letter": "A", "text": "Maintain transparency in import/export documentation"}, {"letter": "B", "text": "Expedite clearance/release of goods"}, {"letter": "C", "text": "Reduce transaction cost"}, {"letter": "D", "text": "All of these"}], "answer": "D", "answer_text": "All of these", "explanation": "Section 143AA चा उद्देश Customs procedures अधिक: Transparent ✔️ Fast ✔️ Cost-effective ✔️ करण्याचा आहे. याच दिशेने e-Sanchit, SWIFT, Faceless Assessment सारख्या initiatives उपयोगी पडतात.", "golden": "Section 143AA → Transparency + Speed + Lower Cost"}, {"no": 77, "q": "Q77. The licence for Customs Broker under Customs Act, 1962 is issued under which section?", "options": [{"letter": "A", "text": "141"}, {"letter": "B", "text": "146"}, {"letter": "C", "text": "149"}, {"letter": "D", "text": "136"}], "answer": "B", "answer_text": "Section 146", "explanation": "Customs Act Section 146 Customs Broker licensing शी संबंधित आहे. CBLR मध्ये licence application, examination, conduct, suspension/cancellation इत्यादी detailed provisions आहेत.", "golden": "Customs Broker Licence → Section 146"}, {"no": 78, "q": "Q78. Which of the following provisions in respect of amendment of document is incorrect?", "options": [{"letter": "A", "text": "Amendment in Bill of Entry can be done before clearance of imported goods"}, {"letter": "B", "text": "Amendment in Shipping Bill can be done before export of goods"}, {"letter": "C", "text": "Amendment in Bill of Entry can be done after clearance of imported goods without documentary evidence"}, {"letter": "D", "text": "All of these"}], "answer": "C", "answer_text": "", "explanation": "Section 149 अंतर्गत clearance नंतर Bill of Entry मध्ये amendment करायचा असेल तर documentary evidence आवश्यक आहे. म्हणून: ❌ “After clearance without documentary evidence” — चुकीचे.", "golden": "Post-clearance Amendment → Documentary Evidence Required"}, {"no": 79, "q": "Q79. How many Participating Government Agencies (PGAs) were on board e-Sanchit application under SWIFT programme as on 30.12.2020?", "options": [{"letter": "A", "text": "51"}, {"letter": "B", "text": "50"}, {"letter": "C", "text": "53"}, {"letter": "D", "text": "None of these"}], "answer": "C", "answer_text": "53", "explanation": "Paper मध्ये 30 December 2020 रोजी e-Sanchit/SWIFT अंतर्गत: 👉 53 Participating Government Agencies दिलेल्या आहेत.", "golden": "30.12.2020 → e-Sanchit PGAs = 53"}, {"no": 80, "q": "Q80. Supporting documents for justification of Duty Exemption or fulfilment of Export Obligation Compliance Requirement were required to be uploaded in e-Sanchit along with Bill of Entry with effect from—", "options": [{"letter": "A", "text": "15.01.2021"}, {"letter": "B", "text": "15.07.2020"}, {"letter": "C", "text": "15.04.2021"}, {"letter": "D", "text": "None of these"}], "answer": "A", "answer_text": "15.01.2021", "explanation": "Paper/source नुसार 15 January 2021 पासून Duty Exemption किंवा Export Obligation compliance साठी required supporting documents e-Sanchit मध्ये Bill of Entry सोबत upload करणे आवश्यक झाले.", "golden": "e-Sanchit Supporting Documents → 15.01.2021"}, {"no": 81, "q": "Q81. The appeal filed by the importer against the Faceless Assessment will be taken up by?", "options": [{"letter": "A", "text": "Commissioner (Appeals) having jurisdiction where the Bill of Entry has been assessed by the Faceless Assessment"}, {"letter": "B", "text": "Commissioner (Appeals) having jurisdiction over the port of import where the consignment is imported"}, {"letter": "C", "text": "Commissioner (Appeals) Faceless Assessment at Delhi"}, {"letter": "D", "text": "None of these"}], "answer": "B", "answer_text": "", "explanation": "Faceless Assessment मध्ये assessment officer वेगळ्या ठिकाणी असू शकतो. पण appeal ज्या port वर goods import झाले आहेत त्या port च्या jurisdiction मधील Commissioner (Appeals) कडे जाते.", "golden": "Faceless Assessment Appeal → Port of Import jurisdiction"}, {"no": 82, "q": "Q82. Items which are prohibited for imports can be imported by SEZ unit with the prior approval of—", "options": [{"letter": "A", "text": "Development Commissioner of SEZ"}, {"letter": "B", "text": "Board of Approval"}, {"letter": "C", "text": "Additional Secretary, Ministry of Commerce"}, {"letter": "D", "text": "None of these"}], "answer": "B", "answer_text": "Board of Approval", "explanation": "SEZ unit ला prohibited items import करण्यासाठी Board of Approval (BoA) ची prior approval आवश्यक आहे. Development Commissioner स्वतःहून अशी permission देत नाही.", "golden": "SEZ + Prohibited Import → Board of Approval"}, {"no": 83, "q": "Q83. Destruction of goods by an SEZ unit can be done with the—", "options": [{"letter": "A", "text": "Permission of Authorized Officer in the presence of Specified Officer"}, {"letter": "B", "text": "Permission of Development Commissioner in the presence of Specified Officer"}, {"letter": "C", "text": "Permission of Specified Officer in the presence of Authorized Officer"}, {"letter": "D", "text": "Permission of Development Commissioner in the presence of Authorized Officer"}], "answer": "C", "answer_text": "", "explanation": "SEZ unit मधील goods destroy करण्यासाठी: Permission → Specified Officer Presence → Authorized Officer आवश्यक आहे.", "golden": "SEZ Goods Destruction → Specified Officer + Authorized Officer"}, {"no": 84, "q": "Q84. What time limit has been prescribed for issuing speaking order where importer does not accept re-assessment?", "options": [{"letter": "A", "text": "15 days"}, {"letter": "B", "text": "30 days"}, {"letter": "C", "text": "45 days"}, {"letter": "D", "text": "7 days"}], "answer": "A", "answer_text": "15 days", "explanation": "Importer ने reassessment accept केले नाही तर proper officer ने speaking order issue करणे आवश्यक आहे. Paper मध्ये time limit: 👉 15 days from the date of reassessment दिलेली आहे.", "golden": "Reassessment not accepted → Speaking Order → 15 Days"}, {"no": 85, "q": "Q85. How many copies of the Import Certificate for import of Narcotic Drugs and Psychotropic Substances are issued by the issuing authority?", "options": [{"letter": "A", "text": "4"}, {"letter": "B", "text": "5"}, {"letter": "C", "text": "6"}, {"letter": "D", "text": "7"}], "answer": "D", "answer_text": "7", "explanation": "NDPS Rules, 1985 नुसार Import Certificate च्या: 👉 7 copies issue केल्या जातात. या copies संबंधित Customs आणि enforcement authorities मध्ये circulation साठी असतात.", "golden": "NDPS Import Certificate → 7 Copies"}, {"no": 86, "q": "Q86. As per NDPS Rules, 1985, Narcotics Commissioner shall issue or deny Import Certificate within—", "options": [{"letter": "A", "text": "15 days"}, {"letter": "B", "text": "21 days"}, {"letter": "C", "text": "28 days"}, {"letter": "D", "text": "None of these"}], "answer": "B", "answer_text": "21 days", "explanation": "Complete application प्राप्त झाल्यानंतर Narcotics Commissioner ने Import Certificate issue किंवा deny करण्याची प्रक्रिया: 👉 21 days मध्ये करायची आहे.", "golden": "NDPS Import Certificate → 21 Days 📘 Q87–90"}, {"no": 87, "q": "Q87. As per NDPS (Regulation of Controlled Substances) Order, 1993, every importer/exporter of controlled substance shall preserve daily account records for—", "options": [{"letter": "A", "text": "Two years"}, {"letter": "B", "text": "Six months"}, {"letter": "C", "text": "Eighteen months"}, {"letter": "D", "text": "None of these"}], "answer": "A", "answer_text": "Two years", "explanation": "Controlled substances च्या receipt/import/sale/consumption/export चे daily records prescribed format मध्ये maintain करणे आवश्यक आहे. Record preservation period: 👉 2 years", "golden": "Controlled Substance Records → 2 Years"}, {"no": 88, "q": "Q88. Every registered person under NDPS (Regulation of Controlled Substances) Order, 1993 shall file quarterly return with—", "options": [{"letter": "A", "text": "Narcotics Commissioner, Gwalior"}, {"letter": "B", "text": "Drug Controller of India, New Delhi"}, {"letter": "C", "text": "Zonal Director, Narcotics Control Bureau"}, {"letter": "D", "text": "None of these"}], "answer": "C", "answer_text": "Zonal Director, Narcotics Control Bureau", "explanation": "Controlled substances बाबत receipt, import, sale, consumption किंवा export ची quarterly return: 👉 Zonal Director, Narcotics Control Bureau यांच्याकडे file केली जाते.", "golden": "NDPS Quarterly Return → Zonal Director, NCB"}, {"no": 89, "q": "Q89. Authorized Officer conducting investigations/enquiry in respect of safeguard quantitative restrictions shall not be below the rank of—", "options": [{"letter": "A", "text": "Deputy Director General of Foreign Trade"}, {"letter": "B", "text": "Additional Director General of Foreign Trade"}, {"letter": "C", "text": "Assistant Director General of Foreign Trade"}, {"letter": "D", "text": "Director General of Foreign Trade"}], "answer": "B", "answer_text": "Additional Director General of Foreign Trade", "explanation": "Safeguard quantitative restrictions संदर्भातील investigation/enquiry करणारा Authorized Officer हा किमान: 👉 Additional Director General of Foreign Trade rank चा असणे आवश्यक आहे.", "golden": "Safeguard QR Investigation → ADGFT minimum"}, {"no": 90, "q": "Q90. Safeguard quantitative restrictions imposed under Safeguard Measure (Quantitative Restrictions) Rules, 2012 shall not be imposed beyond—", "options": [{"letter": "A", "text": "5 years"}, {"letter": "B", "text": "7 years"}, {"letter": "C", "text": "10 years"}, {"letter": "D", "text": "None of these"}], "answer": "C", "answer_text": "10 years", "explanation": "Safeguard quantitative restriction ही temporary trade-remedy measure आहे. Paper नुसार maximum period: 👉 10 years पेक्षा जास्त नसतो.", "golden": "Safeguard Quantitative Restriction → Maximum 10 Years"}, {"no": 91, "q": "Q91. Which statements are true with regard to First Check Appraisement?", "options": [{"letter": "A", "text": "Statements (i) and (ii) only"}, {"letter": "B", "text": "Statements (ii) and (iii) only"}, {"letter": "C", "text": "Statements (i) and (iii) only"}, {"letter": "D", "text": "Statements (i), (ii) and (iii) are true"}], "answer": "D", "answer_text": "", "explanation": "First Check मध्ये goods चे physical examination assessmentपूर्वी होते. हे: Importer request करू शकतो ✔️ Assessing Officer आवश्यक मानू शकतो ✔️ Examination before assessment ✔️ म्हणून तीनही statements correct.", "golden": "First Check → Examination Before Assessment"}, {"no": 92, "q": "Q92. Which of the following is NOT TRUE regarding facilities granted to AEO-T2 certificate holders?", "options": [{"letter": "A", "text": "Self-sealing of export goods without case-to-case permission"}, {"letter": "B", "text": "Will not be subjected to regular transactional PCA and onsite PCA will be conducted once in three years"}, {"letter": "C", "text": "Facility to paste MRP sticker in their premises may be given"}, {"letter": "D", "text": "None of these"}], "answer": "D", "answer_text": "None of these", "explanation": "Paper नुसार AEO-T2 holders ना दिलेल्या facilities मध्ये वरील सर्व statements correct आहेत. म्हणून NOT TRUE statement नाही.", "golden": "AEO-T2 → Multiple Customs Facilitation Benefits"}, {"no": 93, "q": "Q93. Under Arms Rules, 2016, licence for temporary import of arms and ammunition for international sports persons participating in shooting events in India may be granted—", "options": [{"letter": "A", "text": "One month prior to expected arrival"}, {"letter": "B", "text": "Two months prior"}, {"letter": "C", "text": "Three months prior"}, {"letter": "D", "text": "Six months prior"}], "answer": "A", "answer_text": "One month prior", "explanation": "International sports person shooting event साठी India मध्ये येत असल्यास temporary import licence साठी application/permission: 👉 Expected arrival च्या 1 month prior असू शकते.", "golden": "Sports Person + Temporary Arms Import → 1 Month Prior"}, {"no": 94, "q": "Q94. Under Arms Rules, 2016, licence for temporary import of arms/ammunition specified in Category III of Schedule 1 for a foreign visitor to display at a trade show in India may be granted—", "options": [{"letter": "A", "text": "One month prior"}, {"letter": "B", "text": "Two months prior"}, {"letter": "C", "text": "Three months prior"}, {"letter": "D", "text": "Six months prior"}], "answer": "D", "answer_text": "Six months prior", "explanation": "Foreign visitor trade show मध्ये arms/ammunition display करणार असल्यास temporary import licence साठी prescribed period: 👉 Expected arrival च्या 6 months prior आहे.", "golden": "Foreign Visitor + Trade Show Arms → 6 Months Prior"}, {"no": 95, "q": "Q95. B-17 Bond executed by Export Oriented Unit (EOU) is taken for an amount equivalent to—", "options": [{"letter": "A", "text": "25% of duty foregone on sanctioned requirement of Capital Goods + duty foregone on raw material required for 3 months"}, {"letter": "B", "text": "15% of duty foregone on sanctioned requirement of Capital Goods + duty foregone on raw material required for 3 months"}, {"letter": "C", "text": "25% of duty foregone on sanctioned requirement of Capital Goods + duty foregone on raw material required for 6 months"}, {"letter": "D", "text": "15% of duty foregone on sanctioned requirement of Capital Goods + duty foregone on raw material required for 3 months"}], "answer": "A", "answer_text": "", "explanation": "EOU चा B-17 Bond हा: 25% of duty foregone on sanctioned Capital Goods requirement + Raw material साठी 3 months चा duty foregone इतका असतो.", "golden": "B-17 Bond → 25% Capital Goods + 3 Months Raw Material"}, {"no": 96, "q": "Q96. Which of the following is TRUE with respect to exemption from furnishing bank guarantee by EOU?", "options": [{"letter": "A", "text": "Units with positive NFE, 3 years existence, no substantive SCN in preceding 3 years"}, {"letter": "B", "text": "Units with positive NFE, 3 years existence, turnover ₹5 crore or more, no substantive SCN in preceding 3 years"}, {"letter": "C", "text": "Units with positive NFE, 3 years existence, turnover ₹2 crore or more, no substantive SCN in preceding 3 years"}, {"letter": "D", "text": "Units with positive NFE, 3 years existence, turnover ₹3 crore or more, no substantive SCN in preceding 3 years"}], "answer": "B", "answer_text": "", "explanation": "Bank Guarantee exemption साठी EOU ने prescribed conditions satisfy करणे आवश्यक आहे. Paper मधील मुख्य conditions: Positive NFE ✔️ Minimum 3 years operational existence ✔️ ₹5 crore or more turnover ✔️ Substantive grounds वर SCN नसणे ✔️ म्हणून B.", "golden": "EOU BG Exemption → Positive NFE + 3 Years + ₹5 Cr Turnover + No substantive SCN"}, {"no": 97, "q": "Q97. Which of the following is TRUE regarding depreciation allowed on capital goods other than computers and peripherals to an EOU?", "options": [{"letter": "A", "text": "1st year 5%, 2nd 4%, 3rd 3%, 4th & 5th 2%, thereafter 1.5%"}, {"letter": "B", "text": "1st year 4%, 2nd 3%, 3rd 3%, 4th & 5th 2.5%, thereafter 2%"}, {"letter": "C", "text": "1st year 5%, 2nd 3%, 3rd 2.5%, 4th & 5th 2%, thereafter 1.5%"}, {"letter": "D", "text": "1st year 4%, 2nd 3%, 3rd 2.5%, 4th & 5th 2%, thereafter 1.5%"}], "answer": "B", "answer_text": "", "explanation": "Paper मधील correct depreciation schedule: 1st year: 4% per quarter 2nd year: 3% per quarter 3rd year: 3% per quarter 4th & 5th year: 2.5% per quarter Thereafter: 2%", "golden": "EOU Capital Goods Depreciation → 4% → 3% → 3% → 2.5% → 2%"}, {"no": 98, "q": "Q98. Which case is NOT to be taken by SVB for investigation in case of related party import?", "options": [{"letter": "A", "text": "Where value of imported goods is less than ₹1 lakh"}, {"letter": "B", "text": "Where value of imported goods is less than ₹2 lakh"}, {"letter": "C", "text": "Where value of imported goods is less than ₹5 lakh"}, {"letter": "D", "text": "Where value of imported goods is less than ₹10 lakh"}], "answer": "A", "answer_text": "Less than ₹1 lakh", "explanation": "Paper/source नुसार related-party imports मध्ये declared value ₹1 lakh पेक्षा कमी असल्यास routine SVB investigation आवश्यक नाही. यामुळे low-value transactions वर unnecessary scrutiny कमी होते.", "golden": "SVB Threshold → Below ₹1 Lakh → Normally not referred"}, {"no": 99, "q": "Q99. Which statement is NOT TRUE regarding facilities extended to AEO-T1 under AEO Scheme?", "options": [{"letter": "A", "text": "Separate space is earmarked in Custodian's premises"}, {"letter": "B", "text": "Investigations to be completed within 6–9 months"}, {"letter": "C", "text": "Disbursal of drawback in 72 hours of filing of EGM"}, {"letter": "D", "text": "None of these"}], "answer": "C", "answer_text": "", "explanation": "72 hours drawback disbursal ही facility AEO-T2 category शी संबंधित आहे, AEO-T1 शी नाही. म्हणून C हे NOT TRUE आहे.", "golden": "72-hour Drawback → AEO-T2, not AEO-T1"}, {"no": 100, "q": "Q100. The frequency of review of AEO-T2 status, to ensure continued adherence to conditions and standards of grant of AEO status, will be—", "options": [{"letter": "A", "text": "Two years"}, {"letter": "B", "text": "Three years"}, {"letter": "C", "text": "Five years"}, {"letter": "D", "text": "None of these"}], "answer": "B", "answer_text": "Three years", "explanation": "AEO-T2 status मिळाल्यानंतर continued compliance तपासण्यासाठी review: 👉 Every 3 years केला जातो.", "golden": "AEO-T2 Review → 3 Years"}, {"no": 101, "q": "Q101. One-time extension for submitting Installation Certificate for imported Capital goods under EPCG scheme can be given by the concerned RA?", "options": [{"letter": "A", "text": "For a maximum period of 06 months"}, {"letter": "B", "text": "For a maximum period of 03 months"}, {"letter": "C", "text": "For a maximum period of 12 months"}, {"letter": "D", "text": "For a maximum period of 09 months"}], "answer": "C", "answer_text": "Maximum 12 months", "explanation": "EPCG scheme मध्ये imported capital goods install करून त्याचे Installation Certificate submit करावे लागते. Concerned Regional Authority (RA) कडून one-time extension up to 12 months मिळू शकते.", "golden": "EPCG Installation Certificate → One-time extension = 12 months"}, {"no": 102, "q": "Q102. An EOU/EHTP/STP unit may be allowed by concerned Customs Authorities to donate imported computers and computer peripherals to school run by Central Government or State Government?", "options": [{"letter": "A", "text": "Without payment of duty other than applicable taxes under GST Law one year after their import and use"}, {"letter": "B", "text": "Without payment of duty other than applicable taxes under GST Law two years after their import and use"}, {"letter": "C", "text": "Without payment of duty other than applicable taxes under GST Law three years after their import and use"}, {"letter": "D", "text": "None of these"}], "answer": "B", "answer_text": "", "explanation": "EOU/EHTP/STP unit ने imported computers/peripherals वापरल्यानंतर prescribed conditions पूर्ण केल्यास ते Central/State Government school ला donate करू शकतात. Paper मध्ये period 2 years after import and use दिला आहे.", "golden": "EOU Computer Donation → 2 Years after import & use"}, {"no": 103, "q": "Q103. What is the limit of penalty that can be imposed on the authorised carrier who contravenes any provisions of Sea Cargo Manifest and Transhipment Regulations, 2018?", "options": [{"letter": "A", "text": "₹25,000"}, {"letter": "B", "text": "₹50,000"}, {"letter": "C", "text": "₹1,00,000"}, {"letter": "D", "text": "₹2,00,000"}], "answer": "B", "answer_text": "₹50,000", "explanation": "SCMTR, 2018 मधील provisions चे authorised carrier ने contravention केल्यास penalty: 👉 Maximum ₹50,000 आहे.", "golden": "SCMTR Authorised Carrier Penalty → ₹50,000"}, {"no": 104, "q": "Q104. Before which authority can an appeal be filed by a person aggrieved by any decision or order passed under Sea Cargo Manifest and Transhipment Regulations, 2018?", "options": [{"letter": "A", "text": "CESTAT"}, {"letter": "B", "text": "Commissioner (Appeals)"}, {"letter": "C", "text": "Chief Commissioner of Customs"}, {"letter": "D", "text": "None of these"}], "answer": "A", "answer_text": "CESTAT", "explanation": "SCMTR अंतर्गत decision/order मुळे person aggrieved असल्यास appeal: Customs, Excise and Service Tax Appellate Tribunal (CESTAT) समोर करता येते.", "golden": "SCMTR Appeal → CESTAT"}, {"no": 105, "q": "Q105. After how much period the interest shall be payable on amount of duty payable at the time of clearance of goods from warehouse?", "options": [{"letter": "A", "text": "Beyond 30 days from date of deposit"}, {"letter": "B", "text": "Beyond 90 days from date of deposit"}, {"letter": "C", "text": "Beyond 180 days from date of deposit"}, {"letter": "D", "text": "Beyond 365 days from date of deposit"}], "answer": "B", "answer_text": "Beyond 90 days", "explanation": "Warehoused goods जर warehouse मध्ये 90 days पेक्षा जास्त राहिले, तर prescribed interest लागू होतो. Paper मध्ये interest 90 days नंतर payable असल्याचे दिले आहे.", "golden": "Warehouse → Beyond 90 Days → Interest"}, {"no": 106, "q": "Q106. When can the warehousing bond be cancelled?", "options": [{"letter": "A", "text": "After all goods have been cleared for home consumption or exported or transferred"}, {"letter": "B", "text": "After all goods have been duly accounted for"}, {"letter": "C", "text": "After all amounts due on account of such goods have been paid"}, {"letter": "D", "text": "All of these"}], "answer": "D", "answer_text": "All of these", "explanation": "Warehousing bond cancel करण्यासाठी सर्व relevant obligations पूर्ण झालेले असणे आवश्यक आहे: ✔️ Goods cleared/exported/transferred ✔️ Goods duly accounted for ✔️ Duty, interest, penalty इत्यादी dues paid म्हणून All of these.", "golden": "Warehouse Bond Cancellation → A + B + C"}, {"no": 107, "q": "Q107. In case of transhipment of goods directly between two sea ports, which statement is correct?", "options": [{"letter": "A", "text": "Authorised carrier has to execute a bond"}, {"letter": "B", "text": "Authorised carrier has to execute bond with bank guarantee"}, {"letter": "C", "text": "No bond and bank guarantee have to be executed"}, {"letter": "D", "text": "Duty has to be paid before transhipment"}], "answer": "C", "answer_text": "", "explanation": "SCMTR Regulation 5(2) नुसार authorised carrier कडून two sea ports मधील direct transhipment साठी bond किंवा bank guarantee आवश्यक नाही.", "golden": "Direct Sea Port → Sea Port Transhipment → No Bond + No BG Q108–Q115"}, {"no": 108, "q": "Q108. The Jurisdictional Commissioner of Customs can extend the period of completion of audit by?", "options": [{"letter": "A", "text": "From 10 days to 20 days"}, {"letter": "B", "text": "From 20 days to 30 days"}, {"letter": "C", "text": "From 30 days to 60 days"}, {"letter": "D", "text": "From 60 days to 90 days"}], "answer": "C", "answer_text": "30 days to 60 days", "explanation": "Post Clearance Audit (PCA) चा normal completion period 30 days आहे. Complex case असल्यास Jurisdictional Commissioner तो period: 👉 60 days पर्यंत extend करू शकतो.", "golden": "PCA → 30 Days → Extend up to 60 Days"}, {"no": 109, "q": "Q109. How many persons other than an F-Card holder can be employed by a Customs Broker?", "options": [{"letter": "A", "text": "Not more than 50"}, {"letter": "B", "text": "Not more than 20"}, {"letter": "C", "text": "Not more than 100"}, {"letter": "D", "text": "Without any limit"}], "answer": "D", "answer_text": "Without any limit", "explanation": "Customs Broker किती employees ठेवू शकतो यावर prescribed upper limit नाही. परंतु Customs समोर documents sign/represent करण्यासाठी authorised F-Card/G-Card holders महत्त्वाचे आहेत.", "golden": "CB Employees → No upper limit"}, {"no": 110, "q": "Q110. Power to search premises are vested under which Section of the Customs Act, 1962?", "options": [{"letter": "A", "text": "106A"}, {"letter": "B", "text": "107"}, {"letter": "C", "text": "105"}, {"letter": "D", "text": "106"}], "answer": "C", "answer_text": "Section 105", "explanation": "Customs Act Section 105 customs officer ला premises search करण्याचा power देते, जर goods liable to confiscation किंवा relevant documents लपवले असल्याचा reason to believe असेल.", "golden": "Search Premises → Section 105"}, {"no": 111, "q": "Q111. The penalties for contravention, not expressly mentioned under the Customs Act, 1962 are envisaged under Section?", "options": [{"letter": "A", "text": "118"}, {"letter": "B", "text": "124"}, {"letter": "C", "text": "117"}, {"letter": "D", "text": "128"}], "answer": "C", "answer_text": "Section 117", "explanation": "ज्या contravention साठी Customs Act मध्ये specific penalty दिलेली नाही, अशा contravention साठी Section 117 लागू होतो.", "golden": "No specific penalty → Section 117"}, {"no": 112, "q": "Q112. Where any goods are seized under Section 110(1) and no Show Cause Notice is issued, the seized goods shall be returned if SCN is not issued within?", "options": [{"letter": "A", "text": "One year"}, {"letter": "B", "text": "Three months"}, {"letter": "C", "text": "Six months"}, {"letter": "D", "text": "None of these"}], "answer": "C", "answer_text": "Six months", "explanation": "Section 110(2) नुसार seizure झाल्यानंतर 6 months मध्ये SCN issue झाला नाही तर seized goods संबंधित व्यक्तीला return करावे लागतात. Commissioner prescribed circumstances मध्ये हा period आणखी 6 months extend करू शकतो.", "golden": "Seizure → SCN within 6 Months"}, {"no": 113, "q": "Q113. If any person resists or refuses to allow a radiologist to screen or take X-ray pictures of his body under an order of Magistrate under Section 103, he shall be punishable with?", "options": [{"letter": "A", "text": "Imprisonment up to 1 year or fine or both"}, {"letter": "B", "text": "Imprisonment up to 6 months"}, {"letter": "C", "text": "Imprisonment up to 2 years"}, {"letter": "D", "text": "Imprisonment up to 6 months or with fine or both"}], "answer": "D", "answer_text": "", "explanation": "Section 103 अंतर्गत Magistrate च्या order नुसार body screening/X-ray करण्यास refusal किंवा resistance केल्यास: 👉 6 months पर्यंत imprisonment किंवा fine किंवा both अशी punishment आहे.", "golden": "Refuse X-ray → 6 Months / Fine / Both"}, {"no": 114, "q": "Q114. A person shall be punishable with imprisonment up to seven years and with fine in the case of an offence related to?", "options": [{"letter": "A", "text": "Goods whose market price exceeds ₹1 crore"}, {"letter": "B", "text": "Evasion/attempted evasion of duty exceeding ₹50 lakhs"}, {"letter": "C", "text": "Notified categories of prohibited goods"}, {"letter": "D", "text": "All of these"}], "answer": "D", "answer_text": "All of these", "explanation": "Section 135 मध्ये serious customs offences साठी enhanced punishment आहे. या प्रश्नातील सर्व circumstances मध्ये up to 7 years imprisonment + fine लागू होऊ शकते.", "golden": "Sec.135 Serious Offence → Up to 7 Years + Fine"}, {"no": 115, "q": "Q115. Which of the following, under Section 135 of Customs Act, 1962, without prejudice to any action under this Act, is correct?", "options": [{"letter": "A", "text": "Misdeclaration of value/evasion of duty"}, {"letter": "B", "text": "Fraudulently avails or attempts to avail drawback"}, {"letter": "C", "text": "Attempts to export goods which he knows/reason to believe are liable to confiscation"}, {"letter": "D", "text": "All of these"}], "answer": "D", "answer_text": "All of these", "explanation": "Section 135 मध्ये अनेक प्रकारचे customs offences covered आहेत: ✔️ Misdeclaration/value or duty evasion ✔️ Wrongful/fraudulent drawback claim ✔️ Attempt to export goods liable to confiscation म्हणून All of these.", "golden": "Section 135 → Duty Evasion + Drawback Fraud + Improper Export Q116–119"}, {"no": 116, "q": "Q116. Which of the following Officers are hereby empowered and required to assist officers of Customs in execution of Customs Act, 1962?", "options": [{"letter": "A", "text": "Officers ters?", "options": [{"letter": "A", "text": "Chapter 59"}, {"letter": "B", "text": "Chapter 68"}, {"letter": "C", "text": "Chapter 19"}, {"letter": "D", "text": "Chapter 40"}], "answer": "D", "answer_text": "Chapter 40", "explanation": "Rubber आणि articles thereof हे Chapter 40 मध्ये येतात. Pneumatic rubber tyres सुद्धा Chapter 40 मध्ये classify होतात.", "golden": "Rubber Tyres → Chapter 40"}, {"no": 130, "q": "Q130. “Acid Blacks Azo Dyes” are classifiable under which of the following chapters?", "options": [{"letter": "A", "text": "Chapter 32"}, {"letter": "B", "text": "Chapter 72"}, {"letter": "C", "text": "Chapter 59"}, {"letter": "D", "text": "Chapter 62"}], "answer": "A", "answer_text": "Chapter 32", "explanation": "Dyes, colouring matter आणि related preparations हे Chapter 32 मध्ये येतात.", "golden": "Dyes → Chapter 32"}, {"no": 131, "q": "Q131. In case of imported articles of food, who shall take its sample?", "options": [{"letter": "A", "text": "The authorised officer of the FSSAI"}, {"letter": "B", "text": "The authorised officer of DGFT"}, {"letter": "C", "text": "The authorised officer of Police"}, {"letter": "D", "text": "The authorised officer of the Food Import Council"}], "answer": "A", "answer_text": "Authorised Officer of FSSAI", "explanation": "Imported food ची safety/quality तपासणी करण्यासाठी FSSAI (Food Safety and Standards Authority of India) च्या authorised officer कडून sample घेतला जातो.", "golden": "Imported Food Sample → FSSAI Authorised Officer"}, {"no": 132, "q": "Q132. The nodal Ministry to deal with the trans-boundary movement of hazardous wastes is—", "options": [{"letter": "A", "text": "Ministry of Environment and Forest"}, {"letter": "B", "text": "Ministry of Finance"}, {"letter": "C", "text": "Ministry of Home Affairs"}, {"letter": "D", "text": "Ministry of Agriculture"}], "answer": "A", "answer_text": "Ministry of Environment and Forest", "explanation": "Hazardous waste च्या trans-boundary movement साठी nodal ministry म्हणून Environment Ministry काम करते. याचा संबंध environmental protection आणि hazardous waste management शी आहे.", "golden": "Hazardous Waste Trans-boundary → Environment Ministry"}, {"no": 133, "q": "Q133. What is ITC(HS)?", "options": [{"letter": "A", "text": "Important Trade Classification (Harmonized System)"}, {"letter": "B", "text": "Import Trade Classification (Harmonized and Systematic)"}, {"letter": "C", "text": "Import Trade Classes (Harmonized System)"}, {"letter": "D", "text": "Import Trade Classification (Harmonized System)"}], "answer": "D", "answer_text": "Import Trade Classification (Harmonized System)", "explanation": "ITC(HS) = Indian Trade Classification (Harmonized System) असे सामान्यतः ओळखले जाते; परंतु तुमच्या paper मध्ये option D आणि त्याचे answer दिलेले आहे. Paper-based preparation साठी D लक्षात ठेवा.", "golden": "ITC(HS) → Import Trade Classification (Harmonized System) — paper answer D"}, {"no": 134, "q": "Q134. What is the time-limit for filing claim for refund of duty under Section 27 of Customs Act, 1962?", "options": [{"letter": "A", "text": "One month from relevant date"}, {"letter": "B", "text": "Three months from relevant date"}, {"letter": "C", "text": "Six months from relevant date"}, {"letter": "D", "text": "One year from relevant date"}], "answer": "D", "answer_text": "One year", "explanation": "Section 27 अंतर्गत duty refund claim prescribed limitation period मध्ये करावा लागतो. Paper/source मध्ये time limit: 👉 One year from relevant date दिलेली आहे.", "golden": "Section 27 Refund → 1 Year"}, {"no": 135, "q": "Q135. If the exporter finds that the amount of drawback paid is less than what is due, then he—", "options": [{"letter": "A", "text": "Can only file a letter of protest"}, {"letter": "B", "text": "Cannot claim the difference"}, {"letter": "C", "text": "May file a supplementary drawback claim"}, {"letter": "D", "text": "None of these"}], "answer": "C", "answer_text": "May file a supplementary drawback claim", "explanation": "Exporter ला actual eligible drawback पेक्षा कमी amount मिळाला असल्यास supplementary drawback claim file करता येतो.", "golden": "Drawback short paid → Supplementary Drawback Claim"}, {"no": 136, "q": "Q136. The value for personal carriage of gems and jewellery items, by a person authorised by the SEZ unit, for holding or participating in overseas exhibitions, with prior approval of competent authority, subject to conditions mentioned in SEZ Rules, 2006 is—", "options": [{"letter": "A", "text": "Not exceeding US$ One million"}, {"letter": "B", "text": "Not exceeding US$ Two million"}, {"letter": "C", "text": "Not exceeding US$ Four million"}, {"letter": "D", "text": "None of these"}], "answer": "B", "answer_text": "Not exceeding US$ 2 million", "explanation": "SEZ Rules, 2006 अंतर्गत overseas exhibition साठी gems/jewellery personally carry करण्याची facility आहे. Maximum value: 👉 US$ 2 million", "golden": "SEZ Gems/Jewellery Exhibition → US$ 2 Million"}, {"no": 137, "q": "Q137. Appeal against order passed by CESTAT in respect of valuation of imported goods lies with—", "options": [{"letter": "A", "text": "Supreme Court of India"}, {"letter": "B", "text": "High Court"}, {"letter": "C", "text": "JS (RA)"}, {"letter": "D", "text": "Central Government"}], "answer": "A", "answer_text": "Supreme Court of India", "explanation": "Customs valuation/classification सारख्या specified matters मध्ये CESTAT च्या order विरुद्ध appeal Supreme Court कडे जाते, विशेषतः question involving valuation/classification च्या legal interpretation संदर्भात.", "golden": "CESTAT + Valuation/Classification → Supreme Court"}, {"no": 138, "q": "Q138. Export Data Processing and Monitoring System (EDPMS) for monitoring exports of goods and software has been developed by?", "options": [{"letter": "A", "text": "CBIC"}, {"letter": "B", "text": "RBI"}, {"letter": "C", "text": "DGFT"}, {"letter": "D", "text": "None of these"}], "answer": "B", "answer_text": "RBI", "explanation": "EDPMS = Export Data Processing and Monitoring System. हे exports आणि export proceeds/remittances monitor करण्यासाठी Reserve Bank of India (RBI) ने develop केले आहे.", "golden": "EDPMS → RBI"}, {"no": 139, "q": "Q139. Uncleared Article of food means an imported article of food consignment for which delivery is not taken after receipt of NOC from Food Authority (FSSAI) within a period of—", "options": [{"letter": "A", "text": "15 days"}, {"letter": "B", "text": "21 days"}, {"letter": "C", "text": "30 days"}, {"letter": "D", "text": "45 days"}], "answer": "C", "answer_text": "30 days", "explanation": "FSSAI NOC मिळाल्यानंतरही imported food consignment ची delivery घेतली नाही तर prescribed period नंतर त्याला Uncleared Article of Food म्हटले जाते. Paper मध्ये period: 👉 30 days दिलेला आहे.", "golden": "FSSAI NOC + No Delivery → 30 Days"}, {"no": 140, "q": "Q140. After the recommendation of AEO Programme Team, the AEO Programme Manager shall inform the applicant seeking AEO-T2 certificate including the issue of certificate within a period of—", "options": [{"letter": "A", "text": "15 days"}, {"letter": "B", "text": "30 days"}, {"letter": "C", "text": "45 days"}, {"letter": "D", "text": "21 days"}], "answer": "B", "answer_text": "30 days", "explanation": "AEO Programme Team ने recommendation केल्यानंतर AEO Programme Manager ने applicant ला AEO-T2 certificate बाबत decision/certificate issue करण्याची माहिती: 👉 30 days मध्ये द्यायची आहे.", "golden": "AEO-T2 Recommendation → Certificate/Information → 30 Days"}], "2022": [{"no": 1, "q": "Q1. In terms of Explanation to Rule 12 of Customs Valuation (Determination of Value of Imported Goods) Rules, 2007, where the declared value is rejected, the value shall be determined by proceeding sequentially in accordance with—", "options": [{"letter": "A", "text": "Rules 3 to 7"}, {"letter": "B", "text": "Rules 4 to 9"}, {"letter": "C", "text": "Rules 1 to 11"}, {"letter": "D", "text": "Rules 3 to 9"}], "answer": "B", "answer_text": "Rules 4 to 9", "explanation": "जर transaction value accept झाली नाही, तर पुढील valuation methods sequentially apply होतात. Rules 4 to 9 मध्ये: Identical goods Similar goods Deductive value Computed value Residual method यांचा समावेश होतो.", "golden": "Declared Value Rejected → Rules 4 to 9"}, {"no": 2, "q": "Q2. In which of the following cases is an importer not permitted to make deferred payment as per Deferred Payment of Import Duty Rules, 2016?", "options": [{"letter": "A", "text": "An eligible importer who fails to pay duty in full by due date for a period of six consecutive months"}, {"letter": "B", "text": "An eligible importer who fails to pay duty in full by due date for a period of three consecutive months"}, {"letter": "C", "text": "An eligible importer who fails to pay duty in full by due date more than once in a period of three consecutive months"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "", "explanation": "Eligible importer ने three consecutive months मध्ये more than once due date पर्यंत duty पूर्ण भरली नाही तर deferred payment facility गमावतो.", "golden": "Deferred Payment → Default more than once in 3 consecutive months = Not permitted"}, {"no": 3, "q": "Q3. As per the Electronic Duty Credit Ledger Regulations, 2021, an exporter has the option to create e-scrip within a period of ___ from the date of generation of the scroll.", "options": [{"letter": "A", "text": "One year"}, {"letter": "B", "text": "Two years"}, {"letter": "C", "text": "One month"}, {"letter": "D", "text": "Six months"}], "answer": "A", "answer_text": "One year", "explanation": "Scroll generate झाल्यानंतर exporter ला 1 year मध्ये e-scrip create करण्याची option आहे.", "golden": "e-Scrip → Within 1 Year from Scroll"}, {"no": 4, "q": "Q4. Medicines and Pharmaceuticals are primarily classifiable under which chapter?", "options": [{"letter": "A", "text": "Chapter 30"}, {"letter": "B", "text": "Chapter 34"}, {"letter": "C", "text": "Chapter 32"}, {"letter": "D", "text": "Chapter 29"}], "answer": "A", "answer_text": "Chapter 30", "explanation": "Medicaments आणि pharmaceutical products मुख्यतः HS Chapter 30 मध्ये येतात. उदा. medicines, vaccines, pharmaceutical preparations इ.", "golden": "Medicines & Pharmaceuticals → Chapter 30"}, {"no": 5, "q": "Q5. Which of the following goods cannot be deposited in a special warehouse licensed under Section 58A of the Customs Act, 1962?", "options": [{"letter": "A", "text": "Gold"}, {"letter": "B", "text": "Precious stones"}, {"letter": "C", "text": "Silver"}, {"letter": "D", "text": "Psychotropic drugs"}], "answer": "D", "answer_text": "Psychotropic drugs", "explanation": "Section 58A अंतर्गत special warehouse मध्ये sensitive/high-value goods जसे gold, silver आणि precious stones ठेवण्याची व्यवस्था आहे. Paper नुसार psychotropic drugs या category मध्ये येत नाहीत.", "golden": "Special Warehouse → Gold + Silver + Precious Stones; Psychotropic Drugs नाही"}, {"no": 6, "q": "Q6. Which of the following with regard to the acceptance of transaction value of export goods is not correct?", "options": [{"letter": "A", "text": "It is the price actually paid or payable for the goods when sold for export from India"}, {"letter": "B", "text": "It is determined at the time and place of exportation"}, {"letter": "C", "text": "The price is not the only consideration for the sale"}, {"letter": "D", "text": "The buyer and seller of the goods are not related"}], "answer": "C", "answer_text": "", "explanation": "Export goods ची transaction value accept करण्यासाठी price ही sole consideration असणे आवश्यक आहे. म्हणून: ❌ “The price is not the only consideration” — चुकीचे.", "golden": "Export Transaction Value → Price must be sole consideration"}, {"no": 7, "q": "Q7. Under Advance Authorisation Scheme, for which of the following products shall Advance Authorisation not be available?", "options": [{"letter": "A", "text": "(i) and (ii) only"}, {"letter": "B", "text": "(i), (ii) and (iii)"}, {"letter": "C", "text": "(i) only"}, {"letter": "D", "text": "(ii) and (iii) only"}], "answer": "B", "answer_text": "(i), (ii) and (iii)", "explanation": "Paper मध्ये या तिन्ही categories Advance Authorisation मधून excluded आहेत: ✔️ Chapter 71 products ✔️ Biotechnology products ✔️ SCOMET items", "golden": "Advance Authorisation Exclusion → Ch.71 + Biotechnology + SCOMET"}, {"no": 8, "q": "Q8. How much fee is prescribed for cancellation of any customs document as per Levy of Fees (Customs Documents) Amendment Regulations, 2017?", "options": [{"letter": "A", "text": "₹500"}, {"letter": "B", "text": "₹1,000"}, {"letter": "C", "text": "₹100"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "₹1,000", "explanation": "Customs document cancellation साठी prescribed fee: 👉 ₹1,000 आहे. यामध्ये Bill of Entry, Shipping Bill इत्यादी documents येऊ शकतात.", "golden": "Cancellation of Customs Document → ₹1,000"}, {"no": 9, "q": "Q9. Quantitative restrictions cannot be imposed on any goods originating from a developing country when the share of imports of such goods from that country does not exceed—", "options": [{"letter": "A", "text": "10%"}, {"letter": "B", "text": "No such restriction applicable"}, {"letter": "C", "text": "5%"}, {"letter": "D", "text": "3%"}], "answer": "D", "answer_text": "3%", "explanation": "Paper नुसार developing country चा particular product मधील import share 3% पेक्षा जास्त नसल्यास safeguard quantitative restriction लागू करता येत नाही.", "golden": "Developing Country → Import Share ≤ 3% → QR not imposed"}, {"no": 10, "q": "Q10. Determination of the value of export goods by comparison method shall be based on—", "options": [{"letter": "A", "text": "Transaction value of goods of like kind and quality"}, {"letter": "B", "text": "Transaction value of identical goods"}, {"letter": "C", "text": "Transaction value of similar goods"}, {"letter": "D", "text": "Both B & C"}], "answer": "A", "answer_text": "", "explanation": "Export Valuation Rules नुसार comparison method मध्ये comparable goods म्हणून goods of like kind and quality ची transaction value वापरली जाते.", "golden": "Export Comparison Method → Like Kind & Quality"}, {"no": 11, "q": "Q11. Facility of deferred payment of customs duty has been provided at present to which category of importers?", "options": [{"letter": "A", "text": "ACP"}, {"letter": "B", "text": "AEO-T2"}, {"letter": "C", "text": "AEO"}, {"letter": "D", "text": "DPD"}], "answer": "B", "answer_text": "AEO-T2", "explanation": "Deferred payment facility specified eligible importersना दिली जाते. Paper मध्ये योग्य category: 👉 AEO-T2 आहे.", "golden": "Deferred Customs Duty Payment → AEO-T2"}, {"no": 12, "q": "Q12. Which of the following has been notified as the common Customs Electronic Portal for facilitating various activities?", "options": [{"letter": "A", "text": "www.nacin.gov.in"}, {"letter": "B", "text": "www.cbic.gov.in"}, {"letter": "C", "text": "www.icegate.gov.in"}, {"letter": "D", "text": "No such notification is issued"}], "answer": "C", "answer_text": "ICEGATE", "explanation": "ICEGATE हे Customs चे common electronic portal आहे. यावर: e-filing Duty payment Shipment tracking e-Sanchit e-Scrip related services इत्यादी सुविधा आहेत.", "golden": "Common Customs Electronic Portal → ICEGATE"}, {"no": 13, "q": "Q13. Import under EPCG Scheme shall be subject to an Export Obligation equivalent to ___ times of duties, taxes and cess saved on capital goods.", "options": [{"letter": "A", "text": "5 times"}, {"letter": "B", "text": "4 times"}, {"letter": "C", "text": "6 times"}, {"letter": "D", "text": "7 times"}], "answer": "C", "answer_text": "6 times", "explanation": "EPCG = Export Promotion Capital Goods Scheme. Paper नुसार export obligation: 6 × duties/taxes/cess saved इतकी आहे. ही obligation prescribed period मध्ये पूर्ण करावी लागते.", "golden": "EPCG → Export Obligation = 6 Times"}, {"no": 14, "q": "Q14. Which of the following is not a minor amendment?", "options": [{"letter": "A", "text": "Quantity of goods declared"}, {"letter": "B", "text": "Conversion from one unit of measurement to another"}, {"letter": "C", "text": "Seal Number"}, {"letter": "D", "text": "Port of Loading"}], "answer": "A", "answer_text": "Quantity of goods declared", "explanation": "Quantity of goods declared मध्ये बदल हा major amendment मानला जातो. तर seal number, unit conversion, port of loading इत्यादी changes prescribed circumstances मध्ये minor amendment असू शकतात.", "golden": "Not Minor Amendment → Quantity of Goods Declared"}, {"no": 15, "q": "Q15. Can a Customs Broker registered in one place work in Mumbai?", "options": [{"letter": "A", "text": "Yes, a licensee registered is deemed to be registered all over India"}, {"letter": "B", "text": "Yes, the licensee is eligible to work in Mumbai subject to intimation in Form C to the Principal Commissioner/Commissioner of Customs of the Customs Station where he intends to transact business"}, {"letter": "C", "text": "No, the licensee has to obtain a fresh license for Mumbai"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "", "explanation": "Customs Broker licence all-India validity देते, परंतु दुसऱ्या Customs Station मध्ये business सुरू करताना prescribed Form C intimation द्यावी लागते.", "golden": "CB Licence → All India + Form C Intimation"}, {"no": 16, "q": "Q16. Which of the following is true as per Sea Cargo Manifest and Transhipment Regulations, 2018?", "options": [{"letter": "A", "text": "Only no bond shall be furnished by authorised carrier"}, {"letter": "B", "text": "Bond and necessary BG shall be furnished by authorised carrier"}, {"letter": "C", "text": "No bond or BG shall be furnished by authorised carrier"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "", "explanation": "जेव्हा shipment directly between two sea ports via a designated foreign route होते, तेव्हा authorised carrier ला bond किंवा bank guarantee furnish करण्याची आवश्यकता नाही, as per the paper.", "golden": "Direct Sea-to-Sea Transhipment → No Bond + No BG"}, {"no": 17, "q": "Q17. Which of the following is the purpose of Advance Ruling?", "options": [{"letter": "A", "text": "To provide certainty to all importers on dispute issues"}, {"letter": "B", "text": "To make advance laws"}, {"letter": "C", "text": "To provide certainty in advance to the importer with respect to the questions raised"}, {"letter": "D", "text": "To set right law"}], "answer": "C", "answer_text": "", "explanation": "Advance Ruling चा मुख्य उद्देश proposed transaction बद्दल importer ला आधीच legal certainty देणे हा आहे. Classification, valuation, applicability of notifications इत्यादी बाबतीत clarity मिळते.", "golden": "Advance Ruling → Certainty in Advance"}, {"no": 18, "q": "Q18. As per Hazardous and Other Wastes (Management and Transboundary Movement) Rules, 2016, in case of illegal import of hazardous or other waste, the importer shall re-export the waste at his cost within a period of ___ from the date of its arrival into India.", "options": [{"letter": "A", "text": "90 days"}, {"letter": "B", "text": "45 days"}, {"letter": "C", "text": "60 days"}, {"letter": "D", "text": "30 days"}], "answer": "A", "answer_text": "90 days", "explanation": "Illegal import झालेल्या hazardous/other waste बाबत importer ने ते स्वतःच्या खर्चाने: 👉 90 days मध्ये re-export करणे आवश्यक आहे.", "golden": "Illegal Hazardous Waste → Re-export within 90 Days"}, {"no": 19, "q": "Q19. What is the rate of duty to be taken for calculation of duty of goods cleared from a warehouse under Section 68 of Customs Act, 1962?", "options": [{"letter": "A", "text": "Rate of duty as on the date when Bill of Entry for home consumption is presented"}, {"letter": "B", "text": "Rate of duty as on the date of Entry Inwards"}, {"letter": "C", "text": "Rate of duty as on the date of filing IGM"}, {"letter": "D", "text": "All of the above"}], "answer": "A", "answer_text": "", "explanation": "Warehouse मधून goods home consumption साठी clear करताना Section 68 अंतर्गत applicable duty rate: 👉 Bill of Entry for home consumption प्रस्तुत केलेल्या date चा rate घेतला जातो.", "golden": "Warehouse Clearance → Home Consumption → BOE Presentation Date"}, {"no": 20, "q": "Q20. At present, which of the following is not includible in the value of imported goods?", "options": [{"letter": "A", "text": "Cost of insurance up to the place of importation"}, {"letter": "B", "text": "Landing charges"}, {"letter": "C", "text": "Ship demurrage charges"}, {"letter": "D", "text": "Cost of transport up to the place of importation"}], "answer": "B", "answer_text": "Landing Charges", "explanation": "Paper मध्ये Landing Charges योग्य answer दिला आहे. Customs valuation मध्ये transport आणि insurance up to place of importation यांचा treatment होतो. पण prescribed 1% landing charges ची जुनी व्यवस्था discontinued झाल्यामुळे paper answer B आहे.", "golden": "Import Valuation → Landing Charges = Not includible (paper answer)"}, {"no": 21, "q": "Q21. A mixture is composed of 50% cassava flour and 50% maize flour. Cassava falls in tariff 11062000 while maize falls in tariff 11022000. Where will the mixture be classified in Customs Tariff?", "options": [{"letter": "A", "text": "11022000"}, {"letter": "B", "text": "11062000"}, {"letter": "C", "text": "11063090"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "11062000", "explanation": "दोन्ही materials समान प्रमाणात आहेत. अशा mixed goods साठी GRI Rule 3(b) लागू होते. Cassava flour आणि maize flour equally specific असल्यामुळे numerical value नुसार 11062000 classification योग्य ठरते.", "golden": "Equal mixture → Rule 3(c) → Numerical order → 11062000"}, {"no": 22, "q": "Q22. In which of the following cases may the transaction value of goods not be accepted?", "options": [{"letter": "A", "text": "Restrictions on use/disposition imposed by buyer"}, {"letter": "B", "text": "Sale/price subject to a condition for which value cannot be determined"}, {"letter": "C", "text": "Restrictions imposed by law/public authorities in India"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "", "explanation": "Customs Valuation Rules मध्ये transaction value reject करण्यासाठी specified conditions आहेत. Sale/price एखाद्या अशा condition किंवा consideration वर dependent असेल ज्याची value determine करता येत नाही, तर transaction value acceptable राहत नाही.", "golden": "Indeterminable condition → Transaction Value can be rejected"}, {"no": 23, "q": "Q23. Which of the following is not correct in regard to re-testing of samples?", "options": [{"letter": "A", "text": "Additional/Joint Commissioner must indicate name and address of laboratory for second test"}, {"letter": "B", "text": "It has to be done within 30 days from receipt of first test results"}, {"letter": "C", "text": "Request for re-test has to be made in writing to Additional/Joint Commissioner"}, {"letter": "D", "text": "Second re-test can be ordered if ambiguity persists and goods are still under Customs control"}], "answer": "B", "answer_text": "30 days", "explanation": "Paper मधील explanation नुसार re-test request first test result मिळाल्यापासून 7 working days मध्ये करायची आहे. म्हणून 30 days हा पर्याय चुकीचा आहे.", "golden": "Re-test Request → 7 Working Days"}, {"no": 24, "q": "Q24. Annual self-declaration by AEO-T1 entity for review is to be filed between—", "options": [{"letter": "A", "text": "1st September to 31st December each year"}, {"letter": "B", "text": "1st October to 31st December each year"}, {"letter": "C", "text": "1st November to 31st December each year"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "", "explanation": "AEO-T1 entity ने annual self-declaration 1 October ते 31 December या कालावधीत file करायचे आहे.", "golden": "AEO-T1 Annual Declaration → 1 Oct to 31 Dec"}, {"no": 25, "q": "Q25. The importer of any goods in respect of which a Bill of Entry for warehousing has been presented under Section 46 and assessed under Section 17 or Section 18 shall execute a bond in a sum equal to—", "options": [{"letter": "A", "text": "Equal to"}, {"letter": "B", "text": "Four times"}, {"letter": "C", "text": "Twice"}, {"letter": "D", "text": "Thrice"}], "answer": "D", "answer_text": "Thrice", "explanation": "Customs Act Section 59 नुसार warehousing साठी importer ने bond execute करायचा असतो. Bond amount: 3 × duty assessed असतो.", "golden": "Warehousing Bond → 3 Times Duty"}, {"no": 26, "q": "Q26. In which of the following cases registration under Steel Import Monitoring System (SIMS) is not required?", "options": [{"letter": "A", "text": "Imports by air freight mode"}, {"letter": "B", "text": "Imports through Advance Authorisation, DFIA"}, {"letter": "C", "text": "Imports to SEZs"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "Imports by air freight mode", "explanation": "SIMS registration सामान्यतः steel imports arriving by sea साठी लागू आहे. Air freight imports साठी ही prior SIMS registration requirement नाही.", "golden": "SIMS → Air Freight Import = Registration not required"}, {"no": 27, "q": "Q27. Who pays the charges for demurrage, detention and destruction charges, if any in respect of goods detained or seized, found infringing intellectual property rights and confiscated under Section 111(d)?", "options": [{"letter": "A", "text": "The importer"}, {"letter": "B", "text": "The importer or right holder against whom case attains finality"}, {"letter": "C", "text": "The right holder"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "The right holder", "explanation": "IPR infringement असलेले goods Customs ने detain/seize करून नंतर confiscate केले असल्यास prescribed circumstances मध्ये right holder कडून demurrage, detention आणि destruction charges recover केले जातात.", "golden": "IPR Infringing Goods → Charges → Right Holder"}, {"no": 28, "q": "Q28. On which of the following questions can be asked by an importer from Authority for Advance Ruling in Customs?", "options": [{"letter": "A", "text": "Principles to be adopted for determination of value of goods"}, {"letter": "B", "text": "Valuation of imported goods"}, {"letter": "C", "text": "Tariff value of imported goods"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "", "explanation": "Advance Ruling Authority कडे importer legal principles बाबत clarity मागू शकतो. पण Authority स्वतः specific valuation figure किंवा tariff value prescribe करत नाही.", "golden": "Advance Ruling → Principles, not specific tariff value"}, {"no": 29, "q": "Q29. Which of the following statements regarding appointment of Development Commissioner of SEZ is true?", "options": [{"letter": "A", "text": "Board of Approval may appoint any officer not below Joint Secretary"}, {"letter": "B", "text": "Central Government may appoint any officer not below Joint Secretary"}, {"letter": "C", "text": "Central Government may appoint any officer not below Deputy Secretary"}, {"letter": "D", "text": "Board of Approval may appoint any officer not below Additional Secretary"}], "answer": "C", "answer_text": "", "explanation": "SEZ Rules, 2006 नुसार Development Commissioner ची appointment Central Government करते. Officer चा rank Deputy Secretary पेक्षा कमी नसावा.", "golden": "SEZ Development Commissioner → Central Government → ≥ Deputy Secretary"}, {"no": 30, "q": "Q30. “Catch-all controls” as per Section 14C of Foreign Trade (Development and Regulation) Act, 1992 pertains to—", "options": [{"letter": "A", "text": "Import of material/equipment/technology intended for biological/chemical/nuclear weapons"}, {"letter": "B", "text": "Import of any arms and ammunition except by Government"}, {"letter": "C", "text": "Export of material/equipment/technology intended for biological/chemical/nuclear weapons"}, {"letter": "D", "text": "Import or export of any goods/services prohibited for import/export"}], "answer": "C", "answer_text": "", "explanation": "Section 14C FT(DR) Act, 1992 मधील catch-all control मुख्यतः dual-use items च्या export control शी संबंधित आहे. जर exporter ला माहिती असेल किंवा reason to believe असेल की material/equipment/technology WMD development साठी वापरले जाऊ शकते, तर export prohibited होऊ शकतो.", "golden": "Catch-all Control → Export + WMD/dual-use concern Q31–35"}, {"no": 31, "q": "Q31. Any transaction where the value of imported goods is less than Rs ____ but cumulatively these transactions do not exceed Rs 25 lakhs in any financial year shall not be taken up for inquiries by SVBs.", "options": [{"letter": "A", "text": "₹1,00,000"}, {"letter": "B", "text": "₹50,000"}, {"letter": "C", "text": "₹25,000"}, {"letter": "D", "text": "₹20,000"}], "answer": "A", "answer_text": "₹1,00,000", "explanation": "Related-party imports साठी SVB investigation मध्ये low-value transactions साठी threshold आहे. Imported goods ची value: 👉 ₹1 lakh पेक्षा कमी असल्यास आणि annual cumulative value ₹25 lakh पेक्षा जास्त नसल्यास SVB inquiry साठी transaction घेण्यात येत नाही.", "golden": "SVB → Below ₹1 Lakh + Annual ≤ ₹25 Lakh"}, {"no": 32, "q": "Q32. Who is the proper officer for the finalization of provisional assessment in Customs?", "options": [{"letter": "A", "text": "Joint/Additional Commissioner of Customs"}, {"letter": "B", "text": "Chief Commissioner of Customs"}, {"letter": "C", "text": "Deputy Commissioner or Assistant Commissioner of Customs"}, {"letter": "D", "text": "Commissioner of Customs"}], "answer": "C", "answer_text": "", "explanation": "Customs Act Section 18 अंतर्गत provisional assessment ची finalization करण्याची responsibility: 👉 Deputy Commissioner / Assistant Commissioner of Customs यांच्याकडे आहे.", "golden": "Finalisation of Provisional Assessment → DC/AC"}, {"no": 33, "q": "Q33. Under faceless assessment in Customs, amendment before Out of Charge under Section 149 that would not impact the assessment shall be approved by—", "options": [{"letter": "A", "text": "Faceless Assessment Group (FAG)"}, {"letter": "B", "text": "Post Assessment Group (PAG)"}, {"letter": "C", "text": "FAG or PAG, whoever had initially done the assessment"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "PAG", "explanation": "Faceless Assessment नंतर Out of Charge पूर्वी केलेला amendment जर assessment वर impact करत नसेल, तर तो Post Assessment Group (PAG) कडून approve केला जातो.", "golden": "Post-assessment amendment → No assessment impact → PAG"}, {"no": 34, "q": "Q34. Provisions related to clearance of uncleared goods are stipulated in which section of Customs Act?", "options": [{"letter": "A", "text": "Section 48"}, {"letter": "B", "text": "Section 51"}, {"letter": "C", "text": "Section 43"}, {"letter": "D", "text": "Section 49"}], "answer": "A", "answer_text": "Section 48", "explanation": "Customs Act Section 48 मध्ये goods not cleared, abandoned किंवा unclaimed राहिल्यास त्यांची disposal procedure दिली आहे. Custodian ला proper officer च्या permission ने goods sell करण्याची power असते.", "golden": "Uncleared/Unclaimed Goods → Section 48"}, {"no": 35, "q": "Q35. A person can be arrested under the Customs Act if he/she commits an offence punishable under following Section(s):", "options": [{"letter": "A", "text": "Section 132"}, {"letter": "B", "text": "Section 135A"}, {"letter": "C", "text": "Section 136"}, {"letter": "D", "text": "All of these"}], "answer": "D", "answer_text": "All of these", "explanation": "Paper मधील explanation नुसार Customs Act अंतर्गत arrest provisions खालील offences शी संबंधित आहेत: Section 132 ✔️ Section 135A ✔️ Section 136 ✔️ म्हणून All of these.", "golden": "Arrest → Sec.132 + 135A + 136"}, {"no": 36, "q": "Q36. What is the maximum allowable drawback for re-export of imported goods?", "options": [{"letter": "A", "text": "95%"}, {"letter": "B", "text": "97%"}, {"letter": "C", "text": "98%"}, {"letter": "D", "text": "100%"}], "answer": "C", "answer_text": "98%", "explanation": "Customs Act Section 74 अंतर्गत imported goods re-export केल्यास, prescribed conditions पूर्ण झाल्यावर paid import duty च्या maximum: 👉 98% पर्यंत drawback मिळू शकतो.", "golden": "Re-export of Imported Goods → Maximum Drawback = 98%"}, {"no": 37, "q": "Q37. Under the provisions of Section 64, the owner of any warehoused goods may do the following after warehousing the same:", "options": [{"letter": "A", "text": "Inspect the goods"}, {"letter": "B", "text": "Sort the goods"}, {"letter": "C", "text": "Show the goods for sale"}, {"letter": "D", "text": "All of these"}], "answer": "D", "answer_text": "All of these", "explanation": "Section 64 नुसार warehouse मध्ये ठेवलेल्या goods बाबत owner ला prescribed conditions subject to: ✔️ Inspect ✔️ Sort ✔️ Show for sale करता येते.", "golden": "Section 64 → Inspect + Sort + Show for Sale"}, {"no": 38, "q": "Q38. Which of the following statements about definitions as per Section 2 of Customs Act is incorrect?", "options": [{"letter": "A", "text": "“Goods” includes currency"}, {"letter": "B", "text": "“Adjudicating authority” includes Commissioner (Appeals)"}, {"letter": "C", "text": "“Vehicle” includes railway vehicle"}, {"letter": "D", "text": "“Coastal goods” means goods transported in a vessel other than imported goods"}], "answer": "B", "answer_text": "", "explanation": "Section 2 मधील “adjudicating authority” या definition मध्ये Commissioner (Appeals) समाविष्ट नाही. म्हणून B incorrect आहे.", "golden": "“Adjudicating Authority” ≠ Commissioner (Appeals)"}, {"no": 39, "q": "Q39. Revision Application is filed in form—", "options": [{"letter": "A", "text": "CA 6"}, {"letter": "B", "text": "CA 8"}, {"letter": "C", "text": "CA 7"}, {"letter": "D", "text": "CA 5"}], "answer": "B", "answer_text": "CA-8", "explanation": "Customs Act अंतर्गत Revision Application prescribed format मध्ये: 👉 Form CA-8 मध्ये file केली जाते.", "golden": "Revision Application → Form CA-8"}, {"no": 40, "q": "Q40. An importer wishes to file an advance copy of the Bill of Entry; however, he does not have a copy of the Master Bill of Lading (MBL). Which of the following is correct?", "options": [{"letter": "A", "text": "He should approach shipping line and get MBL"}, {"letter": "B", "text": "He can file Bill of Entry based on House Bill of Lading (HBL) as MBL is not required for filing"}, {"letter": "C", "text": "He can file Bill of Entry based on HBL and MBL can be added later through amendment"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "", "explanation": "Advance Bill of Entry file करताना HBL उपलब्ध असेल तर filing करता येते. MBL उपलब्ध नसल्यास नंतर Section 149 अंतर्गत amendment करून MBL add करता येतो.", "golden": "Advance BOE + HBL available, MBL unavailable → File + Add MBL later by amendment"}, {"no": 41, "q": "Q41. A Machine is imported from Shanghai, China at Nhava Sheva Port. The Bill of Entry is filed on 28.02.2022; the vessel arrives on 02.03.2022 and the Entry Inwards is granted on the same day. What should be the rate of duty?", "options": [{"letter": "A", "text": "Rate of duty as on 28.02.2022"}, {"letter": "B", "text": "Rate of duty as on 28.02.2022 or 02.03.2022, whichever is lower"}, {"letter": "C", "text": "Rate of duty as on 02.03.2022"}, {"letter": "D", "text": "Rate of duty as on 28.02.2022 or 02.03.2022, whichever is higher"}], "answer": "C", "answer_text": "Rate of duty as on 02.03.2022", "explanation": "Bill of Entry 28.02.2022 ला file झाला, पण vessel 02.03.2022 ला arrive झाला आणि त्याच दिवशी Entry Inwards मिळाली. Customs Act Section 15 नुसार applicable rate of duty ही relevant date वर depend करते. 👉 Entry Inwards date = 02.03.2022 म्हणून C.", "golden": "Import by vessel → Rate of Duty → Entry Inwards Date"}, {"no": 42, "q": "Q42. As per Regulation 9 of Foreign Exchange Management (Export of Goods and Services) Regulations, 2015, the full export value shall be realised and repatriated to India within—", "options": [{"letter": "A", "text": "Six months"}, {"letter": "B", "text": "Nine months"}, {"letter": "C", "text": "180 days"}, {"letter": "D", "text": "90 days"}], "answer": "B", "answer_text": "Nine months", "explanation": "Export केलेल्या goods/software/services ची full export value India मध्ये realise आणि repatriate करण्यासाठी paper मध्ये: 👉 9 months from date of export दिले आहे.", "golden": "FEMA Export Realisation → 9 Months"}, {"no": 43, "q": "Q43. Which Section of the Customs Act, 1962 is applicable if any warehoused goods are found to be deficient in quantity on account of natural loss?", "options": [{"letter": "A", "text": "Section 70"}, {"letter": "B", "text": "Section 68"}, {"letter": "C", "text": "Section 67"}, {"letter": "D", "text": "Section 69"}], "answer": "A", "answer_text": "Section 70", "explanation": "Warehoused goods मध्ये natural loss मुळे quantity कमी झाली असल्यास Section 70 लागू होतो. Proper officer ला natural loss मुळे deficiency असल्याचे समाधान झाल्यास actual quantity वर duty treatment केले जाते.", "golden": "Natural Loss in Warehoused Goods → Section 70"}, {"no": 44, "q": "Q44. After entry of the electronic integrated declaration on ICEGATE/service centre, a Shipping Bill shall be deemed to have been filed and self-assessment completed when—", "options": [{"letter": "A", "text": "Shipping Bill number is generated by ICES for the declaration"}, {"letter": "B", "text": "Shipping Bill is routed to RMS"}, {"letter": "C", "text": "Let Export Order is given"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "", "explanation": "Electronic declaration submit केल्यानंतर ICES कडून Shipping Bill number generate झाल्यावर Shipping Bill filed आणि self-assessment completed मानले जाते. L.E.O. हा त्यानंतरचा stage आहे.", "golden": "Shipping Bill Filed → SB Number Generated"}, {"no": 45, "q": "Q45. An importer imports goods valued at ₹10,000 (CIF). BCD = 10%, SWC = 10%. BCD is exempted through notification. What should be the Social Welfare Surcharge?", "options": [{"letter": "A", "text": "₹100"}, {"letter": "B", "text": "₹1,000"}, {"letter": "C", "text": "Nil"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Nil", "explanation": "Social Welfare Surcharge हा BCD वर calculate होतो. जर notification मुळे BCD = Nil, तर SWC सुद्धा: 👉 Nil होतो.", "golden": "BCD Exempt → SWC = Nil"}, {"no": 46, "q": "Q46. What is the course of action in respect of goods found infringing Intellectual Property Rights and confiscated under Section 111(d)?", "options": [{"letter": "A", "text": "Goods are either destroyed or disposed outside normal channels of commerce"}, {"letter": "B", "text": "Goods can be re-exported in same form by importer on payment of fine and penalty"}, {"letter": "C", "text": "Goods can only be destroyed"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "", "explanation": "IPR infringing goods confiscate झाल्यानंतर त्यांचा disposal असा केला पाहिजे की ते पुन्हा normal commercial market मध्ये circulate होऊ नयेत. म्हणून: 👉 Destroyed OR disposed outside normal channels of commerce", "golden": "IPR Infringing Goods → Destroy / Dispose outside normal commerce"}, {"no": 47, "q": "Q47. An importer imports goods through the sea route. When is he required to file the Bill of Entry?", "options": [{"letter": "A", "text": "Latest by end of day preceding the day of arrival of vessel"}, {"letter": "B", "text": "Latest by end of the day of arrival of vessel"}, {"letter": "C", "text": "Latest by end of day succeeding the day of arrival"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "", "explanation": "Paper मध्ये prescribed requirement नुसार relevant sea-route imports साठी Bill of Entry: 👉 End of the day of arrival of vessel पर्यंत file करायचा आहे.", "golden": "Sea Import → BOE → By End of Arrival Day"}, {"no": 48, "q": "Q48. Prior Bill of Entry can be filed at any time up to how many days prior to expected date of arrival of aircraft/vessel/vehicle?", "options": [{"letter": "A", "text": "60 days"}, {"letter": "B", "text": "90 days"}, {"letter": "C", "text": "30 days"}, {"letter": "D", "text": "15 days"}], "answer": "C", "answer_text": "30 days", "explanation": "Prior Bill of Entry advance मध्ये file करण्याची सुविधा आहे. Maximum: 👉 30 days before expected arrival", "golden": "Prior BOE → 30 Days before Arrival"}, {"no": 49, "q": "Q49. Before granting a Customs Broker licence, successful applicant has to enter into a bond and furnish bank guarantee for an amount of—", "options": [{"letter": "A", "text": "₹2 lakh"}, {"letter": "B", "text": "₹10 lakh"}, {"letter": "C", "text": "₹5 lakh"}, {"letter": "D", "text": "₹20 lakh"}], "answer": "C", "answer_text": "₹5 lakh", "explanation": "CBLR, 2018 Regulation 8 नुसार Customs Broker licence grant होण्यापूर्वी prescribed bond + bank guarantee furnish करावी लागते. Paper मध्ये amount: 👉 ₹5 lakh दिलेला आहे.", "golden": "Customs Broker → Bond + BG = ₹5 Lakh"}, {"no": 50, "q": "Q50. The Customs value under residual method is determined on the basis of data available in—", "options": [{"letter": "A", "text": "India"}, {"letter": "B", "text": "Exporting country"}, {"letter": "C", "text": "Country of manufacture"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "India", "explanation": "Customs Valuation Rules मधील Residual Method मध्ये previous methods लागू न झाल्यास reasonable means वापरून valuation केली जाते. Paper/source नुसार relevant data: 👉 Data available in India", "golden": "Residual Method → Data available in India"}, {"no": 51, "q": "Q51. Which statement is NOT correct regarding payment of charges for late presentation of Bill of Entry under Section 46?", "options": [{"letter": "A", "text": "Importer liable to pay ₹10,000 per day for each day of default after three days"}, {"letter": "B", "text": "Charges cannot be waived off"}, {"letter": "C", "text": "Importer liable to pay ₹5,000 per day for initial three days of default"}, {"letter": "D", "text": "Maximum charges shall not exceed duty payable"}], "answer": "B", "answer_text": "Charges cannot be waived off", "explanation": "Late presentation charges applicable असले तरी exceptional circumstances मध्ये jurisdictional Commissioner कडून waiver मिळू शकतो. म्हणून: ❌ “Charges cannot be waived off” चुकीचे.", "golden": "Late BOE Charges → Can be waived in exceptional circumstances"}, {"no": 52, "q": "Q52. The remission of duties and taxes in RoDTEP scheme are given as—", "options": [{"letter": "A", "text": "Cash credited into cash ledger"}, {"letter": "B", "text": "Non-transferable duty credit"}, {"letter": "C", "text": "Transferable duty credit"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Transferable duty credit", "explanation": "RoDTEP = Remission of Duties and Taxes on Exported Products. Benefit electronic form मध्ये transferable duty credit म्हणून दिला जातो.", "golden": "RoDTEP → Transferable Duty Credit"}, {"no": 53, "q": "Q53. If a Show Cause Notice is not given within the prescribed period to a person from whose custody goods are seized, then—", "options": [{"letter": "A", "text": "Goods are confiscated"}, {"letter": "B", "text": "Goods are auctioned"}, {"letter": "C", "text": "Goods are returned to the person"}, {"letter": "D", "text": "Goods are disposed of"}], "answer": "C", "answer_text": "", "explanation": "Section 110(2) नुसार seizure नंतर prescribed period मध्ये SCN issue न झाल्यास goods त्या व्यक्तीला return करण्याची provision आहे. Normal period: 👉 6 months (Commissioner द्वारा prescribed circumstances मध्ये extension possible.)", "golden": "Seizure → SCN not issued in time → Goods Returned"}, {"no": 54, "q": "Q54. Which statement is NOT TRUE under Drugs and Cosmetics Act, 1940 regarding a misbranded drug?", "options": [{"letter": "A", "text": "It is not labelled in prescribed manner"}, {"letter": "B", "text": "It contains a colour which is not prescribed"}, {"letter": "C", "text": "Substance is mixed so as to reduce its quality or strength"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "", "explanation": "Misbranding मध्ये incorrect/misleading labelling इत्यादी येते. पण एखादा substance mix करून drug ची quality किंवा strength कमी केली, तर ते adulteration शी संबंधित आहे. म्हणून C चुकीचे statement आहे.", "golden": "Reduce Quality/Strength → Adulteration, not Misbranding"}, {"no": 55, "q": "Q55. In Arrival Manifest for vessels carrying non-containerized cargo, no updation of Form VI-A and VI-B is permitted—", "options": [{"letter": "A", "text": "After examination"}, {"letter": "B", "text": "After clearance of goods from Customs area"}, {"letter": "C", "text": "After Entry Inwards at destination Customs port"}, {"letter": "D", "text": "After vessel leaves port of origin"}], "answer": "C", "answer_text": "", "explanation": "Non-containerized cargo च्या Arrival Manifest मध्ये Form VI-A/VI-B ची information: 👉 Destination Customs Port वर Entry Inwards granted झाल्यानंतर update करता येत नाही.", "golden": "SCMTR → Non-containerized → No update after Entry Inwards"}, {"no": 56, "q": "Q56. A unit for carrying on authorised operations in an SEZ can normally be set up with approval of—", "options": [{"letter": "A", "text": "Board of Approval"}, {"letter": "B", "text": "Jurisdictional Regional Office of DGFT"}, {"letter": "C", "text": "Development Commissioner of SEZ"}, {"letter": "D", "text": "Approval Committee of SEZ"}], "answer": "D", "answer_text": "Approval Committee", "explanation": "SEZ मध्ये unit setup करण्यासाठी सामान्यतः Approval Committee कडून approval घेतला जातो. Development Commissioner हा committee चा important part/chairperson असतो.", "golden": "SEZ Unit Setup → Approval Committee"}, {"no": 57, "q": "Q57. Which of the following is TRUE in respect of export duties?", "options": [{"letter": "A", "text": "No Customs duty is levied on exports"}, {"letter": "B", "text": "Customs duty is levied on exports in case of a very few items, usually natural resources"}, {"letter": "C", "text": "Any export duty is refunded"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "", "explanation": "बहुतेक export goods वर export duty नसते; परंतु काही specified goods वर export duty आहे. विशेषतः काही natural resources conserve करण्यासाठी export duty लावली जाते.", "golden": "Export Duty → Few Specified Goods/Natural Resources"}, {"no": 58, "q": "Q58. As per Rule 5 of Customs Valuation (Determination of Value of Export Goods) Rules, 2007, which is NOT specified to be included under computed value method?", "options": [{"letter": "A", "text": "Cost of production/manufacture/processing"}, {"letter": "B", "text": "Amount towards profit"}, {"letter": "C", "text": "Cost of transportation and insurance"}, {"letter": "D", "text": "Charges for design or brand"}], "answer": "C", "answer_text": "", "explanation": "Computed value method मध्ये production/manufacturing cost, profit आणि specified design/brand charges consider होतात. परंतु transportation and insurance cost हा Rule 5 मध्ये specified component नाही.", "golden": "Export Computed Value → Transportation & Insurance NOT included"}, {"no": 59, "q": "Q59. Where an exemption is granted subject to a condition under Section 25(1), such exemption is valid up to—", "options": [{"letter": "A", "text": "31st March immediately after two years from date of grant/variation"}, {"letter": "B", "text": "31st March immediately after three years"}, {"letter": "C", "text": "31st March immediately after one year"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "", "explanation": "Conditional exemption notification Section 25(1) अंतर्गत असल्यास, unless otherwise specified/varied/rescinded, paper नुसार ती: 👉 31st March falling immediately after two years पर्यंत valid असते.", "golden": "Conditional Exemption → 31 March after 2 Years"}, {"no": 60, "q": "Q60. An importer discovers duty short-paid and pays requisite duty with interest based on his own ascertainment before service of notice under Section 28(1)(a). Which statement is correct?", "options":
