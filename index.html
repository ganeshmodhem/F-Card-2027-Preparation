er": "C", "text": "Section 4 + Section 5 IGST Act"}, {"letter": "D", "text": "Section 4 + Section 5 CGST Act"}], "answer": "B", "answer_text": "", "explanation": "Imported goods वर IGST levy: 👉 Section 3 of Customs Tariff Act, 1975 read with: 👉 Section 5 of IGST Act, 2017 अंतर्गत आहे. Specifically, import IGST collection mechanism Section 3(7) शी संबंधित आहे.", "golden": "Import IGST → Customs Tariff Act Sec.3 + IGST Act Sec.5"}, {"no": 139, "q": "Q139. Who is empowered under Section 24 of Customs Act, 1962 to make rules for denaturing or mutilation of imported goods?", "options": [{"letter": "A", "text": "Chief Commissioner of Customs"}, {"letter": "B", "text": "Department of Revenue"}, {"letter": "C", "text": "CBIC"}, {"letter": "D", "text": "Central Government"}], "answer": "D", "answer_text": "Central Government", "explanation": "Section 24 अंतर्गत imported goods चे denaturing किंवा mutilation करण्याबाबत rules बनवण्याची power: 👉 Central Government कडे आहे.", "golden": "Sec.24 → Denaturing/Mutilation → Central Government"}, {"no": 140, "q": "Q140. Which of the following hazardous waste is allowed with Prior Informed Consent (PIC)?", "options": [{"letter": "A", "text": "Wastes collected from municipal waste"}, {"letter": "B", "text": "Waste asbestos"}, {"letter": "C", "text": "Galvanic sludges"}, {"letter": "D", "text": "Waste pneumatic tyres for direct reuse"}], "answer": "C", "answer_text": "Galvanic sludges", "explanation": "Hazardous and Other Wastes Rules, 2016 अंतर्गत काही wastes Prior Informed Consent (PIC) च्या conditions वर import करता येतात. Paper मध्ये योग्य example: 👉 Galvanic sludges आहे.", "golden": "PIC Waste → Galvanic Sludges"}], "2025": [{"no": 1, "q": "Q1. Who is the competent authority to sanction prosecution under Sections 132, 133, 134 or 135 of the Customs Act, 1962?", "options": [{"letter": "A", "text": "Pr. Chief Commissioner / Chief Commissioner of Customs"}, {"letter": "B", "text": "Principal Commissioner / Commissioner of Customs"}, {"letter": "C", "text": "Additional Commissioner / Joint Commissioner of Customs"}, {"letter": "D", "text": "Deputy Commissioner / Assistant Commissioner of Customs"}], "answer": "B", "answer_text": "Principal Commissioner / Commissioner of Customs", "explanation": "Customs Act, 1962 च्या Section 137 नुसार Sections 132 ते 135 अंतर्गत prosecution सुरू करण्यासाठी competent authority: 👉 Principal Commissioner किंवा Commissioner of Customs आहे.", "golden": "Sec.137 → Prosecution sanction → Pr. Commissioner / Commissioner"}, {"no": 2, "q": "Q2. Which of the following does NOT fall under the scope of “Furtherance of Business” under CGST Act, 2017?", "options": [{"letter": "A", "text": "Machinery or office equipment purchased to enhance business"}, {"letter": "B", "text": "Gifts to employees, if not exceeding ₹50,000/- in a year"}, {"letter": "C", "text": "Corporate Social Responsibility (CSR) expenses, when mandated by law"}, {"letter": "D", "text": "Sales by charitable organizations"}], "answer": "B", "answer_text": "", "explanation": "Employees ना gifts दिल्याने ते आपोआप furtherance of business मानले जात नाही. विशेषतः paper मध्ये दिलेल्या प्रश्नानुसार ₹50,000 पर्यंत employee gifts हा योग्य option आहे.", "golden": "Employee Gift → Furtherance of Business नाही"}, {"no": 3, "q": "Q3. Which of the following is NOT protected under the Copyright Act, 1957?", "options": [{"letter": "A", "text": "Musical compositions"}, {"letter": "B", "text": "Ideas"}, {"letter": "C", "text": "Cinematograph films"}, {"letter": "D", "text": "Literary works"}], "answer": "B", "answer_text": "Ideas", "explanation": "Copyright idea ला protect करत नाही; idea ची expression protect करते. उदा. एखाद्याची story ची basic idea copyright-protected नसू शकते, पण ती idea written story म्हणून express केली असल्यास त्या expression ला copyright protection मिळते.", "golden": "Copyright → Expression protected, Idea itself NOT protected"}, {"no": 4, "q": "Q4. What is the amount an applicant has to pay after declaration of results, who has passed both written and oral examination under Regulation 4 of CBLR, 2018, for grant of Customs Broker Licence?", "options": [{"letter": "A", "text": "₹2,000 within two months"}, {"letter": "B", "text": "₹10,000 within two months"}, {"letter": "C", "text": "₹5,000 within two months"}, {"letter": "D", "text": "₹500 within two months"}], "answer": "C", "answer_text": "₹5,000", "explanation": "CBLR 2018 च्या Regulation 7 नुसार written आणि oral examination पास झाल्यानंतर applicant ने: 👉 ₹5,000 fee results declare झाल्यापासून 2 months मध्ये pay करायची असते.", "golden": "CB Licence → ₹5,000 → Within 2 Months"}, {"no": 5, "q": "Q5. Which of the following is NOT covered under the Arms Act, 1959?", "options": [{"letter": "A", "text": "Knives"}, {"letter": "B", "text": "Artillery"}, {"letter": "C", "text": "Firearms"}, {"letter": "D", "text": "Ammunition"}], "answer": "A", "answer_text": "Knives", "explanation": "Arms Act मध्ये firearms, artillery आणि ammunition यांचा समावेश होतो. सामान्य knives या Act अंतर्गत “arms” म्हणून covered नाहीत, subject to specified exceptions/categories.", "golden": "Arms Act → Firearms + Artillery + Ammunition"}, {"no": 6, "q": "Q6. What period is the authorised Customs Broker required to retain the assessed copy of Bill of Entry and supporting documents in original?", "options": [{"letter": "A", "text": "10 years"}, {"letter": "B", "text": "15 years"}, {"letter": "C", "text": "12 years"}, {"letter": "D", "text": "5 years"}], "answer": "D", "answer_text": "5 years", "explanation": "Bill of Entry (Electronic Integrated Declaration and Paperless Processing) Regulations अंतर्गत Customs Broker ने assessed BOE आणि supporting documents: 👉 किमान 5 वर्षे retain करणे आवश्यक आहे.", "golden": "BOE + Supporting Documents → 5 Years"}, {"no": 7, "q": "Q7. As per Foreign Trade (Development and Regulation) Act, 1992, which statement is correct?", "options": [{"letter": "A", "text": "IEC is necessary for import/export of services or technology."}, {"letter": "B", "text": "IEC is not necessary for import/export of specified services or specified technology."}, {"letter": "C", "text": "IEC is necessary for import/export of services or technology only if provider is taking benefits under FTP."}, {"letter": "D", "text": "None of the above."}], "answer": "C", "answer_text": "", "explanation": "Services किंवा technology च्या import/export मध्ये IEC requirement Foreign Trade Policy अंतर्गत benefit घेतल्यास लागू होते.", "golden": "Service/Technology + FTP Benefit → IEC Required"}, {"no": 8, "q": "Q8. As per Drugs and Cosmetics Act, 1940, a drug shall be deemed to be adulterated if—", "options": [{"letter": "A", "text": "It consists of filthy, putrid or decomposed substance."}, {"letter": "B", "text": "It is imported under a name which belongs to another drug."}, {"letter": "C", "text": "It is not labelled in the prescribed manner."}, {"letter": "D", "text": "It contains the constituents of another drug."}], "answer": "A", "answer_text": "", "explanation": "Drug मध्ये filthy, putrid किंवा decomposed substance असेल तर ते adulterated drug मानले जाते.", "golden": "Adulterated Drug → Filthy / Putrid / Decomposed substance"}, {"no": 9, "q": "Q9. How many minimum years' experience in Group “A” Cadre from Indian Revenue Service (Customs and Central Excise) is required for a retired Group “A” officer to apply for Customs Broker licence?", "options": [{"letter": "A", "text": "3 years"}, {"letter": "B", "text": "8 years"}, {"letter": "C", "text": "5 years"}, {"letter": "D", "text": "6 years"}], "answer": "C", "answer_text": "5 years", "explanation": "Retired Group A officer साठी: 👉 Minimum 5 years Group A experience आवश्यक आहे.", "golden": "Retired Group A Officer → 5 Years Experience"}, {"no": 10, "q": "Q10. In which Customs Houses are Special Valuation Branch (SVB) offices currently operational?", "options": [{"letter": "A", "text": "Mumbai, Delhi, Kolkata, Chennai, Bengaluru, Vizag & Tughlakabad"}, {"letter": "B", "text": "Mumbai, Delhi, Kolkata, Chennai and Bengaluru"}, {"letter": "C", "text": "Mumbai, Delhi, Chennai & Bengaluru"}, {"letter": "D", "text": "Mumbai, Delhi, Kolkata, Chennai, Bengaluru & Vizag"}], "answer": "B", "answer_text": "", "explanation": "Paper नुसार SVB offices: Mumbai Delhi Kolkata Chennai Bengaluru या 5 Customs Houses मध्ये operational आहेत. SVB चा मुख्य संबंध related-party transactions आणि valuation शी आहे.", "golden": "SVB → Mumbai + Delhi + Kolkata + Chennai + Bengaluru"}, {"no": 11, "q": "Q11. After how many days will an authorised carrier demand container detention charges where containers are detained by Customs for verification and entries under Section 46/50 are found correct?", "options": [{"letter": "A", "text": "30 days"}, {"letter": "B", "text": "45 days"}, {"letter": "C", "text": "60 days"}, {"letter": "D", "text": "90 days"}], "answer": "C", "answer_text": "60 days", "explanation": "Sea Cargo Manifest and Transhipment Regulations संदर्भात, Customs verification साठी goods/container detained केले असतील आणि entries correct आढळल्या तर: 👉 60 days नंतर authorised carrier container detention charges demand करू शकतो.", "golden": "Customs Detention + Correct Entry → 60 Days"}, {"no": 12, "q": "Q12. In absence of a registered place of business or fixed establishment, how is “location” of recipient of services determined under IGST Act, 2017?", "options": [{"letter": "A", "text": "Location of supplier's business"}, {"letter": "B", "text": "Usual place of residence of recipient"}, {"letter": "C", "text": "Location of establishment most directly concerned"}, {"letter": "D", "text": "Registered address of supplier"}], "answer": "B", "answer_text": "Usual place of residence", "explanation": "Recipient कडे registered place of business किंवा fixed establishment नसेल तर location: 👉 Usual place of residence of recipient मानली जाते.", "golden": "No Business/F.E. → Recipient's Usual Residence"}, {"no": 13, "q": "Q13. What is the minimum age prescribed for obtaining a firearms licence under the Arms Act, 1959?", "options": [{"letter": "A", "text": "21 years"}, {"letter": "B", "text": "30 years"}, {"letter": "C", "text": "25 years"}, {"letter": "D", "text": "18 years"}], "answer": "A", "answer_text": "21 years", "explanation": "Firearms licence मिळवण्यासाठी prescribed minimum age: 👉 21 years आहे.", "golden": "Firearms Licence → Minimum 21 Years"}, {"no": 14, "q": "Q14. In which section of the Trade Marks Act, 1999 is application for registration of a trade mark discussed?", "options": [{"letter": "A", "text": "Section 23"}, {"letter": "B", "text": "Section 30"}, {"letter": "C", "text": "Section 25"}, {"letter": "D", "text": "Section 18"}], "answer": "D", "answer_text": "Section 18", "explanation": "Trade Marks Act, 1999 मधील: 👉 Section 18 → Application for registration of trade mark याबाबत आहे.", "golden": "Trade Mark Registration Application → Sec.18"}, {"no": 15, "q": "Q15. As per Foreign Trade Policy, 2023, export of “Arms and related material” to Government of Iraq is—", "options": [{"letter": "A", "text": "Prohibited"}, {"letter": "B", "text": "Prohibited but permitted subject to NOC from Department of Defence Production"}, {"letter": "C", "text": "Permitted on production of authorisation from DGFT"}, {"letter": "D", "text": "Free"}], "answer": "B", "answer_text": "", "explanation": "Iraq ला arms and related material export: 👉 Generally prohibited पण Department of Defence Production कडून NOC मिळाल्यास prescribed exception अंतर्गत permission मिळू शकते.", "golden": "Arms → Iraq → Prohibited, but NOC exception"}, {"no": 16, "q": "Q16. Input Tax Credit of Central Tax (CGST) cannot be utilised towards payment of—", "options": [{"letter": "A", "text": "SGST & UTGST"}, {"letter": "B", "text": "IGST & CGST"}, {"letter": "C", "text": "CGST"}, {"letter": "D", "text": "IGST"}], "answer": "A", "answer_text": "SGST & UTGST", "explanation": "CGST ITC चा उपयोग: ✔️ CGST ✔️ IGST साठी करता येतो. पण: ❌ SGST / UTGST payment साठी CGST ITC वापरता येत नाही.", "golden": "CGST ITC → CGST/IGST, NOT SGST/UTGST"}, {"no": 17, "q": "Q17. Under the Patents Act, 1970, an application for patent can be filed by—", "options": [{"letter": "A", "text": "The inventor"}, {"letter": "B", "text": "Any person being the assignee of the inventor"}, {"letter": "C", "text": "Legal representative of deceased inventor"}, {"letter": "D", "text": "All of the above"}], "answer": "D", "answer_text": "All of the above", "explanation": "Patent application खालील व्यक्ती करू शकतात: ✔️ Inventor ✔️ Assignee ✔️ Legal representative of deceased inventor म्हणून: 👉 All of the above", "golden": "Patent Application → Inventor + Assignee + Legal Representative"}, {"no": 18, "q": "Q18. What is the Customs Tariff Heading (CTH) of Sandalwood chips and dust?", "options": [{"letter": "A", "text": "12119051"}, {"letter": "B", "text": "12119048"}, {"letter": "C", "text": "12119053"}, {"letter": "D", "text": "12119054"}], "answer": "A", "answer_text": "12119051", "explanation": "Paper मध्ये Sandalwood chips and dust साठी CTH: 👉 12119051 दिलेला आहे.", "golden": "Sandalwood Chips & Dust → CTH 12119051"}, {"no": 19, "q": "Q19. As per Rule 10(1) of Customs Valuation Rules, 2007, which costs/services incurred by buyer are added to transaction value?", "options": [{"letter": "A", "text": "Loading/unloading charges at place of importation at notional 1% of FOB"}, {"letter": "B", "text": "Commissions and brokerage except buying commission, cost of containers, packing cost, royalties and licence fees"}, {"letter": "C", "text": "Both A and B"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "", "explanation": "Rule 10(1) मध्ये transaction value मध्ये काही additions करावे लागतात. यामध्ये: ✔️ Commissions & brokerage — buying commission वगळून ✔️ Cost of containers ✔️ Packing cost ✔️ Royalties ✔️ Licence fees यांचा समावेश होऊ शकतो.", "golden": "Rule 10 → Additions to Transaction Value"}, {"no": 20, "q": "Q20. If Assessable Value of an imported article is ₹15,000, BCD 30%, SWS 10%, ADD 0%, IGST 18% and Compensation Cess 0%, what is total duty payable?", "options": [{"letter": "A", "text": "₹7,200"}, {"letter": "B", "text": "₹5,841"}, {"letter": "C", "text": "₹7,650"}, {"letter": "D", "text": "₹8,541"}], "answer": "D", "answer_text": "₹8,541", "explanation": "", "golden": "IGST Base = AV + BCD + SWS + applicable other duties"}, {"no": 21, "q": "Q21. If a food business operator has been served an “Improvement Notice” under Food Safety and Standards Act, 2006, within how many days should he comply with the regulations?", "options": [{"letter": "A", "text": "Fourteen days"}, {"letter": "B", "text": "Seven days"}, {"letter": "C", "text": "Thirty days"}, {"letter": "D", "text": "Twenty days"}], "answer": "A", "answer_text": "Fourteen days", "explanation": "Food Safety and Standards Act, 2006 च्या Section 32 नुसार Improvement Notice मिळाल्यानंतर FBO ने: 👉 14 days मध्ये, किंवा notice मध्ये specified केलेल्या period मध्ये compliance करणे आवश्यक आहे.", "golden": "Improvement Notice → 14 Days"}, {"no": 22, "q": "Q22. What does “production” under Narcotic Drugs and Psychotropic Substances Act, 1985 mean?", "options": [{"letter": "A", "text": "Growing of opium, poppy straw, coca leaves or cannabis in fields"}, {"letter": "B", "text": "Growing of opium, poppy straw, coca leaves or cannabis in laboratory"}, {"letter": "C", "text": "Separation of opium, poppy straw, coca leaves or cannabis from the plants from which they are obtained"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "", "explanation": "NDPS Act मध्ये Production म्हणजे: 👉 Opium, poppy straw, coca leaves किंवा cannabis ज्या plants मधून मिळतात, त्या plants पासून त्यांचे separation करणे.", "golden": "Production → Separation from the plant"}, {"no": 23, "q": "Q23. Is the person making supply from territorial waters of India required to take registration under CGST Act?", "options": [{"letter": "A", "text": "Yes, in the coastal State or Union Territory where nearest point of India of appropriate baseline is located"}, {"letter": "B", "text": "No, supply from territorial waters of India is exempt"}, {"letter": "C", "text": "No, as the place from where supply is initiated is not Indian land"}, {"letter": "D", "text": "Yes, in the State where the person supplies the goods"}], "answer": "A", "answer_text": "", "explanation": "CGST Rules च्या Rule 8 नुसार territorial waters मधून taxable supply करणाऱ्या व्यक्तीने: 👉 ज्या coastal State/UT च्या nearest point of appropriate baseline मध्ये supply येते, तिथे registration घ्यायचे.", "golden": "Territorial Waters Supply → Nearest Coastal State/UT"}, {"no": 24, "q": "Q24. If an importer fails to provide documents and information required for SVB inquiries within 60 days, what security deposit may be imposed?", "options": [{"letter": "A", "text": "3%"}, {"letter": "B", "text": "1%"}, {"letter": "C", "text": "5%"}, {"letter": "D", "text": "2%"}], "answer": "C", "answer_text": "5%", "explanation": "SVB inquiry साठी required documents/information वेळेत न दिल्यास Commissioner: 👉 Declared Assessable Value च्या 5% पर्यंत security deposit impose करू शकतो, prescribed period subject to.", "golden": "SVB Documents not furnished in 60 days → 5% Security Deposit"}, {"no": 25, "q": "Q25. Under Narcotic Drugs and Psychotropic Substances Act, 1985, what is the punishment for illegal import of narcotic drugs or psychotropic substances in commercial quantity?", "options": [{"letter": "A", "text": "Rigorous imprisonment up to 5 years"}, {"letter": "B", "text": "Fine of ₹20,000 only"}, {"letter": "C", "text": "Rigorous imprisonment not less than 10 years + fine not less than ₹1 lakh"}, {"letter": "D", "text": "Rigorous imprisonment of 5 years + fine of ₹20,000"}], "answer": "C", "answer_text": "", "explanation": "Commercial quantity च्या illegal import/export बाबत कठोर punishment आहे: 👉 Minimum 10 years rigorous imprisonment 👉 Minimum ₹1 lakh fine Imprisonment/fine prescribed limits पर्यंत वाढू शकतात.", "golden": "NDPS Commercial Quantity → 10 Years + ₹1 Lakh Minimum Q26–30"}, {"no": 26, "q": "Q26. If an applicant has applied for a licence for manufacture of explosives under Section 5 of the Explosives Act, 1884, under which section does the licensing authority grant the licence?", "options": [{"letter": "A", "text": "Section 4"}, {"letter": "B", "text": "Section 6A"}, {"letter": "C", "text": "Section 6B"}, {"letter": "D", "text": "Section 6"}], "answer": "C", "answer_text": "Section 6B", "explanation": "Explosives Act मध्ये manufacture licence च्या application आणि grant साठी संबंधित provisions आहेत. Paper नुसार योग्य provision: 👉 Section 6B", "golden": "Explosives Licence → Sec.6B"}, {"no": 27, "q": "Q27. What is meant by “place of importation” under Customs Valuation Rules, 2007?", "options": [{"letter": "A", "text": "The place from where goods are brought for export"}, {"letter": "B", "text": "The Customs Station where goods are brought for importation into India or for warehousing in India"}, {"letter": "C", "text": "The place where goods are sold in India"}, {"letter": "D", "text": "The place where goods are manufactured"}], "answer": "B", "answer_text": "", "explanation": "Customs Valuation Rules, 2007 च्या Rule 2(d) नुसार “place of importation” म्हणजे: 👉 Customs Station where goods are brought for importation into India or for warehousing in India.", "golden": "Place of Importation → Customs Station"}, {"no": 28, "q": "Q28. Which section of the Customs Act, 1962 empowers the Board to make regulations regarding goods imported or exported by post?", "options": [{"letter": "A", "text": "Section 83"}, {"letter": "B", "text": "Section 81"}, {"letter": "C", "text": "Section 84"}, {"letter": "D", "text": "Section 86"}], "answer": "C", "answer_text": "Section 84", "explanation": "Customs Act: 👉 Section 84 CBIC ला post द्वारे imported/exported goods संदर्भात regulations बनवण्याची power देते.", "golden": "Sec.84 → Post/Courier Goods Regulations"}, {"no": 29, "q": "Q29. A Customs Broker who has a licence at one Customs Station wishes to work at another Customs Station. Which Form is required to intimate Principal Commissioner/Commissioner of Customs?", "options": [{"letter": "A", "text": "Form D"}, {"letter": "B", "text": "Form C"}, {"letter": "C", "text": "Form A"}, {"letter": "D", "text": "Form E"}], "answer": "B", "answer_text": "Form C", "explanation": "CBLR, 2018 च्या Regulation 7 नुसार दुसऱ्या Customs Station वर operate करण्यासाठी: 👉 Form C मध्ये intimation द्यायचे.", "golden": "Another Customs Station → Form C"}, {"no": 30, "q": "Q30. Within how many days must the Principal Commissioner/Commissioner of Customs decide an application for post-export conversion of Shipping Bill under the relevant regulations?", "options": [{"letter": "A", "text": "15 days"}, {"letter": "B", "text": "30 days"}, {"letter": "C", "text": "60 days"}, {"letter": "D", "text": "90 days"}], "answer": "B", "answer_text": "30 days", "explanation": "Shipping Bill (Post Export Conversion) Regulations, 2022 नुसार application मिळाल्यानंतर: 👉 30 days मध्ये Principal Commissioner/Commissioner ने decision घ्यायचा आहे.", "golden": "Post-Export Conversion → 30 Days Q31–35"}, {"no": 31, "q": "Q31. Import of hazardous and other wastes from any country to India shall not be permitted for the purpose of—", "options": [{"letter": "A", "text": "Recycling"}, {"letter": "B", "text": "Disposal"}, {"letter": "C", "text": "Reuse"}, {"letter": "D", "text": "Recovery"}], "answer": "B", "answer_text": "Disposal", "explanation": "Hazardous and Other Wastes Rules, 2016 च्या Rule 12 नुसार hazardous/other waste चे import: ❌ Disposal साठी permitted नाही. Specified conditions अंतर्गत recycling, reuse किंवा recovery साठी import allowed असू शकते.", "golden": "Hazardous Waste Import → Disposal ❌"}, {"no": 32, "q": "Q32. What is the time limit for filing a Bill of Entry under the regulations?", "options": [{"letter": "A", "text": "One month maximum"}, {"letter": "B", "text": "Six months maximum"}, {"letter": "C", "text": "Two months maximum"}, {"letter": "D", "text": "Four months maximum"}], "answer": "D", "answer_text": "Four months maximum", "explanation": "Bill of Entry वेळेत file करणे आवश्यक आहे आणि prescribed circumstances मध्ये extension सहित: 👉 Maximum 4 months ची time limit आहे.", "golden": "Bill of Entry → Maximum 4 Months"}, {"no": 33, "q": "Q33. Within what time must opposition to registration of a trade mark be filed from the date of advertisement/re-advertisement in the Trade Marks Journal?", "options": [{"letter": "A", "text": "Three months"}, {"letter": "B", "text": "Five years"}, {"letter": "C", "text": "Six months"}, {"letter": "D", "text": "Four months"}], "answer": "D", "answer_text": "Four months", "explanation": "Trade Marks Act, 1999 च्या Section 21 नुसार opposition: 👉 Advertisement/re-advertisement च्या date पासून 4 months मध्ये file करायची.", "golden": "Trade Mark Opposition → 4 Months"}, {"no": 34, "q": "Q34. What will be the penalty for late filing of Bill of Entry if the proper officer is satisfied that there was no sufficient cause for such delay?", "options": [{"letter": "A", "text": "₹5,000/day for initial 2 days + ₹8,000/day thereafter"}, {"letter": "B", "text": "₹5,000/day for initial 5 days + ₹8,000/day thereafter"}, {"letter": "C", "text": "₹5,000/day for initial 3 days + ₹10,000/day thereafter"}, {"letter": "D", "text": "₹5,000/day for initial 2 days + ₹10,000/day thereafter"}], "answer": "C", "answer_text": "", "explanation": "Late filing charges: पहिले 3 days → ₹5,000 per day त्यानंतर → ₹10,000 per day", "golden": "Late BOE → 3 Days × ₹5,000 → Then ₹10,000/day"}, {"no": 35, "q": "Q35. In case of illegal import of hazardous/other waste, within how many days shall importer re-export the waste at his own cost?", "options": [{"letter": "A", "text": "10 days"}, {"letter": "B", "text": "30 days"}, {"letter": "C", "text": "90 days"}, {"letter": "D", "text": "180 days"}], "answer": "C", "answer_text": "90 days", "explanation": "Hazardous and Other Wastes Rules मधील Rule 15 नुसार illegal import झाल्यास importer ने: 👉 90 days मध्ये स्वतःच्या खर्चाने waste re-export करायचा.", "golden": "Illegal Hazardous Waste → Re-export within 90 Days Q36–40"}, {"no": 36, "q": "Q36. In the Foreign Trade Policy, 2023, how many categories of items are there in the SCOMET List?", "options": [{"letter": "A", "text": "9"}, {"letter": "B", "text": "2"}, {"letter": "C", "text": "7"}, {"letter": "D", "text": "5"}], "answer": "A", "answer_text": "9", "explanation": "SCOMET = Special Chemicals, Organisms, Materials, Equipment and Technologies. FTP 2023 मधील SCOMET List मध्ये: 👉 9 categories आहेत.", "golden": "SCOMET → 9 Categories"}, {"no": 37, "q": "Q37. Under which Schedule of Hazardous and Other Wastes Rules, 2016 is import of hazardous and other wastes prohibited?", "options": [{"letter": "A", "text": "Schedule V"}, {"letter": "B", "text": "Schedule VI"}, {"letter": "C", "text": "Schedule III"}, {"letter": "D", "text": "Schedule I"}], "answer": "B", "answer_text": "Schedule VI", "explanation": "Hazardous and Other Wastes Rules, 2016 मधील: 👉 Schedule VI मध्ये import prohibited असलेल्या hazardous/other wastes ची list आहे.", "golden": "Prohibited Hazardous Waste Import → Schedule VI"}, {"no": 38, "q": "Q38. Within what period should an invoice be issued in case of supply of goods where supply involves movement of goods under CGST Act, 2017?", "options": [{"letter": "A", "text": "Within 30 days of removal"}, {"letter": "B", "text": "Within 15 days of removal"}, {"letter": "C", "text": "Within 14 days of removal"}, {"letter": "D", "text": "On or before removal of goods"}], "answer": "D", "answer_text": "On or before removal", "explanation": "CGST Rules नुसार goods च्या supply मध्ये movement involved असल्यास tax invoice: 👉 Goods removal करण्यापूर्वी किंवा त्याच वेळी issue करायचा.", "golden": "Goods Movement → Invoice → Before/At Removal"}, {"no": 39, "q": "Q39. Import of opium under Narcotic Drugs and Psychotropic Substances Rules, 1985 is governed by which Rule?", "options": [{"letter": "A", "text": "Rule 41"}, {"letter": "B", "text": "Rule 44"}, {"letter": "C", "text": "Rule 54"}, {"letter": "D", "text": "Rule 67"}], "answer": "C", "answer_text": "Rule 54", "explanation": "NDPS Rules, 1985 मध्ये Rule 54 opium import संदर्भातील provisions शी संबंधित आहे.", "golden": "Opium Import → NDPS Rule 54"}, {"no": 40, "q": "Q40. Which section of the Customs Act, 1962 empowers the Board to make regulations regarding goods imported or exported by post?", "options": [{"letter": "A", "text": "Section 18"}, {"letter": "B", "text": "Section 21"}, {"letter": "C", "text": "Section 23"}, {"letter": "D", "text": "Section 27"}], "answer": "C", "answer_text": "Section 23", "explanation": "या प्रश्नाच्या paper मध्ये Section 23 answer दिलेला आहे. Section 23 हा lost/destroyed goods आणि remission of duty शी संबंधित महत्त्वाचा section आहे.", "golden": "Q40 → Paper Answer: Sec.23 ⚠️ Exam Note: हा प्रश्न/wording Q28 सारखा दिसतो, पण तुमच्या PDF मधील Q40 चा printed answer C — Section 23 आहे. त्यामुळे exam preparation साठी paper-answer वेगळा mark करून ठेवा."}, {"no": 41, "q": "Q41. Who is the authority to issue investigation report for related party import transactions under Customs Act, 1962?", "options": [{"letter": "A", "text": "Jurisdictional Special Valuation Branch (SVB)"}, {"letter": "B", "text": "COIN"}, {"letter": "C", "text": "Jurisdictional DGFT"}, {"letter": "D", "text": "Jurisdictional Commissioner"}], "answer": "A", "answer_text": "Jurisdictional SVB", "explanation": "Related party import transactions मध्ये valuation योग्य आहे की नाही हे तपासण्यासाठी Special Valuation Branch (SVB) investigation करते आणि report issue करते.", "golden": "Related Party Import → SVB → Investigation Report"}, {"no": 42, "q": "Q42. According to the Arms Act, 1959, “prohibited arms” includes which of the following?", "options": [{"letter": "A", "text": "Hunting rifles"}, {"letter": "B", "text": "Antique firearms"}, {"letter": "C", "text": "Small calibre weapons"}, {"letter": "D", "text": "Artillery, anti-aircraft and anti-tank firearms"}], "answer": "D", "answer_text": "", "explanation": "Arms Act, 1959 मधील Section 7 नुसार prohibited arms मध्ये: 👉 Artillery, anti-aircraft आणि anti-tank firearms यांचा समावेश होतो.", "golden": "Prohibited Arms → Artillery + Anti-aircraft + Anti-tank"}, {"no": 43, "q": "Q43. As per the Customs (Assistance in Value Declaration of Imported Goods) Rules, 2023, the Screening Committee consists of……?", "options": [{"letter": "A", "text": "DG Valuation + DG DRI + DG ARM + Conveners of NAC"}, {"letter": "B", "text": "DG NACIN + DG DRI + DG ARM + Conveners of NAC"}, {"letter": "C", "text": "DG Valuation + DG NACIN + DG ARM + Conveners of NAC"}, {"letter": "D", "text": "DG NACIN + DG DRI + Trade Representatives"}], "answer": "A", "answer_text": "", "explanation": "Screening Committee मध्ये: ✔️ DG Valuation ✔️ DG DRI ✔️ DG ARM ✔️ Conveners of National Assessment Centre (NAC) यांचा समावेश होतो.", "golden": "CAVR 2023 Screening Committee → DG Valuation + DRI + ARM + NAC Conveners"}, {"no": 44, "q": "Q44. Within how many days from the date of seizure effected under Section 37A of Foreign Exchange Management Act, 1999 should the order of seizure along with relevant material be placed by the seizing officer before the competent authority?", "options": [{"letter": "A", "text": "15 days"}, {"letter": "B", "text": "30 days"}, {"letter": "C", "text": "60 days"}, {"letter": "D", "text": "45 days"}], "answer": "B", "answer_text": "30 days", "explanation": "FEMA Section 37A नुसार seizure केल्यानंतर seizing officer ने order of seizure आणि relevant material: 👉 30 days मध्ये competent authority समोर ठेवणे आवश्यक आहे.", "golden": "FEMA Sec.37A → Seizure Material → 30 Days"}, {"no": 45, "q": "Q45. Under the Designs Act, 2000 till what period from the date of registration will the registered proprietor of the design have copyright in the design?", "options": [{"letter": "A", "text": "Fifteen years"}, {"letter": "B", "text": "Five years"}, {"letter": "C", "text": "Three years"}, {"letter": "D", "text": "Ten years"}], "answer": "D", "answer_text": "Ten years", "explanation": "Designs Act, 2000 च्या Section 11 नुसार registered design वर copyright: 👉 Registration date पासून 10 years असतो. Application केल्यास further 5 years extension मिळू शकते.", "golden": "Design Copyright → 10 Years + 5 Years Extension Q46–50"}, {"no": 46, "q": "Q46. What is the time-limit for filing a refund claim for export duty paid under Section 26 of the Customs Act, 1962?", "options": [{"letter": "A", "text": "6 months from LEO date"}, {"letter": "B", "text": "3 months from LEO date"}, {"letter": "C", "text": "6 months from the date of import"}, {"letter": "D", "text": "1 year from the date of payment of export duty"}], "answer": "A", "answer_text": "6 months from LEO date", "explanation": "Customs Act Section 26 नुसार goods exported झाले नाहीत/returned झाले असतील तर export duty refund claim: 👉 Let Export Order (LEO) च्या date पासून 6 months मध्ये file करावा.", "golden": "Export Duty Refund → 6 Months from LEO"}, {"no": 47, "q": "Q47. The reverse charge mechanism under CGST Act, 2017 is provided under which section?", "options": [{"letter": "A", "text": "Sub-section 3 of Section 9"}, {"letter": "B", "text": "Sub-section 5 of Section 9"}, {"letter": "C", "text": "Sub-section 2 of Section 9"}, {"letter": "D", "text": "Sub-section 1 of Section 9"}], "answer": "A", "answer_text": "Section 9(3)", "explanation": "Reverse Charge Mechanism (RCM) साठी: 👉 Section 9(3), CGST Act महत्त्वाचा provision आहे. यामध्ये notified goods/services बाबत tax recipient कडून payable होतो.", "golden": "RCM → Sec.9(3)"}, {"no": 48, "q": "Q48. What is the primary purpose of the Additional Duty levied on any item imported into India?", "options": [{"letter": "A", "text": "To equalize the excise duty on like goods produced in India"}, {"letter": "B", "text": "To increase revenue for the government"}, {"letter": "C", "text": "To promote local manufacturing"}, {"letter": "D", "text": "To discourage imports"}], "answer": "A", "answer_text": "", "explanation": "Additional Duty चा primary purpose: 👉 भारतात तयार होणाऱ्या like goods वर लागू असलेल्या excise duty शी imported goods चा tax treatment equalize करणे. यामुळे imported आणि domestic goods मध्ये tax disparity कमी होते.", "golden": "Additional Duty → Equalize Domestic Excise Duty"}, {"no": 49, "q": "Q49. Within how many months has Pr. Commissioner/Commissioner of Customs (Appeals) to hear and decide?", "options": [{"letter": "A", "text": "3 months"}, {"letter": "B", "text": "1 month"}, {"letter": "C", "text": "9 months"}, {"letter": "D", "text": "6 months"}], "answer": "D", "answer_text": "6 months", "explanation": "Customs Act Section 128A नुसार Commissioner (Appeals) ने appeal: 👉 6 months मध्ये hear आणि decide करण्याचा प्रयत्न करावा. यामुळे customs disputes लवकर resolve करण्याचा उद्देश आहे.", "golden": "Sec.128A → Commissioner (Appeals) → 6 Months"}, {"no": 50, "q": "Q50. Which rule of the Customs (Compounding of Offences) Rules, 2005 empowers Compounding Authority to grant immunity from prosecution to the applicant?", "options": [{"letter": "A", "text": "Rule 3"}, {"letter": "B", "text": "Rule 5"}, {"letter": "C", "text": "Rule 6"}, {"letter": "D", "text": "Rule 4"}], "answer": "C", "answer_text": "Rule 6", "explanation": "Rule 6 अंतर्गत Compounding Authority ला application accept आणि compounding amount pay झाल्यानंतर prescribed conditions मध्ये: 👉 Prosecution मधून immunity देण्याचा अधिकार आहे.", "golden": "Compounding Rules → Rule 6 → Immunity Q51–55"}, {"no": 51, "q": "Q51. What is the Customs Tariff Heading (CTH) of Mozzarella Cheese?", "options": [{"letter": "A", "text": "04061011"}, {"letter": "B", "text": "04061012"}, {"letter": "C", "text": "04061009"}, {"letter": "D", "text": "04061010"}], "answer": "D", "answer_text": "04061010", "explanation": "Paper मध्ये Mozzarella Cheese साठी CTH: 👉 04061010 दिलेला आहे.", "golden": "Mozzarella Cheese → CTH 04061010"}, {"no": 52, "q": "Q52. As per the Notification specifying Small Quantity and Commercial Quantity of drugs, small quantity of cocaine under NDPS Act, 1985 is?", "options": [{"letter": "A", "text": "2 gm"}, {"letter": "B", "text": "5 gm"}, {"letter": "C", "text": "8 gm"}, {"letter": "D", "text": "5 gm"}], "answer": "A", "answer_text": "2 gm", "explanation": "NDPS Act अंतर्गत cocaine साठी: 👉 Small Quantity = 2 grams अशी notification मध्ये specification आहे.", "golden": "Cocaine → Small Quantity = 2 gm"}, {"no": 53, "q": "Q53. As per the Trade Marks Act, 1999, what specific requirement is needed for a trade mark to be registered?", "options": [{"letter": "A", "text": "Must be tested"}, {"letter": "B", "text": "Must have distinctiveness"}, {"letter": "C", "text": "Must have been used for five years"}, {"letter": "D", "text": "Must resemble other registered trademarks"}], "answer": "B", "answer_text": "Must have distinctiveness", "explanation": "Trade Mark Act च्या Section 9 नुसार trademark मध्ये distinctive character असणे महत्त्वाचे आहे. Distinctiveness म्हणजे mark मुळे एका trader ची goods/services इतरांपासून identify करता येणे.", "golden": "Trademark Registration → Distinctiveness"}, {"no": 54, "q": "Q54. As per Customs Valuation (Determination of Value of Imported Goods) Rules, 2007, what percentage of business a person should own to be considered as related party?", "options": [{"letter": "A", "text": "3%"}, {"letter": "B", "text": "5%"}, {"letter": "C", "text": "10%"}, {"letter": "D", "text": "15%"}], "answer": "B", "answer_text": "5%", "explanation": "Customs Valuation Rules, 2007 मधील Rule 2 नुसार person related party मानला जाऊ शकतो जर: 👉 तो directly किंवा indirectly 5% or more voting stock/shares own/control करत असेल.", "golden": "Related Party → 5% or More Voting Stock/Shares"}, {"no": 55, "q": "Q55. What is the Customs Tariff Heading (CTH) of Tamarind Kernel Powder?", "options": [{"letter": "A", "text": "13033910"}, {"letter": "B", "text": "13023910"}, {"letter": "C", "text": "13022910"}, {"letter": "D", "text": "13032910"}], "answer": "B", "answer_text": "13023910", "explanation": "Paper मध्ये Tamarind Kernel Powder साठी: 👉 CTH 13023910 दिलेला आहे.", "golden": "Tamarind Kernel Powder → 13023910 Q56–60"}, {"no": 56, "q": "Q56. Under provisions of the Narcotic Drugs and Psychotropic Substances Act, 1985 a substance is declared controlled substance by ______?", "options": [{"letter": "A", "text": "Directorate General of Foreign Trade (DGFT)"}, {"letter": "B", "text": "Central Government"}, {"letter": "C", "text": "Central Board of Indirect Taxes & Customs (CBIC)"}, {"letter": "D", "text": "Narcotics Control Bureau (NCB)"}], "answer": "B", "answer_text": "Central Government", "explanation": "NDPS Act च्या Section 9A अंतर्गत: 👉 Central Government एखाद्या substance ला controlled substance म्हणून declare करू शकते.", "golden": "Controlled Substance → Sec.9A → Central Government"}, {"no": 57, "q": "Q57. As per the Notification specifying Small Quantity and Commercial Quantity of drugs, small quantity of Heroin under NDPS Act, 1985 is?", "options": [{"letter": "A", "text": "50 gm"}, {"letter": "B", "text": "2 gm"}, {"letter": "C", "text": "5 gm"}, {"letter": "D", "text": "10 gm"}], "answer": "C", "answer_text": "5 gm", "explanation": "NDPS notification नुसार: 👉 Heroin small quantity = 5 grams लक्षात ठेवा, commercial quantity यापेक्षा खूप मोठी आहे.", "golden": "Heroin → Small Quantity = 5 gm"}, {"no": 58, "q": "Q58. How many digits are there in a PCIN (Primary Cargo Identification Number) assigned by Customs to identify a cargo contained in single Transport Document mentioning Actual Buyer and Seller?", "options": [{"letter": "A", "text": "18 digits"}, {"letter": "B", "text": "12 digits"}, {"letter": "C", "text": "8 digits"}, {"letter": "D", "text": "15 digits"}], "answer": "A", "answer_text": "18 digits", "explanation": "SCMTR अंतर्गत PCIN = Primary Cargo Identification Number. एका transport document मधील cargo identify करण्यासाठी Customs कडून: 👉 18-digit unique number दिला जातो.", "golden": "PCIN → 18 Digits"}, {"no": 59, "q": "Q59. Is the importer liable to pay duty on any imported goods pilfered after unloading from the vessel and before an order for clearance for home consumption or deposit of the said goods in a warehouse is made by the proper officer of Customs?", "options": [{"letter": "A", "text": "Yes always"}, {"letter": "B", "text": "No always"}, {"letter": "C", "text": "Yes, only when such goods are restored to the importer after pilferage"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "", "explanation": "Customs Act Section 13 नुसार goods unloading झाल्यानंतर पण clearance/warehousing order होण्यापूर्वी pilfer झाले असतील तर: 👉 सामान्यतः importer ला duty भरावी लागत नाही. परंतु goods pilferage नंतर importer ला restored/returned झाले तर duty payable होते.", "golden": "Pilfered Goods → No Duty; BUT if restored → Duty Payable"}, {"no": 60, "q": "Q60. Under what section of the Designs Act, 2000 does the Controller grant a certificate of registration to the proprietor of design when registered?", "options": [{"letter": "A", "text": "Section 7(1)"}, {"letter": "B", "text": "Section 8(3)"}, {"letter": "C", "text": "Section 9(1)"}, {"letter": "D", "text": "Section 10(b)"}], "answer": "C", "answer_text": "Section 9(1)", "explanation": "Designs Act, 2000 च्या: 👉 Section 9(1) नुसार design registered झाल्यावर Controller proprietor ला certificate of registration grant करतो.", "golden": "Design Registration Certificate → Sec.9(1)"}, {"no": 61, "q": "Q61. What is the amount of Bank Guarantee required to be furnished by entities other than Authorized Economic Operator (AEO) for operating under Sea Cargo Manifest and Transhipment Regulations (SCMTR), 2018?", "options": [{"letter": "A", "text": "₹5,00,000/-"}, {"letter": "B", "text": "₹10,00,000/-"}, {"letter": "C", "text": "₹15,00,000/-"}, {"letter": "D", "text": "₹3,00,000/-"}], "answer": "A", "answer_text": "₹5,00,000/-", "explanation": "SCMTR, 2018 नुसार AEO व्यतिरिक्त entities ना authorised carrier म्हणून operate करण्यासाठी: 👉 ₹5 lakh Bank Guarantee द्यावी लागते.", "golden": "SCMTR → Non-AEO → Bank Guarantee ₹5 Lakh"}, {"no": 62, "q": "Q62. Under which section of Customs Act, 1962 are Customs duties levied on imported goods?", "options": [{"letter": "A", "text": "Section 17"}, {"letter": "B", "text": "Section 12"}, {"letter": "C", "text": "Section 13"}, {"letter": "D", "text": "Section 14"}], "answer": "B", "answer_text": "Section 12", "explanation": "Section 12 हा Customs Act चा मुख्य charging section आहे. तो imported/exported goods वर customs duty levy करण्याची authority देतो.", "golden": "Sec.12 → Levy of Customs Duty"}, {"no": 63, "q": "Q63. Piracy of registered designs is prohibited under which section of the Designs Act, 2000?", "options": [{"letter": "A", "text": "Section 22"}, {"letter": "B", "text": "Section 21"}, {"letter": "C", "text": "Section 20"}, {"letter": "D", "text": "Section 23"}], "answer": "A", "answer_text": "Section 22", "explanation": "Designs Act, 2000 मध्ये: 👉 Section 22 = Piracy of registered design Registered design ची unauthorized copying किंवा imitation केल्यास action होऊ शकते.", "golden": "Design Piracy → Sec.22"}, {"no": 64, "q": "Q64. What is the penalty for infringement of copyright under the Copyright Act, 1957?", "options": [{"letter": "A", "text": "No penalty"}, {"letter": "B", "text": "Fine only"}, {"letter": "C", "text": "Both fine and imprisonment"}, {"letter": "D", "text": "Imprisonment only"}], "answer": "C", "answer_text": "Both fine and imprisonment", "explanation": "Copyright infringement साठी criminal punishment मध्ये: ✔️ Imprisonment ✔️ Fine दोन्हीची तरतूद आहे. Paper मध्ये Section 63 च्या संदर्भात हा answer दिलेला आहे.", "golden": "Copyright Infringement → Fine + Imprisonment"}, {"no": 65, "q": "Q65. What % of CIF value of authorization will be permitted duty free in the import of mandatory spares which are required to be exported/supplied with the resultant product?", "options": [{"letter": "A", "text": "12%"}, {"letter": "B", "text": "18%"}, {"letter": "C", "text": "10%"}, {"letter": "D", "text": "15%"}], "answer": "C", "answer_text": "10%", "explanation": "Foreign Trade Policy 2023 मधील EPCG scheme अंतर्गत mandatory spares: 👉 Authorization च्या CIF value च्या 10% पर्यंत duty-free import करता येतात.", "golden": "EPCG Mandatory Spares → 10% of CIF Value Q66–70"}, {"no": 66, "q": "Q66. Under which section of the Explosives Act, 1884 does the Central Government make rules for licensing the manufacture, possession, use, sale, transport, import and export of explosives?", "options": [{"letter": "A", "text": "Section 5A"}, {"letter": "B", "text": "Section 6A"}, {"letter": "C", "text": "Section 5"}, {"letter": "D", "text": "Section 6"}], "answer": "C", "answer_text": "Section 5", "explanation": "Explosives Act, 1884 मधील Section 5 Central Government ला explosives संदर्भात rules बनवण्याची power देते. यामध्ये: Manufacture Possession Use Sale Transport Import Export यांचा समावेश आहे.", "golden": "Explosives Act → Sec.5 → Rule-making Power"}, {"no": 67, "q": "Q67. Which of the following is excluded from the computation of aggregate turnover under CGST Act, 2017?", "options": [{"letter": "A", "text": "Inter-State supplies"}, {"letter": "B", "text": "Exports of goods or services"}, {"letter": "C", "text": "Value of inward supplies on which tax is payable by a person on reverse charge basis"}, {"letter": "D", "text": "Exempt supplies"}], "answer": "C", "answer_text": "", "explanation": "CGST Act Section 2(6) नुसार aggregate turnover मध्ये outward supplies, exports आणि inter-State supplies येतात. परंतु: 👉 Inward supplies on which tax is payable under reverse charge aggregate turnover मध्ये include होत नाहीत.", "golden": "Aggregate Turnover → RCM Inward Supply ❌"}, {"no": 68, "q": "Q68. Under which regulation of Sea Cargo Manifest and Transhipment Regulations (SCMTR), 2018 can the jurisdictional Principal Commissioner/Commissioner of Customs suspend the operations or revoke the registration of an authorised carrier?", "options": [{"letter": "A", "text": "Regulation 13"}, {"letter": "B", "text": "Regulation 12"}, {"letter": "C", "text": "Regulation 10"}, {"letter": "D", "text": "Regulation 11"}], "answer": "D", "answer_text": "Regulation 11", "explanation": "SCMTR, 2018 मधील: 👉 Regulation 11 jurisdictional Principal Commissioner/Commissioner ला authorised carrier ची operations suspend किंवा registration revoke करण्याची power देते. Non-compliance किंवा serious operational lapses असल्यास action होऊ शकते.", "golden": "SCMTR → Reg.11 → Suspend/ Revoke Authorised Carrier"}, {"no": 69, "q": "Q69. As per the principles of Customs Tariff classification, a commodity can be classified by—", "options": [{"letter": "A", "text": "Terms of Heading"}, {"letter": "B", "text": "Notes to Sections"}, {"letter": "C", "text": "Notes to Chapters"}, {"letter": "D", "text": "All of the above"}], "answer": "D", "answer_text": "All of the above", "explanation": "GIR Rule 1 नुसार classification करताना: ✔️ Heading ✔️ Section Notes ✔️ Chapter Notes सर्व consider केले जातात.", "golden": "Classification → Heading + Section Notes + Chapter Notes"}, {"no": 70, "q": "Q70. What is “Controlled Delivery” under the Narcotic Drugs and Psychotropic Substances Act, 1985?", "options": [{"letter": "A", "text": "Delivery of narcotic substances under supervision of officers authorised under Section 50A of the Act to identify offenders"}, {"letter": "B", "text": "Delivery of poppy grown by licence holder to factories for processing"}, {"letter": "C", "text": "Delivery of narcotics seized by Customs for destruction"}, {"letter": "D", "text": "Government control of delivery of narcotic substances to factories for processing"}], "answer": "A", "answer_text": "", "explanation": "NDPS Act मधील Section 50A controlled delivery शी संबंधित आहे. यामध्ये narcotic substances ची movement: 👉 authorised officers च्या supervision खाली होऊ दिली जाते, जेणेकरून offenders/network identify आणि apprehend करता येतील.", "golden": "Controlled Delivery → Sec.50A → Identify Offenders Q71–75"}, {"no": 71, "q": "Q71. Fill in the blank: The term of a patent granted under the Patents Act, 1970 is generally ______ from the date of filing of the application for the patent.", "options": [{"letter": "A", "text": "20 years"}, {"letter": "B", "text": "10 years"}, {"letter": "C", "text": "15 years"}, {"letter": "D", "text": "21 years"}], "answer": "A", "answer_text": "20 years", "explanation": "Patents Act, 1970 नुसार patent चा सामान्य term: 👉 20 years from the date of filing of application असतो.", "golden": "Patent → 20 Years"}, {"no": 72, "q": "Q72. What constitutes assignment of a registered trademark under the Trade Marks Act, 1999?", "options": [{"letter": "A", "text": "Use of identical or deceptively similar mark"}, {"letter": "B", "text": "Use of a different font"}, {"letter": "C", "text": "Changes in colour"}, {"letter": "D", "text": "None of the above"}], "answer": "D", "answer_text": "None of the above", "explanation": "Registered trademark ची assignment म्हणजे proprietor कडून trademark rights दुसऱ्या व्यक्तीला transfer करणे. हे Section 37 शी संबंधित आहे. दिलेल्या A–C पैकी कोणतेही assignment ची definition नाही.", "golden": "Trademark Assignment → Sec.37"}, {"no": 73, "q": "Q73. The information sought by proper officer from importer relating to origin criteria of goods to ascertain correctness of claim under CAROTAR, 2020 is to be provided within—", "options": [{"letter": "A", "text": "14 working days"}, {"letter": "B", "text": "05 working days"}, {"letter": "C", "text": "07 working days"}, {"letter": "D", "text": "10 working days"}], "answer": "D", "answer_text": "10 working days", "explanation": "CAROTAR, 2020 नुसार proper officer ने origin-related information मागितल्यास importer ने: 👉 10 working days मध्ये ती information provide करायची असते.", "golden": "CAROTAR Origin Information → 10 Working Days"}, {"no": 74, "q": "Q74. Which section of Customs Act, 1962 talks about offences relating to knowingly making, signing or using false declarations or documents?", "options": [{"letter": "A", "text": "Section 134"}, {"letter": "B", "text": "Section 132"}, {"letter": "C", "text": "Section 133"}, {"letter": "D", "text": "Section 130"}], "answer": "B", "answer_text": "Section 132", "explanation": "Customs Act: 👉 Section 132 knowingly false declaration, false document किंवा false statement करण्याबाबत offence prescribe करते. Punishment imprisonment/fine किंवा both असू शकते.", "golden": "False Declaration/Document → Sec.132"}, {"no": 75, "q": "Q75. An appeal against the order of Principal Commissioner/Commissioner (Appeals) in a baggage import case lies with which authority?", "options": [{"letter": "A", "text": "Jurisdictional High Court"}, {"letter": "B", "text": "Supreme Court"}, {"letter": "C", "text": "Customs, Excise and Service Tax Appellate Tribunal (CESTAT)"}, {"letter": "D", "text": "Additional Secretary (Revisionary Authority)"}], "answer": "D", "answer_text": "Additional Secretary (Revisionary Authority)", "explanation": "Baggage import cases मध्ये Commissioner (Appeals) च्या order विरुद्ध सामान्य CESTAT appeal लागू होत नाही. 👉 Revisionary Authority / Additional Secretary कडे revision mechanism आहे.", "golden": "Baggage Appeal → Revisionary Authority Q76–80"}, {"no": 76, "q": "Q76. If a person obtains an instrument by fraud and the amount of duty relatable to utilisation of the instrument exceeds ₹50 lakh, he shall be punishable with imprisonment for a maximum term of—", "options": [{"letter": "A", "text": "One year"}, {"letter": "B", "text": "Five years"}, {"letter": "C", "text": "Seven years"}, {"letter": "D", "text": "Three years"}], "answer": "C", "answer_text": "Seven years", "explanation": "Customs Act Section 135 अंतर्गत fraudulent procurement/utilisation of instruments बाबत offence आहे. जर duty involved: 👉 ₹50 lakh पेक्षा जास्त असेल तर punishment up to 7 years imprisonment आणि fine असू शकतो.", "golden": "Fraudulent Instrument + Duty > ₹50 Lakh → Up to 7 Years"}, {"no": 77, "q": "Q77. With which authority shall the appeal be filed if the Principal Commissioner/Commissioner of Customs or the other party is aggrieved by an order passed by the Appellate Tribunal regarding determination of any question having relation to the rate of duty of Customs or to the value of goods for purposes of assessment?", "options": [{"letter": "A", "text": "Central Government"}, {"letter": "B", "text": "Jurisdictional High Court"}, {"letter": "C", "text": "Additional Secretary (Revisionary Authority)"}, {"letter": "D", "text": "Supreme Court"}], "answer": "D", "answer_text": "Supreme Court", "explanation": "Customs Act Section 130E अंतर्गत CESTAT च्या order मध्ये: Rate of duty Value of goods for assessment यासंबंधी question असल्यास appeal: 👉 Supreme Court मध्ये जाते.", "golden": "CESTAT + Rate/Value Question → Supreme Court"}, {"no": 78, "q": "Q78. Under which section of the Customs Act, 1962 is amendment of a Bill of Entry done after clearance of imported goods on the basis of documentary evidence which was in existence at the time the imported goods were cleared?", "options": [{"letter": "A", "text": "Section 31"}, {"letter": "B", "text": "Section 149"}, {"letter": "C", "text": "Section 41"}, {"letter": "D", "text": "Section 145"}], "answer": "B", "answer_text": "Section 149", "explanation": "Section 149 नुसार Bill of Entry किंवा अन्य customs document मध्ये amendment करता येते. Goods clear झाल्यानंतर amendment हवी असल्यास: 👉 Supporting documentary evidence goods clearance च्या वेळी अस्तित्वात असणे आवश्यक आहे.", "golden": "Post-Clearance BOE Amendment → Sec.149"}, {"no": 79, "q": "Q79. Which section of the Customs Tariff Act, 1975 specifies the rates at which duties of Customs shall be levied?", "options": [{"letter": "A", "text": "Section 13"}, {"letter": "B", "text": "Section 3"}, {"letter": "C", "text": "Section 2"}, {"letter": "D", "text": "Section 4"}], "answer": "C", "answer_text": "Section 2", "explanation": "Customs Tariff Act, 1975 च्या Section 2 मध्ये: 👉 First Schedule आणि Second Schedule मध्ये specified rates नुसार customs duties levy करण्याची provision आहे. लक्षात ठेवा: Section 2 → Rates of Customs Duty First Schedule → Import Tariff Second Schedule → Export Tariff", "golden": "Customs Tariff Act Sec.2 → Duty Rates"}, {"no": 80, "q": "Q80. As per Foreign Trade Policy, 2023, when goods are imported under EPCG scheme, what is the time limit for submission of Installation Certificate by the importer to the Regional Authority?", "options": [{"letter": "A", "text": "12 months from date of completion of import"}, {"letter": "B", "text": "18 months from date of completion of import"}, {"letter": "C", "text": "6 months from date of completion of import"}, {"letter": "D", "text": "4 months from date of completion of import"}], "answer": "C", "answer_text": "6 months", "explanation": "EPCG scheme अंतर्गत imported capital goods install केल्यानंतर: 👉 Installation Certificate 6 months मध्ये Regional Authority कडे submit करायचे असते. Certificate Chartered Engineer कडून issued असते.", "golden": "EPCG Installation Certificate → 6 Months"}, {"no": 81, "q": "Q81. As per Foreign Trade Policy, 2023, when goods are imported under EPCG scheme, what is the time limit for submission of Installation Certificate by the importer to the Regional Authority?", "options": [{"letter": "A", "text": "12 months from date of completion of import"}, {"letter": "B", "text": "18 months from date of completion of import"}, {"letter": "C", "text": "6 months from date of completion of import"}, {"letter": "D", "text": "4 months from date of completion of import"}], "answer": "C", "answer_text": "6 months", "explanation": "EPCG Scheme अंतर्गत imported capital goods चे installation झाल्याचे Installation Certificate importer ने: 👉 Import completion च्या date पासून 6 months मध्ये Regional Authority कडे submit करायचे असते.", "golden": "EPCG Installation Certificate → 6 Months"}, {"no": 82, "q": "Q82. Under which section of the Copyright Act, 1957 can a person file a suit for infringement of copyright?", "options": [{"letter": "A", "text": "Section 70"}, {"letter": "B", "text": "Section 55"}, {"letter": "C", "text": "Section 16"}, {"letter": "D", "text": "Section 63"}], "answer": "B", "answer_text": "Section 55", "explanation": "Copyright Act, 1957 मधील Section 55 हा infringement विरुद्ध civil remedies शी संबंधित आहे. Copyright owner court मध्ये: ✔️ Injunction ✔️ Damages ✔️ Accounts of profits यांसाठी suit करू शकतो.", "golden": "Copyright Infringement Suit → Sec.55 Q83–85"}, {"no": 83, "q": "Q83. Which persons have been prohibited from manufacturing, possessing, sale or transporting of explosives under the provisions of the Explosives Act, 1884?", "options": [{"letter": "A", "text": "Any person who has not completed the age of eighteen years"}, {"letter": "B", "text": "Any person convicted of an offence involving violence or moral turpitude"}, {"letter": "C", "text": "Any person whose licence has been cancelled for contravention"}, {"letter": "D", "text": "All of the above"}], "answer": "D", "answer_text": "All of the above", "explanation": "Explosives Rules अंतर्गत खालील persons वर restrictions आहेत: ✔️ 18 वर्षांखालील व्यक्ती ✔️ Violence किंवा moral turpitude च्या offence मध्ये convicted person ✔️ Contravention मुळे licence cancelled झालेली व्यक्ती म्हणून: 👉 All of the above", "golden": "Explosives → Under 18 + Convicted + Cancelled Licence = Prohibited"}, {"no": 84, "q": "Q84. How many digits are there in a “GSTIN” issued at the time of issue of Goods and Services Tax registration certificate?", "options": [{"letter": "A", "text": "15"}, {"letter": "B", "text": "10"}, {"letter": "C", "text": "18"}, {"letter": "D", "text": "12"}], "answer": "A", "answer_text": "15 digits", "explanation": "GSTIN = Goods and Services Tax Identification Number GSTIN मध्ये एकूण: 👉 15 characters असतात. Structure मध्ये State code, PAN, entity number, default character आणि checksum यांचा समावेश असतो.", "golden": "GSTIN → 15 Characters"}, {"no": 85, "q": "Q85. As per Customs Valuation (Determination of Value of Imported Goods) Rules, 2007, what is the correct sequence for deciding the value of imported goods?", "options": [{"letter": "A", "text": "Transaction Value of Identical Goods → Similar Goods → Deductive Value"}, {"letter": "B", "text": "Transaction Value → Transaction Value of Identical Goods → Transaction Value of Similar Goods → Deductive Value"}, {"letter": "C", "text": "Transaction Value → Similar Goods → Identical Goods → Deductive Value"}, {"letter": "D", "text": "Transaction Value of Identical Goods → Transaction Value → Similar Goods → Deductive Value"}], "answer": "B", "answer_text": "", "explanation": "Customs Valuation Rules मध्ये valuation methods चा sequence: 1️⃣ Transaction Value 2️⃣ Identical Goods 3️⃣ Similar Goods 4️⃣ Deductive Value 5️⃣ Computed Value 6️⃣ Residual Method म्हणून दिलेल्या options मध्ये B योग्य आहे.", "golden": "TV → Identical → Similar → Deductive → Computed → Residual Q86–90"}, {"no": 86, "q": "Q86. What is the time-limit for filing Courier Bill of Entry for re-import of returned jewellery from the date of corresponding Let Export Order (LEO)?", "options": [{"letter": "A", "text": "30 days"}, {"letter": "B", "text": "15 days"}, {"letter": "C", "text": "60 days"}, {"letter": "D", "text": "45 days"}], "answer": "D", "answer_text": "45 days", "explanation": "Returned jewellery च्या re-import साठी Courier Bill of Entry: 👉 Corresponding LEO date पासून 45 days मध्ये file करायचा आहे.", "golden": "Returned Jewellery Re-import → 45 Days"}, {"no": 87, "q": "Q87. What is the mechanism or mode for submission of declarations under provisions of Sea Cargo Manifest and Transhipment Regulations, 2018 by various stakeholders?", "options": [{"letter": "A", "text": "ICEGATE site"}, {"letter": "B", "text": "CBIC site"}, {"letter": "C", "text": "India Portal site"}, {"letter": "D", "text": "All of the above"}], "answer": "A", "answer_text": "ICEGATE site", "explanation": "SCMTR अंतर्गत carriers, freight forwarders, logistics operators इत्यादी stakeholders declarations: 👉 ICEGATE वर electronic स्वरूपात submit करतात.", "golden": "SCMTR Declaration → ICEGATE"}, {"no": 88, "q": "Q88. From which date has filing of documents relating to regulatory compliance on E-Sanchit been mandatory for Importers?", "options": [{"letter": "A", "text": "01.01.2018"}, {"letter": "B", "text": "01.04.2018"}, {"letter": "C", "text": "20.05.2018"}, {"letter": "D", "text": "30.03.2018"}], "answer": "B", "answer_text": "01.04.2018", "explanation": "CBIC Circular नुसार importers साठी regulatory documents चे e-SANCHIT वर filing: 👉 1 April 2018 पासून mandatory झाले.", "golden": "e-SANCHIT Mandatory → 01.04.2018"}, {"no": 89, "q": "Q89. Which section of the Customs Act, 1962 deals with punishment for refusal to be X-rayed in accordance with an order made by a Magistrate under Section 103 of the Act?", "options": [{"letter": "A", "text": "Section 108"}, {"letter": "B", "text": "Section 131"}, {"letter": "C", "text": "Section 134"}, {"letter": "D", "text": "Section 132"}], "answer": "C", "answer_text": "Section 134", "explanation": "Section 103 मध्ये suspected person च्या X-ray examination शी संबंधित provision आहे. त्या order चे पालन करण्यास refusal केल्यास: 👉 Section 134 punishment prescribe करते.", "golden": "Refusal to X-Ray → Sec.134"}, {"no": 90, "q": "Q90. Which date of rate of exchange will be valid in a Bill of Entry presented under Section 46 of Customs Act, 1962?", "options": [{"letter": "A", "text": "Date on which Customs will clear the goods"}, {"letter": "B", "text": "Date on which Bill of Entry is presented in Customs"}, {"letter": "C", "text": "Date on which duty for the Bill of Entry will be paid"}, {"letter": "D", "text": "Date on which Bill of Entry is assessed"}], "answer": "B", "answer_text": "", "explanation": "Customs Act Section 14 नुसार imported goods ची valuation करताना applicable exchange rate: 👉 Bill of Entry Customs कडे presented झालेल्या date चा घेतला जातो.", "golden": "Exchange Rate → BOE Presentation Date Q91–95"}, {"no": 91, "q": "Q91. Which of the following is included in “online money gaming” under CGST Act, 2017?", "options": [{"letter": "A", "text": "Depositing virtual digital assets without expectation of rewards"}, {"letter": "B", "text": "Games requiring payment or deposit of money with expectation of winning monetary rewards"}, {"letter": "C", "text": "It does not include schemes, competitions, or processes involving monetary expectations"}, {"letter": "D", "text": "Both A and C"}], "answer": "B", "answer_text": "", "explanation": "Online money gaming मध्ये: 👉 Money pay/deposit करून monetary reward जिंकण्याची expectation असलेले games यांचा समावेश होतो.", "golden": "Online Money Gaming → Deposit/Payment + Monetary Winning Expectation"}, {"no": 92, "q": "Q92. Which section of Foreign Exchange Management Act, 1999 empowers Customs, CGST, Police or any other officer of Central/State Government to exercise powers and discharge duties of Enforcement Directorate officer?", "options": [{"letter": "A", "text": "Section 37"}, {"letter": "B", "text": "Section 40"}, {"letter": "C", "text": "Section 36"}, {"letter": "D", "text": "Section 38"}], "answer": "D", "answer_text": "Section 38", "explanation": "FEMA मधील Section 38 नुसार Central/State Government च्या काही officers ना Enforcement Directorate officer चे powers/duties exercise करण्यासाठी empower केले जाऊ शकते.", "golden": "FEMA → Sec.38 → Other Government Officers + ED Powers"}, {"no": 93, "q": "Q93. When is Arrival Manifest for imported goods required to be delivered by an authorised carrier under provisions of Customs Act, 1962?", "options": [{"letter": "A", "text": "Within 12 hours of arrival of vessel/train/truck carrying imported goods in Customs station"}, {"letter": "B", "text": "After 12 hours"}, {"letter": "C", "text": "Within 36 hours"}, {"letter": "D", "text": "Within 24 hours"}], "answer": "A", "answer_text": "Within 12 hours", "explanation": "Customs Act Section 30 आणि SCMTR provisions नुसार authorised carrier ने Arrival Manifest: 👉 Vessel/train/truck च्या arrival पासून 12 hours मध्ये file करायचा आहे.", "golden": "Arrival Manifest → Within 12 Hours"}, {"no": 94, "q": "Q94. Under the Prevention of Corruption Act, 1988, an offence under Section 13(2) related to criminal misconduct by a public servant is punishable with—", "options": [{"letter": "A", "text": "Imprisonment not less than 6 months, extendable to 2 years"}, {"letter": "B", "text": "Imprisonment not less than 2 years, extendable to 5 years"}, {"letter": "C", "text": "Imprisonment not less than 4 years, extendable to 10 years + fine"}, {"letter": "D", "text": "Imprisonment not less than 1 year, extendable to 7 years"}], "answer": "C", "answer_text": "", "explanation": "Section 13(2) अंतर्गत criminal misconduct साठी: 👉 Minimum 4 years imprisonment 👉 Maximum 10 years imprisonment + fine अशी punishment आहे.", "golden": "PCA Sec.13(2) → 4 to 10 Years + Fine"}, {"no": 95, "q": "Q95. What will be the warehousing period for goods warehoused under Section 60 of Customs Act, 1962?", "options": [{"letter": "A", "text": "Till their consumption or clearance from warehouse"}, {"letter": "B", "text": "One year"}, {"letter": "C", "text": "Three years"}, {"letter": "D", "text": "Two years"}], "answer": "A", "answer_text": "Till consumption or clearance", "explanation": "Section 61 मध्ये warehousing period संबंधित provisions आहेत. पण Section 60 अंतर्गत warehousing मध्ये goods warehouse मध्ये राहू शकतात: 👉 Consumption किंवा clearance होईपर्यंत, subject to applicable statutory provisions.", "golden": "Warehouse → Till Consumption/Clearance Q96–100"}, {"no": 96, "q": "Q96. Within how many days should a licensee apply for a fresh licence under provisions of Customs Brokers Licensing Regulations, 2018 to the Principal Commissioner/Commissioner of Customs when there is a change in PAN?", "options": [{"letter": "A", "text": "45 days"}, {"letter": "B", "text": "60 days"}, {"letter": "C", "text": "30 days"}, {"letter": "D", "text": "15 days"}], "answer": "B", "answer_text": "60 days", "explanation": "CBLR, 2018 मधील Regulation 7(2) नुसार PAN मध्ये change झाल्यास Customs Broker ने: 👉 60 days मध्ये fresh licence साठी apply करणे आवश्यक आहे.", "golden": "PAN Change → Fresh CB Licence → 60 Days"}, {"no": 97, "q": "Q97. In case of death of Licensee what is the further period under Food Safety and Standards Act, 2006 the License shall subsist from the date of Licensee's death for the benefit of the deceased's personal representative or any other member of his family?", "options": [{"letter": "A", "text": "One month"}, {"letter": "B", "text": "Six months"}, {"letter": "C", "text": "Two months"}, {"letter": "D", "text": "Three months"}], "answer": "D", "answer_text": "Three months", "explanation": "Food Safety and Standards (Licensing and Registration of Food Businesses) Regulations, 2011 नुसार licensee च्या death नंतर licence: 👉 3 months पर्यंत deceased च्या personal representative किंवा family member च्या benefit साठी subsist करते.", "golden": "Food Business Licence after Death → 3 Months"}, {"no": 98, "q": "Q98. Under which section of the Designs Act, 2000 can a registered design be cancelled by the Controller General of Patents, Designs and Trade Marks?", "options": [{"letter": "A", "text": "Section 21"}, {"letter": "B", "text": "Section 19"}, {"letter": "C", "text": "Section 18"}, {"letter": "D", "text": "Section 20"}], "answer": "B", "answer_text": "Section 19", "explanation": "Designs Act, 2000 मधील: 👉 Section 19 → Cancellation of registered design याअंतर्गत registered design cancellation साठी grounds दिले आहेत. उदा. lack of novelty, prior publication, public order/morality विरुद्ध असणे इ.", "golden": "Registered Design Cancellation → Sec.19"}, {"no": 99, "q": "Q99. The Indian Customs Tariff has ____ Sections and ____ Chapters.", "options": [{"letter": "A", "text": "21 Sections and 98 Chapters"}, {"letter": "B", "text": "20 Sections and 97 Chapters"}, {"letter": "C", "text": "23 Sections and 98 Chapters"}, {"letter": "D", "text": "22 Sections and 99 Chapters"}], "answer": "A", "answer_text": "21 Sections and 98 Chapters", "explanation": "Indian Customs Tariff ची structure: 👉 21 Sections 👉 98 Chapters यामध्ये goods त्यांच्या nature आणि use नुसार classify केले जातात.", "golden": "Customs Tariff → 21 Sections + 98 Chapters"}, {"no": 100, "q": "Q100. Under the provisions of the Prevention of Corruption Act, 1988, what is the punishment for any person who gives or promises to give an undue advantage to another person/persons, with intention to induce a public servant to perform improperly a public duty?", "options": [{"letter": "A", "text": "Imprisonment up to 5 years or fine or both"}, {"letter": "B", "text": "Imprisonment up to 7 years or fine or both"}, {"letter": "C", "text": "Imprisonment up to 9 years or fine or both"}, {"letter": "D", "text": "Imprisonment for 3 years or fine or both"}], "answer": "B", "answer_text": "Up to 7 years", "explanation": "Prevention of Corruption Act, 1988 मधील Section 8 नुसार public servant ला improper performance करण्यासाठी undue advantage देणे किंवा देण्याचे promise करणे हा offence आहे. Punishment: 👉 Imprisonment up to 7 years OR fine OR both", "golden": "PCA Sec.8 → Undue Advantage → Up to 7 Years"}, {"no": 101, "q": "Q101. What is the term of copyright protection for a literary work under the Copyright Act, 1957?", "options": [{"letter": "A", "text": "Life of the author plus 60 years"}, {"letter": "B", "text": "25 years"}, {"letter": "C", "text": "10 years"}, {"letter": "D", "text": "50 years"}], "answer": "A", "answer_text": "Life of the author plus 60 years", "explanation": "Copyright Act, 1957 च्या Section 22 नुसार literary work साठी copyright: 👉 Author च्या lifetime + 60 years असतो.", "golden": "Literary Work → Life + 60 Years"}, {"no": 102, "q": "Q102. What will be the warehousing period for goods warehoused under Section 60 of Customs Act, 1962?", "options": [{"letter": "A", "text": "Two years"}, {"letter": "B", "text": "Three years"}, {"letter": "C", "text": "One year"}, {"letter": "D", "text": "Six months"}], "answer": "C", "answer_text": "One year", "explanation": "Customs Act, 1962 च्या Section 61 नुसार Section 60 अंतर्गत warehouse केलेल्या goods साठी सामान्य warehousing period: 👉 1 year आहे. Commissioner prescribed circumstances मध्ये extension देऊ शकतो.", "golden": "Section 60 Warehousing → 1 Year"}, {"no": 103, "q": "Q103. Emergency power of Central Government to increase import duties comes under which Section of the Customs Tariff Act, 1975?", "options": [{"letter": "A", "text": "Section 8C"}, {"letter": "B", "text": "Section 8B"}, {"letter": "C", "text": "Section 8"}, {"letter": "D", "text": "Section 8A"}], "answer": "D", "answer_text": "Section 8A", "explanation": "Customs Tariff Act, 1975 मधील Section 8A Central Government ला emergency परिस्थितीत import duty वाढवण्याची power देते. याचा उद्देश domestic industry ला अचानक वाढलेल्या imports मुळे होणाऱ्या injury पासून protect करणे हा आहे.", "golden": "Emergency Increase in Import Duty → Sec.8A Q104–108"}, {"no": 104, "q": "Q104. Under which Rule is “Related Party” defined for the purpose of Customs Valuation?", "options": [{"letter": "A", "text": "Section 14 of Customs Act, 1962"}, {"letter": "B", "text": "Section 2(2) of Customs Act, 1962"}, {"letter": "C", "text": "Rule 2(1) of Customs Valuation Rules, 2007"}, {"letter": "D", "text": "Rule 2(2) of Customs Valuation Rules, 2007"}], "answer": "D", "answer_text": "Rule 2(2)", "explanation": "Customs Valuation (Determination of Value of Imported Goods) Rules, 2007 मध्ये: 👉 Rule 2(2) “Related Party” define करते. यामध्ये employer-employee, business partners आणि specified ownership/control relationships यांचा समावेश होतो.", "golden": "Related Party → CVR 2007 → Rule 2(2)"}, {"no": 105, "q": "Q105. Which of the following can be a reason for the prohibition for import or export of goods under the Customs Act, 1962?", "options": [{"letter": "A", "text": "Protection of human health"}, {"letter": "B", "text": "Prevention of injury to the economy"}, {"letter": "C", "text": "Prevention of deceptive practices"}, {"letter": "D", "text": "All of the above"}], "answer": "D", "answer_text": "All of the above", "explanation": "Customs Act च्या Section 11 अंतर्गत Central Government public interest मध्ये import/export prohibit करू शकते. Reasons मध्ये: ✔️ Human health protection ✔️ Prevention of injury to economy ✔️ Prevention of deceptive practices यांचा समावेश होतो.", "golden": "Sec.11 → Health + Economy + Deceptive Practices"}, {"no": 106, "q": "Q106. As per the Food Safety and Standards (Import) Regulations, 2017 in respect of imported articles of food having shelf-life less than seven days, the importer shall declare the same in ____?", "options": [{"letter": "A", "text": "FORM-13"}, {"letter": "B", "text": "FORM-18"}, {"letter": "C", "text": "FORM-15"}, {"letter": "D", "text": "FORM-10"}], "answer": "A", "answer_text": "FORM-13", "explanation": "Food Safety and Standards (Import) Regulations, 2017 च्या Regulation 9(2) नुसार shelf-life 7 days पेक्षा कमी असलेल्या imported food साठी importer ने: 👉 FORM-13 मध्ये declaration करायचे.", "golden": "Food Shelf Life < 7 Days → FORM-13"}, {"no": 107, "q": "Q107. What is the basis for selecting cases for verification of duty under Section 17(2) of the Customs Act, 1962?", "options": [{"letter": "A", "text": "Importer's previous records"}, {"letter": "B", "text": "Total value of the goods"}, {"letter": "C", "text": "Risk evaluation through appropriate selection criteria"}, {"letter": "D", "text": "Random selection"}], "answer": "C", "answer_text": "", "explanation": "Section 17(2) अंतर्गत Customs officer self-assessment ची correctness verify करू शकतो. Cases selection: 👉 Risk Management System (RMS) आणि appropriate risk-based selection criteria वर होते.", "golden": "Sec.17(2) → Duty Verification → Risk Evaluation/RMS"}, {"no": 108, "q": "Q108. As per CBIC guidelines, what is the suggested threshold limit to launch prosecution against an accused involved in unauthorised importation in baggage/cases under Transfer of Residence Rules?", "options": [{"letter": "A", "text": "Market value of goods involved is ₹50 lakh or more"}, {"letter": "B", "text": "Market value is ₹1 crore or more"}, {"letter": "C", "text": "Market value is ₹2 crore or more"}, {"letter": "D", "text": "Market value is ₹20 lakh or more"}], "answer": "A", "answer_text": "₹50 lakh or more", "explanation": "CBIC guidelines नुसार baggage किंवा Transfer of Residence cases मध्ये unauthorised imported goods ची market value: 👉 ₹50 lakh किंवा अधिक असल्यास prosecution launch करण्याचा suggested threshold आहे.", "golden": "Baggage Prosecution → ₹50 Lakh+ Q109–113"}, {"no": 109, "q": "Q109. Which section of the Customs Act, 1962 deals with protection of data submitted to Customs by an importer or exporter under this Act?", "options": [{"letter": "A", "text": "Section 135B"}, {"letter": "B", "text": "Section 135A"}, {"letter": "C", "text": "Section 135AA"}, {"letter": "D", "text": "Section 135"}], "answer": "C", "answer_text": "Section 135AA", "explanation": "Customs Act मधील: 👉 Section 135AA importer/exporter ने Customs ला दिलेल्या data/information च्या unauthorized disclosure विरुद्ध protection देते.", "golden": "Protection of Customs Data → Sec.135AA"}, {"no": 110, "q": "Q110. Which section of the Customs Act, 1962 gives authority for compounding of offences?", "options": [{"letter": "A", "text": "Section 104"}, {"letter": "B", "text": "Section 137"}, {"letter": "C", "text": "Section 100"}, {"letter": "D", "text": "Section 135"}], "answer": "B", "answer_text": "Section 137", "explanation": "Customs Act च्या Section 137(3) मध्ये offences चे compounding करण्याची provision आहे. Competent authority prescribed conditions मध्ये compounding amount स्वीकारून prosecution टाळण्याची सुविधा देऊ शकते.", "golden": "Compounding of Offences → Sec.137(3)"}, {"no": 111, "q": "Q111. According to the Food Safety and Standards (Labelling and Packaging) Regulations, 2011, for sampling of imported article of food having a valid balance shelf life of less than seven days, the Authorized Officer shall—", "options": [{"letter": "A", "text": "Draw two parts of food sample of each description or measures (except for aseptic sealed packages)"}, {"letter": "B", "text": "Forward to the food analyst such quantity of sample as specified under the Food Safety and Standards (Laboratory and Sample Analysis) Regulations, 2011"}, {"letter": "C", "text": "Seal the samples"}, {"letter": "D", "text": "All of the above"}], "answer": "D", "answer_text": "All of the above", "explanation": "Authorized Officer ला: Two parts of sample draw करायचे, Prescribed quantity food analyst कडे forward करायची, Samples seal करायचे. म्हणून: 👉 All of the above", "golden": "Food Sampling → Draw + Forward + Seal"}, {"no": 112, "q": "Q112. What is the timeline for filing Sea Departure Manifest (SDM) by the Authorized Sea Carrier after the departure of the vessel under SCMTR, 2018?", "options": [{"letter": "A", "text": "Within 48 hours"}, {"letter": "B", "text": "Within 6 hours"}, {"letter": "C", "text": "Within 24 hours"}, {"letter": "D", "text": "Within 12 hours"}], "answer": "C", "answer_text": "Within 24 hours", "explanation": "SCMTR, 2018 च्या Regulation 5 नुसार Authorized Sea Carrier ने vessel departure नंतर: 👉 24 hours मध्ये Sea Departure Manifest (SDM) file करायचा.", "golden": "SDM → After Departure → 24 Hours"}, {"no": 113, "q": "Q113. Who constitutes the “The Narcotic Drugs and Psychotropic Substances Consultative Committee”?", "options": [{"letter": "A", "text": "Central Government"}, {"letter": "B", "text": "Narcotics Control Bureau (NCB)"}, {"letter": "C", "text": "Narcotics Control Bureau in consultation with respective State Government"}, {"letter": "D", "text": "Respective State Government"}], "answer": "A", "answer_text": "Central Government", "explanation": "NDPS Act, 1985 च्या Section 6 नुसार: 👉 Central Government Narcotic Drugs and Psychotropic Substances Consultative Committee constitute करते.", "golden": "NDPS Consultative Committee → Central Government Q114–120"}, {"no": 114, "q": "Q114. Which section of the Copyright Act, 1957 deals with the revocation with regard to assignment of copyright?", "options": [{"letter": "A", "text": "Section 21"}, {"letter": "B", "text": "Section 24"}, {"letter": "C", "text": "Section 20"}, {"letter": "D", "text": "Section 19A"}], "answer": "D", "answer_text": "Section 19A", "explanation": "Copyright Act मधील Section 19A assignee ने assignment नुसार rights exercise न केल्यास assignment revoke करण्यासंबंधी आहे. उदा. assignee ने assignment मिळाल्यानंतर निर्धारित period मध्ये rights properly exercise केले नाहीत तर revocation होऊ शकते.", "golden": "Revocation of Assignment → Sec.19A"}, {"no": 115, "q": "Q115. Under the Customs Act, 1962, which of the following offences are cognizable?", "options": [{"letter": "A", "text": "(i), (ii) and (iii)"}, {"letter": "B", "text": "(i) and (iii)"}, {"letter": "C", "text": "(ii), (iii) and (iv)"}, {"letter": "D", "text": "(i), (ii) and (iv)"}], "answer": "A", "answer_text": "(i), (ii) and (iii)", "explanation": "Customs Act Section 104(4) अंतर्गत specified serious offences cognizable आहेत. या question मध्ये योग्य combination: ✔️ Prohibited goods ✔️ Duty evasion ₹50 lakh or more ✔️ Fraudulent drawback ₹50 lakh or more म्हणून: 👉 (i), (ii), (iii)", "golden": "Cognizable → Prohibited Goods + ₹50L Duty Evasion + ₹50L Drawback"}, {"no": 116, "q": "Q116. Who is the competent authority for compounding of offences under the Customs Act, 1962?", "options": [{"letter": "A", "text": "Pr. Chief Commissioner / Chief Commissioner of Customs"}, {"letter": "B", "text": "Deputy / Assistant Commissioner of Customs"}, {"letter": "C", "text": "Additional / Joint Commissioner of Customs"}, {"letter": "D", "text": "Pr. Commissioner / Commissioner of Customs"}], "answer": "A", "answer_text": "Pr. Chief Commissioner / Chief Commissioner", "explanation": "Customs Act Section 137(3) नुसार compounding offences साठी competent authority: 👉 Principal Chief Commissioner / Chief Commissioner of Customs आहे.", "golden": "Compounding Authority → Pr. Chief Commissioner / Chief Commissioner"}, {"no": 117, "q": "Q117. What is the validity of the H-Card issued to an employee of a Customs Broker by Deputy Commissioner/Assistant Commissioner of Customs?", "options": [{"letter": "A", "text": "10 years"}, {"letter": "B", "text": "3 years"}, {"letter": "C", "text": "1 year"}, {"letter": "D", "text": "5 years"}], "answer": "D", "answer_text": "5 years", "explanation": "CBLR, 2018 च्या Regulation 13 नुसार Customs Broker च्या employee ला दिलेला: 👉 H-Card = 5 years validity असतो. H-Card holder Customs Broker च्या behalf वर customs-related functions करू शकतो.", "golden": "H-Card → 5 Years"}, {"no": 118, "q": "Q118. The Authorised Economic Operator Program is based on ____?", "options": [{"letter": "A", "text": "WCO SAFE Framework of Standards"}, {"letter": "B", "text": "WCO COPES standards"}, {"letter": "C", "text": "WCO Compliance Framework"}, {"letter": "D", "text": "WCO Framework of Standards on Cross-Border"}], "answer": "A", "answer_text": "WCO SAFE Framework of Standards", "explanation": "India चा AEO Programme: 👉 World Customs Organization (WCO) SAFE Framework of Standards वर based आहे. याचा उद्देश supply chain security वाढवणे आणि compliant businesses ला trade facilitation benefits देणे आहे.", "golden": "AEO Programme → WCO SAFE Framework"}, {"no": 119, "q": "Q119. Which of the following rights is NOT a right granted to copyright owners under Section 14 of the Copyright Act?", "options": [{"letter": "A", "text": "Right to dest
