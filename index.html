 [{"letter": "A", "text": "No notice is required to be served by Proper Officer"}, {"letter": "B", "text": "Notice required for appropriating duty and penalty"}, {"letter": "C", "text": "Notice required for imposing requisite penalty"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "", "explanation": "Importer ने स्वतः duty short-paid असल्याचे ascertain करून: ✔️ Short-paid duty भरली ✔️ Applicable interest भरला ✔️ SCN serve होण्यापूर्वी payment केला तर paper/source नुसार separate notice required नाही.", "golden": "Self-ascertainment + Duty + Interest paid before SCN → No Notice"}, {"no": 61, "q": "Q61. The goods destined to Sri Lanka have inadvertently been imported at Nhava Sheva Port. Who can permit the re-export of such goods?", "options": [{"letter": "A", "text": "Only Commissioner"}, {"letter": "B", "text": "Superintendent/Appraiser"}, {"letter": "C", "text": "The applicable adjudicating authority"}, {"letter": "D", "text": "The proper officer for assessment of the above"}], "answer": "C", "answer_text": "The applicable adjudicating authority", "explanation": "Goods चुकून/अनवधानाने India मध्ये import झाले असतील आणि ते Sri Lanka साठी destined असतील, तर circumstances तपासून applicable adjudicating authority re-export permit करू शकते.", "golden": "Inadvertent Import → Re-export → Adjudicating Authority"}, {"no": 62, "q": "Q62. Which of the following statement is “TRUE” as per the FTDR Act?", "options": [{"letter": "A", "text": "IEC number is necessary for the Import/Export of services or technology."}, {"letter": "B", "text": "IEC number is necessary for the Import/Export of services or technology only if the provider is taking benefits under the FTP."}, {"letter": "C", "text": "IEC number is not necessary for the Import/Export of services or technology."}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "", "explanation": "FTDR Act/FTP संदर्भात services किंवा technology च्या import/export साठी IEC सर्व परिस्थितीत mandatory नाही. परंतु exporter/service provider FTP अंतर्गत benefit घेत असेल, तर IEC आवश्यक आहे.", "golden": "Services/Technology + FTP Benefit → IEC Required"}, {"no": 63, "q": "Q63. Which of the following shipping bill is filed by importer for exporting the goods for showcasing them in exhibitions?", "options": [{"letter": "A", "text": "Shipping Bill for claims of Duty Drawback"}, {"letter": "B", "text": "Duty Free Shipping Bill"}, {"letter": "C", "text": "ATA Carnet Shipping Bill"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "ATA Carnet Shipping Bill", "explanation": "Exhibition/trade fair मध्ये goods temporarily export करून पुन्हा India मध्ये आणायचे असतील तर ATA Carnet वापरला जातो. यामुळे temporary export/import वर customs formalities आणि duty complications कमी होतात.", "golden": "Exhibition → Temporary Export → ATA Carnet"}, {"no": 64, "q": "Q64. As per Regulation 13 of the Customs Brokers Licensing Regulations, 2018, a Customs Broker can employ persons other than F-card holder with the approval of—", "options": [{"letter": "A", "text": "Principal Commissioner/Commissioner of Customs"}, {"letter": "B", "text": "Additional/Joint Commissioner of Customs"}, {"letter": "C", "text": "Deputy/Assistant Commissioner of Customs"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Deputy/Assistant Commissioner of Customs", "explanation": "Customs Broker ला F-card holder व्यतिरिक्त इतर persons employ करण्यासाठी prescribed approval आवश्यक आहे. Paper नुसार approval: 👉 Deputy/Assistant Commissioner of Customs यांच्याकडून घेतले जाते.", "golden": "CB Non-F-card Employee → DC/AC Approval"}, {"no": 65, "q": "Q65. Which of the following is true regarding controlled delivery under the Customs Act, 1962?", "options": [{"letter": "A", "text": "Controlled delivery is not permitted under the Customs Act"}, {"letter": "B", "text": "Controlled delivery is permitted under the Customs Act, 1962 under the supervision of proper officer to identify the persons involved in the commission of an offence"}, {"letter": "C", "text": "Controlled delivery is done informally by investigating agencies"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "", "explanation": "Controlled Delivery म्हणजे suspected/smuggled consignment ला पूर्णपणे लगेच seize न करता proper officer च्या supervision खाली पुढे जाऊ देणे, ज्यामुळे actual offenders/network identify करता येतो.", "golden": "Controlled Delivery → Proper Officer Supervision → Identify Offenders"}, {"no": 66, "q": "Q66. As per Deferred Payment of Import Duty Rules, 2016, who has been empowered to allow payment of duty by any mode other than electronic payment?", "options": [{"letter": "A", "text": "Chief Commissioner"}, {"letter": "B", "text": "A.C./D.C."}, {"letter": "C", "text": "Joint/Addl. Commissioner"}, {"letter": "D", "text": "Commissioner/Principal Commissioner"}], "answer": "B", "answer_text": "A.C./D.C.", "explanation": "Exceptional circumstances मध्ये electronic payment व्यतिरिक्त दुसऱ्या mode ने duty payment allow करण्याची power: 👉 Assistant Commissioner / Deputy Commissioner यांच्याकडे आहे.", "golden": "Non-electronic Duty Payment → AC/DC"}, {"no": 67, "q": "Q67. Based on the notice given by the right holder, there are reasons to believe that the imported goods are suspected to be infringing intellectual property rights. What is the immediate course of action taken by Customs in such cases?", "options": [{"letter": "A", "text": "The clearance of goods is suspended"}, {"letter": "B", "text": "The goods are seized"}, {"letter": "C", "text": "The goods are confiscated"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "Clearance of goods is suspended", "explanation": "Right holder कडून IPR infringement बाबत notice मिळाल्यावर आणि reasonable grounds असल्यास Customs चा पहिला immediate action = clearance suspend करणे. नंतर verification/investigation होते.", "golden": "IPR Suspicion → Immediate Action = Suspend Clearance"}, {"no": 68, "q": "Q68. Under the provisions of which Section of Customs Act, 1962 any goods, documents or bank account provisionally attached, may, pending the order of adjudicating authority be released to the owner on taking a bond in proper form with such security and conditions as required?", "options": [{"letter": "A", "text": "Section 110A"}, {"letter": "B", "text": "Section 109A"}, {"letter": "C", "text": "Section 110"}, {"letter": "D", "text": "None of these"}], "answer": "A", "answer_text": "Section 110A", "explanation": "Section 110A मध्ये seized goods/documents/bank accounts यांची provisional release करण्याची provision आहे. Owner कडून: Bond Required security Prescribed conditions घेतल्यानंतर release होऊ शकते.", "golden": "Provisional Release → Section 110A"}, {"no": 69, "q": "Q69. The power to prohibit importation and exportation of goods is derived from which section of the Customs Act, 1962?", "options": [{"letter": "A", "text": "Section 3"}, {"letter": "B", "text": "Section 11"}, {"letter": "C", "text": "Section 25"}, {"letter": "D", "text": "None of these"}], "answer": "B", "answer_text": "Section 11", "explanation": "Section 11 Central Government ला specified goods चे import किंवा export prohibit/restrict करण्याची power देते. Reasons मध्ये: Public health National security Conservation International obligations इत्यादी असू शकतात.", "golden": "Prohibit Import/Export → Section 11"}, {"no": 70, "q": "Q70. Can any person responsible for maintaining records of registration, statement of accounts or holding any other information relevant for purposes of Customs Act, 1962, be asked to furnish information?", "options": [{"letter": "A", "text": "Yes, obligations have been placed on such parties under the Customs Act to furnish information"}, {"letter": "B", "text": "No, such information can be sought only under summons under Section 108"}, {"letter": "C", "text": "No, there is no legal basis to ask for such information"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "", "explanation": "Customs Act अंतर्गत relevant records/accounts/information maintain करणाऱ्या persons/authorities वर Customs ला required information furnish करण्याची legal obligation असू शकते. ही obligation summons Section 108 पुरती मर्यादित नाही.", "golden": "Relevant Records/Information → Customs can require information"}, {"no": 71, "q": "Q71. Levy of a lower rate of duty under a trade agreement is governed by which section of the Customs Tariff Act, 1975?", "options": [{"letter": "A", "text": "Section 3"}, {"letter": "B", "text": "Section 6"}, {"letter": "C", "text": "Section 4"}, {"letter": "D", "text": "Section 5"}], "answer": "D", "answer_text": "Section 5", "explanation": "Customs Tariff Act मधील Section 5 trade agreements अंतर्गत preferential/concessional rates of duty शी संबंधित आहे. उदा.: FTA CEPA Regional trade arrangements", "golden": "Trade Agreement → Preferential Rate → Section 5"}, {"no": 72, "q": "Q72. What is the time limit for filing refund claim for refund of duty u/s 27 of the Customs Act, 1962 where duty paid under protest?", "options": [{"letter": "A", "text": "Six months from the relevant date"}, {"letter": "B", "text": "Three months from the relevant date"}, {"letter": "C", "text": "No time limit"}, {"letter": "D", "text": "Twelve months from the relevant date"}], "answer": "C", "answer_text": "No time limit", "explanation": "Section 27 अंतर्गत सामान्यतः refund claim साठी limitation असते. परंतु duty paid under protest असल्यास limitation period लागू होत नाही. म्हणून answer: 👉 No time limit", "golden": "Duty Paid Under Protest → No Time Limit"}, {"no": 73, "q": "Q73. Reimported goods under a claim of benefit of an exemption notification are assessed under—", "options": [{"letter": "A", "text": "Second check, unless requested for the first check by the importer"}, {"letter": "B", "text": "Second check"}, {"letter": "C", "text": "First check or check as per the option of the importer"}, {"letter": "D", "text": "First Check"}], "answer": "D", "answer_text": "First Check", "explanation": "Exemption notification च्या conditions आणि identity verify करण्यासाठी reimported goods चे examination assessmentपूर्वी केले जाते. म्हणून: 👉 First Check", "golden": "Reimport + Exemption Notification → First Check"}, {"no": 74, "q": "Q74. CCRs stands for—", "options": [{"letter": "A", "text": "Common Customs Requirements"}, {"letter": "B", "text": "Compulsory Customs Requirements"}, {"letter": "C", "text": "Common Compliance Requirements"}, {"letter": "D", "text": "Compulsory Compliance Requirements"}], "answer": "D", "answer_text": "Compulsory Compliance Requirements", "explanation": "CCRs = Compulsory Compliance Requirements. हे specific imported goods साठी mandatory standards/conditions असतात. उदा.: Certification Safety requirements Labelling Environmental requirements", "golden": "CCR → Compulsory Compliance Requirements"}, {"no": 75, "q": "Q75. As per the Drugs and Cosmetics Rules, 1945 no drugs shall be imported by air into India through which of the following airports?", "options": [{"letter": "A", "text": "Hyderabad"}, {"letter": "B", "text": "Goa"}, {"letter": "C", "text": "Ahmedabad"}, {"letter": "D", "text": "Pune"}], "answer": "D", "answer_text": "Pune", "explanation": "Drugs import करण्यासाठी notified/designated airports चा वापर करावा लागतो. Paper मध्ये Pune हा authorised airport नसल्यामुळे योग्य answer आहे.", "golden": "Drug Import by Air → Pune = Notified Airport नाही"}, {"no": 76, "q": "Q76. The integrated tax on goods imported into India shall be levied and collected in accordance with the provisions of—", "options": [{"letter": "A", "text": "Section 5 of the IGST Act"}, {"letter": "B", "text": "Section 3 of the Customs Tariff Act, 1975"}, {"letter": "C", "text": "Section 12 of the Customs Act, 1962"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "Section 5 of IGST Act", "explanation": "Imported goods वर IGST levy करण्याचा मुख्य provision: 👉 Section 5 of IGST Act आहे. Customs authorities import stage वर IGST collect करतात.", "golden": "Import IGST → Section 5, IGST Act"}, {"no": 77, "q": "Q77. Can an exporter file a shipping bill for export under both the RoDTEP scheme and the duty drawback scheme?", "options": [{"letter": "A", "text": "Yes, he can file"}, {"letter": "B", "text": "No, he can file under any one scheme"}, {"letter": "C", "text": "Yes, he can file only under the brand rate of drawback with RoDTEP scheme"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "Yes, he can file", "explanation": "Paper/source नुसार exporter RoDTEP आणि Duty Drawback दोन्ही benefits claim करू शकतो, परंतु drawback बाबत applicable conditions/limitations follow कराव्या लागतात. विशेषतः drawback benefit customs componentपुरता असल्यास RoDTEP सोबत claim करण्याची व्यवस्था आहे.", "golden": "RoDTEP + Duty Drawback → Can be claimed together, subject to conditions"}, {"no": 78, "q": "Q78. Which of the following method is not there in the Customs Valuation (Determination of Value of Export Goods) Rules, 2007?", "options": [{"letter": "A", "text": "Computed Method"}, {"letter": "B", "text": "Deductive Method"}, {"letter": "C", "text": "Residual Method"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "Deductive Method", "explanation": "Export valuation rules मध्ये Deductive Method नाही. Paper मध्ये: Computed Method ✔️ Residual Method ✔️ Deductive Method ❌ म्हणून answer B.", "golden": "Export Valuation → Deductive Method = NOT there"}, {"no": 79, "q": "Q79. Under the provisions of which Section of Customs Act, 1962, the awards of confiscation or penalty by Customs officers, not to interfere with other punishments?", "options": [{"letter": "A", "text": "Section 121"}, {"letter": "B", "text": "Section 125"}, {"letter": "C", "text": "Section 127"}, {"letter": "D", "text": "None of these"}], "answer": "C", "answer_text": "Section 127", "explanation": "Section 127 स्पष्ट करते की Customs Act अंतर्गत confiscation किंवा penalty ची action इतर कायद्यांखालील punishment/prosecution ला prevent करत नाही. उदा. smuggling सोबत NDPS/Arms इत्यादी laws चे offence असल्यास त्या कायद्यांतर्गतही action होऊ शकतो.", "golden": "Other Punishments Not Affected → Section 127"}, {"no": 80, "q": "Q80. An importer has imported goods on C&F terms. The transaction value declared is ₹12,000 (C&F). Insurance amount not known. How much insurance should be taken for calculating the assessable value?", "options": [{"letter": "A", "text": "1.125% of ₹12,000"}, {"letter": "B", "text": "1.125% of ₹10,000"}, {"letter": "C", "text": "Nil as insurance not done"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "1.125% of ₹12,000", "explanation": "", "golden": "Insurance not known → 1.125% of C&F value"}, {"no": 81, "q": "Q81. The validity period of the No Objection Certificate permitting the import of food within which the imported articles of food have to be taken out by the importer from Customs area under the Food Safety & Standard (Import) Regulations, 2017 is—", "options": [{"letter": "A", "text": "45 days"}, {"letter": "B", "text": "21 days"}, {"letter": "C", "text": "30 days"}, {"letter": "D", "text": "15 days"}], "answer": "C", "answer_text": "30 days", "explanation": "FSSAI कडून NOC (No Objection Certificate) मिळाल्यानंतर importer ने food consignment Customs area मधून prescribed period मध्ये काढणे आवश्यक आहे. 👉 NOC validity = 30 days", "golden": "Food NOC → 30 Days"}, {"no": 82, "q": "Q82. To which category of goods, the provisions of Chapter VIII of the Customs Act, 1962 regarding goods in transit apply?", "options": [{"letter": "A", "text": "Baggage"}, {"letter": "B", "text": "Goods imported by post"}, {"letter": "C", "text": "Stores"}, {"letter": "D", "text": "None of these"}], "answer": "D", "answer_text": "None of these", "explanation": "Chapter VIII मध्ये मुख्यतः goods in transit, transhipment आणि coastal movement यांच्याशी संबंधित provisions आहेत. दिलेल्या A, B, C पैकी कोणतीही category योग्य नाही.", "golden": "Chapter VIII → Transit / Transhipment / Coastal Movement"}, {"no": 83, "q": "Q83. Memorandum of cross objection is filed—", "options": [{"letter": "A", "text": "By the respondent on receipt of notice of appeal"}, {"letter": "B", "text": "By the Adjudicating Authority on receipt of notice of appeal"}, {"letter": "C", "text": "By the aggrieved party on receipt of notice of appeal"}, {"letter": "D", "text": "By the department on receipt of notice of appeal"}], "answer": "A", "answer_text": "", "explanation": "Appeal दुसऱ्या party ने दाखल केल्यानंतर respondent ला notice मिळाल्यावर respondent स्वतःचे objections/counter-points देण्यासाठी memorandum of cross objection दाखल करू शकतो.", "golden": "Cross Objection → Respondent → Notice of Appeal मिळाल्यावर"}, {"no": 84, "q": "Q84. Bolts and cotter-pins which are parts of a four-wheeler motor car, and having a specific part in the parts catalogue of manufacturer will be classified in?", "options": [{"letter": "A", "text": "Chapter 87"}, {"letter": "B", "text": "Chapter 86"}, {"letter": "C", "text": "Chapter 73"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Chapter 73", "explanation": "हे motor vehicle मध्ये वापरले जात असले तरी bolts आणि cotter-pins हे iron/steel articles आहेत. Specific motor-vehicle parts म्हणून classify करण्याऐवजी सामान्य fasteners म्हणून: 👉 Chapter 73 मध्ये classify केले जातात.", "golden": "Bolts/Cotter Pins → Iron/Steel Articles → Chapter 73"}, {"no": 85, "q": "Q85. Drone is classifiable under which of the following chapter?", "options": [{"letter": "A", "text": "Chapter 87"}, {"letter": "B", "text": "Chapter 85"}, {"letter": "C", "text": "Chapter 88"}, {"letter": "D", "text": "Chapter 90"}], "answer": "C", "answer_text": "Chapter 88", "explanation": "Drone हे Unmanned Aerial Vehicle (UAV) आहे. Aerial vehicle असल्यामुळे Customs Tariff मध्ये: 👉 Chapter 88 — Aircraft, spacecraft and parts thereof मध्ये classification होते.", "golden": "Drone/UAV → Chapter 88 Q86–90"}, {"no": 86, "q": "Q86. What if the importer does not clear the imported goods within specified time?", "options": [{"letter": "A", "text": "Customs may auction the goods if the same remain uncleared for 30 days"}, {"letter": "B", "text": "Custodians may auction the goods after notice to importer and permission from Customs if the same are not cleared for 30 days"}, {"letter": "C", "text": "Customs may confiscate the goods if the same remain uncleared for 30 days"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "", "explanation": "Customs Act Section 48 नुसार goods prescribed period मध्ये clear झाले नाहीत तर custodian goods auction/sell करू शकतो. पण: Importer ला notice ✔️ Proper Customs officer ची permission ✔️ आवश्यक आहे.", "golden": "Uncleared Goods → Custodian + Notice + Customs Permission"}, {"no": 87, "q": "Q87. If any imported goods have been damaged or had deteriorated at any time before or during unloading of the goods in India—", "options": [{"letter": "A", "text": "As goods are already imported, full customs duty needs to be paid"}, {"letter": "B", "text": "Custodian needs to pay duty for damaged part for negligence"}, {"letter": "C", "text": "Importer will get abatement for customs duty on the damaged content"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "", "explanation": "Customs Act Section 22 नुसार goods unloading पूर्वी किंवा unloading दरम्यान damaged/deteriorated झाले असतील तर importer ला त्या damaged portion च्या value वर abatement of duty मिळू शकते.", "golden": "Damage before/during unloading → Duty Abatement → Section 22"}, {"no": 88, "q": "Q88. In the event of the Commissioner directing investigations by SVB, the proper officer shall promptly carry out the provisional assessment in terms of Section 18 and release the goods against security in the form of EDD or RD amounting to—", "options": [{"letter": "A", "text": "1% of the assessable value"}, {"letter": "B", "text": "5% of the assessable value"}, {"letter": "C", "text": "2% of the assessable value"}, {"letter": "D", "text": "No EDD or RD is required to be given"}], "answer": "D", "answer_text": "", "explanation": "SVB investigation सुरू असताना provisional assessment करता येते. Paper/source नुसार अशा परिस्थितीत: 👉 EDD किंवा RD insist करायचे नाही. यामुळे importer चे goods unnecessarily block होत नाहीत.", "golden": "SVB Investigation + Provisional Assessment → No EDD/RD"}, {"no": 89, "q": "Q89. Whether all import and export consignments are subjected to post-clearance audit in Indian Customs?", "options": [{"letter": "A", "text": "Yes, all import/export consignments are subjected to PCA"}, {"letter": "B", "text": "All import/export consignments except those re-assessed earlier before clearance are subjected to PCA"}, {"letter": "C", "text": "Post Clearance Audit is based on risk-based controls, and only those selected for PCA are audited"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "", "explanation": "Post Clearance Audit म्हणजे प्रत्येक consignment चे audit नाही. PCA risk-based असते. Risk parameters जसे: Value Classification Origin Compliance history यांच्या आधारावर consignments/select importers audit साठी निवडले जातात.", "golden": "PCA → Risk Based → Selected Cases Only"}, {"no": 90, "q": "Q90. Edible non-living insect is classifiable under which chapter?", "options": [{"letter": "A", "text": "Chapter 5"}, {"letter": "B", "text": "Chapter 4"}, {"letter": "C", "text": "Chapter 3"}, {"letter": "D", "text": "Chapter 2"}], "answer": "C", "answer_text": "Chapter 3", "explanation": "Non-living edible insects हे aquatic animals category शी संबंधित classification मध्ये Chapter 3 मध्ये येतात, paper explanation नुसार.", "golden": "Edible Non-living Insect → Chapter 3 Q91–95"}, {"no": 91, "q": "Q91. While applying Rule 5 of Customs Valuation Rules, 2007, if more than one transaction value of similar goods is found, which value shall be taken?", "options": [{"letter": "A", "text": "Lowest"}, {"letter": "B", "text": "Average"}, {"letter": "C", "text": "Highest"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "Lowest", "explanation": "Similar goods च्या एकापेक्षा जास्त transaction values उपलब्ध असल्यास: 👉 Lowest transaction value घेतली जाते. यामुळे valuation मध्ये overvaluation टाळता येते.", "golden": "Multiple Similar Goods Values → Lowest Value"}, {"no": 92, "q": "Q92. As per Rule 10 of Customs Valuation Rules, 2007, which of the following is NOT to be added in the transaction value?", "options": [{"letter": "A", "text": "Buying commission"}, {"letter": "B", "text": "Brokerage"}, {"letter": "C", "text": "Cost of packing"}, {"letter": "D", "text": "Royalty related to imported goods payable as a condition of sale"}], "answer": "A", "answer_text": "Buying Commission", "explanation": "Rule 10 अंतर्गत transaction value मध्ये certain additions होतात: ✔️ Packing cost ✔️ Brokerage ✔️ Certain royalties/licence fees पण importer ने आपल्या buying agent ला दिलेली buying commission assessable value मध्ये add होत नाही.", "golden": "Buying Commission → NOT Added"}, {"no": 93, "q": "Q93. As per Legal Metrology (Packaged Commodities) Rules, 2011, as amended, which of the following need NOT be mandatorily declared on packages of imported food items?", "options": [{"letter": "A", "text": "Name of Country of Origin/Manufacture"}, {"letter": "B", "text": "Best before/use by date, month and year"}, {"letter": "C", "text": "Name and address of Manufacturer"}, {"letter": "D", "text": "Bar Code or QR code"}], "answer": "D", "answer_text": "Bar Code or QR Code", "explanation": "Imported food package वर prescribed declarations mandatory आहेत. परंतु Bar Code/QR Code हा mandatory declaration नाही. तो voluntarily tracking/marketing साठी वापरला जाऊ शकतो.", "golden": "Imported Food Package → Bar Code/QR Code = Not Mandatory"}, {"no": 94, "q": "Q94. Which of the following is correct in respect of the authorized officers for clearance of imports of food products under Food Safety Standards Act, 2006?", "options": [{"letter": "A", "text": "FSSAI has notified Authorised Officers at Points of Entries (POEs) for food"}, {"letter": "B", "text": "Customs Officers have been notified as Authorised Officers at POEs"}, {"letter": "C", "text": "FSSAI has notified at some POEs their officials and at some other POEs Customs Officials as authorised officers"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "", "explanation": "Food imports साठी FSSAI ने काही Points of Entry वर FSSAI officials, तर काही ठिकाणी Customs officials यांना Authorised Officers म्हणून notify केले आहे.", "golden": "Food Import POE → FSSAI + Notified Customs Officials"}, {"no": 95, "q": "Q95. Provisional Assessment of any Bill of Entry is governed by provisions of Section ___ of the Customs Act, 1962.", "options": [{"letter": "A", "text": "Section 20"}, {"letter": "B", "text": "Section 19"}, {"letter": "C", "text": "Section 18"}, {"letter": "D", "text": "Section 17"}], "answer": "C", "answer_text": "Section 18", "explanation": "Customs Act: 👉 Section 17 = Assessment 👉 Section 18 = Provisional Assessment जेव्हा final duty determination साठी information/documents/test results उपलब्ध नसतात, तेव्हा provisional assessment करता येते.", "golden": "Provisional Assessment → Section 18 Q96–100"}, {"no": 96, "q": "Q96. Who is the proper officer to give Out of Charge (OOC) for imported goods under Section 47 of the Customs Act, 1962?", "options": [{"letter": "A", "text": "Deputy/Assistant Commissioner of Customs and Central Excise"}, {"letter": "B", "text": "Preventive Officer/Examiner Officer/Inspector of Customs and Central Excise"}, {"letter": "C", "text": "Custodian of imported goods"}, {"letter": "D", "text": "Appraiser/Superintendent of Customs and Central Excise"}], "answer": "D", "answer_text": "", "explanation": "Imported goods ची assessment, duty payment आणि examination formalities complete झाल्यानंतर Out of Charge (OOC) order competent proper officer देतो. Paper answer: 👉 Appraiser/Superintendent", "golden": "OOC → Appraiser/Superintendent"}, {"no": 97, "q": "Q97. For the purposes of Valuation (Determination of Value of Export Goods) Rules, 2007, which of the following is NOT true with respect to related persons?", "options": [{"letter": "A", "text": "They are employer and employee"}, {"letter": "B", "text": "Any person directly or indirectly owns, controls or holds at least 20% of outstanding voting stock/shares of both of them"}, {"letter": "C", "text": "They are legally recognised partners in business"}, {"letter": "D", "text": "They are officers or directors of one another's businesses"}], "answer": "B", "answer_text": "", "explanation": "Paper explanation नुसार related persons च्या definition मध्ये voting stock/shareholding साठी 5% threshold आहे, 20% नाही. म्हणून 20% असलेले statement NOT TRUE आहे.", "golden": "Related Persons → 5% threshold, not 20%"}, {"no": 98, "q": "Q98. Which of the following methods is most appropriate for determining Customs value of Old and Used Capital Goods?", "options": [{"letter": "A", "text": "Comparison of identical goods method"}, {"letter": "B", "text": "Residual Method"}, {"letter": "C", "text": "Computed Method"}, {"letter": "D", "text": "Comparison of similar goods method"}], "answer": "B", "answer_text": "Residual Method", "explanation": "Old & used capital goods साठी identical/similar new goods ची direct comparison अनेकदा योग्य valuation देत नाही. म्हणून prescribed valuation methods लागू न झाल्यास: 👉 Residual Method योग्य ठरतो.", "golden": "Old & Used Capital Goods → Residual Method"}, {"no": 99, "q": "Q99. Imports of Electronic Cigarettes (E-cigarettes) are — as per DGFT ITC Policy, 2015–20", "options": [{"letter": "A", "text": "Restricted"}, {"letter": "B", "text": "Free"}, {"letter": "C", "text": "Prohibited"}, {"letter": "D", "text": "Canalised"}], "answer": "C", "answer_text": "Prohibited", "explanation": "DGFT Notification नुसार e-cigarettes चा import prohibited आहे. यामध्ये: E-cigarettes Vape devices Similar electronic nicotine delivery systems यांचा समावेश होतो.", "golden": "E-Cigarettes Import → Prohibited"}, {"no": 100, "q": "Q100. Cargo declaration in Form-XII is required to be made for import, export, transhipment, or for being carried as same bottom cargo when cargo includes—", "options": [{"letter": "A", "text": "Hazardous waste"}, {"letter": "B", "text": "Diamonds"}, {"letter": "C", "text": "Arms or ammunition"}, {"letter": "D", "text": "Wildlife"}], "answer": "C", "answer_text": "Arms or ammunition", "explanation": "Form-XII cargo declaration ची requirement specified sensitive cargo साठी आहे. Paper मध्ये: 👉 Arms or ammunition हा योग्य answer आहे.", "golden": "Form-XII → Arms/Ammunition"}, {"no": 101, "q": "Q101. Which of the following statement is NOT correct in respect of amendment of an Import/Arrival Manifest?", "options": [{"letter": "A", "text": "An amendment can only be done after adjudication"}, {"letter": "B", "text": "Major amendment may involve substantial revenue implication"}, {"letter": "C", "text": "Minor amendments can be done without adjudication"}, {"letter": "D", "text": "Major amendment involving fraudulent intention needs to be adjudicated"}], "answer": "A", "answer_text": "", "explanation": "Import/Arrival Manifest मध्ये amendment करण्यासाठी प्रत्येक amendment साठी adjudication आवश्यक नसते. Minor amendment → adjudication शिवाय होऊ शकते ✔️ Major amendment → circumstances नुसार adjudication लागू शकते ✔️ Fraudulent intention असलेले major amendment → adjudication ✔️ म्हणून “amendment can only be done after adjudication” हे चुकीचे आहे.", "golden": "Manifest Amendment → Minor = No Adjudication; Major/Fraud = Adjudication"}, {"no": 102, "q": "Q102. Under the Food Safety & Standards (Import) Regulations, 2017, which “Form” is to be used by the importer for giving the declaration of compliance of requirements for importing food meant for Exhibition purposes?", "options": [{"letter": "A", "text": "Form 11"}, {"letter": "B", "text": "Form 8"}, {"letter": "C", "text": "Form 12"}, {"letter": "D", "text": "Form 10"}], "answer": "D", "answer_text": "Form 10", "explanation": "Exhibition साठी India मध्ये food import करताना importer ने compliance declaration द्यायचे असते. त्यासाठी: 👉 Form 10 वापरला जातो.", "golden": "Food + Exhibition → Form 10"}, {"no": 103, "q": "Q103. Which of the following duties are levied on goods which are imported into the country at subsidised prices?", "options": [{"letter": "A", "text": "Anti-Dumping Duty"}, {"letter": "B", "text": "Safeguard Duty"}, {"letter": "C", "text": "Countervailing Duty"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Countervailing Duty", "explanation": "जर exporting country मधून goods ला subsidy मिळत असेल आणि त्यामुळे Indian domestic industry ला unfair disadvantage होत असेल, तर Countervailing Duty (CVD) लागू केली जाते.", "golden": "Subsidised Imports → Countervailing Duty"}, {"no": 104, "q": "Q104. Which of the following cannot be audited by Customs under Section 99A of the Customs Act?", "options": [{"letter": "A", "text": "Customs Broker"}, {"letter": "B", "text": "Custodian/licensee of a Warehouse licensed under the Customs Act"}, {"letter": "C", "text": "Freight Forwarder"}, {"letter": "D", "text": "None of the above"}], "answer": "D", "answer_text": "None of the above", "explanation": "Section 99A अंतर्गत Customs audit ची scope मोठी आहे. त्यामध्ये: Customs Broker ✔️ Warehouse custodian/licensee ✔️ Freight Forwarder ✔️ यांचा समावेश होऊ शकतो. म्हणून A, B, C तिन्ही audit होऊ शकतात.", "golden": "Sec.99A → Customs-related stakeholders can be audited"}, {"no": 105, "q": "Q105. Coastal goods, as per the Customs Act, 1962, is defined as—", "options": [{"letter": "A", "text": "Goods other than imported goods, lying at the Customs areas"}, {"letter": "B", "text": "Goods other than imported goods, and not meant for exports as well"}, {"letter": "C", "text": "Goods other than imported goods, transported in a vessel from one port in India to another"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "", "explanation": "Coastal goods म्हणजे imported goods नसलेले goods जे: 👉 India मधील एका port वरून दुसऱ्या Indian port कडे vessel ने transport केले जातात.", "golden": "Coastal Goods → Indian Port → Indian Port by Vessel"}, {"no": 106, "q": "Q106. Direct Port Delivery (DPD) facility shall not be available to importers against whom a case of evasion of duty has been booked in the preceding—", "options": [{"letter": "A", "text": "02 years"}, {"letter": "B", "text": "03 years"}, {"letter": "C", "text": "05 years"}, {"letter": "D", "text": "None"}], "answer": "C", "answer_text": "05 years", "explanation": "DPD म्हणजे container port वरून थेट importer च्या premises कडे delivery. ही facility compliant importers साठी आहे. जर मागील: 👉 5 years मध्ये duty evasion चे case booked झाले असेल तर DPD facility उपलब्ध नसते.", "golden": "DPD Restriction → Duty Evasion Case → Previous 5 Years"}, {"no": 107, "q": "Q107. The Appellate Tribunal has discretion to refuse admission of appeal in respect of an order where—", "options": [{"letter": "A", "text": "The amount of fine or penalty determined by such order does not exceed one lakh rupees"}, {"letter": "B", "text": "The amount of fine or penalty determined by such order does not exceed two lakh rupees"}, {"letter": "C", "text": "The amount of fine or penalty determined by such order does not exceed five lakh rupees"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "₹2 lakh", "explanation": "Section 129A नुसार CESTAT ला काही low-value appeals admit न करण्याचा discretion आहे. Fine/penalty: 👉 ₹2 lakh पेक्षा जास्त नसल्यास Tribunal appeal refuse करू शकते.", "golden": "CESTAT → Fine/Penalty ≤ ₹2 Lakh → May refuse admission Q108–115"}, {"no": 108, "q": "Q108. Charges for delayed presentation of Bill of Entry under Bill of Entry (Electronic Integrated Declaration and Paperless Processing) Regulations, 2018 shall not exceed—", "options": [{"letter": "A", "text": "Assessable value + duty payable"}, {"letter": "B", "text": "Assessable value"}, {"letter": "C", "text": "₹5,00,000/-"}, {"letter": "D", "text": "Duty payable"}], "answer": "D", "answer_text": "Duty payable", "explanation": "Late Bill of Entry presentation साठी charges लागू होतात, पण ते: 👉 Duty payable पेक्षा जास्त नसावेत.", "golden": "Late BOE Charges → Maximum = Duty Payable"}, {"no": 109, "q": "Q109. Which of the following is NOT to be referred for the purpose of classification in case of imported goods?", "options": [{"letter": "A", "text": "Chapter Note in Customs Tariff"}, {"letter": "B", "text": "Foreign Trade Policy"}, {"letter": "C", "text": "Section Note in Customs Tariff"}, {"letter": "D", "text": "HSN Explanatory Note"}], "answer": "B", "answer_text": "Foreign Trade Policy", "explanation": "Imported goods चे tariff classification करताना मुख्यतः: Section Notes ✔️ Chapter Notes ✔️ HSN Explanatory Notes ✔️ यांचा reference घेतला जातो. Foreign Trade Policy classification determine करण्यासाठी primary reference नाही.", "golden": "Classification → Section Note + Chapter Note + HSN Notes; NOT FTP"}, {"no": 110, "q": "Q110. In how much period export under Duty Free Import Authorisation (DFIA) Scheme has to be completed from the date of online filing of application and generation of file number?", "options": [{"letter": "A", "text": "Within 6 months"}, {"letter": "B", "text": "Within 9 months"}, {"letter": "C", "text": "Within 12 months"}, {"letter": "D", "text": "Within 18 months"}], "answer": "C", "answer_text": "Within 12 months", "explanation": "DFIA scheme अंतर्गत export obligation prescribed period मध्ये पूर्ण करणे आवश्यक आहे. Paper नुसार: 👉 12 months हा period आहे.", "golden": "DFIA → Export Completion → 12 Months"}, {"no": 111, "q": "Q111. Once the goods are assessed and the B/E is returned to the importer for payment of duty, which of the following is correct?", "options": [{"letter": "A", "text": "The importer has to pay duty within one day else interest to be paid along with duty"}, {"letter": "B", "text": "The importer has to pay duty within seven days else duty is paid along with interest"}, {"letter": "C", "text": "The importer can pay duty any time without interest subject to his paying all the dues of CFS/ICD"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "", "explanation": "Section 47 नुसार assessment झाल्यानंतर Bill of Entry importer कडे duty payment साठी परत दिल्यावर: 👉 One working day मध्ये duty भरायची आहे. उशीर झाल्यास interest लागू होतो.", "golden": "Assessed BOE → Duty within 1 Working Day"}, {"no": 112, "q": "Q112. Which of the following taxes/duties are not leviable on imports into India?", "options": [{"letter": "A", "text": "Basic Customs Duty"}, {"letter": "B", "text": "IGST"}, {"letter": "C", "text": "Compensation Cess"}, {"letter": "D", "text": "CGST and SGST"}], "answer": "D", "answer_text": "CGST and SGST", "explanation": "Import stage वर सामान्यतः: ✔️ BCD ✔️ IGST ✔️ Compensation Cess (where applicable) लागू होऊ शकतात. पण CGST + SGST हे domestic intra-State supply साठी आहेत; import stage वर त्याऐवजी IGST लागू होतो.", "golden": "Import → IGST, NOT CGST + SGST"}, {"no": 113, "q": "Q113. An exporter exports certain goods for repair and re-exports the same after repair. Which of the following is correct with respect to the value on which BCD and IGST are to be charged?", "options": [{"letter": "A", "text": "BCD as well as IGST on a value equal to the repair charges, insurance, and freight"}, {"letter": "B", "text": "BCD on a value equal to the repair charges, insurance and freight and IGST on the full value of the goods"}, {"letter": "C", "text": "BCD on a value equal to the repair charges, insurance and freight and IGST is not charged"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "", "explanation": "Goods repair साठी export करून परत import केले असल्यास, prescribed conditions मध्ये duty repair-related value वर calculate केली जाते. Paper नुसार: 👉 Repair charges + Insurance + Freight या value वर BCD आणि IGST calculate होतात.", "golden": "Re-import after Repair → Duty on Repair Charges + Insurance + Freight"}, {"no": 114, "q": "Q114. An Import licence, granted by the Licensing Authority under the Drugs and Cosmetics Rules, 1945 as amended, unless it is sooner suspended or cancelled shall be valid for a period of—", "options": [{"letter": "A", "text": "Two years"}, {"letter": "B", "text": "Three years"}, {"letter": "C", "text": "Five years"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "Three years", "explanation": "Drugs import licence ची validity: 👉 3 years from date of issue असते, unless ती आधी suspend/cancel झाली.", "golden": "Drug Import Licence → 3 Years"}, {"no": 115, "q": "Q115. In the case of goods imported by sea or air and transhipped to another customs station in India, the cost of insurance, transport, loading, unloading, handling charges associated with such transhipment shall be—", "options": [{"letter": "A", "text": "Excluded"}, {"letter": "B", "text": "Added to the extent incurred by exporter"}, {"letter": "C", "text": "Excluded if specifically provided in any contract between importer and exporter"}, {"letter": "D", "text": "Added to the extent incurred by importer"}], "answer": "A", "answer_text": "Excluded", "explanation": "Customs Valuation Rules नुसार India मध्ये arrival नंतरच्या transhipment costs assessable value मध्ये add केले जात नाहीत. हे domestic/transhipment costs आहेत.", "golden": "Post-arrival Transhipment Cost → Excluded from Assessable Value Q116–120"}, {"no": 116, "q": "Q116. Which of the following is correct with respect to application of the Customs Act?", "options": [{"letter": "A", "text": "It applies to an offence or contravention committed only within India"}, {"letter": "B", "text": "It applies only to offences committed outside India"}, {"letter": "C", "text": "It applies to the whole of India, and also to any offence or contravention committed outside India by any person"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "", "explanation": "Customs Act Section 1: 👉 Whole of India ला apply होतो. तसेच import/export of goods संदर्भातील काही offences/contraventions India बाहेर केलेले असले तरी Act लागू होऊ शकतो.", "golden": "Customs Act → Whole India + Certain Extraterritorial Offences"}, {"no": 117, "q": "Q117. What is the implication of contravention of any provision of Chapter VAA or any rule made thereunder in respect of any goods imported on a claim of a preferential rate of duty?", "options": [{"letter": "A", "text": "(i) only"}, {"letter": "B", "text": "(i) and (iii) only"}, {"letter": "C", "text": "(i) and (ii) only"}, {"letter": "D", "text": "(i), (ii) and (iii)"}], "answer": "B", "answer_text": "(i) and (iii) only", "explanation": "Preferential rate of duty claim करताना Chapter VAA/related rules चे contravention झाल्यास: ✔️ Goods liable to confiscation ✔️ Section 114 अंतर्गत penalty लागू होऊ शकते. Paper answer नुसार Section 28DA penalty या combination मध्ये लागू होत नाही.", "golden": "Preferential Duty Contravention → Confiscation + Sec.114 Penalty"}, {"no": 118, "q": "Q118. Which of the following is correct in respect of items covered in the PGA Exempted Category (PEC) list?", "options": [{"letter": "A", "text": "Such goods are considered as ‘out of scope’ and no reference to Assistant Drug Controller is required before clearance"}, {"letter": "B", "text": "Such goods are considered as prohibited and a reference is required to Assistant Drug Controller for NOC"}, {"letter": "C", "text": "Such goods are considered as exempted from all prohibitions under the Customs Act"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "", "explanation": "PGA Exempted Category (PEC) मधील goods हे संबंधित Participating Government Agencies च्या regulatory clearance च्या scope बाहेर असतात. म्हणून: 👉 Assistant Drug Controller कडे NOC/reference आवश्यक नाही.", "golden": "PEC → Out of Scope → No PGA Reference"}, {"no": 119, "q": "Q119. Which of the following information is NOT required to be furnished in electronic integrated declaration as per Shipping Bill Regulations, 2019?", "options": [{"letter": "A", "text": "The State of origin of goods"}, {"letter": "B", "text": "District of origin of goods"}, {"letter": "C", "text": "GSTIN, if exporter is registered in GST"}, {"letter": "D", "text": "None of the above"}], "answer": "D", "answer_text": "None of the above", "explanation": "Electronic Shipping Bill declaration मध्ये: ✔️ State of origin ✔️ District of origin ✔️ GSTIN, where applicable ही information required आहे. म्हणून A, B, C तिन्ही required असल्यामुळे NOT required = None.", "golden": "Shipping Bill → State + District + GSTIN"}, {"no": 120, "q": "Q120. Which of the following is correct in respect of goods that are subject to mandatory standards of Bureau of Indian Standards (BIS) on quality?", "options": [{"letter": "A", "text": "The importers of such products have to obtain license to import such goods"}, {"letter": "B", "text": "The buyers of such products have to obtain BIS license for selling such goods"}, {"letter": "C", "text": "The manufacturer/exporter of these products to India has to obtain BIS license"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "Importer has to obtain licence", "explanation": "Mandatory BIS standards असलेल्या imported products साठी importer ने prescribed BIS licence/registration requirement पूर्ण करणे आवश्यक आहे. Paper मध्ये योग्य answer: 👉 A दिलेला आहे.", "golden": "Mandatory BIS Goods → Importer → BIS Licence"}, {"no": 121, "q": "Q121. Under Faceless Assessment, an appraising officer can finally assess the bills of entry having an assessable value of—", "options": [{"letter": "A", "text": "Up to ₹5 lakhs"}, {"letter": "B", "text": "Up to ₹10 lakhs"}, {"letter": "C", "text": "Up to ₹1 lakh"}, {"letter": "D", "text": "Up to ₹3 lakhs"}], "answer": "A", "answer_text": "Up to ₹5 lakhs", "explanation": "Faceless Assessment मध्ये low-value consignments चे faster assessment करण्यासाठी appraising officers ना delegated power आहे. Paper नुसार appraising officer: 👉 ₹5 lakh पर्यंत assessable value असलेला Bill of Entry finally assess करू शकतो.", "golden": "Faceless Assessment → Appraising Officer → Up to ₹5 Lakh"}, {"no": 122, "q": "Q122. Which of the following duty can be imposed to save the domestic industry?", "options": [{"letter": "A", "text": "Anti-dumping Duty"}, {"letter": "B", "text": "Countervailing Duty"}, {"letter": "C", "text": "Safeguard Duty"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Safeguard Duty", "explanation": "Safeguard Duty ही domestic industry ला sudden surge in imports मुळे होणाऱ्या serious injury पासून संरक्षण देण्यासाठी लावली जाते. महत्त्वाचे: Anti-dumping → dumping विरुद्ध Countervailing → subsidy विरुद्ध Safeguard → sudden increase in imports", "golden": "Import Surge → Safeguard Duty"}, {"no": 123, "q": "Q123. Improper removal of goods from a warehouse attracts the provision of which Section of the Customs Act, 1962?", "options": [{"letter": "A", "text": "Section 71"}, {"letter": "B", "text": "Section 68"}, {"letter": "C", "text": "Section 72"}, {"letter": "D", "text": "None of these"}], "answer": "C", "answer_text": "Section 72", "explanation": "Warehouse मधून goods proper permission शिवाय किंवा prescribed conditions च्या violation मध्ये remove केले तर Section 72 लागू होतो. अशा goods वर applicable duty, interest आणि penalty ची recovery होऊ शकते.", "golden": "Improper Removal from Warehouse → Section 72"}, {"no": 124, "q": "Q124. Under which sections of Customs Act, 1962, CFSs are designated and empowered to carry out their functions?", "options": [{"letter": "A", "text": "Section 8, Section 45, Section 141"}, {"letter": "B", "text": "Section 7, Section 8, Section 141"}, {"letter": "C", "text": "Section 8, Section 45"}, {"letter": "D", "text": "Section 141"}], "answer": "A", "answer_text": "Sections 8, 45 & 141", "explanation": "CFS म्हणजे Container Freight Station. Customs Act मधील: Section 8 → Customs area/facilities Section 45 → custody and clearance of imported goods Section 141 → regulations regarding facilities/responsibilities of custodians यामुळे CFS operations चा legal framework तयार होतो.", "golden": "CFS → Sec. 8 + 45 + 141"}, {"no": 125, "q": "Q125. Which of the following statement is “True” under the CGST Rules, 2017 regarding cancellation of registration?", "options": [{"letter": "A", "text": "Violates provisions of Section 172 of the Act"}, {"letter": "B", "text": "Avails input tax credit in violation of Section 25"}, {"letter": "C", "text": "Violates provision of Rule 85B"}, {"letter": "D", "text": "Violates provision of Rule 10A"}], "answer": "D", "answer_text": "Violates Rule 10A", "explanation": "CGST Rules मध्ये registered person ने prescribed time मध्ये bank account details furnish करणे आवश्यक आहे. Rule 10A चे compliance न केल्यास registration cancellation ची action होऊ शकते.", "golden": "CGST Registration → Bank Details → Rule 10A Q126–130"}, {"no": 126, "q": "Q126. If a person knowingly or intentionally makes, signs or uses, or causes to be made, signed or used, any declaration, statement or document which is false or incorrect in any material particular, in the transaction of any business for the purposes of this Act, shall be liable to a penalty not exceeding—", "options": [{"letter": "A", "text": "Two times the value of goods"}, {"letter": "B", "text": "Five times the value of goods"}, {"letter": "C", "text": "Ten times the value of goods"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "Five times the value of goods", "explanation": "Customs Act अंतर्गत knowingly false declaration/document वापरल्यास penalty: 👉 Value of goods च्या 5 times पर्यंत लागू होऊ शकते.", "golden": "False Declaration → Penalty → Up to 5× Value of Goods"}, {"no": 127, "q": "Q127. In the case of imports by vehicle, the prescribed time limit for filing of IGM is:", "options": [{"letter": "A", "text": "12 hours prior to arrival"}, {"letter": "B", "text": "Immediately on arrival"}, {"letter": "C", "text": "Prior to the arrival"}, {"letter": "D", "text": "Within 12 hours after its arrival"}], "answer": "D", "answer_text": "Within 12 hours after arrival", "explanation": "Vehicle ने goods import होत असतील तर Import General Manifest (IGM) prescribed period मध्ये file करावा लागतो. Paper नुसार: 👉 Arrival नंतर 12 hours मध्ये IGM file करायचा आहे.", "golden": "Import by Vehicle → IGM → Within 12 Hours after Arrival"}, {"no": 128, "q": "Q128. What are the implications if the import/arrival manifest is not delivered within the prescribed time-limit?", "options": [{"letter": "A", "text": "A penalty up to ₹50,000 is liable to be imposed"}, {"letter": "B", "text": "A penalty up to ₹1,00,000 is liable to be imposed"}, {"letter": "C", "text": "A penalty up to 10% of the value of goods in the conveyance is liable to be imposed"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "Penalty up to ₹50,000", "explanation": "Import/Arrival Manifest हे Customs clearance साठी critical document आहे. Prescribed time मध्ये manifest/report file न केल्यास Customs Act Section 30 अंतर्गत: 👉 Penalty up to ₹50,000 लागू होऊ शकते.", "golden": "Late Import/Arrival Manifest → ₹50,000"}, {"no": 129, "q": "Q129. The appeal filed by the importer against the Faceless Assessment will be taken up by—", "options": [{"letter": "A", "text": "Commissioner (Appeals) having jurisdiction where the Bill of Entry has been assessed by FAG"}, {"letter": "B", "text": "Commissioner (Appeals) having jurisdiction over the port of import where the consignment is imported"}, {"letter": "C", "text": "Commissioner (Appeals) Faceless Assessment at Delhi"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "", "explanation": "Assessment electronically/faceless असले तरी goods physically ज्या port of import वर आले आहेत, त्या jurisdiction शी appellate authority जोडलेली राहते. म्हणून appeal: 👉 Commissioner (Appeals) having jurisdiction over the port of import यांच्याकडे जाते.", "golden": "Faceless Assessment Appeal → Jurisdiction of Port of Import"}, {"no": 130, "q": "Q130. Which Section of Customs Act, 1962 deals with adjudication of confiscations and penalties?", "options": [{"letter": "A", "text": "Section 117"}, {"letter": "B", "text": "Section 122"}, {"letter": "C", "text": "Section 121"}, {"letter": "D", "text": "Section 120"}], "answer": "B", "answer_text": "Section 122", "explanation": "Customs Act मधील Section 122 adjudication of confiscation and penalties बद्दल आहे.", "golden": "Adjudication → Confiscation & Penalty → Section 122 Q131–135"}, {"no": 131, "q": "Q131. Under which section of the Customs Act, 1962, a Shipping Bill is presented to the proper officer for export of goods?", "options": [{"letter": "A", "text": "Section 50(2)"}, {"letter": "B", "text": "Section 50(1)"}, {"letter": "C", "text": "Section 51(2)"}, {"letter": "D", "text": "Section 51(1)"}], "answer": "B", "answer_text": "Section 50(1)", "explanation": "Export goods साठी exporter ने Shipping Bill proper officer कडे present करणे Section 50(1) अंतर्गत आहे.", "golden": "Shipping Bill → Section 50(1)"}, {"no": 132, "q": "Q132. Under CGST Rules, 2017 which form is prescribed for intimation/application for withdrawal from Composition Levy?", "options": [{"letter": "A", "text": "FORM GST CMP-05"}, {"letter": "B", "text": "FORM GST CMP-04"}, {"letter": "C", "text": "FORM GST CMP-03"}, {"letter": "D", "text": "FORM GST CMP-09"}], "answer": "B", "answer_text": "FORM GST CMP-04", "explanation": "Composition Scheme मधून withdrawal करायचा असल्यास registered person ने prescribed: 👉 FORM GST CMP-04 मध्ये intimation/application करायची आहे.", "golden": "Withdrawal from Composition → CMP-04"}, {"no": 133, "q": "Q133. Which of the following is not considered as an importer, in relation to any goods at any time between their importation and the time when they are cleared for home consumption?", "options": [{"letter": "A", "text": "Owner"}, {"letter": "B", "text": "Beneficial owner"}, {"letter": "C", "text": "Any person holding himself out to be the importer"}, {"letter": "D", "text": "None of the above"}], "answer": "D", "answer_text": "None of the above", "explanation": "Customs Act Section 2 मधील Importer definition broad आहे. Importer मध्ये: Owner ✔️ Beneficial owner ✔️ Importer असल्याचे स्वतः सांगणारी व्यक्ती ✔️ यांचा समावेश होतो. म्हणून A, B आणि C तिन्ही importer definition मध्ये येतात.", "golden": "Importer = Owner + Beneficial Owner + Person holding himself out as importer"}, {"no": 134, "q": "Q134. An appeal cannot be filed before CESTAT if the matter relates to—", "options": [{"letter": "A", "text": "(i) only"}, {"letter": "B", "text": "(i), (ii) and (iii)"}, {"letter": "C", "text": "(i) and (iii) only"}, {"letter": "D", "text": "(ii) and (iii) only"}], "answer": "B", "answer_text": "(i), (ii) and (iii)", "explanation": "Section 129A अंतर्गत काही specified matters CESTAT च्या appellate jurisdiction मधून excluded आहेत. यामध्ये: ✔️ Baggage ✔️ Goods not unloaded from conveyance ✔️ Payment of drawback यांचा समावेश आहे.", "golden": "CESTAT Exclusions → Baggage + Not Unloaded Goods + Drawback"}, {"no": 135, "q": "Q135. A machine is imported for ₹1,00,000 (CIF). BCD = 10%, SWC = 10%. IGST rate = 18% and Compensation Cess = 15%. What should be the value for calculating Compensation Cess?", "options": [{"letter": "A", "text": "Nil"}, {"letter": "B", "text": "₹1,10,000"}, {"letter": "C", "text": "₹1,30,980"}, {"letter": "D", "text": "₹1,11,000"}], "answer": "D", "answer_text": "₹1,11,000", "explanation": "", "golden": "Compensation Cess Base = CIF + BCD + SWS Q136–140"}, {"no": 136, "q": "Q136. Which of the following goods, when imported into India, are governed by BIS standards?", "options": [{"letter": "A", "text": "Paper based stationery goods"}, {"letter": "B", "text": "Toys/dolls and other similar recreational goods"}, {"letter": "C", "text": "Machinery"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "Toys/dolls and similar recreational goods", "explanation": "Children's toys/dolls यांसाठी safety आणि quality standards महत्त्वाचे असल्यामुळे imported toys वर BIS standards लागू होतात.", "golden": "BIS Mandatory → Toys/Dolls"}, {"no": 137, "q": "Q137. For how long the warehoused capital goods intended for use in any 100% export-oriented undertaking remain in the warehouse?", "options": [{"letter": "A", "text": "Up to 6 months from date of deposit"}, {"letter": "B", "text": "Up to 90 days from date of deposit"}, {"letter": "C", "text": "Till the clearance from the warehouse"}, {"letter": "D", "text": "Up to 1 year from date of deposit"}], "answer": "C", "answer_text": "Till clearance from the warehouse", "explanation": "100% EOU साठी वापरायचे warehoused capital goods warehouse मध्ये fixed 6 months/90 days/1 year limit मध्ये clear करणे आवश्यक नाही. ते: 👉 warehouse मधून clear होईपर्यंत राहू शकतात, subject to applicable conditions.", "golden": "EOU Warehoused Capital Goods → Till Clearance"}, {"no": 138, "q": "Q138. Which of the following is NOT correct with regard to assessment in Customs? Assessment does not include—", "options": [{"letter": "A", "text": "Self-assessment"}, {"letter": "B", "text": "Re-assessment"}, {"letter": "C", "text": "Provisional assessment"}, {"letter": "D", "text": "Summary assessment"}], "answer": "D", "answer_text": "Summary Assessment", "explanation": "Customs Act Section 2 मधील assessment definition मध्ये: ✔️ Self-assessment ✔️ Re-assessment ✔️ Provisional assessment यांचा समावेश आहे. Summary assessment हा routine assessment प्रकार म्हणून definition मध्ये नाही.", "golden": "Assessment Includes → Self + Re + Provisional; NOT Summary"}, {"no": 139, "q": "Q139. Under Section 123 of Customs Act, 1962, the burden of proving that the seized goods are not smuggled goods is upon—", "options": [{"letter": "A", "text": "Proper Officer of Customs"}, {"letter": "B", "text": "Prosecutor"}, {"letter": "C", "text": "Person from whose possession goods were seized or one who claims them to be owner"}, {"letter": "D", "text": "Customs Department"}], "answer": "C", "answer_text": "", "explanation": "Section 123 काही notified goods बाबत reverse burden of proof लागू करतो. Goods seize झाल्यानंतर, ते smuggled नाहीत हे सिद्ध करण्याची जबाबदारी: 👉 ज्याच्या possession मधून goods seize झाले किंवा जो त्यांचा owner असल्याचा दावा करतो त्याच्यावर असते.", "golden": "Section 123 → Burden of Proof on Possessor/Claimant"}, {"no": 140, "q": "Q140. Who is the authority to approve the provisional attachment under Section 28BA of the Customs Act, 1962?", "options": [{"letter": "A", "text": "Deputy Commissioner/Assistant Commissioner of Customs"}, {"letter": "B", "text": "Chief Commissioner of Customs"}, {"letter": "C", "text": "Joint/Additional Commissioner of Customs"}, {"letter": "D", "text": "Principal Commissioner/Commissioner of Customs"}], "answer": "D", "answer_text": "Principal Commissioner/Commissioner of Customs", "explanation": "Section 28BA अंतर्गत revenue interest protect करण्यासाठी property चे provisional attachment करण्याची power आहे. यासाठी approval: 👉 Principal Commissioner of Customs / Commissioner of Customs यांच्याकडून दिले जाते.", "golden": "Provisional Attachment → Section 28BA → Principal Commissioner/Commissioner"}], "2023": [{"no": 1, "q": "Q1. In case of procurement of goods and services by a SEZ unit from EOU, a ______ is to be filed by the SEZ unit.", "options": [{"letter": "A", "text": "Shipping Bill"}, {"letter": "B", "text": "Bill of Export"}, {"letter": "C", "text": "Bill of Entry"}, {"letter": "D", "text": "Bill of Lading"}], "answer": "C", "answer_text": "Bill of Entry", "explanation": "SEZ unit ने EOU कडून goods/services procure केल्यास, SEZ च्या दृष्टीने ते import मानले जाते. त्यामुळे SEZ unit कडून Bill of Entry file केला जातो. EOU कडून export benefit साठी Bill of Export file होतो.", "golden": "SEZ from EOU → SEZ files Bill of Entry"}, {"no": 2, "q": "Q2. As per Food Safety and Standard (Import) Regulations, 2017, unconsumed food articles meant for foreign sportspersons during their stay/event—", "options": [{"letter": "A", "text": "Can be donated to sports association after permission and duty payment"}, {"letter": "B", "text": "Can be disposed of"}, {"letter": "C", "text": "Shall be re-exported to country of origin under intimation to AO/FSSAI"}, {"letter": "D", "text": "Can be donated without duty"}], "answer": "C", "answer_text": "", "explanation": "Foreign sportspersons साठी temporary purpose ने आणलेले उरलेले food articles event संपल्यानंतर: 👉 Country of origin ला re-export करावे लागतात. AO/FSSAI ला intimation द्यावी लागते.", "golden": "Unconsumed Food of Foreign Sportsperson → Re-export"}, {"no": 3, "q": "Q3. The power to arrest under the Customs Act, 1962 lies with—", "options": [{"letter": "A", "text": "Joint Commissioner of Customs"}, {"letter": "B", "text": "Deputy/Assistant Commissioner of Customs"}, {"letter": "C", "text": "Commissioner of Customs"}, {"letter": "D", "text": "Additional Commissioner of Customs"}], "answer": "C", "answer_text": "Commissioner of Customs", "explanation": "Customs Act Section 104 अंतर्गत arrest करण्यासाठी Commissioner of Customs कडे power आहे.", "golden": "Arrest → Section 104 → Commissioner"}, {"no": 4, "q": "Q4. Which is the correct answer in respect of Safeguard measures?", "options": [{"letter": "A", "text": "It shall not apply to articles imported by a unit in SEZ"}, {"letter": "B", "text": "It shall apply only to the portion used in manufacture of goods cleared into DTA"}, {"letter": "C", "text": "Both A and B"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Both A and B", "explanation": "SEZ unit ने goods SEZ मध्ये वापरल्यास safeguard duty लागू होत नाही. पण ते goods वापरून तयार केलेले final products DTA मध्ये clear केले तर applicable portion वर safeguard duty लागू होऊ शकते.", "golden": "SEZ → Safeguard Duty generally not applicable; DTA clearance → applicable portion"}, {"no": 5, "q": "Q5. Which Section of Customs Act, 1962 deals with grant of licence for Customs Broker?", "options": [{"letter": "A", "text": "Section 146A"}, {"letter": "B", "text": "Section 150"}, {"letter": "C", "text": "Section 146"}, {"letter": "D", "text": "Section 142"}], "answer": "C", "answer_text": "Section 146", "explanation": "Section 146 Customs Broker licensing शी संबंधित आहे. याच section अंतर्गत Customs Brokers Licensing Regulations तयार केले आहेत.", "golden": "Customs Broker Licence → Section 146"}, {"no": 6, "q": "Q6. Under Section 17 of Customs Act, which assessment is NOT allowed?", "options": [{"letter": "A", "text": "Self-Assessment"}, {"letter": "B", "text": "Re-assessment"}, {"letter": "C", "text": "Provisional Assessment"}, {"letter": "D", "text": "Both A & B"}], "answer": "C", "answer_text": "Provisional Assessment", "explanation": "Section 17 मध्ये: Self-assessment ✔️ Re-assessment ✔️ यांचा समावेश आहे. पण Provisional Assessment = Section 18.", "golden": "Sec.17 → Self + Re-assessment Sec.18 → Provisional Assessment"}, {"no": 7, "q": "Q7. The drawback amount/rate determined under Drawback Rules, 2017 shall not exceed—", "options": [{"letter": "A", "text": "One-tenth of market price"}, {"letter": "B", "text": "One-fourth of FOB value"}, {"letter": "C", "text": "Half of FOB value"}, {"letter": "D", "text": "One-third of market price"}], "answer": "D", "answer_text": "One-third of market price", "explanation": "Drawback amount किंवा rate हा export product च्या market price च्या one-third पेक्षा जास्त नसावा.", "golden": "Drawback → Maximum 1/3 of Market Price Q8–Q10"}, {"no": 8, "q": "Q8. Which of the following is NOT included in “General Power to make Regulations” by Board under Section 157?", "options": [{"letter": "A", "text": "Time and manner of finalisation of provisional assessment"}, {"letter": "B", "text": "Manner of clearance/removal of imported or export goods"}, {"letter": "C", "text": "Circumstances and manner of issuing supplementary notice"}, {"letter": "D", "text": "None of the above"}], "answer": "D", "answer_text": "None of the above", "explanation": "Section 157 CBIC/Board ला regulations बनवण्याची general power देते. वरील A, B आणि C सर्व regulatory scope मध्ये येतात. म्हणून None of the above.", "golden": "Section 157 → General Regulation-making Power"}, {"no": 9, "q": "Q9. In which of the following cases can amount of refund be credited to Consumer Welfare Fund?", "options": [{"letter": "A", "text": "Refund related to duty under Section 9A"}, {"letter": "B", "text": "Drawback under Section 74"}, {"letter": "C", "text": "Drawback under Section 75"}, {"letter": "D", "text": "None of the above"}], "answer": "D", "answer_text": "None of the above", "explanation": "Consumer Welfare Fund मध्ये सामान्य refund amount credit होऊ शकतो, subject to unjust enrichment provisions. परंतु drawback under Sections 74/75 हे specific entitlement असल्याने या options मध्ये योग्य case नाही.", "golden": "Drawback u/s 74/75 → Consumer Welfare Fund मध्ये नाही"}, {"no": 10, "q": "Q10. Under Section 100 of Customs Act, power to search suspected persons applies to—", "options": [{"letter": "A", "text": "(ii) only"}, {"letter": "B", "text": "(i), (ii) & (iii) only"}, {"letter": "C", "text": "(i), (ii), (iii) & (iv)"}, {"letter": "D", "text": "(i) & (ii) only"}], "answer": "C", "answer_text": "All (i), (ii), (iii) & (iv)", "explanation": "Section 100 मध्ये search power खालील persons बाबत लागू होतो: Foreign-going aircraft मधून आलेले/board करणारे persons Indian Customs waters मधील vessels वरील persons India बाहेरून आलेल्या vehicle मधील persons Customs area मधील persons", "golden": "Section 100 → All four categories Q11–Q15"}, {"no": 11, "q": "Q11. Under which of the following events are goods imported into India exempted from duty for display/use subject to re-export?", "options": [{"letter": "A", "text": "Agricultural Fair/Exhibition"}, {"letter": "B", "text": "Trade Fair/Exhibition"}, {"letter": "C", "text": "Event organised to promote cultural activity"}, {"letter": "D", "text": "All of the above"}], "answer": "D", "answer_text": "All of the above", "explanation": "Temporary import for: Agricultural fair Trade exhibition Cultural events यासाठी prescribed conditions पूर्ण केल्यास customs duty exemption मिळू शकते. Re-export condition महत्त्वाची आहे.", "golden": "Temporary Exhibition Import → Duty Exemption + Re-export"}, {"no": 12, "q": "Q12. As per Customs (Electronic Cash Ledger) Regulations, 2022, OTC payment limit for Government Department shall not exceed ______ per day.", "options": [{"letter": "A", "text": "₹5 lakh"}, {"letter": "B", "text": "₹50,000"}, {"letter": "C", "text": "No limit"}, {"letter": "D", "text": "₹1 lakh"}], "answer": "C", "answer_text": "No Limit", "explanation": "Government Department साठी electronic cash ledger मध्ये OTC deposit वर: 👉 No monetary limit आहे.", "golden": "Government Department OTC → No Limit"}, {"no": 13, "q": "Q13. Goods of which value can be adjudged by an Assistant Commissioner for confiscation under Section 113?", "options": [{"letter": "A", "text": "Above ₹2 lakh but not exceeding ₹5 lakh"}, {"letter": "B", "text": "Above ₹5 lakh but not exceeding ₹50 lakh"}, {"letter": "C", "text": "Above ₹1 lakh but not exceeding ₹10 lakh"}, {"letter": "D", "text": "Above ₹1 lakh but not exceeding ₹5 lakh"}], "answer": "C", "answer_text": "", "explanation": "Paper मध्ये Assistant Commissioner/Deputy Commissioner च्या adjudication limit बाबत: 👉 Above ₹1 lakh but not exceeding ₹10 lakh दिले आहे.", "golden": "AC/DC Adjudication → >₹1 Lakh to ₹10 Lakh"}, {"no": 14, "q": "Q14. In which circumstances may preferential tariff treatment be refused without verification?", "options": [{"letter": "A", "text": "I & III but not II"}, {"letter": "B", "text": "All the circumstances"}, {"letter": "C", "text": "I & II but not III"}, {"letter": "D", "text": "II & III but not I"}], "answer": "B", "answer_text": "All", "explanation": "Section 28DA(10) अंतर्गत specified defects असल्यास preferential tariff treatment verification न करता refuse करता येते. वरील तिन्ही circumstances मध्ये refusal होऊ शकतो.", "golden": "Preferential Tariff → Ineligible item/Incomplete description/Unauthenticated alteration → Refusal"}, {"no": 15, "q": "Q15. If Assistant Commissioner is satisfied that duty paid by applicant is refundable, which is correct?", "options": [{"letter": "A", "text": "Credited to Consumer Welfare Fund"}, {"letter": "B", "text": "Paid to applicant if import was for personal use"}, {"letter": "C", "text": "Paid to applicant if related to drawback under Sections 74/75"}, {"letter": "D", "text": "All of the above"}], "answer": "D", "answer_text": "All of the above", "explanation": "Section 27 मध्ये refund applicant ला directly देण्याच्या specified circumstances आहेत. उदा.: ✔️ Personal use ✔️ Drawback under Sections 74/75 ✔️ Other cases where unjust enrichment condition is satisfied म्हणून paper answer D.", "golden": "Refund → Personal Use / Drawback / Unjust Enrichment conditions Q16–20"}, {"no": 16, "q": "Q16. Limitation for making application to claim refund of duty/interest paid under protest is—", "options": [{"letter": "A", "text": "No time-limit"}, {"letter": "B", "text": "Before expiry of one year"}, {"letter": "C", "text": "Before expiry of nine months"}, {"letter": "D", "text": "Before expiry of six months"}], "answer": "A", "answer_text": "No time-limit", "explanation": "Duty किंवा interest under protest भरले असल्यास Section 27 ची सामान्य limitation लागू होत नाही.", "golden": "Paid Under Protest → No Time Limit"}, {"no": 17, "q": "Q17. Owner of warehoused goods may do which of the following while goods remain in warehouse?", "options": [{"letter": "A", "text": "Inspect the goods"}, {"letter": "B", "text": "Sort the goods"}, {"letter": "C", "text": "Show the goods for sale"}, {"letter": "D", "text": "All of the above"}], "answer": "D", "answer_text": "All", "explanation": "Customs Act Section 64 अंतर्गत owner ला prescribed conditions subject to: ✔️ Inspect ✔️ Sort ✔️ Show for sale करता येते.", "golden": "Section 64 → Inspect + Sort + Show for Sale"}, {"no": 18, "q": "Q18. Which is a ground for revoking Customs Broker licence under CBLR, 2018?", "options": [{"letter": "A", "text": "Failure to comply with condition of bond"}, {"letter": "B", "text": "Adjudicated insolvent"}, {"letter": "C", "text": "Convicted by competent court for offence involving moral turpitude"}, {"letter": "D", "text": "All of the above"}], "answer": "D", "answer_text": "All", "explanation": "CBLR, 2018 अंतर्गत Customs Broker licence revoke होऊ शकते जर: Bond condition comply केली नाही ✔️ Broker insolvent ठरला ✔️ Moral turpitude संबंधित offence मध्ये conviction झाली ✔️", "golden": "CB Licence Revocation → Bond Violation + Insolvency + Moral Turpitude"}, {"no": 19, "q": "Q19. As per Intellectual Property Rights (Imported Goods) Enforcement Rules, 2007, proper officer for suspending clearance of suspected infringing goods is—", "options": [{"letter": "A", "text": "Appraising Officer"}, {"letter": "B", "text": "Assistant/Deputy Commissioner"}, {"letter": "C", "text": "Additional Commissioner"}, {"letter": "D", "text": "Superintendent"}], "answer": "B", "answer_text": "Assistant/Deputy Commissioner", "explanation": "IPR infringement बाबत valid notice मिळाल्यावर clearance suspend करण्याचा proper officer: 👉 Assistant Commissioner / Deputy Commissioner of Customs आहे.", "golden": "IPR Suspension → AC/DC"}, {"no": 20, "q": "Q20. Which of the following statements is correct?", "options": [{"letter": "A", "text": "“Dutiable goods” means goods on which duty has been paid"}, {"letter": "B", "text": "“Bill of Export” means a bill referred to in Section 48"}, {"letter": "C", "text": "“Bill of Entry” means a bill referred to in Section 46"}, {"letter": "D", "text": "“Market price” means retail price of goods"}], "answer": "C", "answer_text": "Bill of Entry = Section 46", "explanation": "Customs Act Section 46 मध्ये Bill of Entry ची provision आहे. म्हणून: 👉 Bill of Entry → Section 46 हा statement correct आहे.", "golden": "Bill of Entry → Section 46"}, {"no": 21, "q": "Q21. Relevant date for determining the Rate of Exchange for Bill of Entry for warehousing will be—", "options": [{"letter": "A", "text": "The date of Entry Inwards"}, {"letter": "B", "text": "The date of presentation of Bill of Entry for warehousing"}, {"letter": "C", "text": "The date of Bill of Lading"}, {"letter": "D", "text": "The date of presentation of Bill of Entry for clearance of warehoused goods"}], "answer": "B", "answer_text": "Date of presentation of Bill of Entry for warehousing", "explanation": "Warehousing साठी Into-Bond Bill of Entry file करताना foreign currency चे INR मध्ये conversion करण्यासाठी त्या Bill of Entry च्या presentation date चा applicable exchange rate घेतला जातो.", "golden": "Warehousing BOE → Rate of Exchange = Presentation Date"}, {"no": 22, "q": "Q22. As per Customs Brokers Licensing Regulations, 2018, “G card holder” means a person who has passed the examination referred to in—", "options": [{"letter": "A", "text": "Regulation 09"}, {"letter": "B", "text": "Regulation 11"}, {"letter": "C", "text": "Regulation 13"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Regulation 13", "explanation": "CBLR 2018 मधील Regulation 13 अंतर्गत examination पास केलेल्या आणि Form G photo identity card मिळालेल्या व्यक्तीला G-card holder म्हणतात.", "golden": "G Card → Regulation 13"}, {"no": 23, "q": "Q23. Computed value as per Rule 5 of Customs Valuation (Determination of Value of Export Goods) Rules, 2007 shall include—", "options": [{"letter": "A", "text": "Cost of production, manufacture or processing of export goods"}, {"letter": "B", "text": "Charges, if any, for the design or brand"}, {"letter": "C", "text": "An amount towards profit"}, {"letter": "D", "text": "All of the above"}], "answer": "D", "answer_text": "All of the above", "explanation": "Computed value method मध्ये: ✔️ Production/manufacturing/processing cost ✔️ Design/brand related charges ✔️ Profit amount हे सर्व consider केले जातात.", "golden": "Export Computed Value → Cost + Design/Brand + Profit"}, {"no": 24, "q": "Q24. Which of the following conveyances shall NOT be liable for confiscation under the Customs Act, 1962?", "options": [{"letter": "A", "text": "Vessel constructed/altered for concealing goods"}, {"letter": "B", "text": "Conveyance required to stop/land but fails to do so"}, {"letter": "C", "text": "Conveyance from which goods are thrown overboard to prevent seizure"}, {"letter": "D", "text": "None of the above"}], "answer": "D", "answer_text": "None of the above", "explanation": "वरील सर्व acts Customs law चे serious violations आहेत. Section 115 अंतर्गत अशा conveyances ना confiscation लागू होऊ शकते. म्हणून exemption असलेला option नाही.", "golden": "Sec.115 → Conveyance involved in smuggling violations → Confiscation"}, {"no": 25, "q": "Q25. Which of the following is “Not Correct”? Section 15 of Customs Act applies for rate of duty of imported goods wherein—", "options": [{"letter": "A", "text": "Goods entered for home consumption"}, {"letter": "B", "text": "Goods cleared from a warehouse for home consumption"}, {"letter": "C", "text": "Goods imported by post"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Goods imported by post", "explanation": "Section 15 मुख्यतः: Home consumption imports Warehoused goods cleared for home consumption यांच्या rate of duty साठी लागू होतो. Postal imports साठी separate provisions आहेत.", "golden": "Sec.15 → Home Consumption + Ex-Bond; Postal Goods → Separate provision Q26–30"}, {"no": 26, "q": "Q26. Which of the given Statement/s is/are correct regarding filing of Bill of Entry?", "options": [{"letter": "A", "text": "Only Statement I is correct"}, {"letter": "B", "text": "Only Statement II is correct"}, {"letter": "C", "text": "Both Statements are correct"}, {"letter": "D", "text": "None are correct"}], "answer": "A", "answer_text": "Only Statement I is correct", "explanation": "Paper answer नुसार Bill of Entry ची normal filing electronic आहे. Exceptional circumstances मध्ये manual filing ची permission higher authority कडून असू शकते; त्यामुळे Statement II ज्या authority ला power देतो ते चुकीचे आहे.", "golden": "BOE → Electronic Filing"}, {"no": 27, "q": "Q27. Which statement is correct with respect to Courier Imports and Exports (Clearance) Regulations, 1998?", "options": [{"letter": "A", "text": "Documents and samples can be packed together"}, {"letter": "B", "text": "Free gifts and samples can be packed together in identifiable courier company bags"}, {"letter": "C", "text": "Documents and free gifts can be packed together"}, {"letter": "D", "text": "Dutiable goods and samples can be packed together"}], "answer": "B", "answer_text": "", "explanation": "Courier regulations नुसार free gifts आणि samples identifiable courier company bags मध्ये एकत्र pack करता येतात. Documents आणि dutiable goods साठी separate treatment आहे.", "golden": "Courier → Free Gifts + Samples → Can be packed together"}, {"no": 28, "q": "Q28. Under CBLR, 2018, obligations of a Customs Broker do NOT include—", "options": [{"letter": "A", "text": "Verify correctness of IEC, GSTIN and identity of client"}, {"letter": "B", "text": "Enrol himself in more than one Customs Brokers’ Association in a particular jurisdiction"}, {"letter": "C", "text": "Join investigations promptly"}, {"letter": "D", "text": "Obtain authorisation from companies/firms/individuals for whom he acts"}], "answer": "B", "answer_text": "", "explanation": "Customs Broker च्या obligations मध्ये client verification, authorisation आणि investigation मध्ये cooperation यांचा समावेश आहे. पण एकाच jurisdiction मध्ये एकापेक्षा जास्त Customs Brokers' Association मध्ये enrol होणे obligation नाही; उलट restriction आहे.", "golden": "CB → More than one CB Association membership = Not allowed"}, {"no": 29, "q": "Q29. As per Electronic Duty Credit Ledger Regulations, 2021, e-scrip shall be valid for—", "options": [{"letter": "A", "text": "6 months"}, {"letter": "B", "text": "Two years"}, {"letter": "C", "text": "18 months"}, {"letter": "D", "text": "One year"}], "answer": "B", "answer_text": "Two years", "explanation": "Electronic Duty Credit Ledger मध्ये create झालेला e-scrip = 2 years valid. ⚠️ लक्षात ठेवा: Scroll ची validity आणि e-scrip ची validity वेगळी असू शकते.", "golden": "e-Scrip → 2 Years"}, {"no": 30, "q": "Q30. Which of the following is a taxable event under Customs Act, 1962?", "options": [{"letter": "A", "text": "Entering of goods into Indian territorial waters"}, {"letter": "B", "text": "Unloading imported goods at customs port"}, {"letter": "C", "text": "Goods cleared for home consumption"}, {"letter": "D", "text": "Filing Bill of Entry"}], "answer": "A", "answer_text": "Entering Indian territorial waters", "explanation": "Paper explanation नुसार Customs taxation साठी taxable event म्हणजे goods चे import into India. Indian territorial waters मध्ये goods enter झाल्यावर Customs jurisdiction लागू होते.", "golden": "Taxable Event → Import of Goods / Entry into Indian Territorial Waters Q31–35"}, {"no": 31, "q": "Q31. Any power exercisable by Assistant/Deputy Commissioner may also be exercised by a Gazetted Officer empowered by—", "options": [{"letter": "A", "text": "Central Government"}, {"letter": "B", "text": "Principal Chief Commissioner/Chief Commissioner"}, {"letter": "C", "text": "CBIC/Board"}, {"letter": "D", "text": "Principal Commissioner/Commissioner"}], "answer": "C", "answer_text": "CBIC/Board", "explanation": "Customs Act Section 152 अंतर्गत AC/DC ची काही powers दुसऱ्या Gazetted Customs Officer ला delegate करता येतात. त्यासाठी: 👉 CBIC/Board empowerment करते.", "golden": "Delegation → Sec.152 → CBIC/Board"}, {"no": 32, "q": "Q32. Any misdeclaration in IGM would make goods liable to confiscation under ___ and person liable to penalty under ___.", "options": [{"letter": "A", "text": "Section 111(f), Section 112"}, {"letter": "B", "text": "Section 111(f), Section 30"}, {"letter": "C", "text": "Section 30, Section 30"}, {"letter": "D", "text": "Section 30, Section 112"}], "answer": "A", "answer_text": "Section 111(f), Section 112", "explanation": "IGM मध्ये misdeclaration असल्यास: Goods → Section 111(f) अंतर्गत confiscation liable. Person → Section 112 अंतर्गत penalty.", "golden": "IGM Misdeclaration → Sec.111(f) + Sec.112"}, {"no": 33, "q": "Q33. Which of the following Entry Inwards need not be obtained for unloading?", "options": [{"letter": "A", "text": "Baggage accompanying passenger/crew"}, {"letter": "B", "text": "Animals"}, {"letter": "C", "text": "Perishable goods"}, {"letter": "D", "text": "All of the above"}], "answer": "D", "answer_text": "All of the above", "explanation": "सामान्यतः imported goods unload करण्यापूर्वी Entry Inwards आवश्यक असते. परंतु specific categories साठी exception आहे: ✔️ Passenger/crew baggage ✔️ Animals ✔️ Perishable goods", "golden": "Entry Inwards Exception → Baggage + Animals + Perishables"}, {"no": 34, "q": "Q34. When consignment is arriving from Sri Lanka, which statement regarding amended Bill of Entry Regulations is correct?", "options": [{"letter": "A", "text": "Only Statement I is correct"}, {"letter": "B", "text": "Only Statement II is correct"}, {"letter": "C", "text": "Both are correct"}, {"letter": "D", "text": "None are correct"}], "answer": "A", "answer_text": "Only Statement I is correct", "explanation": "Paper explanation नुसार Sri Lanka कडून येणाऱ्या spec
