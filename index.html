roy copies"}, {"letter": "B", "text": "Right to reproduction"}, {"letter": "C", "text": "Right to perform publicly"}, {"letter": "D", "text": "Right to translation"}], "answer": "A", "answer_text": "Right to destroy copies", "explanation": "Section 14 मध्ये copyright owner ला अनेक exclusive rights मिळतात: ✔️ Reproduction ✔️ Public performance ✔️ Translation ✔️ Adaptation इत्यादी. पण: ❌ Right to destroy copies हा statutory copyright right नाही.", "golden": "Sec.14 → Reproduction/Performance/Translation; Destroy Copies ❌"}, {"no": 120, "q": "Q120. Which rule of the Hazardous and Other Wastes (Management and Transboundary Movement) Rules, 2016 deals with illegal export from or import into India of hazardous or other wastes?", "options": [{"letter": "A", "text": "Rule 15"}, {"letter": "B", "text": "Rule 8"}, {"letter": "C", "text": "Rule 9"}, {"letter": "D", "text": "Rule 11"}], "answer": "A", "answer_text": "Rule 15", "explanation": "Hazardous and Other Wastes Rules, 2016 मध्ये: 👉 Rule 15 → Illegal Traffic म्हणजे illegal import/export of hazardous or other wastes यासंबंधी provision आहे. Illegal import/export झाल्यास waste परत exporting country कडे पाठवणे किंवा prescribed manner मध्ये dispose करणे आवश्यक असू शकते.", "golden": "Illegal Hazardous Waste Import/Export → Rule 15"}, {"no": 121, "q": "Q121. In respect of food items available for sale in the market, Shelf life under Food Safety and Standards Act, 2006 means the period between the—", "options": [{"letter": "A", "text": "Date of manufacture and Date of purchase"}, {"letter": "B", "text": "Date of manufacture and Best Before 1 Month"}, {"letter": "C", "text": "Date of manufacture and Date of Expiry whichever is later"}, {"letter": "D", "text": "Date of manufacture and Best Before or Date of Expiry whichever is earlier"}], "answer": "D", "answer_text": "", "explanation": "Food च्या Shelf Life चा अर्थ: 👉 Date of Manufacture पासून Best Before किंवा Date of Expiry यापैकी जे आधी येते तो कालावधी. म्हणजे consumer ला food सुरक्षित आणि acceptable quality मध्ये किती काळ उपलब्ध आहे हे shelf life सांगते.", "golden": "Shelf Life → Manufacture Date → Best Before / Expiry → Whichever is Earlier"}, {"no": 122, "q": "Q122. Which section of the Prevention of Corruption Act, 1988 deals with offence relating to bribing of a public servant by any person?", "options": [{"letter": "A", "text": "Section 6"}, {"letter": "B", "text": "Section 4"}, {"letter": "C", "text": "Section 12"}, {"letter": "D", "text": "Section 8"}], "answer": "D", "answer_text": "Section 8", "explanation": "Prevention of Corruption Act, 1988 मध्ये: 👉 Section 8 = Offence relating to bribing of a public servant म्हणजे एखाद्या public servant ला undue advantage देणे किंवा देण्याचे promise करणे हा offence आहे.", "golden": "PCA → Sec.8 → Bribing Public Servant"}, {"no": 123, "q": "Q123. The import and export of hazardous and other wastes not specified in Schedule I of the Hazardous and Other Wastes (Management and Transboundary Movement) Rules, 2016, but exhibiting the hazardous characteristics outlined in Part C of Schedule I of the said rules shall require prior written permission of __________ before it is imported to or exported from India, as the case may be?", "options": [{"letter": "A", "text": "Ministry of Environment, Forest and Climate Change"}, {"letter": "B", "text": "Central Pollution Control Board"}, {"letter": "C", "text": "Ministry of Commerce & Industry"}, {"letter": "D", "text": "Commissioner of Customs"}], "answer": "A", "answer_text": "Ministry of Environment, Forest and Climate Change", "explanation": "Hazardous waste जर Schedule I मध्ये specifically specified नसला, पण त्याच्यामध्ये Part C of Schedule I मध्ये दिलेली hazardous characteristics असतील, तर import/export करण्यापूर्वी: 👉 Ministry of Environment, Forest and Climate Change (MoEFCC) ची prior written permission आवश्यक आहे.", "golden": "Hazardous Characteristics + Not specified in Schedule I → Prior Written Permission → MoEFCC"}, {"no": 124, "q": "Q124. What is the threshold limit for obtaining the registration under CGST Act, 2017 in case of inter-State supply of goods and/or services?", "options": [{"letter": "A", "text": "₹40 Lakh"}, {"letter": "B", "text": "Mandatory registration irrespective of turnover"}, {"letter": "C", "text": "₹20 Lakh"}, {"letter": "D", "text": "₹10 Lakh"}], "answer": "B", "answer_text": "Mandatory registration irrespective of turnover", "explanation": "Inter-State taxable supply करणाऱ्या व्यक्तीसाठी registration requirement लागू होते. Paper मध्ये दिलेला answer B आहे.", "golden": "Inter-State Supply → Mandatory Registration"}, {"no": 125, "q": "Q125. In the case of a Warehousing Bill of Entry filed by an importer under section 46 and assessed to duty under section 17 or section 18 what will be the sum equal to?", "options": [{"letter": "A", "text": "Sum equal to the amount of duty assessed on such goods"}, {"letter": "B", "text": "Duty assessed on such goods"}, {"letter": "C", "text": "Sum equal to the amount of duty assessed on such goods plus amount of duty assessed on such goods"}, {"letter": "D", "text": "Sum equal to value of the goods assessed on such goods"}], "answer": "A", "answer_text": "", "explanation": "Customs Act च्या Section 59 अंतर्गत warehousing साठी importer कडून bond घेतला जातो. Bond ची amount: 👉 Assessed duty इतकी असते.", "golden": "Warehousing Bond → Amount equal to Duty Assessed"}, {"no": 126, "q": "Q126. Which one of the following offences is punishable under section 135(1)(b) of the Customs Act, 1962?", "options": [{"letter": "A", "text": "Fraudulently availing or attempting to avail of any exemption from duty provided under any Act, if the amount of exemption from duty exceeds ₹50 lakh"}, {"letter": "B", "text": "Fraudulently availing exemption below ₹50 lakh"}, {"letter": "C", "text": "Evasion or attempted evasion of duty exceeding ₹50 lakh"}, {"letter": "D", "text": "Import/export knowingly using false document"}], "answer": "A", "answer_text": "", "explanation": "Section 135(1)(b) मध्ये fraudulent manner ने duty exemption किंवा drawback चा फायदा घेण्याशी संबंधित offence येतो.", "golden": "Sec.135(1)(b) → Fraudulent Duty Exemption/Benefit"}, {"no": 127, "q": "Q127. Which of the following is NOT a requirement for registration as an authorised courier under the Courier Imports and Exports Regulations?", "options": [{"letter": "A", "text": "Authorised Sea Carrier including Shipping Line"}, {"letter": "B", "text": "Authorised Sea Agent (Steamer/Shipping Agent)"}, {"letter": "C", "text": "Authorised Courier"}, {"letter": "D", "text": "All of the above"}], "answer": "D", "answer_text": "All of the above", "explanation": "SCMTR अंतर्गत manifest filing करणाऱ्या संबंधित stakeholders ना prescribed registration आवश्यक आहे. Paper मध्ये योग्य answer D आहे.", "golden": "SCMTR Registration → Relevant notified stakeholders Q128–130"}, {"no": 128, "q": "Q128. What is the validity period of a registered trademark as per the Trade Marks Act, 1999?", "options": [{"letter": "A", "text": "10 years"}, {"letter": "B", "text": "15 years"}, {"letter": "C", "text": "5 years"}, {"letter": "D", "text": "20 years"}], "answer": "A", "answer_text": "10 years", "explanation": "Trade Marks Act, 1999 च्या Section 25 नुसार registered trademark: 👉 10 years साठी valid असतो आणि prescribed conditions वर पुढे renew करता येतो.", "golden": "Trademark Registration → 10 Years"}, {"no": 129, "q": "Q129. Within how many days shall the Principal Commissioner/Commissioner of Customs dispose of an application for registration of an Authorised Courier?", "options": [{"letter": "A", "text": "30 days"}, {"letter": "B", "text": "45 days"}, {"letter": "C", "text": "15 days"}, {"letter": "D", "text": "60 days"}], "answer": "B", "answer_text": "45 days", "explanation": "Courier Imports and Exports Regulations, 2010 अंतर्गत application मिळाल्यानंतर: 👉 45 days मध्ये disposal करायचा आहे.", "golden": "Authorised Courier Registration → 45 Days"}, {"no": 130, "q": "Q130. Who among the following persons is required to register and operate under Sea Cargo Manifest and Transhipment Regulations (SCMTR), 2018?", "options": [{"letter": "A", "text": "Authorised Sea Carrier"}, {"letter": "B", "text": "Authorised Sea Agent"}, {"letter": "C", "text": "Authorised Courier / other notified carrier"}, {"letter": "D", "text": "All of the above"}], "answer": "D", "answer_text": "All of the above", "explanation": "SCMTR मध्ये sea cargo movement/handling मध्ये involved notified stakeholders ना designated online system वर registration आणि prescribed declarations करणे आवश्यक आहे.", "golden": "SCMTR → All notified stakeholders Q131–135"}, {"no": 131, "q": "Q131. If any person intentionally obstructs any officer of Customs in the exercise of any powers conferred under the Customs Act, such person shall be punishable with imprisonment for a term which may extend to—", "options": [{"letter": "A", "text": "Two years"}, {"letter": "B", "text": "Six months"}, {"letter": "C", "text": "Five years"}, {"letter": "D", "text": "One year"}], "answer": "A", "answer_text": "Two years", "explanation": "Customs Act च्या Section 133 नुसार Customs officer ला intentionally obstruct केल्यास: 👉 Imprisonment up to 2 years, किंवा fine, किंवा both.", "golden": "Sec.133 → Obstruction of Customs Officer → 2 Years"}, {"no": 132, "q": "Q132. Which section of the Customs Act, 1962 deals with the valuation of imported goods?", "options": [{"letter": "A", "text": "Section 12"}, {"letter": "B", "text": "Section 25"}, {"letter": "C", "text": "Section 14"}, {"letter": "D", "text": "Section 13"}], "answer": "C", "answer_text": "Section 14", "explanation": "Section 14 imported goods ची valuation करण्यासाठी transaction value/principles prescribe करते.", "golden": "Sec.14 → Customs Valuation"}, {"no": 133, "q": "Q133. What is the validity period of a registered trademark as per the Trade Marks Act, 1999?", "options": [{"letter": "A", "text": "10 years"}, {"letter": "B", "text": "15 years"}, {"letter": "C", "text": "5 years"}, {"letter": "D", "text": "20 years"}], "answer": "A", "answer_text": "10 years", "explanation": "Trade Marks Act, 1999 च्या Section 25(1) नुसार registration: 👉 10 years from the date of registration valid असते.", "golden": "Trademark → 10 Years"}, {"no": 134, "q": "Q134. An appeal against the order of rejection for the grant of licence under Food Safety and Standards Act, 2006 lies with which authority?", "options": [{"letter": "A", "text": "Commissioner of Food Safety"}, {"letter": "B", "text": "The Designated Officer of FSSAI"}, {"letter": "C", "text": "High Court"}, {"letter": "D", "text": "Joint Director, DGFT"}], "answer": "A", "answer_text": "Commissioner of Food Safety", "explanation": "Designated Officer ने licence application reject केल्यास aggrieved person: 👉 Commissioner of Food Safety कडे appeal करू शकतो.", "golden": "Food Licence Rejection → Appeal → Commissioner of Food Safety"}, {"no": 135, "q": "Q135. What is the import policy for second-hand desktop computers as per Foreign Trade Policy, 2023?", "options": [{"letter": "A", "text": "Open General Licence, freely importable"}, {"letter": "B", "text": "Prohibited, cannot be imported under any Authorization"}, {"letter": "C", "text": "Prohibited, importable against Authorization"}, {"letter": "D", "text": "Restricted, Importable against Authorization"}], "answer": "D", "answer_text": "", "explanation": "Second-hand desktop computers: 👉 Restricted आहेत आणि import करण्यासाठी: 👉 Authorisation आवश्यक आहे.", "golden": "Second-hand Desktop → Restricted → Authorisation Q136–140"}, {"no": 136, "q": "Q136. Which provision of the Prevention of Corruption Act, 1988 mandates previous sanction for prosecution of a public servant accused of committing offences punishable under Sections 7, 11, 13 and 15?", "options": [{"letter": "A", "text": "Section 20"}, {"letter": "B", "text": "Section 17"}, {"letter": "C", "text": "Section 18"}, {"letter": "D", "text": "Section 19"}], "answer": "D", "answer_text": "Section 19", "explanation": "Prevention of Corruption Act मधील: 👉 Section 19 नुसार specified offences साठी public servant विरुद्ध prosecution सुरू करण्यापूर्वी previous sanction आवश्यक आहे.", "golden": "PCA Sec.19 → Previous Sanction for Prosecution"}, {"no": 137, "q": "Q137. Should all related party transactions be subject to Valuation Branch (SVB) investigation?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}, {"letter": "C", "text": "If annual turnover is above ₹5 Crores"}, {"letter": "D", "text": "If annual turnover is above ₹10 Crores"}], "answer": "B", "answer_text": "No", "explanation": "प्रत्येक related-party transaction आपोआप SVB investigation ला जात नाही. Paper मध्ये दिलेल्या guidance नुसार certain conditions/exceptions मध्ये SVB investigation आवश्यक नसू शकते.", "golden": "Related Party ≠ Automatically SVB Investigation"}, {"no": 138, "q": "Q138. Which section of the Foreign Exchange Management Act, 1999 deals with realisation and repatriation of foreign exchange?", "options": [{"letter": "A", "text": "Section 7"}, {"letter": "B", "text": "Section 9"}, {"letter": "C", "text": "Section 8"}, {"letter": "D", "text": "Section 6"}], "answer": "C", "answer_text": "Section 8", "explanation": "FEMA Section 8: 👉 Realisation and repatriation of foreign exchange यासंबंधी obligation सांगतो. Resident in India ने foreign exchange मिळाल्यास prescribed manner/time मध्ये India मध्ये realise/repatriate करणे आवश्यक असते.", "golden": "FEMA Sec.8 → Realisation & Repatriation"}, {"no": 139, "q": "Q139. Which section of the Foreign Trade (Development and Regulation) Act, 1992 regulates import of food items into India?", "options": [{"letter": "A", "text": "Section 20"}, {"letter": "B", "text": "Section 23"}, {"letter": "C", "text": "Section 28"}, {"letter": "D", "text": "Section 25"}], "answer": "D", "answer_text": "Section 25", "explanation": "तुमच्या paper मध्ये answer Section 25 दिलेला आहे.", "golden": "Paper Answer → Sec.25"}, {"no": 140, "q": "Q140. Within how many days should a Bill of Entry be presented when filed in advance with the expected arrival of the aircraft/vessel/vehicle by which the imported goods have been shipped for importation into India?", "options": [{"letter": "A", "text": "60 days"}, {"letter": "B", "text": "45 days"}, {"letter": "C", "text": "15 days"}, {"letter": "D", "text": "30 days"}], "answer": "D", "answer_text": "30 days", "explanation": "Customs Act Section 46 नुसार advance Bill of Entry filing ची सुविधा आहे. Paper नुसार: 👉 Expected arrival च्या 30 days आधी Bill of Entry present करता येतो.", "golden": "Advance BOE → 30 Days Q141–145"}, {"no": 141, "q": "Q141. If Bill of Entry is not presented within the time specified and no sufficient cause is shown, what is the consequence?", "options": [{"letter": "A", "text": "No charges"}, {"letter": "B", "text": "Bill of Entry cannot be filed"}, {"letter": "C", "text": "Importer shall pay charges for late presentation"}, {"letter": "D", "text": "Importer can file only with Commissioner’s permission"}], "answer": "C", "answer_text": "", "explanation": "Late Bill of Entry filing झाल्यास prescribed late presentation charges लागू होतात. Paper explanation नुसार initial period साठी ₹5,000/day आणि त्यानंतर ₹10,000/day लागू होतात.", "golden": "Late BOE → Late Presentation Charges"}, {"no": 142, "q": "Q142. Which section of Customs Act, 1962 provides for option to pay fine in lieu of confiscation?", "options": [{"letter": "A", "text": "Section 128"}, {"letter": "B", "text": "Section 100"}, {"letter": "C", "text": "Section 125"}, {"letter": "D", "text": "Section 110"}], "answer": "C", "answer_text": "Section 125", "explanation": "Section 125: 👉 Redemption Fine in lieu of confiscation ची provision देतो. Goods confiscation ला liable असल्यास adjudicating officer specified conditions वर fine भरून goods release करण्याची option देऊ शकतो.", "golden": "Sec.125 → Redemption Fine"}, {"no": 143, "q": "Q143. A person making supply from multiple States and  [{"letter": "A", "text": "Rule 10"}, {"letter": "B", "text": "Rule 3"}, {"letter": "C", "text": "Rule 13"}, {"letter": "D", "text": "Rule 12"}], "answer": "D", "answer_text": "Rule 12", "explanation": "Customs Valuation Rules, 2007 मधील Rule 12 proper officer ला declared transaction value reject करण्याची procedure देते, जर transaction value च्या truth/accuracy बाबत reasonable doubt असेल. त्यानंतर Rules 4 ते 9 मधील alternative valuation methods लागू होतात.", "golden": "Rule 12 → Rejection of Declared Transaction Value"}, {"no": 150, "q": "Q150. How many copies of the import certificate, for import of narcotic drug or psychotropic substance, is prepared by the concerned authority under provisions of Narcotic Drugs and Psychotropic Substances Rules, 1985?", "options": [{"letter": "A", "text": "2"}, {"letter": "B", "text": "3"}, {"letter": "C", "text": "5"}, {"letter": "D", "text": "7"}], "answer": "D", "answer_text": "7 copies", "explanation": "NDPS Rules, 1985 अंतर्गत narcotic drug/psychotropic substance च्या import certificate बाबत: 👉 7 copies तयार केल्या जातात.", "golden": "NDPS Import Certificate → 7 Copies"}]},DUP=[{"no": 11, "q": "Q11. The Nodal Ministry to deal with the trans-boundary movement of hazardous wastes is—", "options": [{"letter": "A", "text": "Ministry of Environment and Forest"}, {"letter": "B", "text": "Ministry of Finance"}, {"letter": "C", "text": "Ministry of Home Affairs"}, {"letter": "D", "text": "Ministry of Agriculture"}], "answer": "A", "answer_text": "Ministry of Environment and Forest", "explanation": "Hazardous waste च्या trans-boundary movement साठी Ministry of Environment, Forest and Climate Change (MoEFCC) nodal ministry आहे.", "golden": "Hazardous Waste → MoEFCC", "years": ["2019", "2021"], "_id": "dup_1"}, {"no": 144, "q": "Q144. The rate of duty in respect of Ex-bond Bill of Entry is taken as—", "options": [{"letter": "A", "text": "Rate on date of presentation of Ex-bond BE"}, {"letter": "B", "text": "Rate on date of presentation uthorised officer of the FSSAI"}, {"letter": "B", "text": "The authorised officer of DGFT"}, {"letter": "C", "text": "The authorised officer of Police"}, {"letter": "D", "text": "The authorised officer of the Food Import Council"}], "answer": "A", "answer_text": "Authorised Officer of FSSAI", "explanation": "FSSAI = Food Safety and Standards Authority of India. Imported food ची inspection, sampling आणि food safety compliance साठी FSSAI authorised officer जबाबदार असतो.", "golden": "Imported Food → FSSAI", "years": ["2019", "2021"], "_id": "dup_4"}, {"no": 38, "q": "Q38. Which of the following is not to be referred for the purpose of classification in case of imported goods?", "options": [{"letter": "A", "text": "Chapter Note in Customs Tariff"}, {"letter": "B", "text": "Section Note in Customs Tariff"}, {"letter": "C", "text": "HSN Explanatory Note"}, {"letter": "D", "text": "Foreign Trade Policy"}], "answer": "D", "answer_text": "Foreign Trade Policy", "explanation": "Tariff classification करताना मुख्यतः: ✔️ Section Notes ✔️ Chapter Notes ✔️ HSN Explanatory Notes ✔️ General Rules for Interpretation यांचा reference घेतला जातो. FTP हे classification चे primary legal source नाही.", "golden": "Classification → Section Note + Chapter Note + HSN FTP → Not classification reference", "years": ["2021", "2022"], "_id": "dup_8"}, {"no": 48, "q": "Q48. Which of the following is the purpose of Advance Ruling?", "options": [{"letter": "A", "text": "To set right law"}, {"letter": "B", "text": "To provide certainty in advance to the importer with respect to questions raised"}, {"letter": "C", "text": "To provide certainty to all importers on dispute issues"}, {"letter": "D", "text": "To make advance laws"}], "answer": "B", "answer_text": "", "explanation": "Advance Ruling चा मुख्य उद्देश importer ला एखाद्या proposed import transaction बाबत आधीच certainty देणे हा आहे.", "golden": "Advance Ruling → Certainty in Advance", "years": ["2021", "2022"], "_id": "dup_9"}, {"no": 58, "q": "Q58. Facility of deferred payment of customs duty has been provided at present to which category of importers?", "options": [{"letter": "A", "text": "ACP"}, {"letter": "B", "text": "AEO"}, {"letter": "C", "text": "AEO-T2"}, {"letter": "D", "text": "DPD"}], "answer": "C", "answer_text": "AEO-T2", "explanation": "Source answer नुसार deferred payment facility AEO Tier-2 category शी जोडलेली आहे. AEO = Authorized Economic Operator.", "golden": "Deferred Customs Duty → AEO-T2", "years": ["2019", "2020", "2022"], "_id": "dup_5"}, {"no": 78, "q": "Q78. What is ITC (HS)?", "options": [{"letter": "A", "text": "Important Trade Classification (Harmonized System)"}, {"letter": "B", "text": "Import Trade Classification (Harmonized and Systematic)"}, {"letter": "C", "text": "Import Trade Classes (Harmonized System)"}, {"letter": "D", "text": "Import Trade Classification (Harmonized System)"}], "answer": "D", "answer_text": "", "explanation": "Source नुसार: ITC (HS) = Import Trade Classification (Harmonized System) भारतामध्ये import-export goods चे classification करण्यासाठी हे वापरले जाते. हे 8-digit classification system आहे. याचा उपयोग: Import/Export policy Customs duty Trade statistics यासाठी होतो.", "golden": "ITC(HS) = Import Trade Classification (Harmonized System)", "years": ["2019", "2021"], "_id": "dup_6"}, {"no": 81, "q": "Q81. The appeal filed by the importer against the Faceless Assessment will be taken up by?", "options": [{"letter": "A", "text": "Commissioner (Appeals) having jurisdiction where the Bill of Entry has been assessed by the Faceless Assessment"}, {"letter": "B", "text": "Commissioner (Appeals) having jurisdiction over the port of import where the consignment is imported"}, {"letter": "C", "text": "Commissioner (Appeals) Faceless Assessment at Delhi"}, {"letter": "D", "text": "None of these"}], "answer": "B", "answer_text": "", "explanation": "Faceless Assessment मध्ये assessment officer वेगळ्या ठिकाणी असू शकतो. पण appeal ज्या port वर goods import झाले आहेत त्या port च्या jurisdiction मधील Commissioner (Appeals) कडे जाते.", "golden": "Faceless Assessment Appeal → Port of Import jurisdiction", "years": ["2021", "2022"], "_id": "dup_10"}];let year="HOME",term="";
const state={};Object.keys(DATA).forEach(y=>state[y]={a:{},score:0});
const dupState={a:{},score:0};const retryState={};

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function renderHome(){
 let total=0,attempt=0,correct=0,wrong=0,cards="";
 for(const y of Object.keys(DATA)){
   const n=DATA[y].length, a=Object.keys(state[y].a).length, c=state[y].score, w=a-c;
   total+=n;attempt+=a;correct+=c;wrong+=w;
   cards+=`<div class="dashcard"><b>${y}</b><div class="dashmuted">${a}/${n} completed • Score ${c}</div><div class="mini"><div class="minibar" style="width:${n?a/n*100:0}%"></div></div></div>`;
 }
 let cont="";
 for(const y of Object.keys(DATA)){let a=Object.keys(state[y].a).length;if(a<DATA[y].length){cont=`<div class="continue"><span class="badge">CONTINUE STUDY</span><div style="margin-top:7px"><b>${y}</b> — Q${a+1} पासून पुढे सुरू करा</div><button class="btn" onclick="openYear('${y}')">▶ Continue ${y}</button></div>`;break}}
 document.getElementById("app").innerHTML=`<div class="dashboard">
 <div class="dashcard"><b>${total}</b><div class="dashmuted">Total Questions</div></div>
 <div class="dashcard"><b>${attempt}</b><div class="dashmuted">Attempted</div></div>
 <div class="dashcard"><b>${correct}</b><div class="dashmuted">Correct</div></div>
 <div class="dashcard"><b>${wrong}</b><div class="dashmuted">Wrong</div></div>
 </div>${cont}<div class="stats"><b>📚 Year-wise Progress</b></div>${cards}`;
}
function openYear(y){year=y;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.y===y));document.getElementById("search").value="";term="";render();scrollTo(0,0)}
function findYear(q){for(const y of Object.keys(DATA)){if(DATA[y].some(x=>x.no===q.no && x.q===q.q))return y}return null}
function wrongList(){let a=[];for(const y of Object.keys(DATA)){for(const q of DATA[y]){let st=state[y].a[q.no];if(st&&st.s!==q.answer)a.push({...q,_wy:y,_id:"wrong_"+y+"_"+q.no});}}return a}
function list(){if(year==="DUP")return DUP;if(year==="WRONG")return wrongList();return DATA[year]}
function store(q){if(year==="DUP")return dupState.a[q._id];if(year==="WRONG")return retryState[q._id];return state[year].a[q.no]}
function pick(id,s){
 let q;
 if(year==="DUP") q=DUP.find(x=>x._id===id);
 else if(year==="WRONG") q=wrongList().find(x=>x._id===id);
 else q=DATA[year].find(x=>String(x.no)===String(id));
 if(!q)return;
 if(year==="DUP"){if(dupState.a[q._id])return;dupState.a[q._id]={s};if(s===q.answer)dupState.score++;}
 else if(year==="WRONG"){retryState[q._id]={s};}
 else {if(state[year].a[q.no])return;state[year].a[q.no]={s};if(s===q.answer)state[year].score++;}
 saveData();render();
}
function render(){
 if(year==="HOME"){renderHome();return}
 let L=list().filter(q=>(q.q+" "+q.options.map(o=>o.text).join(" ")).toLowerCase().includes(term));
 let total=list().length,answered=year==="DUP"?Object.keys(dupState.a).length:year==="WRONG"?Object.keys(retryState).length:Object.keys(state[year].a).length;
 let score=year==="DUP"?dupState.score:year==="WRONG"?"":state[year].score;
 let title=year==="DUP"?"🔁 Duplicate Questions":year==="WRONG"?"❌ Wrong Questions":year;
 let out=`<div class="stats"><b>${title}</b> — ${total} Questions ${score!==""?`<span style="float:right">${answered}/${total} • Score: ${score}</span>`:""}${year!=="WRONG"?`<div class="progress"><div class="bar" style="width:${total?answered/total*100:0}%"></div></div>`:""}</div>`;
 if(!L.length)out+=`<div class="empty">${year==="WRONG"?"🎉 सध्या Wrong Questions नाहीत.":"Question सापडला नाही."}</div>`;
 L.forEach(q=>{let a=store(q),key=year==="DUP"?q._id:(year==="WRONG"?q._id:q.no);out+=`<div class="card"><div class="q"><span class="num">Q${q.no}.</span> ${esc(q.q.replace(/^Q\\d+\\.\\s*/,""))}</div>`;
 if(year==="DUP")out+=`<div class="years">या प्रश्नाचा paper: ${q.years.join(", ")}</div>`;
 q.options.forEach(o=>{let c=a?(o.letter===q.answer?"correct":o.letter===a.s?"wrong":""):"";out+=`<button type="button" class="opt ${c}" ${a?"disabled":""} data-question-id="${esc(String(key))}" data-option="${esc(o.letter)}"><b>${o.letter}.</b> ${esc(o.text)}</button>`});
 if(a){let ok=a.s===q.answer;out+=`<div class="fb show ${ok?"ok":"bad"}">${ok?"✅ बरोबर उत्तर!":"❌ चुकीचे उत्तर!"}<br><b>Answer: ${esc(q.answer)} — ${esc(q.answer_text)}</b><div style="margin-top:7px"><b>📖 Explanation:</b> ${esc(q.explanation||"Source paper मध्ये explanation उपलब्ध नाही.")}</div><div class="golden">🔑 Golden Point: ${esc(q.golden)}</div>${year==="WRONG"?`<div style="margin-top:8px"><button class="btn" onclick="retryAgain('${q._id}')">🔄 Re-attempt Again</button></div>`:""}</div>`}out+=`</div>`});
 document.getElementById("app").innerHTML=out;
 document.querySelectorAll("#app .opt:not([disabled])").forEach(btn=>{
   btn.addEventListener("click",()=>pick(btn.dataset.questionId,btn.dataset.option));
 });
}
function retryAgain(id){delete retryState[id];saveData();render()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{year=b.dataset.y;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));document.getElementById("search").value="";term="";render();scrollTo(0,0)});
document.getElementById("search").oninput=e=>{term=e.target.value.toLowerCase();render()};
document.getElementById("reset").onclick=()=>{if(year==="HOME"){renderHome();return}if(year==="DUP"){dupState.a={};dupState.score=0}else if(year==="WRONG"){Object.keys(retryState).forEach(k=>delete retryState[k])}else state[year]={a:{},score:0};saveData();render()};
function saveData(){localStorage.setItem("fcard_progress",JSON.stringify(state));localStorage.setItem("fcard_dup",JSON.stringify(dupState));localStorage.setItem("fcard_retry",JSON.stringify(retryState))}
function loadData(){try{let s=JSON.parse(localStorage.getItem("fcard_progress")||"{}");Object.keys(DATA).forEach(y=>{if(s[y])state[y]=s[y]});let d=JSON.parse(localStorage.getItem("fcard_dup")||"{}");if(d.a){dupState.a=d.a;dupState.score=d.score||0}let r=JSON.parse(localStorage.getItem("fcard_retry")||"{}");Object.assign(retryState,r)}catch(e){}render()}
function setupPin(){let saved=localStorage.getItem("fcard_pin");if(saved && localStorage.getItem("fcard_auto_unlock")==="1"){document.getElementById("pin").innerHTML="";loadData();return}if(!saved){document.getElementById("pin").innerHTML=`<div class="pinbox"><div class="pinpanel"><h2>🔐 App PIN Set करा</h2><div>तुमचा 4 digit PIN तयार करा</div><input id="pininput" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><div class="pinerr"></div><button onclick="setPin()">Set PIN</button></div></div>`}else{document.getElementById("pin").innerHTML=`<div class="pinbox"><div class="pinpanel"><h2>🔐 F Card App</h2><div>PIN टाका</div><input id="pininput" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><div class="pinerr"></div><button onclick="unlock()">Open App</button></div></div>`}}
function setPin(){let v=document.getElementById("pininput").value;if(!/^\d{4}$/.test(v)){document.querySelector(".pinerr").textContent="कृपया 4 digit PIN द्या.";return}localStorage.setItem("fcard_pin",v);localStorage.setItem("fcard_auto_unlock","1");sessionStorage.setItem("fcard_unlocked","1");document.getElementById("pin").innerHTML="";loadData()}
function unlock(){let v=document.getElementById("pininput").value;if(v===localStorage.getItem("fcard_pin")){localStorage.setItem("fcard_auto_unlock","1");sessionStorage.setItem("fcard_unlocked","1");document.getElementById("pin").innerHTML="";loadData()}else document.querySelector(".pinerr").textContent="PIN चुकीचा आहे."}
window.addEventListener("beforeunload",saveData);setupPin();
</script></body></html>
