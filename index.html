ified consignments बाबत Statement II लागू होत नाही. म्हणून: 👉 Only Statement I", "golden": "Sri Lanka Consignment → Air BOE rule as stated; Statement II incorrect"}, {"no": 35, "q": "Q35. Penalty for fraudulent utilization of input tax credit for claiming refund is levied under—", "options": [{"letter": "A", "text": "Section 114AA"}, {"letter": "B", "text": "Section 115"}, {"letter": "C", "text": "Section 114AC"}, {"letter": "D", "text": "Section 114AB"}], "answer": "C", "answer_text": "Section 114AC", "explanation": "Customs Act मध्ये fraudulent ITC utilisation करून export refund claim केल्यास Section 114AC अंतर्गत penalty लागू होते.", "golden": "Fraudulent ITC Refund → Section 114AC Q36–40"}, {"no": 36, "q": "Q36. Which authority may exempt a class of goods from provisions of Warehouse (Custody and Handling of Goods) Regulations, 2016?", "options": [{"letter": "A", "text": "Jurisdictional Principal Commissioner"}, {"letter": "B", "text": "Jurisdictional Chief Commissioner"}, {"letter": "C", "text": "Jurisdictional Additional Commissioner"}, {"letter": "D", "text": "CBIC/Board"}], "answer": "D", "answer_text": "CBIC/Board", "explanation": "Regulation 13 नुसार goods ची nature, transport किंवा storage लक्षात घेऊन regulations मधील provisions मधून class of goods ला exemption देण्याची power: 👉 CBIC/Board कडे आहे.", "golden": "Warehouse Regulations Exemption → CBIC/Board"}, {"no": 37, "q": "Q37. Penalty for fraudulent utilisation of input tax credit for claiming refund on goods entered for export shall not exceed—", "options": [{"letter": "A", "text": "Four times"}, {"letter": "B", "text": "Five times"}, {"letter": "C", "text": "Three times"}, {"letter": "D", "text": "No limit"}], "answer": "B", "answer_text": "Five times", "explanation": "Section 114AC अंतर्गत fraudulent ITC वापरून refund claim केल्यास penalty: 👉 Refund claimed च्या 5 times पर्यंत जाऊ शकते.", "golden": "Sec.114AC → Maximum Penalty = 5× Refund"}, {"no": 38, "q": "Q38. Which statement about notified goods is NOT correct?", "options": [{"letter": "A", "text": "No person shall, after expiry of 30 days from notified date, keep/store notified goods at place other than intimated place"}, {"letter": "B", "text": "Sold notified goods cannot be moved without voucher"}, {"letter": "C", "text": "Shifting notified goods requires intimation to proper officer"}, {"letter": "D", "text": "True and complete account of notified goods must be maintained"}], "answer": "A", "answer_text": "", "explanation": "Paper explanation नुसार 30 days हा statement मध्ये दिलेला period चुकीचा आहे. Notified goods बाबत storage/movement आणि accounting वर strict controls आहेत.", "golden": "Notified Goods → Intimated Place + Voucher + Proper Account"}, {"no": 39, "q": "Q39. “Foreign-going vessel” includes—", "options": [{"letter": "A", "text": "Only I"}, {"letter": "B", "text": "I and II"}, {"letter": "C", "text": "Only II"}, {"letter": "D", "text": "None"}], "answer": "B", "answer_text": "I and II", "explanation": "Customs Act Section 2 नुसार foreign-going vessel मध्ये: ✔️ Indian port ↔ foreign port goods/passenger carriage ✔️ Indian territorial watersच्या बाहेर fishing/operations करणारी vessel यांचा समावेश होतो.", "golden": "Foreign-going Vessel → Indian/Foreign Port + Outside Territorial Waters Fishing"}, {"no": 40, "q": "Q40. Time period for realisation of sale proceeds of export goods where drawback has been claimed is governed by—", "options": [{"letter": "A", "text": "Customs Tariff Act, 1975"}, {"letter": "B", "text": "Foreign Exchange Management Act, 1999"}, {"letter": "C", "text": "Section 74 of Customs Act"}, {"letter": "D", "text": "DGFT Rules"}], "answer": "B", "answer_text": "FEMA, 1999", "explanation": "Export proceeds realise करण्याची prescribed time-limit foreign exchange regulations/FEMA framework नुसार ठरते. Drawback claim केलेला असला तरी export proceeds realisation बाबत FEMA provisions महत्त्वाचे आहेत.", "golden": "Export Proceeds Realisation → FEMA"}, {"no": 41, "q": "Q41. In case of goods entered for home consumption, except for baggage and goods imported by post, and Bill of Entry has been presented before the date of entry inwards, what will be the date for determination of rate of duty?", "options": [{"letter": "A", "text": "Date of entry inwards"}, {"letter": "B", "text": "Date of filing of Bill of Entry"}, {"letter": "C", "text": "Date as opted or requested by the importer or authorised representative"}, {"letter": "D", "text": "Date of Bill of Lading"}], "answer": "A", "answer_text": "Date of Entry Inwards", "explanation": "Vessel import मध्ये Bill of Entry आधी file केला असला तरी, जर तो Entry Inwards पूर्वी file केला असेल, तर rate of duty साठी: 👉 Date of Entry Inwards consider केली जाते.", "golden": "BOE before Entry Inwards → Rate of Duty = Entry Inwards Date"}, {"no": 42, "q": "Q42. Under SWIFT, currently, which PGAs have connected their own systems with online message exchange mode?", "options": [{"letter": "A", "text": "FSSAI and PQ"}, {"letter": "B", "text": "AQCS"}, {"letter": "C", "text": "Both A and B"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Both A and B", "explanation": "SWIFT (Single Window Interface for Facilitating Trade) अंतर्गत अनेक Participating Government Agencies चे systems Customs सोबत integrate केले आहेत. Paper मध्ये: FSSAI PQ AQCS यांचा उल्लेख आहे. म्हणून Both A and B.", "golden": "SWIFT → FSSAI + PQ + AQCS"}, {"no": 43, "q": "Q43. What is E-Sanchit?", "options": [{"letter": "A", "text": "Facility for registration of Shipping Bill"}, {"letter": "B", "text": "Facility for registration of Bill of Entry"}, {"letter": "C", "text": "Facility by DGFT for Import Authorisation"}, {"letter": "D", "text": "Facility for uploading supporting documents by authorised person on ICEGATE"}], "answer": "D", "answer_text": "", "explanation": "e-Sanchit हे Customs चे electronic document storage/upload facility आहे. Importer/exporter किंवा authorised person supporting documents online upload करू शकतो. उदा.: Invoice Packing List Certificates Authorisations", "golden": "e-Sanchit → Supporting Documents → Online Upload → ICEGATE"}, {"no": 44, "q": "Q44. As per Postal Export (Electronic Declaration and Processing) Regulations, 2022, for export of goods by post the exporter/authorised agent shall make an entry through an electronic declaration in the forms:", "options": [{"letter": "A", "text": "Only (i)"}, {"letter": "B", "text": "Only (iii)"}, {"letter": "C", "text": "(i) & (ii)"}, {"letter": "D", "text": "None of them"}], "answer": "C", "answer_text": "(i) & (ii)", "explanation": "Postal Export Regulations, 2022 नुसार electronic declarations साठी: ✔️ PBE-III → e-commerce exports ✔️ PBE-IV → other postal exports वापरले जातात. Postal Shipping Bill या regulations अंतर्गत prescribed नाही.", "golden": "Postal Export → PBE-III + PBE-IV"}, {"no": 45, "q": "Q45. As per Controlled Delivery (Customs) Regulations, 2022, “goods” does not include—", "options": [{"letter": "A", "text": "Narcotic drugs"}, {"letter": "B", "text": "Currency and negotiable instruments including counterfeits"}, {"letter": "C", "text": "Cigarettes"}, {"letter": "D", "text": "Gold in only bullion form"}], "answer": "D", "answer_text": "Gold in only bullion form", "explanation": "Controlled Delivery Regulations मध्ये “goods” मध्ये अनेक sensitive items येतात. Paper मध्ये gold in only bullion form हा definition मधून excluded आहे.", "golden": "Controlled Delivery → Gold only in bullion form = Excluded"}, {"no": 46, "q": "Q46. What is the normal time limit under the Customs Act for completion of inquiry or investigation resulting in SCN under Sections 28(1) and 28(4), from date of audit initiation?", "options": [{"letter": "A", "text": "Within five years"}, {"letter": "B", "text": "Within one year"}, {"letter": "C", "text": "No limit"}, {"letter": "D", "text": "Within two years"}], "answer": "D", "answer_text": "Within two years", "explanation": "Paper मध्ये Section 28BB संदर्भात audit नंतर inquiry/investigation आणि SCN action पूर्ण करण्यासाठी normal timeline: 👉 2 years from date of audit initiation दिलेली आहे.", "golden": "Audit Initiation → Inquiry/Investigation + SCN → 2 Years Q47–50"}, {"no": 47, "q": "Q47. As per Postal Export Regulations, 2022, which of the following is correct?", "options": [{"letter": "A", "text": "Customs Department shall set up, operate and maintain the PBE Automated System for filing electronic declaration for export of goods through post."}, {"letter": "B", "text": "An exporter who wishes to export goods through post or his authorised agent shall register himself on the PBE Automated System."}, {"letter": "C", "text": "Both A and B"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "", "explanation": "Exporter किंवा authorised agent ला postal export साठी PBE Automated System वर registration करणे आवश्यक आहे. Paper answer मध्ये B आहे.", "golden": "Postal Export → Exporter/Agent → PBE Automated System Registration"}, {"no": 48, "q": "Q48. Arrest in respect of an offence punishable under the Customs Act, 1962 should be effected only in cases which may include—", "options": [{"letter": "A", "text": "Unauthorised importation in baggage where market value exceeds ₹50,00,000"}, {"letter": "B", "text": "Fraudulent evasion of duty involving ₹2 crore or more"}, {"letter": "C", "text": "Both A and B"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Both A and B", "explanation": "Section 104 अंतर्गत arrest power serious offences मध्ये वापरली जाते. Paper मध्ये दोन examples दिले आहेत: ✔️ Unauthorised baggage import where value exceeds ₹50 lakh ✔️ Fraudulent duty evasion involving ₹2 crore or more म्हणून Both A and B.", "golden": "Arrest → Serious Customs Offence → ₹50L / ₹2Cr thresholds"}, {"no": 49, "q": "Q49. No penalty shall be levied if the amount of duty along with applicable interest has been paid by the noticee where there was no collusion or wilful misstatement/suppression of facts, within ___ after issuance of Show Cause Notice.", "options": [{"letter": "A", "text": "45 days"}, {"letter": "B", "text": "15 days"}, {"letter": "C", "text": "30 days"}, {"letter": "D", "text": "60 days"}], "answer": "C", "answer_text": "30 days", "explanation": "जर: Duty + applicable interest भरले ✔️ Collusion नाही ✔️ Wilful misstatement/suppression नाही ✔️ SCN नंतर 30 days मध्ये payment केले ✔️ तर paper नुसार penalty लागू होत नाही.", "golden": "SCN + Duty & Interest Payment → 30 Days → No Penalty"}, {"no": 50, "q": "Q50. As per Section 2(43) of the Customs Act, 1962, “warehouse” means—", "options": [{"letter": "A", "text": "Any warehouse licensed under Section 57"}, {"letter": "B", "text": "Any warehouse licensed under Section 58"}, {"letter": "C", "text": "Any warehouse licensed under Section 58A"}, {"letter": "D", "text": "All of these"}], "answer": "D", "answer_text": "All of these", "explanation": "Customs Act मध्ये “warehouse” definition मध्ये: ✔️ Public warehouse — Section 57 ✔️ Private warehouse — Section 58 ✔️ Special warehouse — Section 58A यांचा समावेश आहे.", "golden": "Warehouse → Sec.57 + Sec.58 + Sec.58A Q51–55"}, {"no": 51, "q": "Q51. Any goods seized under Section 110 of the Customs Act, 1962, may pending the order of the adjudicating authority, be released provisionally to the owner under Section—", "options": [{"letter": "A", "text": "110"}, {"letter": "B", "text": "110A"}, {"letter": "C", "text": "110AA"}, {"letter": "D", "text": "125"}], "answer": "B", "answer_text": "Section 110A", "explanation": "Seized goods adjudication पूर्ण होण्यापूर्वी prescribed conditions subject to provisional release करता येतात. त्यासाठी: 👉 Section 110A लागू होतो.", "golden": "Provisional Release of Seized Goods → Sec.110A"}, {"no": 52, "q": "Q52. Who can be an AEO in CBIC’s AEO programme subject to criteria?", "options": [{"letter": "A", "text": "Importer / Exporter"}, {"letter": "B", "text": "Logistics provider"}, {"letter": "C", "text": "Customs Broker"}, {"letter": "D", "text": "All of the above"}], "answer": "D", "answer_text": "All of the above", "explanation": "CBIC च्या AEO programme मध्ये eligible entities मध्ये: ✔️ Importers ✔️ Exporters ✔️ Logistics providers ✔️ Custodians/terminal operators ✔️ Customs Brokers यांचा समावेश होऊ शकतो.", "golden": "AEO → Importer + Exporter + Logistics + Customs Broker"}, {"no": 53, "q": "Q53. For any re-assessment done by the Faceless Assessment Group, which is at variance with the self-assessment done by the importer and where the importer does not confirm his acceptance of the said re-assessment electronically, a speaking order on the re-assessment will be passed by the—", "options": [{"letter": "A", "text": "Turant Suvidha Kendra"}, {"letter": "B", "text": "Investigating Agency"}, {"letter": "C", "text": "Port Assessment Group"}, {"letter": "D", "text": "Faceless Assessment Group"}], "answer": "D", "answer_text": "Faceless Assessment Group", "explanation": "FAG ने importer च्या self-assessment पेक्षा वेगळे re-assessment केले आणि importer ने electronic acceptance दिले नाही तर speaking order द्यावा लागतो. तो: 👉 Faceless Assessment Group (FAG) द्वारे pass केला जातो.", "golden": "FAG Re-assessment + No Electronic Acceptance → Speaking Order by FAG"}, {"no": 54, "q": "Q54. A project would fall under the category of “substantial expansion” if the installed capacity of the unit is increased by not less than ___, as per the Project Import Regulations, 1986.", "options": [{"letter": "A", "text": "15%"}, {"letter": "B", "text": "20%"}, {"letter": "C", "text": "25%"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "25%", "explanation": "Project Import Regulations, 1986 नुसार installed capacity मध्ये: 👉 Not less than 25% increase झाल्यास project ला substantial expansion category मध्ये ठेवले जाते.", "golden": "Substantial Expansion → Capacity Increase ≥ 25%"}, {"no": 55, "q": "Q55. If assessment is done provisionally by FAG—", "options": [{"letter": "A", "text": "The sioner/Commissioner under IPR Rules, 2007, the import of allegedly infringing goods into India shall be deemed—", "options": [{"letter": "A", "text": "As Restricted"}, {"letter": "B", "text": "As Prohibited"}, {"letter": "C", "text": "As Specified"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "As Prohibited", "explanation": "IPR Rules अंतर्गत right holder च्या notice ची registration झाल्यावर alleged infringing goods चा import: 👉 Prohibited म्हणून Customs clearance suspend/confiscation action घेऊ शकते.", "golden": "IPR Notice Registered → Infringing Import = Prohibited"}, {"no": 64, "q": "Q64. Which statements are correct in respect of CAROTAR 2020?", "options": [{"letter": "A", "text": "Statement I & III correct, II incorrect"}, {"letter": "B", "text": "Statement II & III correct, I incorrect"}, {"letter": "C", "text": "Statement I & II correct, III incorrect"}, {"letter": "D", "text": "All statements correct"}], "answer": "C", "answer_text": "Statement I & II correct, III incorrect", "explanation": "CAROTAR 2020 अंतर्गत preferential tariff claim बाबत काही परिस्थितीत claim deny केला जाऊ शकतो. I आणि II valid circumstances आहेत. फक्त verification ला जास्त वेळ लागेल म्हणून preferential claim reject करणे योग्य ground नाही.", "golden": "CAROTAR → Origin Criteria + Supporting Documents"}, {"no": 65, "q": "Q65. CAROTAR Rules, 2020 are applicable to—", "options": [{"letter": "A", "text": "All goods intended to be exported from India"}, {"letter": "B", "text": "All imports of goods into India"}, {"letter": "C", "text": "Import of all goods into India where preferential rate of duty in terms of a trade agreement is claimed"}, {"letter": "D", "text": "All imports where notification gives less effective rate of duty"}], "answer": "C", "answer_text": "", "explanation": "CAROTAR = Customs (Administration of Rules of Origin under Trade Agreements) Rules, 2020. हे rules तेव्हा लागू होतात जेव्हा importer Trade Agreement अंतर्गत preferential rate of house Sec.58A → Specified sensitive/high-value goods"}, {"no": 78, "q": "Q78. According to the “Handling of Cargo in Customs Areas Regulations, 2009”, adequate manpower for loading, unloading, stacking, handling, shifting, etc. and de-stuffing of containers at customs area shall be provided by—", "options": [{"letter": "A", "text": "Customs Cargo Services Provider"}, {"letter": "B", "text": "Freight Forwarder"}, {"letter": "C", "text": "Customs Broker"}, {"letter": "D", "text": "Importer/Exporter"}], "answer": "A", "answer_text": "Customs Cargo Services Provider", "explanation": "CCSP (Customs Cargo Services Provider) ची responsibility आहे की Customs area मध्ये cargo handling साठी adequate manpower आणि facilities उपलब्ध करून द्याव्यात. यात: Loading Unloading Stacking Handling Shifting De-stuffing यांचा समावेश आहे.", "golden": "Cargo Handling → CCSP Responsibility"}, {"no": 79, "q": "Q79. Remission of duty is not permitted on which of the following warehoused goods lost due to natural causes under Section 70?", "options": [{"letter": "A", "text": "Ethylene dichloride kept in tanks"}, {"letter": "B", "text": "Beer kept in glass containers"}, {"letter": "C", "text": "Wine kept in casks"}, {"letter": "D", "text": "Liquid helium gas kept in containers"}], "answer": "B", "answer_text": "Beer kept in glass containers", "explanation": "Section 70 मध्ये natural loss साठी remission उपलब्ध असू शकते. परंतु loss जर avoidable/handling-related breakage मुळे होत असेल तर remission मिळत नाही. Glass containers मध्ये beer असल्यामुळे breakage हा natural loss म्हणून स्वीकारला जात नाही, paper explanation नुसार.", "golden": "Section 70 → Natural Loss Remission; Avoidable Breakage → No Remission"}, {"no": 80, "q": "Q80. As per Customs (Electronic Cash Ledger) Regulations, 2022, the deposit challan generated for making a deposit into the electronic cash ledger shall be valid for—", "options": [{"letter": "A", "text": "7 days"}, {"letter": "B", "text": "10 days"}, {"letter": "C", "text": "15 days"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "15 Days", "explanation": "Electronic Cash Ledger मध्ये deposit करण्यासाठी generate केलेला FORM ECL-2 challan: 👉 15 days valid असतो. 15 दिवसांत payment/deposit पूर्ण न झाल्यास नवीन challan generate करावा लागतो.", "golden": "ECL-2 Challan → Validity = 15 Days"}, {"no": 81, "q": "Q81. Which of the following statements is “Correct” while calculating the time prescribed for filing appeal against an order under the Customs Act, 1962?", "options": [{"letter": "A", "text": "Time for obtaining the certified copy may be excluded"}, {"letter": "B", "text": "Appeal can be filed on next working day if the last day is a holiday"}, {"letter": "C", "text": "If appeal is sent by Registered Post, date of actual receipt of appeal at appellate authority will be considered"}, {"letter": "D", "text": "All of the above"}], "answer": "D", "answer_text": "All of the above", "explanation": "Appeal limitation calculate करताना paper नुसार: Certified copy मिळवण्यासाठी लागलेला time exclude होऊ शकतो ✔️ Last day holiday असेल तर next working day ला appeal करता येते ✔️ Registered Post ने appeal पाठविल्यास receipt date consider केली जाते ✔️ म्हणून D — All.", "golden": "Appeal Time Calculation → Certified Copy + Holiday + Registered Post"}, {"no": 82, "q": "Q82. The rate of duty applicable to imported goods cleared from a warehouse is the rate in force on the date of—", "options": [{"letter": "A", "text": "Filing of Ex-Bond Bill of Entry"}, {"letter": "B", "text": "Filing of Home Consumption Bill of Entry"}, {"letter": "C", "text": "Date of clearance of goods for warehousing"}, {"letter": "D", "text": "Filing of Warehouse Bill of Entry"}], "answer": "A", "answer_text": "Filing of Ex-Bond Bill of Entry", "explanation": "Warehoused goods home consumption साठी clear करताना applicable rate: 👉 Ex-Bond Bill of Entry file करण्याच्या दिवशीचा rate घेतला जातो.", "golden": "Warehouse Goods → Duty Rate = Ex-Bond BOE Date"}, {"no": 83, "q": "Q83. In Customs Act, 1962 the term “goods” does not include—", "options": [{"letter": "A", "text": "Currency"}, {"letter": "B", "text": "Stores"}, {"letter": "C", "text": "Immovable Property"}, {"letter": "D", "text": "Vessels"}], "answer": "C", "answer_text": "Immovable Property", "explanation": "Customs Act मधील “goods” मध्ये: ✔️ Vessels ✔️ Stores ✔️ Currency ✔️ Negotiable instruments इत्यादी यांचा समावेश होतो. परंतु: ❌ Immovable Property goods मध्ये येत नाही.", "golden": "Goods → Movable items; Immovable Property = Not Goods"}, {"no": 84, "q": "Q84. “Deemed Exports” for the purpose of FTP refer to transactions in which goods supplied are—", "options": [{"letter": "A", "text": "Only I is true"}, {"letter": "B", "text": "Only II is true"}, {"letter": "C", "text": "Both I & II are true"}, {"letter": "D", "text": "Neither I nor II is true"}], "answer": "A", "answer_text": "Only I is true", "explanation": "Deemed Export मध्ये goods: 👉 India मध्ये manufactured होतात आणि India बाहेर जात नाहीत. Payment फक्त foreign exchange मध्येच असणे compulsory नाही. म्हणून: ✔️ Statement I = True ❌ Statement II = False", "golden": "Deemed Export → Goods do NOT leave India Q85–90"}, {"no": 85, "q": "Q85. What is the maximum rate of drawback allowable on re-export of duty-paid goods?", "options": [{"letter": "A", "text": "95% of duty amount"}, {"letter": "B", "text": "100% of duty amount"}, {"letter": "C", "text": "98% of duty amount"}, {"letter": "D", "text": "90% of duty amount"}], "answer": "C", "answer_text": "98%", "explanation": "Customs Act Section 74 अंतर्गत duty-paid imported goods re-export केल्यास maximum drawback: 👉 98% of customs duty paid असू शकतो, subject to prescribed conditions.", "golden": "Section 74 → Re-export of Duty-Paid Goods → 98% Drawback"}, {"no": 86, "q": "Q86. On 01.01.2023, the Foreign Trade Policy (FTP) which was in force was—", "options": [{"letter": "A", "text": "2020–2025"}, {"letter": "B", "text": "2020–2022"}, {"letter": "C", "text": "2015–2020"}, {"letter": "D", "text": "2021–2023"}], "answer": "C", "answer_text": "2015–2020", "explanation": "नवीन FTP 2023 01.04.2023 पासून लागू झाली. म्हणून 01.01.2023 रोजी extensions मुळे operative policy: 👉 FTP 2015–2020 होती.", "golden": "01-01-2023 → FTP 2015–20"}, {"no": 87, "q": "Q87. As per Customs Audit Regulations, 2018, the Proper Officer with previous approval of Principal Commissioner/Commissioner may do audit with assistance of—", "options": [{"letter": "A", "text": "Chartered Accountant"}, {"letter": "B", "text": "Cost Accountant"}, {"letter": "C", "text": "Expert in computer sciences"}, {"letter": "D", "text": "All of the above"}], "answer": "D", "answer_text": "All of the above", "explanation": "Customs audit complex असल्यास Proper Officer खालील experts ची assistance घेऊ शकतो: ✔️ Chartered Accountant ✔️ Cost Accountant ✔️ Computer Science Expert म्हणून D.", "golden": "Customs Audit → CA + Cost Accountant + Computer Expert"}, {"no": 88, "q": "Q88. Under the Anonymized Escalation Mechanism (AEM), importer/Customs Broker can register requirement for expeditious clearance of Bill of Entry delayed for more than—", "options": [{"letter": "A", "text": "1 working day"}, {"letter": "B", "text": "2 working days"}, {"letter": "C", "text": "36 hours"}, {"letter": "D", "text": "3 days"}], "answer": "A", "answer_text": "1 working day", "explanation": "AEM म्हणजे Anonymized Escalation Mechanism. Bill of Entry clearance मध्ये delay: 👉 More than 1 working day झाल्यास importer/Customs Broker AEM द्वारे escalation करू शकतो.", "golden": "AEM → BOE Delay > 1 Working Day"}, {"no": 89, "q": "Q89. Proceeds of confiscated goods sold by public auction/tender shall be applied in which order?", "options": [{"letter": "A", "text": "Custodian charges → Customs Duty → Freight"}, {"letter": "B", "text": "Expenses of sale → Freight charges → Customs Duty"}, {"letter": "C", "text": "Customs Duty → Freight → Custodian charges"}, {"letter": "D", "text": "Freight → Custodian charges → Expenses of sale"}], "answer": "B", "answer_text": "", "explanation": "Section 150 नुसार sale proceeds चा क्रम: 1️⃣ Expenses of sale 2️⃣ Freight charges 3️⃣ Customs Duty यानंतर balance amount owner ला prescribed manner मध्ये दिला जातो.", "golden": "Sec.150 → Sale Expenses → Freight → Customs Duty"}, {"no": 90, "q": "Q90. Under Warehoused Goods (Removal) Regulations, 2016, warehoused goods removed for export shall be transported under one-time lock affixed by—", "options": [{"letter": "A", "text": "Proper Officer"}, {"letter": "B", "text": "Licensee"}, {"letter": "C", "text": "Bond Officer"}, {"letter": "D", "text": "Any one of the above"}], "answer": "D", "answer_text": "Any one of the above", "explanation": "One-time lock खालीलपैकी कोणाकडून affix होऊ शकतो: ✔️ Proper Officer ✔️ Licensee ✔️ Bond Officer म्हणून D.", "golden": "Export Warehoused Goods → One-Time Lock → Any of 3 Q91–95"}, {"no": 91, "q": "Q91. The importer shall not be liable to pay duty leviable on pilfered imported goods if the goods are—", "options": [{"letter": "A", "text": "Pilfered after unloading and restored to importer after pilferage"}, {"letter": "B", "text": "Pilfered after unloading, but before the order of clearance made by proper officer"}, {"letter": "C", "text": "Pilfered after the order of clearance made by proper officer"}, {"letter": "D", "text": "All of the above"}], "answer": "B", "answer_text": "", "explanation": "Customs Act Section 13 नुसार goods: 👉 Unloading नंतर पण proper officer ने clearance order देण्यापूर्वी pilfered झाले तर importer त्या goods वर duty साठी liable नसतो. पण clearance order झाल्यानंतर pilferage झाल्यास duty liability राहते.", "golden": "Pilferage → After Unloading + Before Clearance Order → No Importer Duty"}, {"no": 92, "q": "Q92. Which of the following is NOT correct? An importer can relinquish title of imported goods and not be liable to pay duty—", "options": [{"letter": "A", "text": "After an order for clearance of goods for home consumption is made"}, {"letter": "B", "text": "Before clearance order for home consumption"}, {"letter": "C", "text": "Before an order permitting deposit of goods for warehousing is made"}, {"letter": "D", "text": "Where no offence is committed under Customs Act, 1962"}], "answer": "A", "answer_text": "", "explanation": "Section 23 नुसार importer title relinquish करू शकतो clearance order होण्यापूर्वी. Clearance order झाल्यानंतर: ❌ Relinquishment करता येत नाही. म्हणून A चुकीचे statement आहे.", "golden": "Relinquishment → Before Clearance Order"}, {"no": 93, "q": "Q93. Which officers are empowered and required to assist Customs officers in execution of Customs Act?", "options": [{"letter": "A", "text": "Officers of Police"}, {"letter": "B", "text": "Officers of Navy"}, {"letter": "C", "text": "State Government officers employed at ports/airports"}, {"letter": "D", "text": "All of the above"}], "answer": "D", "answer_text": "All of the above", "explanation": "Section 151 अंतर्गत Customs officers ना execution मध्ये assistance देणे आवश्यक आहे. त्यामध्ये: ✔️ Police ✔️ Navy ✔️ State Government officers at ports/airports यांचा समावेश होतो.", "golden": "Sec.151 → Police + Navy + State Govt Officers"}, {"no": 94, "q": "Q94. In respect of cancellation of warehouse licence under Section 58B, which statement is NOT correct?", "options": [{"letter": "A", "text": "During suspension, no goods shall be deposited"}, {"letter": "B", "text": "Warehoused goods shall be removed within 15 days from cancellation order"}, {"letter": "C", "text": "Principal Commissioner/Commissioner may cancel licence under Sections 57/58/58A"}, {"letter": "D", "text": "Licensee shall not be given opportunity of being heard"}], "answer": "B", "answer_text": "", "explanation": "तुमच्या PDF मध्ये B answer म्हणून दिलेला आहे. त्याच explanation मध्ये cancellation नंतर goods removal period बाबत 7 days असा उल्लेख आहे; त्यामुळे 15 days statement चुकीचे मानले आहे. ⚠️ Important: या प्रश्नाच्या PDF explanation मध्ये D बाबतही hearing ची विसंगती दिसते. त्यामुळे exam preparation साठी paper-marked answer = B लक्षात ठेवा.", "golden": "Warehouse Cancellation → Paper Answer = B"}, {"no": 95, "q": "Q95. Which of the following is true with regard to amendment of a Shipping Bill after export goods have been exported?", "options": [{"letter": "A", "text": "No amendment allowed"}, {"letter": "B", "text": "Amendment may be allowed on basis of documentary evidence which was in existence at the time goods were exported"}, {"letter": "C", "text": "Amendment may be allowed on basis of documents created after export"}, {"letter": "D", "text": "Amendment may be allowed without documentary evidence"}], "answer": "B", "answer_text": "", "explanation": "Customs Act Section 149 नुसार export झाल्यानंतर Shipping Bill amendment करण्यासाठी: 👉 Goods export होताना अस्तित्वात असलेला documentary evidence आवश्यक आहे. नंतर तयार झालेला नवीन evidence वापरून सामान्यतः amendment करता येत नाही.", "golden": "Post-Export Amendment → Existing-at-time-of-export Document Q96–100"}, {"no": 96, "q": "Q96. The six-digit level commodity/product code provided by the Harmonized System (HS) is called—", "options": [{"letter": "A", "text": "Heading"}, {"letter": "B", "text": "Tariff Item"}, {"letter": "C", "text": "Sub-heading"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Sub-heading", "explanation": "HS structure: 2 digits → Chapter 4 digits → Heading 6 digits → Sub-heading म्हणून: 👉 6-digit = Sub-heading", "golden": "2 → Chapter | 4 → Heading | 6 → Sub-heading"}, {"no": 97, "q": "Q97. Import of dogs for breeding or commercial purposes is—", "options": [{"letter": "A", "text": "Permitted with DGFT authorisation"}, {"letter": "B", "text": "Permitted without DGFT authorisation"}, {"letter": "C", "text": "Not permitted"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Not permitted", "explanation": "Paper नुसार dogs चा import breeding/commercial purposes साठी prohibited आहे. Pets/research/security इत्यादी specified purposes साठी वेगळे rules लागू होतात.", "golden": "Dogs → Breeding/Commercial Import = Not Permitted"}, {"no": 98, "q": "Q98. Safeguard measures shall, unless revoked earlier or extended further, cease to have effect on expiry of—", "options": [{"letter": "A", "text": "After one year"}, {"letter": "B", "text": "Four years from date of imposition"}, {"letter": "C", "text": "Initial period of five years"}, {"letter": "D", "text": "More than ten years"}], "answer": "B", "answer_text": "Four years", "explanation": "Customs Tariff Act Section 8B अंतर्गत safeguard measures चा normal initial period: 👉 4 years असतो, subject to extension provisions.", "golden": "Safeguard Measure → 4 Years"}, {"no": 99, "q": "Q99. The provisions of Chapter IX (Warehousing) of Customs Act shall not apply to imported dutiable goods permitted to be stored in a public warehouse under—", "options": [{"letter": "A", "text": "Section 59"}, {"letter": "B", "text": "Section 58"}, {"letter": "C", "text": "Section 49"}, {"letter": "D", "text": "Section 57"}], "answer": "C", "answer_text": "Section 49", "explanation": "Section 49 अंतर्गत imported dutiable goods काही परिस्थितीत public warehouse मध्ये temporary storage साठी ठेवता येतात. ही storage Chapter IX मधील normal warehousing पेक्षा वेगळी आहे. म्हणून: 👉 Section 49", "golden": "Temporary Storage in Public Warehouse → Section 49"}, {"no": 100, "q": "Q100. Under Warehouse (Custody and Handling of Goods) Regulations, any discrepancy in quantity of goods received at warehouse from a customs station shall be reported to the bond officer—", "options": [{"letter": "A", "text": "Within 24 hours"}, {"letter": "B", "text": "Immediately"}, {"letter": "C", "text": "Within 12 hours"}, {"letter": "D", "text": "Within 48 hours"}], "answer": "A", "answer_text": "Within 24 hours", "explanation": "Warehouse मध्ये customs station वरून goods receive झाल्यावर quantity मध्ये discrepancy आढळल्यास: 👉 Bond Officer ला 24 hours मध्ये report करायची आहे.", "golden": "Warehouse Quantity Discrepancy → 24 Hours"}, {"no": 101, "q": "Q101. Transport voucher for the transport, within a village, town or city, of any specified goods is not required if the market value of the goods on the date of transport does not exceed—", "options": [{"letter": "A", "text": "₹10,000"}, {"letter": "B", "text": "₹5,000"}, {"letter": "C", "text": "₹6,000"}, {"letter": "D", "text": "₹1,000"}], "answer": "D", "answer_text": "₹1,000", "explanation": "Specified goods village/town/city मध्ये transport करताना transport voucher ची requirement आहे. परंतु goods ची market value ₹1,000 पेक्षा जास्त नसल्यास transport voucher आवश्यक नाही.", "golden": "Transport Voucher → Exemption up to ₹1,000"}, {"no": 102, "q": "Q102. Which of the following is correct with respect to provisional release of goods?", "options": [{"letter": "A", "text": "It is Provisional Assessment"}, {"letter": "B", "text": "It is done under Section 18 of Customs Act, 1962"}, {"letter": "C", "text": "Both A & B"}, {"letter": "D", "text": "None of the above"}], "answer": "D", "answer_text": "None of the above", "explanation": "हा एक खूप important trap question आहे. Provisional Assessment → Section 18 पण Provisional Release of seized goods → Section 110A. म्हणून A आणि B दोन्ही चुकीचे.", "golden": "Sec.18 = Provisional Assessment Sec.110A = Provisional Release"}, {"no": 103, "q": "Q103. Where the buyer and seller are related, the transaction value—", "options": [{"letter": "A", "text": "Shall be accepted on undertaking that importer will not import such goods again"}, {"letter": "B", "text": "Shall not be accepted even if relationship did not influence price"}, {"letter": "C", "text": "Shall be accepted on undertaking from supplier that they will not supply such goods to anybody"}, {"letter": "D", "text": "Shall be accepted provided examination of circumstances of sale indicates that relationship did not influence the price"}], "answer": "D", "answer_text": "", "explanation": "Buyer आणि seller related असले तरी transaction value automatically reject होत नाही. जर Customs ने sale circumstances तपासून relationship मुळे price प्रभावित झालेला नाही असे satisfy झाले, तर transaction value accept करता येते.", "golden": "Related Buyer/Seller ≠ Automatic Rejection Relationship did not influence price → Transaction Value accepted"}, {"no": 104, "q": "Q104. Consider the following statements for valuation rules for import goods, in case of identical or similar goods:", "options": [{"letter": "A", "text": "(ii) and (iii)"}, {"letter": "B", "text": "(i) and (iii)"}, {"letter": "C", "text": "(i) and (ii)"}, {"letter": "D", "text": "(i), (ii) and (iii)"}], "answer": "D", "answer_text": "All three", "explanation": "Identical/Similar goods valuation करताना: ✔️ Same country of production ✔️ Same manufacturer/producer ✔️ Same goods उपलब्ध नसतील तर different manufacturer/producer consider केले जाऊ शकतात.", "golden": "Identical/Similar Goods → Same Country + Same Manufacturer preferred + Other Manufacturer if needed Q105–Q110"}, {"no": 105, "q": "Q105. The deemed date of filing of drawback claim by the exporter for exports by post shall be—", "options": [{"letter": "A", "text": "Date of receipt of drawback claim form by proper officer from postal authorities"}, {"letter": "B", "text": "Date of delivering to competent Postal Authority, along with parcel/package, a claim in prescribed form"}, {"letter": "C", "text": "15 days from date of export"}, {"letter": "D", "text": "Date of issuance of deficiency memo"}], "answer": "A", "answer_text": "", "explanation": "Postal export मध्ये drawback claim ची deemed filing date म्हणजे: 👉 Proper officer ला postal authorities कडून claim form प्राप्त झाल्याची date.", "golden": "Postal Drawback → Deemed Filing Date = Receipt by Proper Officer"}, {"no": 106, "q": "Q106. Which statement is NOT correct under Intellectual Property Rights (Imported Goods) Enforcement Rules, 2007?", "options": [{"letter": "A", "text": "Copyright as defined in Copyright Act, 1957"}, {"letter": "B", "text": "Patents as defined in Patents Act, 1970"}, {"letter": "C", "text": "Design as defined in Designs Act, 2000"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "Patents", "explanation": "तुमच्या paper मध्ये B answer दिलेला आहे आणि explanation मध्येही Patents as per Patents Act, 1970 हे incorrect statement म्हणून दाखवले आहे. ⚠️ Exam Note: हा प्रश्न source-paper च्या marked answer प्रमाणेच लक्षात ठेवा.", "golden": "Q106 → Paper Answer = B"}, {"no": 107, "q": "Q107. The penalty imposed under Section 114A of Customs Act, 1962 shall be reduced to ____ of the duty or interest determined if the duty and interest payable thereon is paid within ____.", "options": [{"letter": "A", "text": "25% and 45 days"}, {"letter": "B", "text": "15% and 30 days"}, {"letter": "C", "text": "25% and 30 days"}, {"letter": "D", "text": "15% and 15 days"}], "answer": "C", "answer_text": "25% and 30 days", "explanation": "Section 114A अंतर्गत duty/interest demand झाल्यानंतर prescribed conditions मध्ये: 👉 Duty + Interest 30 days मध्ये भरल्यास 👉 Penalty 25% पर्यंत reduced होते.", "golden": "Sec.114A → 30 Days → 25% Penalty"}, {"no": 108, "q": "Q108. If the Bill of Entry is not filed within the prescribed time and proper officer finds no sufficient cause for delay, importer shall be liable to pay late presentation charges at the rate of ____ for initial three days and ____ thereafter.", "options": [{"letter": "A", "text": "₹5,000/day and ₹10,000/day"}, {"letter": "B", "text": "₹4,000/day and ₹10,000/day"}, {"letter": "C", "text": "₹2,000/day and ₹5,000/day"}, {"letter": "D", "text": "₹3,000/day and ₹6,000/day"}], "answer": "A", "answer_text": "", "explanation": "Late Bill of Entry filing साठी: Initial 3 days → ₹5,000 per day Thereafter → ₹10,000 per day", "golden": "Late BOE → First 3 Days ₹5,000/day → Thereafter ₹10,000/day"}, {"no": 109, "q": "Q109. Intellectual Property Rights (Imported Goods) Enforcement Rules, 2007 are NOT applicable on—", "options": [{"letter": "A", "text": "Goods of commercial nature contained in personal baggage"}, {"letter": "B", "text": "Goods sent in small consignments intended for personal use of importer"}, {"letter": "C", "text": "Both A and B"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "", "explanation": "IPR Enforcement Rules चा उद्देश commercial-scale counterfeit/pirated goods रोखणे आहे. Small consignments intended for personal use यांना हे rules लागू होत नाहीत.", "golden": "IPR Rules → Small Consignments for Personal Use = Not Applicable"}, {"no": 110, "q": "Q110. In case of sale of goods by a SEZ unit in domestic tariff area, DTA unit shall be required to file—", "options": [{"letter": "A", "text": "Bill of Entry for warehousing"}, {"letter": "B", "text": "Shipping Bill"}, {"letter": "C", "text": "Bill of Export"}, {"letter": "D", "text": "Bill of Entry for home consumption"}], "answer": "D", "answer_text": "Bill of Entry for Home Consumption", "explanation": "SEZ unit ने DTA unit ला goods विकले तर DTA buyer च्या दृष्टीने ते import मानले जाते. त्यामुळे DTA unit ने: 👉 Bill of Entry for Home Consumption file करायचा.", "golden": "SEZ → DTA Sale → Bill of Entry for Home Consumption Q111–Q115"}, {"no": 111, "q": "Q111. Who among the following can specify the limits of the Customs Area?", "options": [{"letter": "A", "text": "Jurisdictional Additional Commissioner"}, {"letter": "B", "text": "Central Board of Indirect Taxes and Customs"}, {"letter": "C", "text": "Jurisdictional Pr. Chief Commissioner/Chief Commissioner"}, {"letter": "D", "text": "Jurisdictional Pr. Commissioner/Commissioner of Customs"}], "answer": "D", "answer_text": "", "explanation": "Customs Act Section 8 नुसार Customs area ची limits specify करण्याची power: 👉 Principal Commissioner / Commissioner of Customs यांच्याकडे आहे.", "golden": "Sec.8 → Customs Area → Pr. Commissioner/Commissioner"}, {"no": 112, "q": "Q112. Every aircraft operator shall transfer Passenger Name Record information to designated Customs systems not later than ___ before departure time under PNR Information Regulations, 2022.", "options": [{"letter": "A", "text": "48 hours"}, {"letter": "B", "text": "24 hours"}, {"letter": "C", "text": "12 hours"}, {"letter": "D", "text": "36 hours"}], "answer": "B", "answer_text": "24 hours", "explanation": "Aircraft operator ने passenger PNR information Customs system ला: 👉 Departure च्या किमान 24 hours आधी transmit करायची आहे.", "golden": "PNR → 24 Hours before Departure"}, {"no": 113, "q": "Q113. Remission of duty on lost goods, otherwise than as a result of pilferage, any time before clearance for home consumption can be granted by—", "options": [{"letter": "A", "text": "Additional Commissioner of Customs"}, {"letter": "B", "text": "Joint Commissioner of Customs"}, {"letter": "C", "text": "Deputy/Assistant Commissioner of Customs"}, {"letter": "D", "text": "Principal Commissioner of Customs"}], "answer": "C", "answer_text": "Deputy/Assistant Commissioner", "explanation": "Section 23 अंतर्गत goods lost/destroyed झाल्यास remission of duty मिळू शकते. Prescribed authority: 👉 Deputy Commissioner / Assistant Commissioner", "golden": "Sec.23 → Lost/Damaged Goods → AC/DC can grant remission"}, {"no": 114, "q": "Q114. The monitoring of utilization of goods imported or procured from the Domestic Tariff Area by the Developer in a SEZ shall be done by—", "options": [{"letter": "A", "text": "Specified Officer"}, {"letter": "B", "text": "Development Commissioner"}, {"letter": "C", "text": "Approval Committee"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Approval Committee", "explanation": "SEZ मध्ये Developer ने imported/DTA goods चा utilization योग्य प्रकारे होत आहे का याचे monitoring: 👉 Approval Committee करते.", "golden": "SEZ Developer Goods Utilization → Approval Committee"}, {"no": 115, "q": "Q115. Common Customs Electronic Portal can be notified by the Board under Section ___ of the Customs Act, 1962.", "options": [{"letter": "A", "text": "154B"}, {"letter": "B", "text": "154"}, {"letter": "C", "text": "154C"}, {"letter": "D", "text": "154A"}], "answer": "C", "answer_text": "Section 154C", "explanation": "Common Customs Electronic Portal साठी Customs Act मध्ये: 👉 Section 154C महत्त्वाचे आहे. हे portal declarations, orders, notices आणि digital communication साठी electronic interface देते.", "golden": "Common Customs Electronic Portal → Sec.154C Q116–Q120"}, {"no": 116, "q": "Q116. “Goods of like kind and quality” as per Customs Valuation (Determination of Value of Export Goods) Rules, 2007 does not mean—", "options": [{"letter": "A", "text": "Perform the same functions or different function"}, {"letter": "B", "text": "Produced by same person or different person"}, {"letter": "C", "text": "Are commercially interchangeable with goods being valued"}, {"letter": "D", "text": "Export goods identical or similar in physical characteristics, quality and reputation"}], "answer": "A", "answer_text": "", "explanation": "“Like kind and quality” मध्ये goods commercially interchangeable असणे आणि physical characteristics/quality/reputation मध्ये similarity असणे महत्त्वाचे आहे. पण same किंवा different functions perform करणे हा definition चा भाग नाही.", "golden": "Like Kind & Quality → Commercial Interchangeability + Characteristics/Quality/Reputation"}, {"no": 117, "q": "Q117. When any goods are confiscated under the Customs Act, 1962, ownership of such goods shall thereupon vest in—", "options": [{"letter": "A", "text": "The Custodian"}, {"letter": "B", "text": "Proper Officer confiscating the goods"}, {"letter": "C", "text": "The Importer"}, {"letter": "D", "text": "The Central Government"}], "answer": "D", "answer_text": "Central Government", "explanation": "Customs Act Section 126 नुसार goods confiscate झाल्यावर त्यांची ownership: 👉 Central Government मध्ये vest होते.", "golden": "Confiscated Goods → Ownership → Central Government"}, {"no": 118, "q": "Q118. Which of the following statement is TRUE?", "options": [{"letter": "A", "text": "Deemed Exports under FTP are eligible for RoDTEP"}, {"letter": "B", "text": "Goods subject to minimum export price or export duty are eligible for RoDTEP"}, {"letter": "C", "text": "Deemed Exports under FTP are not eligible for duty credit under RoDTEP"}, {"letter": "D", "text": "Exports originating in third country but trans-shipped through India are eligible for RoDTEP"}], "answer": "C", "answer_text": "", "explanation": "RoDTEP scheme मुख्यतः physical exports originating from India साठी आहे. Deemed exports हे actual physical export नसल्यामुळे RoDTEP duty credit साठी eligible नाहीत.", "golden": "RoDTEP → Physical Export from India Deemed Export → Not Eligible"}, {"no": 119, "q": "Q119. Which of the following items is NOT specified under Section 123 of the Customs Act, 1962, where burden of proof of smuggled goods is discussed?", "options": [{"letter": "A", "text": "Watches"}, {"letter": "B", "text": "Gold Jewellery"}, {"letter": "C", "text": "Silver Jewellery"}, {"letter": "D", "text": "Cigarettes"}], "answer": "C", "answer_text": "Silver Jewellery", "explanation": "Section 123 मध्ये notified goods बाबत burden of proof reverse होतो. Paper मध्ये specified items मध्ये: Watches ✔️ Gold jewellery ✔️ Cigarettes ✔️ परंतु: ❌ Silver jewellery specified list मध्ये नाही.", "golden": "Sec.123 → Silver Jewellery = NOT specified"}, {"no": 120, "q": "Q120. Any person who contravenes any provisions of the Customs Act, 1962, where no express penalty is elsewhere provided, shall be liable to a penalty not exceeding—", "options": [{"letter": "A", "text": "₹4 lakh"}, {"letter": "B", "text": "₹50,000"}, {"letter": "C", "text": "₹2 lakh"}, {"letter": "D", "text": "₹1 lakh"}], "answer": "A", "answer_text": "₹4 lakh", "explanation": "Customs Act Section 117 अंतर्गत, ज्या contravention साठी specific penalty दिलेली नाही, त्या बाबतीत: 👉 Maximum ₹4 lakh penalty लागू होऊ शकते.", "golden": "Sec.117 → General Penalty → Up to ₹4 Lakh"}, {"no": 121, "q": "Q121. Under Project Import, spare parts and consumables can be imported up to what percentage of the assessable value of goods?", "options": [{"letter": "A", "text": "5%"}, {"letter": "B", "text": "10%"}, {"letter": "C", "text": "15%"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "10%", "explanation": "Project Import Regulations अंतर्गत project साठी आवश्यक spare parts आणि consumables हे main equipment च्या assessable value च्या 10% पर्यंत import करता येतात.", "golden": "Project Import → Spare Parts & Consumables → 10%"}, {"no": 122, "q": "Q122. Which of the following statements is NOT True for fulfilment of Export Obligation (EO) under the EPCG Scheme?", "options": [{"letter": "A", "text": "Shipments under DFIA will be counted for fulfilment of EO"}, {"letter": "B", "text": "Royalty payments received by the Authorisation holder in freely convertible currency shall not be counted for discharge of EO"}, {"letter": "C", "text": "Foreign exchange received for R&D services shall be counted for discharge of EO under EPCG"}, {"letter": "D", "text": "All of the above"}], "answer": "B", "answer_text": "", "explanation": "EPCG अंतर्गत export obligation fulfilment साठी eligible exports/services consider केले जातात. Paper explanation नुसार freely convertible currency मध्ये मिळालेली royalty payment EO discharge साठी count केली जात नाही.", "golden": "EPCG → Royalty received in freely convertible currency = Not counted for EO"}, {"no": 123, "q": "Q123. As per the Customs Act, 1962, which of the following statements is incorrect?", "options": [{"letter": "A", "text": "“Warehoused goods” means goods deposited in a warehouse."}, {"letter": "B", "text": "“Imported goods” include goods which have been cleared for home consumption."}, {"letter": "C", "text": "“Export goods” means any goods which are to be taken out of India to a place outside India."}, {"letter": "D", "text": "“Examination”, in relation to goods, includes measurement and weighing thereof."}], "answer": "B", "answer_text": "", "explanation": "“Imported goods” म्हणजे India बाहेरून India मध्ये आलेले goods जोपर्यंत home consumption साठी clear झालेले नाहीत. एकदा goods home consumption साठी clear झाले की ते Customs Act च्या definition नुसार “imported goods” राहत नाहीत.", "golden": "Imported Goods → Not goods already cleared for home consumption"}, {"no": 124, "q": "Q124. Capital Goods intended for use in any 100% Export Oriented Unit (EOU) can be kept in a warehouse up to—", "options": [{"letter": "A", "text": "Expiry of 3 years"}, {"letter": "B", "text": "Expiry of 1 year"}, {"letter": "C", "text": "Their clearance from the warehouse (No Time Limit)"}, {"letter": "D", "text": "Expiry of 5 years"}], "answer": "C", "answer_text": "Till clearance from warehouse (No Time Limit)", "explanation": "100% EOU साठी intended capital goods warehouse मध्ये ठेवण्यासाठी fixed 1/3/5 years limit नाही. ते goods: 👉 Warehouse मधून clear होईपर्यंत warehouse मध्ये राहू शकतात.", "golden": "EOU Capital Goods → No Time Limit → Till Clearance"}, {"no": 125, "q": "Q125. In case of short landing of goods loaded in a conveyance for importation into India, the person-in-charge of the conveyance is liable for a penalty that would have been chargeable on the goods not unloaded, had such goods been imported:", "options": [{"letter": "A", "text": "Not exceeding the amount of duty"}, {"letter": "B", "text": "Not exceeding twice the amount of duty"}, {"letter": "C", "text": "Not exceeding 1.5 times"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "Not exceeding twice the amount of duty", "explanation": "Customs Act Section 116 मध्ये short landing साठी person-in-charge वर penalty लागू होऊ शकते. Maximum: 👉 2 times the duty that would have been chargeable.", "golden": "Short Landing → Sec.116 → Up to 2× Duty"}, {"no": 126, "q": "Q126. For re-export under Section 74 of the Customs Act, 1962, the identity of goods has to be established with respect to import documents to the satisfaction of—", "options": [{"letter": "A", "text": "Assistant/Deputy Commissioner of Customs"}, {"letter": "B", "text": "Assessing Officer"}, {"letter": "C", "text": "Examining Officer"}, {"letter": "D", "text": "Commissioner of Customs"}], "answer": "A", "answer_text": "Assistant/Deputy Commissioner of Customs", "explanation": "Section 74 मध्ये imported goods re-export करून drawback claim करताना imported goods आणि re-export केलेले goods same/identifiable आहेत हे establish करावे लागते. हे identity: 👉 Assistant/Deputy Commissioner of Customs यांच्या satisfaction ला establish करायचे असते.", "golden": "Sec.74 → Identity of Goods → AC/DC Q127–Q130"}, {"no": 127, "q": "Q127. Which of the following is NOT included in the definition of “customs station” under the Customs Act, 1962?", "options": [{"letter": "A", "text": "Customs port"}, {"letter": "B", "text": "Customs warehouse"}, {"letter": "C", "text": "International courier terminal"}, {"letter": "D", "text": "Foreign post office"}], "answer": "B", "answer_text": "Customs warehouse", "explanation": "Customs Act Section 2 नुसार customs station मध्ये customs port, customs airport, international courier terminal आणि foreign post office यांचा समावेश होतो. पण: ❌ Customs warehouse customs station नाही.", "golden": "Customs Station → Port + Airport + Courier Terminal + Foreign Post Office Warehouse ≠ Customs Station"}, {"no": 128, "q": "Q128. The term IRN in respect of ICEGATE stands for—", "options": [{"letter": "A", "text": "Interchange of Registration Number"}, {"letter": "B", "text": "Image of Records Noted"}, {"letter": "C", "text": "Image Reference Number"}, {"letter": "D", "text": "Interface for Records Noting"}], "answer": "C", "answer_text": "Image Reference Number", "explanation": "IRN = Image Reference Number. e-Sanchit वर supporting documents upload केल्यानंतर त्यांना एक unique reference number मिळतो. हा number Customs declarations शी document link करण्यासाठी उपयोगी असतो.", "golden": "ICEGATE IRN → Image Reference Number"}, {"no": 129, "q": "Q129. Which of the following sections of the Customs Act, 1962 empowers the proper officer to undertake “controlled delivery” of any consignment of such goods?", "options": [{"letter": "A", "text": "Section 105"}, {"letter": "B", "text": "Section 109A"}, {"letter": "C", "text": "Section 106A"}, {"letter": "D", "text": "Section 109"}], "answer": "B", "answer_text": "Section 109A", "explanation": "Controlled Delivery म्हणजे suspected illicit goods चा consignment लगेच seize न करता, competent authority च्या supervision खाली पुढे जाऊ देणे, जेणेकरून पूर्ण network/recipient शोधता येईल. यासाठी: 👉 Section 109A महत्त्वाचे आहे.", "golden": "Controlled Delivery → Section 109A"}, {"no": 130, "q": "Q130. The costs toward destruction, demurrage and detention charges incurred till the time of destruction or disposal of goods infringing intellectual property rights shall be borne by—", "options": [{"letter": "A", "text": "Right holder"}, {"letter": "B", "text": "Importer"}, {"letter": "C", "text": "Custodian"}, {"letter": "D", "text": "Half each by right holder and importer"}], "answer": "A", "answer_text": "Right holder", "explanation": "IPR-infringing goods destroy/dispose करताना destruction, demurrage आणि detention चे costs: 👉 Right holder याने bear करायचे असतात.", "golden": "IPR Goods Destruction Costs → Right Holder Q131–Q133"}, {"no": 131, "q": "Q131. Where any duty has not been levied or not paid for reason other than collusion or wilful misstatement or suppression of facts:", "options": [{"letter": "A", "text": "The person chargeable with the duty or interest may pay before service of notice"}, {"letter": "B", "text": "The duty cannot be paid before service of notice"}, {"letter": "C", "text": "If the person pays before service of notice, any interest payable is exempted"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "", "explanation": "Section 28(1) मध्ये जर duty short-paid/non-paid आहे पण case मध्ये collusion, wilful misstatement किंवा suppression of facts नाही, तर person: 👉 SCN serve होण्यापूर्वी duty + applicable interest भरू शकतो. Interest माफ होत नाही; applicable interest भरावे लागते.", "golden": "Sec.28 → Before SCN → Duty + Interest can be paid"}, {"no": 132, "q": "Q132. As per Deferred Payment of Import Duty Rules, 2016, who shall NOT be allowed to make deferred payment of duty?", "options": [{"letter": "A", "text": "Eligible importer who fails to pay duty in full by due date more than once in six consecutive months"}, {"letter": "B", "text": "Eligible importer who fails more than twice in six consecutive months"}, {"letter": "C", "text": "Eligible importer who fails to pay duty in full by due date more than once in three consecutive months"}, {"letter": "D", "text": "Eligible importer who fails more than twice in three consecutive months"}], "answer": "C", "answer_text": "", "explanation": "Eligible importer ने three consecutive months मध्ये due date पर्यंत duty full payment करण्यास more than once failure केले तर deferred payment facility वापरता येत नाही.", "golden": "Deferred Payment → More than once default in 3 consecutive months → Not allowed"}, {"no": 133, "q": "Q133. E-Payment of Customs duty is mandatory for importers paying duty of Rs. ____ per Bill of Entry.", "options": [{"letter": "A", "text": "₹25,000"}, {"letter": "B", "text": "₹10,000"}, {"letter": "C", "text": "₹1,00,000"}, {"letter": "D", "text": "₹50,000"}], "answer": "C", "answer_text": "₹1,00,000", "explanation": "एका Bill of Entry साठी customs duty: 👉 ₹1 lakh किंवा त्यापेक्षा जास्त असल्यास electronic payment mandatory आहे.", "golden": "E-Payment Mandatory → ₹1 Lakh or More Q134–Q140"}, {"no": 134, "q": "Q134. Under EPCG scheme, Specific Export Obligation (EO) for exporters of Green Technology Products shall be ____ of EO.", "options": [{"letter": "A", "text": "75%"}, {"letter": "B", "text": "50%"}, {"letter": "C", "text": "30%"}, {"letter": "D", "text": "60%"}], "answer": "A", "answer_text": "75%", "explanation": "FTP 2023 मध्ये Green Technology Products साठी EPCG scheme अंतर्गत reduced specific export obligation आहे. Normal EO च्या: 👉 75% इतकी specific EO fulfil करावी लागते.", "golden": "Green Technology Products → EPCG EO = 75%"}, {"no": 135, "q": "Q135. As per Customs Audit Regulations, 2018, the proper officer shall give not less than ____ advance notice to the auditee to conduct audit at the premises.", "options": [{"letter": "A", "text": "30 days"}, {"letter": "B", "text": "07 days"}, {"letter": "C", "text": "15 days"}, {"letter": "D", "text": "10 days"}], "answer": "C", "answer_text": "15 days", "explanation": "Customs audit सुरू करण्यापूर्वी auditee ला: 👉 At least 15 days advance notice द्यावी लागते.", "golden": "Customs Audit → Advance Notice = 15 Days"}, {"no": 136, "q": "Q136. Which of the following category of goods cannot be confiscated under Section 111 of the Customs Act, 1962?", "options": [{"letter": "A", "text": "Goods imported by sea or air and unloaded at a place other than customs port/airport"}, {"letter": "B", "text": "Goods attempted to be exported by sea or air from a place other than customs port/airport"}, {"letter": "C", "text": "Dutiable or prohibited goods found concealed in any package before or after unloading"}, {"letter": "D", "text": "Dutiable or prohibited goods found concealed in any conveyance"}], "answer": "B", "answer_text": "", "explanation": "Section 111 हा improper importation शी संबंधित आहे. Option B मध्ये attempted export आहे. Export violations साठी मुख्यतः Section 113 लागू होतो. म्हणून Section 111 अंतर्गत confiscation न होणारा option: 👉 B", "golden": "Sec.111 → Improper Import Sec.113 → Improper Export"}, {"no": 137, "q": "Q137. Who among the following shall decide whether any goods or services are required by a unit in SEZ for its authorised operations?", "options": [{"letter": "A", "text": "Specified Officer"}, {"letter": "B", "text": "Authorised Officer"}, {"letter": "C", "text": "Approval Committee"}, {"letter": "D", "text": "Development Commissioner"}], "answer": "D", "answer_text": "Development Commissioner", "explanation": "SEZ unit च्या authorised operations साठी कोणते goods/services आवश्यक आहेत हे: 👉 Development Commissioner ठरवतो.", "golden": "SEZ Authorised Operations → Development Commissioner"}, {"no": 138, "q": "Q138. Advance Authorisation scheme is meant for duty free import of—", "options": [{"letter": "A", "text": "Inputs used for export production"}, {"letter": "B", "text": "Machinery for export production"}, {"letter": "C", "text": "A and B both"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "Inputs used for export production", "explanation": "Advance Authorisation चा मुख्य purpose: 👉 Export products manufacture करण्यासाठी required inputs duty-free import करणे. Raw materials, components, fuel, oil, packing materials इत्यादी eligible inputs असू शकतात. Machinery/capital goods ही Advance Authorisation ची primary purpose नाही.", "golden": "Advance Authorisation → Duty-Free Inputs → Export Production"}, {"no": 139, "q": "Q139. Which of the following is a major amendment in IGM?", "options": [{"letter": "A", "text": "Commodity description"}, {"letter": "B", "text": "Changing the Importer's address only"}, {"letter": "C", "text": "Conversion from one unit of measurement to another"}, {"letter": "D", "text": "Correcting any spelling mistakes"}], "answer": "A", "answer_text": "Commodity description", "explanation": "IGM मध्ये goods ची commodity description बदलल्यास duty/compliance वर परिणाम होऊ शकतो. म्हणून हे major amendment मानले जाते. Address correction, unit conversion किंवा spelling correction हे minor amendments असू शकतात, subject to prescribed rules.", "golden": "IGM Major Amendment → Commodity Description"}, {"no": 140, "q": "Q140. Which of the following officers of Customs is NOT an “Authorised Officer” under SEZ Rules, 2006?", "options": [{"letter": "A", "text": "Assistant Commissioner"}, {"letter": "B", "text": "Appraiser"}, {"letter": "C", "text": "Superintendent"}, {"letter": "D", "text": "Preventive Officer"}], "answer": "A", "answer_text": "Assistant Commissioner", "explanation": "SEZ Rules, 2006 नुसार Authorised Officer हा Customs officer असतो पण तो Appraiser किंवा Superintendent पेक्षा खालील rank चा नसावा. म्हणून: ✔️ Appraiser → Authorised Officer ✔️ Superintendent → Authorised Officer ✔️ Preventive Officer → Authorised Officer ❌ Assistant Commissioner → या definition मध्ये नाही", "golden": "SEZ Authorised Officer → Appraiser/Superintendent or above; Assistant Commissioner not included"}], "2024": [{"no": 1, "q": "Q1. Which of the following section of the Customs Act, 1962 empowers the Central Government to make Rules consistent with the Customs Act, 1962?", "options": [{"letter": "A", "text": "Section 157"}, {"letter": "B", "text": "Section 158"}, {"letter": "C", "text": "Section 156"}, {"letter": "D", "text": "Section 154"}], "answer": "C", "answer_text": "Section 156", "explanation": "Customs Act मधील Section 156 Central Government ला Customs Act शी consistent असलेले Rules बनवण्याची power देते. लक्षात ठेवा: 156 → Rules 157 → Regulations 154 → Correction of clerical/arithmetical mistakes", "golden": "Sec.156 = Central Government → Rules"}, {"no": 2, "q": "Q2. When has India ratified the WTO's Trade Facilitation Agreement (TFA)?", "options": [{"letter": "A", "text": "April 2016"}, {"letter": "B", "text": "April 2017"}, {"letter": "C", "text": "May 2017"}, {"letter": "D", "text": "May 2016"}], "answer": "A", "answer_text": "April 2016", "explanation": "India ने WTO च्या Trade Facilitation Agreement (TFA) ला April 2016 मध्ये ratify केले. TFA चा उद्देश: Customs clearance faster करणे Trade procedures simplify करणे Transparency वाढवणे International trade facilitate करणे", "golden": "India + WTO TFA → April 2016"}, {"no": 3, "q": "Q3. Amendment of a Bill of Entry is not permitted after—", "options": [{"letter": "A", "text": "Imported goods are cleared for Home Consumption"}, {"letter": "B", "text": "Imported goods are deposited in a warehouse"}, {"letter": "C", "text": "Filing of Advance Bill of Entry"}, {"letter": "D", "text": "Both (A) and (B)"}], "answer": "D", "answer_text": "Both (A) and (B)", "explanation": "Customs Act Section 149 नुसार Bill of Entry amendment बाबत महत्त्वाचा rule आहे. Goods: ✔️ Home Consumption साठी cleared झाल्यानंतर ✔️ Warehouse मध्ये deposited झाल्यानंतर सामान्यतः amendment करता येत नाही. म्हणून A + B = D.", "golden": "BOE Amendment → Clearance/warehousing नंतर generally not permitted Q4–Q6"}, {"no": 4, "q": "Q4. Choose the right answer to fill in the blanks:", "options": [{"letter": "A", "text": "WCO COPES standards"}, {"letter": "B", "text": "WCO Framework of Standards on Cross-Border"}, {"letter": "C", "text": "WCO SAFE Framework of Standards"}, {"letter": "D", "text": "WCO Compliance Framework"}], "answer": "C", "answer_text": "WCO SAFE Framework of Standards", "explanation": "AEO Programme हे World Customs Organization च्या: 👉 SAFE Framework of Standards वर आधारित आहे. SAFE Framework चा उद्देश secure आणि efficient international supply chain तयार करणे हा आहे.", "golden": "AEO → WCO SAFE Framework"}, {"no": 5, "q": "Q5. As per the Explosives Rules, 2008, within how many days of actual export, an exporter or his authorised agent shall submit a copy of bill of lading and return in Form RE-10 to the Chief Controller of Explosives?", "options": [{"letter": "A", "text": "07 days"}, {"letter": "B", "text": "21 days"}, {"letter": "C", "text": "28 days"}, {"letter": "D", "text": "15 days"}], "answer": "B", "answer_text": "21 days", "explanation": "Explosives Rules, 2008 नुसार actual export झाल्यानंतर: 👉 21 days मध्ये Bill of Lading ची copy आणि Form RE-10 Chief Controller of Explosives कडे submit करायची असते.", "golden": "Explosives → RE-10 → 21 Days"}, {"no": 6, "q": "Q6. Which of the following is correct while calculating the time prescribed for filing an appeal against an order under the Customs Act, 1962?", "options": [{"letter": "A", "text": "Time for obtaining the certified copy of order may be excluded."}, {"letter": "B", "text": "Appeal can be filed on next working day if last day is a gazetted holiday."}, {"letter": "C", "text": "Neither (A) nor (B) is true."}, {"letter": "D", "text": "Both (A) and (B) are true."}], "answer": "D", "answer_text": "Both A and B", "explanation": "Appeal limitation calculate करताना: ✔️ Certified copy मिळवण्यासाठी लागलेला time exclude होऊ शकतो. ✔️ Last day gazetted holiday असेल तर next working day ला appeal file करता येते. म्हणून दोन्ही statements correct.", "golden": "Appeal Limitation → Certified Copy Time Excluded + Holiday → Next Working Day Q7–Q10"}, {"no": 7, "q": "Q7. Select the most appropriate Answer: The interest on delayed refund shall be paid at what rate?", "options": [{"letter": "A", "text": "15%"}, {"letter": "B", "text": "Not below 6%"}, {"letter": "C", "text": "As fixed by the Central Government by notification"}, {"letter": "D", "text": "Not exceeding 25%"}], "answer": "C", "answer_text": "As fixed by the Central Government by notification", "explanation": "Customs Act Section 27A नुसार delayed refund वर interest: 👉 Central Government ने notification द्वारे fixed केलेल्या rate ने दिला जातो. Paper च्या explanation मध्ये current rate 6% per annum असा उल्लेख आहे.", "golden": "Delayed Refund → Sec.27A → Rate fixed by Central Government"}, {"no": 8, "q": "Q8. What will be the rate of exchange for the purpose of Customs Act, 1962?", "options": [{"letter": "A", "text": "Rate of exchange determined by Board (CBIC)"}, {"letter": "B", "text": "Rate determined by World Customs Organisation"}, {"letter": "C", "text": "Rate determined by RBI"}, {"letter": "D", "text": "Rate determined by World Bank"}], "answer": "A", "answer_text": "Rate determined by Board (CBIC)", "explanation": "Customs valuation साठी foreign currency चे INR conversion करण्यासाठी applicable exchange rate: 👉 CBIC/Board notify करते. हे Section 14 शी संबंधित आहे.", "golden": "Customs Exchange Rate → CBIC/Board"}, {"no": 9, "q": "Q9. The requirement of delivering arrival manifest is not required for which vessels as per The Sea Cargo Manifest and Transhipment (Amendment) Regulations, 2019?", "options": [{"letter": "A", "text": "Vessels carrying imported goods"}, {"letter": "B", "text": "Vessels carrying any kind of goods"}, {"letter": "C", "text": "Vessels carrying imported and exported goods"}, {"letter": "D", "text": "Vessels carrying only coastal goods"}], "answer": "D", "answer_text": "Vessels carrying only coastal goods", "explanation": "Coastal goods Indian ports मध्ये domestic movement करतात. त्यांच्यावर international import/export customs clearance लागू नसल्यामुळे arrival manifest requirement लागू होत नाही.", "golden": "SCMTR → Only Coastal Goods → Arrival Manifest not required"}, {"no": 10, "q": "Q10. What are the records to be maintained by licensee as per Regulation 11 of the Warehouse (Custody and Handling of Goods) Regulations, 2016?", "options": [{"letter": "A", "text": "Records of receipt, handling, storing and removal of goods into and from warehouse"}, {"letter": "B", "text": "Record of draw of samples from warehoused goods"}, {"letter": "C", "text": "Copies of Bill of Entry, transport documents or any other documents"}, {"letter": "D", "text": "All of the options are correct"}], "answer": "D", "answer_text": "All", "explanation": "Warehouse licensee ला comprehensive records maintain करावे लागतात: ✔️ Goods receipt ✔️ Handling ✔️ Storage ✔️ Removal ✔️ Sample draw ✔️ Bill of Entry ✔️ Transport documents म्हणून All of the above.", "golden": "Warehouse Records → Receipt + Storage + Removal + Samples + Documents Q11–Q15"}, {"no": 11, "q": "Q11. A licence granted under Private Warehouse Licensing Regulations, 2016 is valid till how many years?", "options": [{"letter": "A", "text": "10 years"}, {"letter": "B", "text": "Unless it is cancelled"}, {"letter": "C", "text": "Till transferred to another entity"}, {"letter": "D", "text": "Renewable every 5 years"}], "answer": "B", "answer_text": "Unless it is cancelled", "explanation": "Private Warehouse Licence ला fixed 5 किंवा 10 years validity नाही. Licence: 👉 Cancelled किंवा surrendered होईपर्यंत valid राहते, subject to compliance with conditions.", "golden": "Private Warehouse Licence → Valid unless cancelled"}, {"no": 12, "q": "Q12. An ‘Authorised Person’ under the Bill of Entry (Electronic Integrated Declaration and Paperless Processing) Regulations, 2018 includes an employee of Customs Broker who has been issued a photo identity card in ______ under Customs Brokers Licensing Regulations, 2013 or any other regulation dealing with similar matters.", "options": [{"letter": "A", "text": "Form D"}, {"letter": "B", "text": "Form I"}, {"letter": "C", "text": "Form G"}, {"letter": "D", "text": "Form H"}], "answer": "C", "answer_text": "Form G", "explanation": "Customs Broker च्या employee ला authorised person म्हणून काम करण्यासाठी valid photo identity card आवश्यक असतो. तो: 👉 Form G मध्ये असतो.", "golden": "Customs Broker Employee → Form G"}, {"no": 13, "q": "Q13. The restrictions under Courier Imports and Exports (Electronic Declaration and Processing) Regulations, 2010, shall not apply to which of the following?", "options": [{"letter": "A", "text": "Import of animals and parts thereof, plants and parts thereof"}, {"letter": "B", "text": "Export of gems and jewellery"}, {"letter": "C", "text": "Publications containing maps depicting incorrect boundaries of India"}, {"letter": "D", "text": "Import of perishables goods"}], "answer": "B", "answer_text": "Export of gems and jewellery", "explanation": "Paper च्या explanation नुसार courier mode मध्ये gems and jewellery export permitted आहे. इतर listed categories वर restrictions लागू होऊ शकतात.", "golden": "Courier Restrictions → Export of Gems & Jewellery = Exception"}, {"no": 14, "q": "Q14. Which regulation of the Sea Cargo Manifest and Transhipment Regulations, 2018 allows amendment of arrival and departure manifest?", "options": [{"letter": "A", "text": "Regulation 7"}, {"letter": "B", "text": "Regulation 8"}, {"letter": "C", "text": "Regulation 5"}, {"letter": "D", "text": "Regulation 6"}], "answer": "B", "answer_text": "Regulation 8", "explanation": "SCMTR 2018 मध्ये: 👉 Regulation 8 arrival/departure manifest मध्ये amendment किंवा supplement करण्याची provision देते, prescribed conditions subject to.", "golden": "SCMTR → Amendment of Manifest → Regulation 8"}, {"no": 15, "q": "Q15. Which of the following is true for Residual Method of Customs valuation?", "options": [{"letter": "A", "text": "Value can be determined based on price of goods for export to a country other than India."}, {"letter": "B", "text": "Value can be determined based on price of goods on domestic market of country of exportation."}, {"letter": "C", "text": "Value can be determined using reasonable means on basis of data available in India."}, {"letter": "D", "text": "Value can be determined based on selling price in India of goods produced in India."}], "answer": "C", "answer_text": "", "explanation": "Residual method हा valuation चा last resort आहे. इतर valuation methods apply होत नसतील तर: 👉 Reasonable means + data available in India याच्या आधारावर value determine केली जाते.", "golden": "Residual Method → Reasonable Means + Data Available in India Q16–Q20"}, {"no": 16, "q": "Q16. An appeal against the order of CESTAT for the determination of any value of goods for purposes of assessment lies with which Authority?", "options": [{"letter": "A", "text": "Jurisdictional High Court"}, {"letter": "B", "text": "Additional Secretary (RA)"}, {"letter": "C", "text": "Settlement Commission"}, {"letter": "D", "text": "Supreme Court"}], "answer": "D", "answer_text": "Supreme Court", "explanation": "Customs Act Section 130E अंतर्गत CESTAT च्या order मध्ये value of goods for assessment संबंधित substantial question असल्यास appeal: 👉 Supreme Court मध्ये जाते.", "golden": "CESTAT + Value of Goods for Assessment → Supreme Court"}, {"no": 17, "q": "Q17. The limit of one year for claim of refund of Customs duty does not apply if—", "options": [{"letter": "A", "text": "The duty or interest has been paid under protest"}, {"letter": "B", "text": "The duty or interest has been paid voluntarily"}, {"letter": "C", "text": "The claim shall mandatorily be submitted before expiry of one year"}, {"letter": "D", "text": "None of the option is correct"}], "answer": "A", "answer_text": "Paid under protest", "explanation": "Customs Act Section 27 मध्ये सामान्यतः refund claim साठी one-year limitation असते. परंतु duty/interest: 👉 Under protest भरले असल्यास ही one-year limitation लागू होत नाही.", "golden": "Refund + Under Protest → 1-Year Limitation Does NOT Apply"}, {"no": 18, "q": "Q18. The Central Government has made CAROTAR Rules, 2020. The term CAROTAR stands for—", "options": [{"letter": "A", "text": "Central Administration of Regions Oriented Trade Agreement Rules"}, {"letter": "B", "text": "Customs (Administration of Rules of Origin under Trade Agreements) Rules"}, {"letter": "C", "text": "Central Agreement and Recognition of Origin Treaty"}, {"letter": "D", "text": "Customs Agreement and Recognition of Origin Treaty"}], "answer": "B", "answer_text": "", "explanation": "CAROTAR चा full form: Customs (Administration of Rules of Origin under Trade Agreements) Rules, 2020 हे preferential tariff claim करताना Rules of Origin ची compliance तपासण्यासाठी महत्त्वाचे आहेत.", "golden": "CAROTAR → Rules of Origin under Trade Agreements"}, {"no": 19, "q": "Q19. Within how many months, provisional assessment should be finalised by proper officer on receipt of desired documents/report?", "options": [{"letter": "A", "text": "3 months"}, {"letter": "B", "text": "2 months"}, {"letter": "C", "text": "1 month"}, {"letter": "D", "text": "6 months"}], "answer": "B", "answer_text": "2 months", "explanation": "Customs (Finalisation of Provisional Assessment) Regulations, 2018 नुसार required documents/report मिळाल्यानंतर proper officer ने provisional assessment: 👉 2 months मध्ये finalise करावे.", "golden": "Provisional Assessment Finalisation → 2 Months"}, {"no": 20, "q": "Q20. Which of the following statement is not correct with respect to Foreign Trade Policy 2023?", "options": [{"letter": "A", "text": "Project imports are excluded from EPCG"}, {"letter": "B", "text": "All items with Basic Customs Duty of more than 20% have been included in the list of ineligible categories of import under self-declaration basis"}, {"letter": "C", "text": "Diamond India Limited (DIL) is one of the nominated agencies for Gems and Jewellery schemes"}, {"letter": "D", "text": "All options are correct"}], "answer": "B", "answer_text": "", "explanation": "Paper नुसार B statement incorrect आहे. FTP 2023 मध्ये self-declaration basis वरील ineligible categories ची specific list आहे; Basic Customs Duty 20% पेक्षा जास्त असलेले सर्व items अशी blanket condition नाही. म्हणून B incorrect.", "golden": "FTP 2023 → “All BCD >20%” = Incorrect blanket statement"}, {"no": 21, "q": "Q21. Under which section of Customs Act, 1962, Controlled Delivery (Customs) Regulations, 2022 has been made?", "options": [{"letter": "A", "text": "Section 107 of the Customs Act, 1962"}, {"letter": "B", "text": "Section 109A of the Customs Act, 1962"}, {"letter": "C", "text": "Section 108A of the Customs Act, 1962"}, {"letter": "D", "text": "Section 110 of the Customs Act, 1962"}], "answer": "B", "answer_text": "Section 109A", "explanation": "Controlled Delivery (Customs) Regulations, 2022 हे Section 109A अंतर्गत बनवण्यात आले आहेत. Controlled Delivery म्हणजे suspected illegal goods च्या consignment ला Customs supervision खाली पुढे जाऊ देऊन संबंधित persons/network शोधणे.", "golden": "Controlled Delivery → Sec.109A"}, {"no": 22, "q": "Q22. Where the Bill of Entry is not filed within the time specified in Regulation 4(1) of Bill of Entry (Electronic Integrated Declaration and Paperless Processing) Regulations, 2018, importer shall be liable to pay charges for late presentation of Bill of Entry at the rate of—", "options": [{"letter": "A", "text": "₹5,000 for first 3 days and ₹15,000 per day thereafter"}, {"letter": "B", "text": "₹2,000 for first 3 days and ₹10,000 per day thereafter"}, {"letter": "C", "text": "₹5,000 for first 3 days and ₹10,000 per day thereafter"}, {"letter": "D", "text": "₹2,000 for first 3 days and ₹5,000 per day thereafter"}], "answer": "C", "answer_text": "₹5,000 + ₹10,000", "explanation": "Late Bill of Entry साठी: पहिले 3 दिवस → ₹5,000 प्रति दिवस त्यानंतर → ₹10,000 प्रति दिवस", "golden": "Late BOE → 1st 3 days ₹5,000/day → Thereafter ₹10,000/day"}, {"no": 23, "q": "Q23. For import of Narcotics Drugs or Psychotropic Substance along with the Import Certificate, which other document is required?", "options": [{"letter": "A", "text": "Excise permit issued by DGFT"}, {"letter": "B", "text": "Excise permit issued by Central Bureau of Narcotics"}, {"letter": "C", "text": "Excise permit issued by the Central Government"}, {"letter": "D", "text": "Excise permit issued by the concerned State Government"}], "answer": "D", "answer_text": "Permit issued by concerned State Government", "explanation": "Narcotic drugs/psychotropic substances import करताना Import Certificate सोबत संबंधित State Government कडून issued Excise Permit आवश्यक आहे.", "golden": "Narcotics Import → Import Certificate + State Excise Permit"}, {"no": 24, "q": "Q24. As per Customs Act, 1962 Indian Customs waters extend up to a limit of—", "options": [{"letter": "A", "text": "100 nautical miles from the base line"}, {"letter": "B", "text": "12 nautical miles from the base line"}, {"letter": "C", "text": "200 nautical miles from the base line"}, {"letter": "D", "text": "24 nautical miles from the base line"}], "answer": "C", "answer_text": "200 nautical miles", "explanation": "Customs Act मधील Indian Customs Waters ची definition territorial watersपुरती मर्यादित नाही. ती: 👉 200 nautical miles from the baseline पर्यंत extend होते. यामध्ये territorial waters, contiguous zone आणि EEZ चा समावेश होतो.", "golden": "Indian Customs Waters → 200 Nautical Miles"}, {"no": 25, "q": "Q25. Which of the following Acts are not covered under Intellectual Property Rights (Imported Goods) Rules, 2017?", "options": [{"letter": "A", "text": "Copyright Act, 1957"}, {"letter": "B", "text": "Trade Marks Act, 1999"}, {"letter": "C", "text": "Patents Act, 1970"}, {"letter": "D", "text": "Geographical Indications of Goods (Registration and Protection) Act, 1999"}], "answer": "C", "answer_text": "Patents Act, 1970", "explanation": "IPR Imported Goods Rules मध्ये Copyright, Trade Marks आणि Geographical Indications यांचा enforcement framework आहे. Patents border enforcement साठी या rules मध्ये covered नाहीत.", "golden": "IPR Rules → Patent Act NOT covered Q26–30"}, {"no": 26, "q": "Q26. In case of goods consisting of articles liable to different rates of duty, the customs duty will be calculated as follows—", "options": [{"letter": "A", "text": "If sufficient evidence is produced, duty will be determined at the lowest rate of such rates on all such articles."}, {"letter": "B", "text": "If sufficient evidence is produced, duty will be determined at the highest rate of such rates on all such articles."}, {"letter": "C", "text": "If sufficient evidence is produced, each article shall be chargeable to duty separately at the rate applicable to it."}, {"letter": "D", "text": "None of the above."}], "answer": "C", "answer_text": "", "explanation": "एकाच package/consignment मध्ये different articles आणि different duty rates असतील आणि प्रत्येक article identify करण्यासाठी sufficient evidence असेल तर: 👉 प्रत्येक article वर त्याला लागू होणारा स्वतंत्र duty rate लावला जातो.", "golden": "Different Articles + Different Rates → Each Article Separately"}, {"no": 27, "q": "Q27. The exemption of Customs duty to any imported goods granted under Section
