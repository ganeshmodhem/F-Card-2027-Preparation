 25(1) of Customs Act is generally valid up to?", "options": [{"letter": "A", "text": "One year from the date of such grant"}, {"letter": "B", "text": "The exemption is valid unless rescinded"}, {"letter": "C", "text": "31st day of March falling immediately after two years from date of such grant"}, {"letter": "D", "text": "31st day of March of the financial year from date of such grant"}], "answer": "C", "answer_text": "", "explanation": "Section 25(4A) नुसार specified exemption notification साधारणपणे: 👉 Grant झाल्यापासून दोन वर्षांनंतर लगेच येणाऱ्या 31 March पर्यंत valid राहते, unless earlier rescinded.", "golden": "Sec.25(4A) → Exemption → 31 March after 2 years"}, {"no": 28, "q": "Q28. The import of hazardous waste may be allowed to actual users with the ______ of the exporting country and shall require the ______ of the Ministry of Environment, Forest and Climate Change.", "options": [{"letter": "A", "text": "Export certificate, Prior Informed Consent"}, {"letter": "B", "text": "Permission, Prior Informed Consent"}, {"letter": "C", "text": "Export Certificate, BIS permit"}, {"letter": "D", "text": "Prior Informed Consent, Permission"}], "answer": "D", "answer_text": "Prior Informed Consent, Permission", "explanation": "Hazardous waste import साठी: Exporting country → Prior Informed Consent (PIC) आणि MoEFCC → Permission आवश्यक आहे.", "golden": "Hazardous Waste → PIC + MoEFCC Permission"}, {"no": 29, "q": "Q29. The copies of Import Certificate in relation to Narcotics Drug shall be supplied to—", "options": [{"letter": "A", "text": "Commissioner of Customs"}, {"letter": "B", "text": "Concerned authority of exporting country"}, {"letter": "C", "text": "Drugs Controller, Government of India"}, {"letter": "D", "text": "All the options are correct"}], "answer": "D", "answer_text": "All the options are correct", "explanation": "Narcotics import certificate ची copies control आणि record keeping साठी संबंधित authorities कडे circulate केल्या जातात. Paper मध्ये D answer दिलेला आहे.", "golden": "Narcotics Import Certificate → All specified authorities"}, {"no": 30, "q": "Q30. The drawback is paid to an exporter under Section ______ of the Customs Act, 1962.", "options": [{"letter": "A", "text": "79"}, {"letter": "B", "text": "76"}, {"letter": "C", "text": "75"}, {"letter": "D", "text": "78"}], "answer": "C", "answer_text": "Section 75", "explanation": "Section 75 imported inputs वापरून तयार केलेल्या exported goods वर All Industry Rate/Brand Rate drawback शी संबंधित आहे. लक्षात ठेवा: Section 74 → Duty-paid imported goods re-export Section 75 → Imported inputs used in manufacture of exported goods", "golden": "Sec.75 → Manufacturing Export Drawback Q31–35"}, {"no": 31, "q": "Q31. IRN and DRN in e-Sanchit stands for—", "options": [{"letter": "A", "text": "Internal Reference Number, Delivery Reference Number"}, {"letter": "B", "text": "Image Reference Number, Document Reference Number"}, {"letter": "C", "text": "Internal Receipt Number, Document Reference Number"}, {"letter": "D", "text": "Image Reference Number, Delivery Reference Number"}], "answer": "B", "answer_text": "", "explanation": "IRN = Image Reference Number DRN = Document Reference Number e-Sanchit वर document/image upload केल्यानंतर हे reference numbers तयार होतात.", "golden": "IRN → Image Reference Number DRN → Document Reference Number"}, {"no": 32, "q": "Q32. What is full form of APEDA?", "options": [{"letter": "A", "text": "Agricultural and Products Food Processing Export Development Authority"}, {"letter": "B", "text": "Agricultural and Packaged Food Engineering Development Authority"}, {"letter": "C", "text": "Agricultural and Processed Food Products Export Development Authority"}, {"letter": "D", "text": "Agricultural Packaging Engineering Development Authority"}], "answer": "C", "answer_text": "", "explanation": "APEDA चा full form: Agricultural and Processed Food Products Export Development Authority ही authority agricultural आणि processed food products च्या exports ला promote करते.", "golden": "APEDA → Agricultural and Processed Food Products Export Development Authority"}, {"no": 33, "q": "Q33. Which of the following statements are correct as per Customs Act, 1962?", "options": [{"letter": "A", "text": "The confiscation of smuggled goods can be undertaken without limit by Commissioner of Customs."}, {"letter": "B", "text": "The confiscation of smuggled goods can be undertaken without limit by Joint Commissioner of Customs."}, {"letter": "C", "text": "The confiscation of smuggled goods can be undertaken without limit by Deputy Commissioner of Customs."}, {"letter": "D", "text": "Both (A) and (B) are correct."}], "answer": "D", "answer_text": "Both A and B", "explanation": "Section 122 मध्ये adjudication powers आणि value limits वेगवेगळ्या authorities ना दिल्या आहेत. Paper नुसार Commissioner आणि Joint Commissioner ना specified cases मध्ये monetary limit शिवाय adjudication power आहे.", "golden": "Sec.122 → Commissioner + Joint Commissioner → No monetary limit"}, {"no": 34, "q": "Q34. Under which section of Customs Act, 1962, the proper officer may reassess the duty leviable on imported goods?", "options": [{"letter": "A", "text": "Section 17"}, {"letter": "B", "text": "Section 12"}, {"letter": "C", "text": "Section 14"}, {"letter": "D", "text": "Section 18"}], "answer": "A", "answer_text": "Section 17", "explanation": "Section 17(4) नुसार proper officer ला importer च्या self-assessment मध्ये error/incompleteness आढळल्यास: 👉 Re-assessment करता येते.", "golden": "Sec.17 → Self-Assessment + Re-assessment"}, {"no": 35, "q": "Q35. How many doses of any single drug under Drugs and Cosmetics Rules, 1945 (as amended) are permitted in normal cases to be imported as part of bona fide baggage of passenger for personal use which are otherwise prohibited under Section 10 of the Drugs and Cosmetics Act, 1940?", "options": [{"letter": "A", "text": "100 average doses"}, {"letter": "B", "text": "150 average doses"}, {"letter": "C", "text": "200 average doses"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "100 average doses", "explanation": "Rule 36 अंतर्गत personal-use bona fide baggage मध्ये otherwise prohibited drugs च्या: 👉 Not exceeding 100 average doses पर्यंतची quantity permitted आहे. Exceptional individual cases मध्ये licensing authority larger quantity sanction करू शकते.", "golden": "Drug in Baggage → Maximum 100 Average Doses Q36–40"}, {"no": 36, "q": "Q36. What is the applicability of Customs duty on jetsam?", "options": [{"letter": "A", "text": "The articles will be charged to duty unless proved to proper officer that they are entitled to be admitted duty free."}, {"letter": "B", "text": "The articles will be treated as if they were imported into India."}, {"letter": "C", "text": "The articles will not be charged to duty."}, {"letter": "D", "text": "The articles will be handed over to State Authorities."}], "answer": "A", "answer_text": "", "explanation": "Jetsam म्हणजे समुद्रात/पाण्यातून recover झालेले goods. Customs Act Section 21 नुसार अशा goods वर duty लागू होते, जोपर्यंत importer/proper claimant हे सिद्ध करत नाही की goods duty-free treatment साठी eligible आहेत.", "golden": "Jetsam → Duty Applicable unless exemption proved"}, {"no": 37, "q": "Q37. Abatement of Customs duty in case of damaged imported goods shall be applicable if—", "options": [{"letter": "A", "text": "Imported goods had been damaged at any time before or during unloading of goods in India."}, {"letter": "B", "text": "Imported goods had been damaged at any time after unloading of goods in India but before examination."}, {"letter": "C", "text": "Any warehoused goods had been damaged at any time before clearance for home consumption due to any accident."}, {"letter": "D", "text": "All the options are correct."}], "answer": "D", "answer_text": "All", "explanation": "Section 22 damaged/deteriorated imported goods बाबत abatement देते. Damage जर: ✔️ Unloading पूर्वी/दरम्यान ✔️ Unloading नंतर पण examination पूर्वी ✔️ Warehouse मध्ये accident मुळे clearance पूर्वी झाले असेल तर prescribed conditions subject to abatement मिळू शकते.", "golden": "Sec.22 → Damaged/Deteriorated Goods → Abatement"}, {"no": 38, "q": "Q38. An appeal against the order of Commissioner (Appeals) in a case involving import of goods as baggage lies with whom under Customs Act?", "options": [{"letter": "A", "text": "None of the above"}, {"letter": "B", "text": "CESTAT"}, {"letter": "C", "text": "Additional Secretary (Revisionary Authority)"}, {"letter": "D", "text": "Jurisdictional High Court"}], "answer": "C", "answer_text": "Additional Secretary (Revisionary Authority)", "explanation": "Baggage matters CESTAT च्या सामान्य appellate jurisdiction मधून excluded आहेत. अशा matter मध्ये revision application: 👉 Additional Secretary (Revisionary Authority) यांच्याकडे जाते.", "golden": "Baggage Appeal → Revisionary Authority, NOT CESTAT"}, {"no": 39, "q": "Q39. As per CAROTAR, 2020 what is the minimum period for which an importer is required to keep origin-related documents related to Form I?", "options": [{"letter": "A", "text": "02 years from date of filing of Bill of Entry"}, {"letter": "B", "text": "10 years from date of filing of Bill of Entry"}, {"letter": "C", "text": "05 years from date of filing of Bill of Entry"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "5 Years", "explanation": "CAROTAR 2020 नुसार preferential tariff claim करताना importer ने origin-related documents, including Form I, retain करणे आवश्यक आहे. Period: 👉 5 years from the date of filing of Bill of Entry", "golden": "CAROTAR → Origin Documents → 5 Years"}, {"no": 40, "q": "Q40. ITC(HS) is aligned at ______ level with International Harmonized System goods nomenclature maintained by World Customs Organization.", "options": [{"letter": "A", "text": "6 digit"}, {"letter": "B", "text": "2 digit"}, {"letter": "C", "text": "4 digit"}, {"letter": "D", "text": "8 digit"}], "answer": "A", "answer_text": "6 digit", "explanation": "ITC(HS) मध्ये Indian Trade Classification based on Harmonized System आहे. International HS nomenclature शी alignment: 👉 6-digit level वर आहे. India पुढे additional digits वापरून national tariff/statistical classification करते.", "golden": "HS International Alignment → 6 Digit"}, {"no": 41, "q": "Q41. Which rule under General Rules of Interpretation (GIR) provides for the Section Notes/Chapter Notes to be used while classifying a product?", "options": [{"letter": "A", "text": "Rule 1"}, {"letter": "B", "text": "Rule 4"}, {"letter": "C", "text": "Rule 3"}, {"letter": "D", "text": "Rule 2"}], "answer": "A", "answer_text": "Rule 1", "explanation": "GIR Rule 1 नुसार classification करताना: 👉 Heading + relevant Section Notes + Chapter Notes सर्वप्रथम consider केले जातात.", "golden": "GIR Rule 1 → Heading + Section Notes + Chapter Notes"}, {"no": 42, "q": "Q42. Importer Exporter Code (IEC) can be cancelled by?", "options": [{"letter": "A", "text": "Chief Commissioner of Customs"}, {"letter": "B", "text": "Any officer authorized by Ministry of Finance"}, {"letter": "C", "text": "Director General DGFT"}, {"letter": "D", "text": "CBIC"}], "answer": "C", "answer_text": "Director General DGFT", "explanation": "IEC हा DGFT कडून issue केला जातो. FTP 2023 नुसार non-compliance, fraud, inactivity इत्यादी कारणांमुळे IEC: 👉 Director General of Foreign Trade (DGFT) cancel करू शकतात.", "golden": "IEC → DGFT → Cancellation by DGFT"}, {"no": 43, "q": "Q43. When is a Bill of Entry deemed to be filed as per Regulation 4(2) of the Bill of Entry (Electronic Integrated Declaration and Paperless Processing) Regulations, 2018?", "options": [{"letter": "A", "text": "A Bill of Entry number is generated by the system"}, {"letter": "B", "text": "An Entry Inward number is generated by the system"}, {"letter": "C", "text": "A QR code is generated by the system"}, {"letter": "D", "text": "None of the options are correct"}], "answer": "A", "answer_text": "Bill of Entry number is generated by the system", "explanation": "Electronic Bill of Entry system मध्ये system कडून Bill of Entry number generate झाल्यावर BOE deemed to be filed मानला जातो.", "golden": "BOE deemed filed → BOE Number generated"}, {"no": 44, "q": "Q44. The value of deteriorated imported goods may be ascertained under?", "options": [{"letter": "A", "text": "Gross sale proceeds as sold by proper officer by public auction or tender"}, {"letter": "B", "text": "Value as ascertained by the proper officer"}, {"letter": "C", "text": "Value as per declaration made by importer"}, {"letter": "D", "text": "Either (A) or (B) at the option of owner of such goods"}], "answer": "D", "answer_text": "Either A or B", "explanation": "Customs Act Section 23 नुसार imported goods deteriorate झाले असतील तर remission of duty साठी goods ची value: Public auction/tender मधील gross sale proceeds, किंवा Proper Officer ने ascertain केलेली value यापैकी लागू पद्धतीने ठरवता येते.", "golden": "Deteriorated Goods → Gross Sale Proceeds OR Proper Officer's Valuation"}, {"no": 45, "q": "Q45. A cosmetic shall be deemed to be mis-branded if—", "options": [{"letter": "A", "text": "It contains a colour which is not prescribed"}, {"letter": "B", "text": "It is imported under the name which belongs to another cosmetic"}, {"letter": "C", "text": "Both (A) and (B) are correct"}, {"letter": "D", "text": "Neither (A) nor (B) is correct"}], "answer": "A", "answer_text": "It contains a colour which is not prescribed", "explanation": "Drugs & Cosmetics Rules, 1945 नुसार prescribed नसलेला colour cosmetic मध्ये वापरल्यास ते mis-branded ठरू शकते. Paper explanation नुसार दुसऱ्या cosmetic चे नाव वापरणे हे primary criterion नाही.", "golden": "Mis-branded Cosmetic → Non-prescribed Colour"}, {"no": 46, "q": "Q46. As per the definition under Customs Act, 1962, the “market price” of the goods is defined as:", "options": [{"letter": "A", "text": "Weighted mean price of the goods in ordinary course of trade in India"}, {"letter": "B", "text": "Wholesale price of the goods in ordinary course of trade in India"}, {"letter": "C", "text": "Average price of goods in ordinary course of trade in India"}, {"letter": "D", "text": "Retail price of goods in ordinary course of trade in India"}], "answer": "B", "answer_text": "Wholesale price", "explanation": "Customs Act Section 2 मध्ये Market Price म्हणजे: 👉 Wholesale price of goods in the ordinary course of trade in India असा अर्थ दिला आहे.", "golden": "Market Price → Wholesale Price"}, {"no": 47, "q": "Q47. Which of the following is NOT correct for Customs (Import of Goods at Concessional Rate of Duty) Rules, 2017 (IGCR Rules), as amended?", "options": [{"letter": "A", "text": "Importer shall file monthly statement on common portal."}, {"letter": "B", "text": "Importer shall file intimation to proper officer when sending goods for job work."}, {"letter": "C", "text": "Individual transaction based permissions and intimations are not required for import of goods."}, {"letter": "D", "text": "IGCR Identification Number (IIN) is to be quoted by importer while filing Bill of Entry."}], "answer": "C", "answer_text": "", "explanation": "IGCR Rules simplified झाले असले तरी काही specific situations मध्ये: 👉 transaction-based permissions/intimations अजूनही आवश्यक असू शकतात. म्हणून “individual transaction based permissions and intimations are not required” हे blanket statement चुकीचे आहे.", "golden": "IGCR → Some transaction-based permissions/intimations still required Q48–50"}, {"no": 48, "q": "Q48. The Export Tariff comes under which schedule of Customs Tariff Act, 1975?", "options": [{"letter": "A", "text": "Schedule 1"}, {"letter": "B", "text": "Schedule 2"}, {"letter": "C", "text": "Schedule 3"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "Schedule 2", "explanation": "Customs Tariff Act मध्ये: Schedule 1 → Import Tariff Schedule 2 → Export Tariff म्हणून Export Tariff: 👉 Second Schedule मध्ये आहे.", "golden": "Schedule 1 → Import Schedule 2 → Export"}, {"no": 49, "q": "Q49. As per Customs Valuation (Determination of Value of Imported Goods) Rules, 2007, the cost of transport of the imported goods to the place of importation will include—", "options": [{"letter": "A", "text": "Ship demurrage charges on chartered vessel"}, {"letter": "B", "text": "Barge charges"}, {"letter": "C", "text": "Both (A) and (B)"}, {"letter": "D", "text": "Neither (A) nor (B)"}], "answer": "C", "answer_text": "Both A and B", "explanation": "Customs valuation मध्ये place of importation पर्यंत goods आणण्यासाठी झालेले transportation-related costs assessable value मध्ये consider केले जातात. यात: ✔️ Ship demurrage on chartered vessel ✔️ Barge charges दोन्हीचा समावेश होतो.", "golden": "Transport Cost → Demurrage + Barge Charges"}, {"no": 50, "q": "Q50. Which of the following condition is NOT correct with respect to “arrest” in Customs offence?", "options": [{"letter": "A", "text": "Fraudulent availment of drawback involving ₹2 crore or more"}, {"letter": "B", "text": "Outright smuggling of high value goods such as precious metals where value is ₹50 lakh or more"}, {"letter": "C", "text": "Importation of trade goods involving wilful misdeclaration in description where market value is ₹1 crore or more"}, {"letter": "D", "text": "Importation of trade goods involving wilful misdeclaration in description where market value is ₹2 crore or more"}], "answer": "C", "answer_text": "", "explanation": "Paper explanation नुसार arrest guidelines मध्ये serious offences साठी specified thresholds आहेत. C मधील ₹1 crore threshold हा current arrest condition शी जुळत नाही.", "golden": "Arrest → Serious Customs Offences + prescribed monetary thresholds ⚠️ Exam Tip: Q50 मध्ये C paper answer म्हणून लक्षात ठेवा. Q51–55"}, {"no": 51, "q": "Q51. What is the minimum period for which the auditee has to preserve and make available documents for the purpose of audit as per The Customs Audit Regulations, 2018?", "options": [{"letter": "A", "text": "Six years"}, {"letter": "B", "text": "Three years"}, {"letter": "C", "text": "Four years"}, {"letter": "D", "text": "Five years"}], "answer": "D", "answer_text": "Five years", "explanation": "Customs Audit Regulations, 2018 नुसार auditee ने relevant records: 👉 Minimum 5 years preserve करून audit साठी available ठेवणे आवश्यक आहे.", "golden": "Customs Audit Records → 5 Years"}, {"no": 52, "q": "Q52. Any authorized person who contravenes any provision of Bill of Entry (Electronic Integrated Declaration and Paperless Processing) Regulations, 2018 shall be liable to a penalty which may extend to—", "options": [{"letter": "A", "text": "₹50,000"}, {"letter": "B", "text": "₹30,000"}, {"letter": "C", "text": "₹20,000"}, {"letter": "D", "text": "₹40,000"}], "answer": "A", "answer_text": "₹50,000", "explanation": "Bill of Entry electronic processing regulations च्या provisions चे contravention झाल्यास penalty: 👉 Up to ₹50,000 असू शकते.", "golden": "BOE Electronic Regulations → Maximum Penalty ₹50,000"}, {"no": 53, "q": "Q53. As per Foreign Trade Policy, 2023, which goods are ineligible categories of import on self-declaration basis?", "options": [{"letter": "A", "text": "Honey"}, {"letter": "B", "text": "Rough Marble Blocks/Slabs"}, {"letter": "C", "text": "Both (A) and (B)"}, {"letter": "D", "text": "Neither (A) nor (B)"}], "answer": "C", "answer_text": "Both A and B", "explanation": "FTP 2023 मध्ये काही sensitive/restricted items साठी self-declaration पुरेसे नाही. यामध्ये: ✔️ Honey ✔️ Rough marble blocks/slabs यांचा समावेश आहे. त्यासाठी prescribed authorisation आवश्यक असते.", "golden": "Self-Declaration Ineligible → Honey + Rough Marble"}, {"no": 54, "q": "Q54. Fill in the blanks:", "options": [{"letter": "A", "text": "Lead or Arsenic compound"}, {"letter": "B", "text": "Hexachlorophene"}, {"letter": "C", "text": "Mercury compounds"}, {"letter": "D", "text": "All of the above"}], "answer": "D", "answer_text": "All of the above", "explanation": "Drugs & Cosmetics Rules मध्ये harmful/toxic substances असलेली cosmetics import करण्यावर restrictions आहेत. Paper नुसार: ✔️ Lead/Arsenic compounds ✔️ Hexachlorophene ✔️ Mercury compounds असलेली cosmetics prohibited आहेत.", "golden": "Cosmetics Import → Lead/Arsenic + Hexachlorophene + Mercury = Prohibited"}, {"no": 55, "q": "Q55. What is the full form of ITC (HS) as per Foreign Trade Policy?", "options": [{"letter": "A", "text": "Import Trade Code Harmonised System"}, {"letter": "B", "text": "Indian Trade Classification Harmonized System"}, {"letter": "C", "text": "International Trade Classification Harmonised System"}, {"letter": "D", "text": "Import Trade Classification Harmonised System"}], "answer": "B", "answer_text": "", "explanation": "ITC (HS) म्हणजे: Indian Trade Classification (Harmonized System) India च्या import/export goods classification साठी वापरले जाते.", "golden": "ITC (HS) → Indian Trade Classification (Harmonized System) Q56–60"}, {"no": 56, "q": "Q56. When did Customs Act, 1962 come into force?", "options": [{"letter": "A", "text": "1st April, 1962"}, {"letter": "B", "text": "1st April, 1963"}, {"letter": "C", "text": "1st July, 1962"}, {"letter": "D", "text": "1st February, 1963"}], "answer": "D", "answer_text": "1st February, 1963", "explanation": "Customs Act, 1962 हा 13 December 1962 रोजी enacted झाला. तो: 👉 1 February 1963 पासून लागू झाला.", "golden": "Customs Act, 1962 → Came into force on 1 Feb 1963"}, {"no": 57, "q": "Q57. In terms of Section 150 of Customs Act, 1962, the proceeds of any such sale arising out of goods not being confiscated goods shall be applied in following order:", "options": [{"letter": "A", "text": "Payment of expenses of sale Payment of freight and other charges Payment of duty Payment to Custodian of goods Payment to Owner of goods"}, {"letter": "B", "text": "Payment of freight and other charges Payment of expenses of sale Payment of duty Payment to Custodian Payment to Owner"}, {"letter": "C", "text": "Payment of expenses of sale Payment of duty Payment of freight and other charges Payment to Custodian Payment to Owner"}, {"letter": "D", "text": "Payment to Custodian Payment of expenses of sale Payment of freight and other charges Payment of duty Payment to Owner"}], "answer": "A", "answer_text": "", "explanation": "Section 150 मध्ये sale proceeds चा क्रम लक्षात ठेवा: 1️⃣ Expenses of sale 2️⃣ Freight & other charges 3️⃣ Customs duty 4️⃣ Custodian charges 5️⃣ Balance → Owner", "golden": "150 → Sale Expense → Freight → Duty → Custodian → Owner"}, {"no": 58, "q": "Q58. Under the Food Safety & Standards (Import) Regulations, 2017, the importer shall inform the Central Licensing Authority and Authorised Officer of any suspension, revocation or cancellation of the certificate of IEC number granted by DGFT not later than how many working days?", "options": [{"letter": "A", "text": "03 working days"}, {"letter": "B", "text": "05 working days"}, {"letter": "C", "text": "07 working days"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "3 working days", "explanation": "IEC certificate suspend/revoke/cancel झाल्यास importer ने संबंधित Food Safety authorities ना: 👉 3 working days मध्ये inform करणे आवश्यक आहे.", "golden": "FSS Import → IEC Change → 3 Working Days"}, {"no": 59, "q": "Q59. Under Customs Act, 1962, proper officer of Customs can provisionally attach any bank account with the approval of Commissioner of Customs for a period not exceeding—", "options": [{"letter": "A", "text": "One year extendable to further six months"}, {"letter": "B", "text": "Three months extendable to further three months"}, {"letter": "C", "text": "One year extendable to further one year"}, {"letter": "D", "text": "Six months extendable to further six months"}], "answer": "D", "answer_text": "Six months + six months", "explanation": "Section 110(5) नुसार proper officer bank account provisionally attach करू शकतो: 👉 Maximum 6 months आणि recorded reasons असल्यास further: 👉 6 months extend करता येते.", "golden": "Bank Account Attachment → 6 Months + 6 Months"}, {"no": 60, "q": "Q60. What do PMV referred in the Shipping Bill mean?", "options": [{"letter": "A", "text": "Present Making Value"}, {"letter": "B", "text": "Present Market Value"}, {"letter": "C", "text": "Product Manufacturing Value"}, {"letter": "D", "text": "Product Market Value"}], "answer": "B", "answer_text": "Present Market Value", "explanation": "Shipping Bill मध्ये: PMV = Present Market Value म्हणजे exported goods ची current market value. Drawback/export valuation संदर्भात PMV महत्त्वाचे आहे.", "golden": "PMV → Present Market Value"}, {"no": 61, "q": "Q61. As per Section 3 of Customs Act, 1962, which of the following are NOT included in classes of officers of Customs?", "options": [{"letter": "A", "text": "Chief Commissioner of Customs"}, {"letter": "B", "text": "Any other class of officers appointed for the purpose of Customs Act"}, {"letter": "C", "text": "Chairman Mumbai Port Trust"}, {"letter": "D", "text": "Pr. Additional Director General of Revenue Intelligence"}], "answer": "C", "answer_text": "Chairman Mumbai Port Trust", "explanation": "Section 3 मध्ये Customs officers च्या classes दिल्या आहेत. Chairman, Mumbai Port Trust हा Customs officer नाही.", "golden": "Sec.3 → Classes of Customs Officers"}, {"no": 62, "q": "Q62. Which of the following given options are correct with respect to Settlement Commission under Customs Act, 1962?", "options": [{"letter": "A", "text": "Settlement Commission can order provisional attachment of property of the applicant"}, {"letter": "B", "text": "Settlement Commission can grant immunity from prosecution and penalty"}, {"letter": "C", "text": "Both (A) and (B) are correct"}, {"letter": "D", "text": "Neither (A) nor (B) is correct"}], "answer": "C", "answer_text": "Both A and B", "explanation": "Settlement Commission कडे: ✔️ Applicant ची property provisionally attach करण्याची power आहे. ✔️ Conditions पूर्ण झाल्यास prosecution आणि penalty मधून immunity देऊ शकते.", "golden": "Settlement Commission → Provisional Attachment + Immunity"}, {"no": 63, "q": "Q63. Which of the following statement is correct for import or export of goods through Courier?", "options": [{"letter": "A", "text": "The Electronic Courier Export Manifest (CEM) is filed in Form F."}, {"letter": "B", "text": "Advance assessment of Courier Shipping Bills on the Express Cargo Clearance System (ECCS) is not available."}, {"letter": "C", "text": "Neither (A) nor (B) is true."}, {"letter": "D", "text": "Both (A) and (B) are true."}], "answer": "A", "answer_text": "", "explanation": "Courier exports साठी Electronic Courier Export Manifest (CEM): 👉 Form F मध्ये file केला जातो. ECCS मध्ये advance assessment facility उपलब्ध आहे, त्यामुळे B चुकीचे आहे.", "golden": "Courier Export → CEM → Form F"}, {"no": 64, "q": "Q64. The appeals made against the following orders passed by Commissioner (Appeals) are not allowed to be admitted before Appellate Tribunal if the case relates to—", "options": [{"letter": "A", "text": "Payment of Scrips"}, {"letter": "B", "text": "Payment of drawback"}, {"letter": "C", "text": "Payment of Customs duty"}, {"letter": "D", "text": "All the above"}], "answer": "B", "answer_text": "Payment of drawback", "explanation": "Customs Act Section 129A नुसार drawback संबंधित orders बाबत CESTAT appeal maintainable नाही. अशा matters साठी Revisionary Authority कडे revision mechanism आहे.", "golden": "CESTAT Exclusion → Drawback"}, {"no": 65, "q": "Q65. Who can be considered as a proper officer under Customs Act, 1962?", "options": [{"letter": "A", "text": "Officers of Central Excise"}, {"letter": "B", "text": "Officers of the Navy"}, {"letter": "C", "text": "Officers of Customs assigned the functions by the Principal Commissioner of Customs"}, {"letter": "D", "text": "Police Officers"}], "answer": "C", "answer_text": "", "explanation": "Proper Officer म्हणजे Customs Act अंतर्गत specific functions assigned केलेला Customs officer. म्हणून: 👉 Principal Commissioner ने functions assign केलेला Customs Officer proper officer ठरतो.", "golden": "Proper Officer → Customs Officer + Assigned Function"}, {"no": 66, "q": "Q66. Which regulation of Customs Brokers Licensing Regulations, 2018 mandates Customs brokers to be licensed for carrying business relating to bill of entry?", "options": [{"letter": "A", "text": "Regulation 3"}, {"letter": "B", "text": "Regulation 6"}, {"letter": "C", "text": "Regulation 5"}, {"letter": "D", "text": "Regulation 4"}], "answer": "A", "answer_text": "Regulation 3", "explanation": "CBLR 2018 च्या Regulation 3 नुसार Customs Broker म्हणून business करण्यासाठी licence आवश्यक आहे. विशेषतः import/export documentation मध्ये Customs Broker ला prescribed licence असणे आवश्यक आहे.", "golden": "CBLR → Regulation 3 → Licence Requirement"}, {"no": 67, "q": "Q67. The Transaction value in case of Imported goods shall include amount paid or payable for following Costs and services?", "options": [{"letter": "A", "text": "Engineering and Design work"}, {"letter": "B", "text": "Royalty"}, {"letter": "C", "text": "Commissions and Brokerage"}, {"letter": "D", "text": "All of the above"}], "answer": "D", "answer_text": "All of the above", "explanation": "Customs valuation मध्ये transaction value calculate करताना prescribed additions consider होतात. त्यात: ✔️ Engineering & design work ✔️ Royalty ✔️ Commissions & brokerage यांचा समावेश होऊ शकतो.", "golden": "Transaction Value → Prescribed additions → All above Q68–70"}, {"no": 68, "q": "Q68. Which of the following is NOT a part of the Arrival Manifest?", "options": [{"letter": "A", "text": "Cargo declaration"}, {"letter": "B", "text": "List of private property in possession of the Master and crew"}, {"letter": "C", "text": "Bill of Entry"}, {"letter": "D", "text": "Application for entry inward"}], "answer": "C", "answer_text": "Bill of Entry", "explanation": "Arrival Manifest मध्ये vessel/aircraft/vehicle आणि त्यातील cargo/passengers संबंधित details असतात. Bill of Entry हा importer/customs broker कडून imported goods च्या clearance साठी file केला जाणारा वेगळा document आहे.", "golden": "Arrival Manifest ≠ Bill of Entry"}, {"no": 69, "q": "Q69. Under Customs Act, 1962, which of the following statements with respect to X-Ray of suspected persons for detecting secreted goods, following is not correct?", "options": [{"letter": "A", "text": "Prior approval of Deputy/Assistant Commissioner"}, {"letter": "B", "text": "X-ray of female suspect can be done under supervision of any registered practitioner"}, {"letter": "C", "text": "Consent of the suspected person is required"}, {"letter": "D", "text": "The person shall be produced before nearest magistrate without delay"}], "answer": "B", "answer_text": "", "explanation": "Section 103 नुसार female suspect चा X-ray prescribed manner मध्ये female registered medical practitioner च्या supervision खाली करणे आवश्यक आहे. फक्त any registered practitioner म्हणणे चुकीचे आहे.", "golden": "Female Suspect X-Ray → Female Registered Medical Practitioner"}, {"no": 70, "q": "Q70. Which of the following is not true as per Customs (Electronic Cash Ledger) Regulations, 2022?", "options": [{"letter": "A", "text": "Electronic cash ledger can be used for making payment towards duty, interest, penalty, fee or any other amount."}, {"letter": "B", "text": "The deposit made in electronic cash ledger shall accrue interest as applicable."}, {"letter": "C", "text": "Deposit can be made through over-the-counter payment through an authorised bank."}, {"letter": "D", "text": "Balance after payment of duty, interest, penalty, fee etc. may be applied for refund."}], "answer": "B", "answer_text": "", "explanation": "Electronic Cash Ledger मध्ये deposit केलेल्या amount वर: ❌ Interest payable होत नाही. Ledger चा उपयोग Customs duty, interest, penalty, fee इत्यादी payments साठी केला जातो.", "golden": "Electronic Cash Ledger → Deposit earns NO Interest Q71–74"}, {"no": 71, "q": "Q71. Which of the following agencies are part of online message exchange mode in SWIFT?", "options": [{"letter": "A", "text": "Wildlife Crime Control Bureau (WCCB)"}, {"letter": "B", "text": "Plant Quarantine (PQ)"}, {"letter": "C", "text": "Animal Quarantine and Certification Services (AQCS)"}, {"letter": "D", "text": "All of the above"}], "answer": "D", "answer_text": "All of the above", "explanation": "SWIFT (Single Window Interface for Facilitating Trade) मध्ये Customs आणि Participating Government Agencies यांच्यात electronic message exchange होते. Paper मध्ये: ✔️ WCCB ✔️ PQ ✔️ AQCS सर्वांचा समावेश आहे.", "golden": "SWIFT → WCCB + PQ + AQCS"}, {"no": 72, "q": "Q72. The Bill of Lading is issued by whom?", "options": [{"letter": "A", "text": "Consignor"}, {"letter": "B", "text": "Custodian"}, {"letter": "C", "text": "Shipping Line"}, {"letter": "D", "text": "Inspector of Customs"}], "answer": "C", "answer_text": "Shipping Line", "explanation": "Bill of Lading हा carrier/shipping line कडून issued होणारा: Receipt of goods Contract of carriage Document of title म्हणून काम करणारा important document आहे.", "golden": "Bill of Lading → Shipping Line / Carrier"}, {"no": 73, "q": "Q73. What does Regulation 7 of “The Public Warehouse Licensing Regulations, 2016” mention?", "options": [{"letter": "A", "text": "Validity of licence"}, {"letter": "B", "text": "Non-Transferability of licence"}, {"letter": "C", "text": "Grant of licence"}, {"letter": "D", "text": "Conditions for licence"}], "answer": "B", "answer_text": "Non-Transferability of licence", "explanation": "Public Warehouse Licensing Regulations, 2016 मधील Regulation 7: 👉 Licence non-transferable आहे. म्हणजे licence दुसऱ्या व्यक्ती/entity ला transfer करता येत नाही.", "golden": "Public Warehouse Reg.7 → Non-Transferability"}, {"no": 74, "q": "Q74. If transaction value is rejected, following methods for Customs valuation are used:", "options": [{"letter": "A", "text": "1,2,3,4"}, {"letter": "B", "text": "4,2,3,1"}, {"letter": "C", "text": "4,1,3,2"}, {"letter": "D", "text": "4,3,2,1"}], "answer": "D", "answer_text": "4,3,2,1", "explanation": "Transaction value reject झाल्यानंतर valuation methods चा क्रम: 1️⃣ Identical goods / Similar goods 2️⃣ Deductive Value Method 3️⃣ Computed Value Method 4️⃣ Residual Method म्हणजे दिलेल्या numbering प्रमाणे: 👉 4 → 3 → 2 → 1", "golden": "Valuation Sequence → Identical/Similar → Deductive → Computed → Residual Q75–80"}, {"no": 75, "q": "Q75. Before disposal of seized gold in any form, an application to certify correctness of inventory under Section 110 of Customs Act, 1962, will be filed by the proper officer to—", "options": [{"letter": "A", "text": "Jurisdictional Commissioner of Customs"}, {"letter": "B", "text": "Jurisdictional Commissioner (Appeals) of Customs"}, {"letter": "C", "text": "Gold Disposal Committee"}, {"letter": "D", "text": "Magistrate"}], "answer": "B", "answer_text": "Jurisdictional Commissioner (Appeals) of Customs", "explanation": "Section 110(1B) नुसार seized gold dispose करण्यापूर्वी inventory ची correctness certify करण्यासाठी proper officer ने application: 👉 Jurisdictional Commissioner (Appeals) यांच्याकडे करायची असते.", "golden": "Seized Gold Inventory → Commissioner (Appeals)"}, {"no": 76, "q": "Q76. In relation to TRS (Time Release Study) in Customs, which of the statement below are correct?", "options": [{"letter": "A", "text": "It is a performance measurement tool."}, {"letter": "B", "text": "It presents quantitative measure of the cargo release time."}, {"letter": "C", "text": "It assesses progress made towards the National Trade Facilitation Action Plan targets."}, {"letter": "D", "text": "All of the above."}], "answer": "D", "answer_text": "All of the above", "explanation": "TRS = Time Release Study हे: ✔️ Performance measurement tool आहे ✔️ Cargo release time measure करते ✔️ National Trade Facilitation Action Plan च्या progress चे assessment करते", "golden": "TRS → Cargo Release Time + Performance + Trade Facilitation"}, {"no": 77, "q": "Q77. In which of the following circumstances, the imported goods can be provisionally assessed?", "options": [{"letter": "A", "text": "When importer is unable to make self-assessment"}, {"letter": "B", "text": "When imported goods are necessarily subjected to chemical test"}, {"letter": "C", "text": "Where necessary documents have not been produced"}, {"letter": "D", "text": "All the options are correct"}], "answer": "D", "answer_text": "All", "explanation": "Customs Act Section 18 अंतर्गत provisional assessment खालील परिस्थितीत होऊ शकते: ✔️ Importer self-assessment करू शकत नाही ✔️ Chemical/other test आवश्यक आहे ✔️ Necessary documents/information available नाही म्हणून All options.", "golden": "Sec.18 → Provisional Assessment"}, {"no": 78, "q": "Q78. As per Hazardous and Other Wastes (Management and Transboundary Movement) Rules, 2016, in case of illegal import of hazardous or other waste, importer shall re-export the waste at his cost within a period of ______ from the date of its arrival into India.", "options": [{"letter": "A", "text": "90 days"}, {"letter": "B", "text": "60 days"}, {"letter": "C", "text": "180 days"}, {"letter": "D", "text": "45 days"}], "answer": "A", "answer_text": "90 days", "explanation": "Illegal import झालेला hazardous/other waste: 👉 90 days मध्ये importer's cost वर re-export करणे आवश्यक आहे.", "golden": "Illegal Hazardous Waste → Re-export → 90 Days"}, {"no": 79, "q": "Q79. Which of the following is correct as per the Customs Broker Licensing Regulations, 2018 (as amended)?", "options": [{"letter": "A", "text": "A licensee may surrender licence granted through written request to Commissioner of Customs who has issued the licence."}, {"letter": "B", "text": "A Customs Broker licence once granted is valid for 15 years."}, {"letter": "C", "text": "A Customs Broker licence can be transferred to a legal heir unconditionally in event of death of licence holder."}, {"letter": "D", "text": "A Customs Broker can employ a person who is a F Card holder to assist him."}], "answer": "A", "answer_text": "", "explanation": "CBLR Regulation 8A नुसार licence holder written request देऊन licence surrender करू शकतो. पण: ❌ Licence 15 years साठी fixed नाही. ❌ Licence legal heir कडे unconditionally transfer होत नाही. ❌ F-card holder बाबत statement योग्य नाही.", "golden": "CB Licence → Voluntary Surrender → Written Request"}, {"no": 80, "q": "Q80. Who can grant exemption to goods from Customs duty at a particular port?", "options": [{"letter": "A", "text": "Chief Commissioner of Customs"}, {"letter": "B", "text": "Any Minister of India"}, {"letter": "C", "text": "CBIC"}, {"letter": "D", "text": "Central Government"}], "answer": "D", "answer_text": "Central Government", "explanation": "Customs Act Section 25(2) नुसार Central Government ला particular port वर imported goods ना customs duty मधून exemption देण्याची power आहे. Chief Commissioner किंवा CBIC स्वतः Section 25(2) अंतर्गत exemption order grant करत नाही.", "golden": "Sec.25(2) → Particular Port Exemption → Central Government"}, {"no": 81, "q": "Q81. Which of the following statement is not correct with respect to Intellectual Property Rights (Imported Goods) Enforcement Rules, 2007?", "options": [{"letter": "A", "text": "After the grant of registration of the notice by the Commissioner of Customs, import of allegedly infringing goods into India shall be deemed prohibited."}, {"letter": "B", "text": "Assistant Commissioner of Customs can on his own initiative suspend the clearance of goods infringing intellectual property rights."}, {"letter": "C", "text": "Right holder should join the proceedings within a period of ten working days from date of suspension of clearance unless extended."}, {"letter": "D", "text": "The goods infringing intellectual property rights in an unaltered state can be allowed to be re-exported."}], "answer": "D", "answer_text": "", "explanation": "IPR rules अंतर्गत infringing goods ची clearance suspend केली जाऊ शकते. Paper explanation नुसार unaltered state मध्ये infringing goods re-export करण्याची परवानगी देता येत नाही. म्हणून D हे incorrect statement आहे.", "golden": "IPR Infringing Goods → Unaltered State मध्ये Re-export allowed नाही"}, {"no": 82, "q": "Q82. Under Customs Act, 1962 prosecution can be launched with approval of competent authority, if a person is found to be indulging in unauthorised importation in baggage where the market value of the goods involved is:", "options": [{"letter": "A", "text": "₹50,00,000/- or more"}, {"letter": "B", "text": "₹1,00,000/- or more"}, {"letter": "C", "text": "₹2,00,000/- or more"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "₹50 lakh or more", "explanation": "Paper मध्ये दिलेल्या Circular No. 13/2022 नुसार baggage मध्ये unauthorised importation ची market value: 👉 ₹50 lakh किंवा त्यापेक्षा जास्त असल्यास prosecution साठी competent authority ची approval आवश्यक आहे.", "golden": "Baggage Unauthorised Import → ₹50 Lakh+ → Prosecution"}, {"no": 83, "q": "Q83. Any person aggrieved by any decision or order passed by an officer of Customs lower in rank than a Commissioner of Customs may appeal to the Commissioner (Appeals) within ______ days from the date of communication.", "options": [{"letter": "A", "text": "30 days"}, {"letter": "B", "text": "45 days"}, {"letter": "C", "text": "60 days"}, {"letter": "D", "text": "90 days"}], "answer": "C", "answer_text": "60 days", "explanation": "Customs Act Section 128 नुसार Commissioner पेक्षा lower rank च्या officer च्या order विरुद्ध appeal: 👉 60 days मध्ये Commissioner (Appeals) कडे करता येते. Sufficient cause असल्यास Commissioner (Appeals) further 30 days पर्यंत delay condone करू शकतो.", "golden": "Sec.128 → Appeal → 60 Days + possible 30 days extension"}, {"no": 84, "q": "Q84. Who along with Customs authorities is mandated to collaborate for examination of infringing copies as per the provisions of Copyright Rules, 1958?", "options": [{"letter": "A", "text": "Ministry of Human Resource Development"}, {"letter": "B", "text": "Registrar of Copyrights"}, {"letter": "C", "text": "Copyright Authority of India"}, {"letter": "D", "text": "Censor Board of India"}], "answer": "B", "answer_text": "Registrar of Copyrights", "explanation": "Copyright Rules, 1958 नुसार Customs authorities ना infringing/pirated copies identify करण्यासाठी: 👉 Registrar of Copyrights यांच्याकडून technical assistance/expert opinion मिळू शकते.", "golden": "Copyright Infringing Goods + Customs → Registrar of Copyrights"}, {"no": 85, "q": "Q85. The importer shall present the Bill of Entry under Section 46 of Customs Act, 1962:", "options": [{"letter": "A", "text": "Before the end of the day (including holidays) preceding the day on which the vessel arrives at a Customs Station."}, {"letter": "B", "text": "Before the end of the next day (excluding holidays) following the day on which the vessel arrives."}, {"letter": "C", "text": "On the same day on which the vessel arrives."}, {"letter": "D", "text": "None of the options is correct."}], "answer": "A", "answer_text": "", "explanation": "Section 46(3) नुसार importer ने Bill of Entry: 👉 vessel customs station वर येण्याच्या preceding day च्या end पूर्वी, holidays सहित, file करायचा असतो. याला advance filing म्हणतात.", "golden": "Sec.46 → BOE → Previous Day End Before Arrival"}, {"no": 86, "q": "Q86. What shall be a valid shelf life of any article of food at the time of customs clearance, as per Food Safety and Standards (Import) Amendment Regulations, 2018?", "options": [{"letter": "A", "text": "Valid shelf life of not less than sixty per cent or six months before expiry whichever is less."}, {"letter": "B", "text": "Valid shelf life of not less than sixty per cent or three months before expiry whichever is less."}, {"letter": "C", "text": "Valid shelf life of not less than fifty per cent or three months before expiry whichever is less."}, {"letter": "D", "text": "Valid shelf life of not less than fifty per cent or six months before expiry whichever is less."}], "answer": "B", "answer_text": "", "explanation": "Food import clearance वेळी article ची remaining shelf life: 👉 60% किंवा 3 months before expiry, whichever is less असणे आवश्यक आहे.", "golden": "Food Shelf Life → 60% OR 3 Months → Whichever is Less Q87–90"}, {"no": 87, "q": "Q87. What is the minimum value addition required for exporting under Advance Authorisation Scheme?", "options": [{"letter": "A", "text": "10%"}, {"letter": "B", "text": "25%"}, {"letter": "C", "text": "35%"}, {"letter": "D", "text": "15%"}], "answer": "D", "answer_text": "15%", "explanation": "FTP 2023 नुसार Advance Authorisation अंतर्गत सामान्य minimum value addition: 👉 15% आहे. काही specified products साठी वेगळे value addition rates लागू होऊ शकतात.", "golden": "Advance Authorisation → General Minimum VA = 15%"}, {"no": 88, "q": "Q88. Which of the following statement is/are correct with respect to smuggled goods?", "options": [{"letter": "A", "text": "Any goods used for concealing smuggled goods shall also be liable to confiscation."}, {"letter": "B", "text": "Where any goods imported in a package are liable to confiscation, the package and any other goods imported in that package shall also be liable to confiscation."}, {"letter": "C", "text": "Smuggled goods may be confiscated notwithstanding any change in their form."}, {"letter": "D", "text": "All of the above."}], "answer": "D", "answer_text": "All of the above", "explanation": "Customs Act मध्ये smuggled goods बाबत: ✔️ Concealment साठी वापरलेले goods confiscate होऊ शकतात. ✔️ Package आणि त्यातील relevant goods confiscation ला subject होऊ शकतात. ✔️ Goods चे form बदलले तरी confiscation लागू होऊ शकते.", "golden": "Smuggled Goods → Concealing Goods + Package + Changed Form → Confiscation"}, {"no": 89, "q": "Q89. What is the purpose of ICEDASH?", "options": [{"letter": "A", "text": "It is dashboard showing details of various cases booked by Customs offices."}, {"letter": "B", "text": "It is dashboard to upload digitally signed documents."}, {"letter": "C", "text": "It is a dashboard showing performance of clearing process at various Customs formations."}, {"letter": "D", "text": "It is dashboard available only to CBIC to monitor officers' performance."}], "answer": "C", "answer_text": "", "explanation": "ICEDASH हे Customs clearance performance चे monitoring dashboard आहे. यामध्ये different ports/airports वरील clearance time compare करता येतो.", "golden": "ICEDASH → Customs Clearance Performance Dashboard"}, {"no": 90, "q": "Q90. What is the eligibility of an importer having Authorised Economic Operator (AEO) T2 to get the status of Authorised Economic Operator (AEO) T3?", "options": [{"letter": "A", "text": "AEO T2 continuously for 6 months preceding application"}, {"letter": "B", "text": "AEO T2 continuously for 1 year preceding application"}, {"letter": "C", "text": "AEO T2 continuously for 9 months preceding application"}, {"letter": "D", "text": "AEO T2 continuously for at least 2 years preceding application"}], "answer": "D", "answer_text": "At least 2 years", "explanation": "AEO T3 हा higher level certification आहे. AEO T2 holder ने: 👉 Application च्या आधी किमान 2 वर्षे continuously AEO T2 status maintain केलेले असणे आवश्यक आहे.", "golden": "AEO T2 → T3 → 2 Years Continuous Q91–95"}, {"no": 91, "q": "Q91. Which of the following is correct about Settlement Commission under Customs Act, 1962?", "options": [{"letter": "A", "text": "The applicant can withdraw the application made to Settlement Commission."}, {"letter": "B", "text": "Applications pending before Appellate Tribunal can also be admitted by Settlement Commission."}, {"letter": "C", "text": "Settlement Commission can accept application for any type of cases booked under Customs Act."}, {"letter": "D", "text": "Settlement Commission cannot accept application with respect to goods to which Section 123 of Customs Act applies."}], "answer": "D", "answer_text": "", "explanation": "Section 127B नुसार Settlement Commission काही specified categories मध्ये application entertain करू शकत नाही. यामध्ये Section 123 अंतर्गत covered goods येतात. उदा. notified smuggled goods categories.", "golden": "Settlement Commission → Sec.123 Goods → Application NOT accepted"}, {"no": 92, "q": "Q92. Which chapter under Customs Act, 1962 deals with Audit provisions?", "options": [{"letter": "A", "text": "Chapter XII"}, {"letter": "B", "text": "Chapter XI"}, {"letter": "C", "text": "Chapter XIIA"}, {"letter": "D", "text": "Chapter XIA"}], "answer": "C", "answer_text": "Chapter XIIA", "explanation": "Customs Act मध्ये audit provisions: 👉 Chapter XIIA मध्ये आहेत. Chapter XIIA Section 99A पासून संबंधित provisions cover करतो.", "golden": "Audit → Chapter XIIA → Sec.99A"}, {"no": 93, "q": "Q93. The penalty for fraudulent utilisation of input tax credit for claiming refund is provided under which of the following?", "options": [{"letter": "A", "text": "Rule 9 of CGST Rules"}, {"letter": "B", "text": "Section 10 of IGST Act"}, {"letter": "C", "text": "Section 114AC of Customs Act"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Section 114AC", "explanation": "Section 114AC of Customs Act, 1962 fraudulent documents/invoices वापरून input tax credit च्या आधारावर refund claim करण्याशी संबंधित penalty provision देते. Penalty: 👉 Refund claimed च्या amount च्या five times पर्यंत जाऊ शकते.", "golden": "Fraudulent ITC Refund → Sec.114AC"}, {"no": 94, "q": "Q94. Under whose permission a licensee shall allow transfer of warehoused goods to another warehouse as per the Warehouse (Custody and Handling of Goods) Regulations, 2016?", "options": [{"letter": "A", "text": "Bond Officer"}, {"letter": "B", "text": "Central Excise Inspector"}, {"letter": "C", "text": "Licensee"}, {"letter": "D", "text": "Port Officer"}], "answer": "A", "answer_text": "Bond Officer", "explanation": "Warehouse मधून goods दुसऱ्या warehouse मध्ये transfer करताना: 👉 Bond Officer ची permission आवश्यक आहे. Bond Officer movement आणि compliance supervise करतो.", "golden": "Warehouse Transfer → Permission of Bond Officer"}, {"no": 95, "q": "Q95. An appeal against the advance ruling can be filed in the ______ within ______ from the date of communication of such ruling.", "options": [{"letter": "A", "text": "CESTAT, 90 days"}, {"letter": "B", "text": "CESTAT, 60 days"}, {"letter": "C", "text": "High Court, 60 days"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "High Court, 60 days", "explanation": "Customs Act Section 28KA नुसार Authority for Advance Rulings च्या ruling विरुद्ध appeal: 👉 High Court मध्ये: 👉 60 days मध्ये करता येते. Sufficient cause असल्यास further period मिळू शकतो.", "golden": "Advance Ruling Appeal → High Court → 60 Days Q96–100"}, {"no": 96, "q": "Q96. The goods mentioned in which of the following schedule of Hazardous and Other Wastes (Management and Transboundary Movement) Rules, 2016 are prohibited for import?", "options": [{"letter": "A", "text": "Schedule IV"}, {"letter": "B", "text": "Schedule VI"}, {"letter": "C", "text": "Schedule V"}, {"letter": "D", "text": "Schedule III"}], "answer": "B", "answer_text": "Schedule VI", "explanation": "Hazardous and Other Wastes Rules, 2016 मध्ये: 👉 Schedule VI मध्ये India मध्ये import साठी prohibited hazardous/other wastes ची category दिली आहे.", "golden": "Hazardous Waste → Prohibited Import → Schedule VI"}, {"no": 97, "q": "Q97. The search of any persons under the provisions of Customs Act, 1962 is required to be taken before whom?", "options": [{"letter": "A", "text": "Gazetted Officer of Customs"}, {"letter": "B", "text": "Magistrate"}, {"letter": "C", "text": "Either (A) or (B)"}, {"letter": "D", "text": "No such requirement is there"}], "answer": "C", "answer_text": "Either A or B", "explanation": "Section 102 नुसार search करण्यापूर्वी searched person ला त्याचा अधिकार सांगितला पाहिजे. त्याला: 👉 Gazetted Officer of Customs किंवा Magistrate समोर search घेण्याचा option दिला जातो.", "golden": "Sec.102 → Search → Gazetted Officer OR Magistrate"}, {"no": 98, "q": "Q98. Customs (Assistance in Value Declaration of Imported Goods) Rules, 2023 shall not be applicable to which of the following?", "options": [{"letter": "A", "text": "Goods which attract import duty on specific rate basis"}, {"letter": "B", "text": "Project Imports"}, {"letter": "C", "text": "Goods imported for the purpose of re-export"}, {"letter": "D", "text": "All the options are correct"}], "answer": "D", "answer_text": "All", "explanation": "Rule 13 नुसार specific categories या Rules च्या applicability मधून excluded आहेत: ✔️ Specific-rate duty goods ✔️ Project imports ✔️ Re-export साठी imported goods म्हणून: 👉 All options are correct.", "golden": "AVD Rules → Specific Rate + Project Import + Re-export → Excluded"}, {"no": 99, "q": "Q99. Who is having the power to notify to prohibit importation or exportation of goods under Section 11 of Customs Act, 1962?", "options": [{"letter": "A", "text": "CBIC"}, {"letter": "B", "text": "Finance Secretary"}, {"letter": "C", "text": "Commissioner of Customs"}, {"letter": "D", "text": "Central Government"}], "answer": "D", "answer_text": "Central Government", "explanation": "Customs Act Section 11 नुसार public interest मध्ये goods ची import/export prohibit करण्यासाठी notification issue करण्याची power: 👉 Central Government कडे आहे. Reasons मध्ये national security, shortage/conservation of foreign exchange इत्यादी असू शकतात.", "golden": "Sec.11 → Prohibit Import/Export → Central Government"}, {"no": 100, "q": "Q100. The Export authorisation for export of Narcotic Drugs is given by?", "options": [{"letter": "A", "text": "Commissioner of Customs"}, {"letter": "B", "text": "Narcotics Commissioner"}, {"letter": "C", "text": "Drugs Controller, Government of India"}, {"letter": "D", "text": "Concerned State Government"}], "answer": "B", "answer_text": "Narcotics Commissioner", "explanation": "Narcotic Drugs च्या export साठी authorisation: 👉 Narcotics Commissioner, Central Bureau of Narcotics (CBN), Gwalior यांच्याकडून दिले जाते.", "golden": "Narcotic Drugs Export → Narcotics Commissioner"}, {"no": 101, "q": "Q101. Which of the following section of the Customs Act, 1962 empowers the Board (CBIC) to make regulations regarding goods imported or to be exported by post?", "options": [{"letter": "A", "text": "Section 81"}, {"letter": "B", "text": "Section 86"}, {"letter": "C", "text": "Section 83"}, {"letter": "D", "text": "Section 84"}], "answer": "D", "answer_text": "Section 84", "explanation": "Section 84 अंतर्गत CBIC ला post द्वारे imported/exported goods संदर्भात regulations करण्याची power आहे.", "golden": "Sec.84 → Goods imported/exported by Post"}, {"no": 102, "q": "Q102. The proper officer shall not serve the Show Cause Notice under Section 28 of Customs Act, 1962, if—", "options": [{"letter": "A", "text": "The amount involved is less than ₹100"}, {"letter": "B", "text": "The amount involved is less than ₹1,000"}, {"letter": "C", "text": "The amount involved is less than ₹50"}, {"letter": "D", "text": "The amount involved is less than ₹500"}], "answer": "A", "answer_text": "Less than ₹100", "explanation": "Section 28 अंतर्गत duty/interest amount ₹100 पेक्षा कमी असल्यास Show Cause Notice serve करण्याची आवश्यकता नाही.", "golden": "Sec.28 → SCN not required → Amount < ₹100"}, {"no": 103, "q": "Q103. Which of the following is NOT part of Screening Committee for the purpose of Customs (Assistance in Value Declaration of Imported Goods) Rules, 2023?", "options": [{"letter": "A", "text": "Director General of Analytics and Risk Management"}, {"letter": "B", "text": "Additional Director General of Revenue Intelligence"}, {"letter": "C", "text": "Convenor of National Assessment Centre"}, {"letter": "D", "text": "Director General of Valuation"}], "answer": "B", "answer_text": "Additional Director General of Revenue Intelligence", "explanation": "Screening Committee मध्ये: ✔️ DG Analytics & Risk Management ✔️ Convenor of National Assessment Centre ✔️ DG Valuation यांचा समावेश आहे. ADG DRI हा Committee चा member नाही.", "golden": "AVD Screening Committee → ADG DRI = Not Member"}, {"no": 104, "q": "Q104. The electronic cash ledger shall be maintained in which form?", "options": [{"letter": "A", "text": "Form ECL-2"}, {"letter": "B", "text": "Form ECL-3"}, {"letter": "C", "text": "Form ECL-4"}, {"letter": "D", "text": "Form ECL-1"}], "answer": "D", "answer_text": "Form ECL-1", "explanation": "Customs Electronic Cash Ledger Regulations, 2022 नुसार: 👉 ECL = Form ECL-1 मध्ये electronic cash ledger maintain केला जातो. ECL-2 हा deposit challan साठी वापरला जातो.", "golden": "ECL Ledger → ECL-1"}, {"no": 105, "q": "Q105. As per Customs (Electronic Cash Ledger) Regulations, 2022, maximum limit of over-the-counter payment in a day for deposit into electronic cash ledger, in case of a person is……?", "options": [{"letter": "A", "text": "₹5,000"}, {"letter": "B", "text": "₹10,000"}, {"letter": "C", "text": "₹20,000"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "₹10,000", "explanation": "Over-the-counter payment द्वारे एका व्यक्तीने एका दिवसात Electronic Cash Ledger मध्ये deposit करता येणारी maximum amount: 👉 ₹10,000 आहे.", "golden": "ECL OTC Deposit → ₹10,000/day/person"}, {"no": 106, "q": "Q106. Who is the competent Authority to impose penalty on an aircraft operator or his authorised agent who contravenes or fails to comply with any provisions of Passenger Name Record Information Regulations, 2022?", "options": [{"letter": "A", "text": "Director General, NCTC"}, {"letter": "B", "text": "Adjudicating Authority"}, {"letter": "C", "text": "Additional Director General, NCTC-Passenger"}, {"letter": "D", "text": "Commissioner of Customs"}], "answer": "C", "answer_text": "Additional Director General, NCTC-Passenger", "explanation": "PNR Regulations, 2022 मध्ये non-compliance साठी penalty impose करण्याची competent authority: 👉 Additional Director General, NCTC-Passenger आहे.", "golden": "PNR Penalty → ADG, NCTC-Passenger Q107–110"}, {"no": 107, "q": "Q107. Which Rule under CGST Rules, 2017 deals with a refund of IGST paid on goods exported out of India?", "options": [{"letter": "A", "text": "Rule 96"}, {"letter": "B", "text": "Rule 86"}, {"letter": "C", "text": "Rule 98"}, {"letter": "D", "text": "Rule 88"}], "answer": "A", "answer_text": "Rule 96", "explanation": "Export of goods वर paid IGST चा refund मिळण्यासाठी relevant provision: 👉 Rule 96 of CGST Rules, 2017 आहे. Shipping Bill हा refund application म्हणून treated होतो, subject to prescribed conditions.", "golden": "IGST Refund on Export → CGST Rule 96"}, {"no": 108, "q": "Q108. Who is the proper officer under Customs Act, 1962, to stop and search conveyance?", "options": [{"letter": "A", "text": "Officer of rank Assistant Commissioner of Customs and above"}, {"letter": "B", "text": "Officer of rank Superintendent of Customs and above"}, {"letter": "C", "text": "Officer of rank Preventive/Examiner of Customs and above"}, {"letter": "D", "text": "Officer of rank Joint Commissioner of Customs and above"}], "answer": "C", "answer_text": "Preventive/Examiner of Customs and above", "explanation": "Section 106 read with Circular No. 26/2022 नुसार conveyance stop/search करण्यासाठी proper officer म्हणून: 👉 Preventive Officer / Examiner आणि त्यापेक्षा senior officer अधिकृत आहेत.", "golden": "Sec.106 → Stop/Search Conveyance → Preventive/Examiner+"}, {"no": 109, "q": "Q109. What is the full form of e-SANCHIT?", "options": [{"letter": "A", "text": "E-storage application network and computerized hardware of Indirect Tax"}, {"letter": "B", "text": "E-storage and computerized handling of indirect tax documents"}, {"letter": "C", "text": "E-storage application for centralized handling of indirect tax documents"}, {"letter": "D", "text": "E-storage application for computerized handling of indirect tax documents"}], "answer": "B", "answer_text": "", "explanation": "e-SANCHIT = E-storage and computerized handling of indirect tax documents. हे Customs चे digital document platform आहे.", "golden": "e-SANCHIT → E-storage + Computerized Handling of Indirect Tax Documents"}, {"no": 110, "q": "Q110. Which of the following statements are correct?", "options": [{"letter": "A", "text": "Export of jewellery through Foreign Post Office is allowed."}, {"letter": "B", "text": "Personal carriage of gems and jewellery export parcels by foreign-bound passengers is allowed."}, {"letter": "C", "text": "Both (A) and (B) are correct."}, {"letter": "D", "text": "Neither (A) nor (B) are correct."}], "answer": "C", "answer_text": "Both A & B", "explanation": "Paper नुसार: ✔️ Jewellery export through Foreign Post Office allowed आहे. ✔️ Foreign-bound passenger कडून personal carriage of gems/jewellery export parcels देखील permitted आहे. म्हणून: 👉 A + B = C", "golden": "Jewellery Export → FPO + Personal Carriage permitted Q111–115"}, {"no": 111, "q": "Q111. Under Customs Valuation (Determination of Value of Imported Goods) Rules, 2007, “Computed Value” is mentioned under which rule?", "options": [{"letter": "A", "text": "Rule 8"}, {"letter": "B", "text": "Rule 6"}, {"letter": "C", "text": "Rule 5"}, {"letter": "D", "text": "Rule 7"}], "answer": "A", "answer_text": "Rule 8", "explanation": "Customs Valuation Rules मध्ये: 👉 Rule 8 = Computed Value Method हा method materials, production cost, profit आणि other prescribed costs वर आधारित असतो.", "golden": "Computed Value → Rule 8"}, {"no": 112, "q": "Q112. Which section of Customs Act, 1962 deals with cancelling of licence of warehouses?", "options": [{"letter": "A", "text": "Section 59"}, {"letter": "B", "text": "Section 58B"}, {"letter": "C", "text": "Section 58"}, {"letter": "D", "text": "Section 58A"}], "answer": "B", "answer_text": "Section 58B", "explanation": "Warehouse licence cancellation साठी: 👉 Section 58B लक्षात ठेवा: Sec.58 → Private Warehouse Sec.58A → Special Warehouse Sec.58B → Cancellation of Warehouse Licence", "golden": "Sec.58B → Cancellation of Warehouse Licence"}, {"no": 113, "q": "Q113. Who is authorised to empower an officer of Customs to search any person who has secreted any goods of the description specified in Section 101(2) of Customs Act, 1962?", "options": [{"letter": "A", "text": "Commissioner of Customs"}, {"letter": "B", "text": "Chief Commissioner of Customs"}, {"letter": "C", "text": "Superintendent of Customs"}, {"letter": "D", "text": "Assistant/Deputy Commissioner of Customs"}], "answer": "A", "answer_text": "Commissioner of Customs", "explanation": "Section 101(2) अंतर्गत अशा person ची search authorise करण्याचा अधिकार: 👉 Commissioner of Customs यांच्याकडे आहे.", "golden": "Sec.101(2) → Search Authorisation → Commissioner"}, {"no": 114, "q": "Q114. What is the full form of IGCR?", "options": [{"letter": "A", "text": "Import of Goods at Cost-effective rate"}, {"letter": "B", "text": "Import of Goods at Concessional rate"}, {"letter": "C", "text": "Import of Goods at Customs Rate"}, {"letter": "D", "text": "None of the options is correct"}], "answer": "B", "answer_text": "", "explanation": "IGCR = Import of Goods at Concessional Rate. IGCR Rules अंतर्गत specified purpose साठी imported goods वर concessional customs duty benefit मिळतो.", "golden": "IGCR → Import of Goods at Concessional Rate"}, {"no": 115, "q": "Q115. What is the duration of the New Foreign Trade Policy, 2023?", "options": [{"letter": "A", "text": "The duration of policy is five years"}, {"letter": "B", "text": "It is an open-ended policy"}, {"letter": "C", "text": "The duration of policy is ten years"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "Open-ended policy", "explanation": "FTP 2023 ही previous FTP प्रमाणे fixed 5-year duration ची नाही. ती: 👉 Open-ended policy आहे आणि changes/updates notifications द्वारे करता येतात.", "golden": "FTP 2023 → Open-ended Policy Q116–120"}, {"no": 116, "q": "Q116. What are the conditions for retired officer of CBIC for eligibility to apply for Customs Broker licence?", "options": [{"letter": "A", "text": "He should be a retired Group A officer and should have a minimum of five years' experience in Group A and Group B post taken together."}, {"letter": "B", "text": "He is retired as a Group A officer."}, {"letter": "C", "text": "He should be a retired Group A officer and have a minimum of five years' experience in Group A post."}, {"letter": "D", "text": "He should be a retired Group A officer and have a minimum of two years' experience in Group A post."}], "answer": "C", "answer_text": "", "explanation": "CBLR 2018 Regulation 5(2) नुसार retired Group A officer ला Customs Broker licence साठी eligibility मिळण्यासाठी: 👉 Retired Group A officer + minimum 5 years' experience in Group A post आवश्यक आहे.", "golden": "Retired CBIC Group A → 5 Years Group A Experience"}, {"no": 117, "q": "Q117. Who is empowered to make regulations consistent with the Customs Act, 1962?", "options": [{"letter": "A", "text": "Additional Director General of Directorate of Revenue Intelligence"}, {"letter": "B", "text": "Commissioner of Customs"}, {"letter": "C", "text": "Central Board of Indirect Taxes and Customs"}, {"letter": "D", "text": "State Government"}], "answer": "C", "answer_text": "CBIC", "explanation": "Customs Act Section 157 अंतर्गत: 👉 Central Board of Indirect Taxes and Customs (CBIC) ला Act शी consistent regulations बनवण्याची power आहे. लक्षात ठेवा: Sec.156 → Central Government → Rules Sec.157 → CBIC → Regulations", "golden": "Sec.157 → CBIC → Regulations"}, {"no": 118, "q": "Q118. Which of the following option is NOT correct with respect to Customs and Central Excise Duties Drawback Rules, 2017?", "options": [{"letter": "A", "text": "Exporter can make an application for fixing drawback, if amount/rate of drawback determined for class of goods is less than 80% of duties paid on materials used in production."}, {"letter": "B", "text": "The drawback amount shall not exceed one fourth of the market price of the export product."}, {"letter": "C", "text": "The rate of drawback is determined by Central Government."}, {"letter": "D", "text": "None of the options are correct."}], "answer": "B", "answer_text": "", "explanation": "Rule 9 नुसार drawback amount/rate बाबत: 👉 Drawback amount one-third of the market price पेक्षा जास्त नसावा. Option B मध्ये one-fourth म्हटले आहे. म्हणून B चुकीचे आहे.", "golden": "Drawback → Maximum 1/3 of Export Product Market Price"}, {"no": 119, "q": "Q119. Who is considered to be a F Card Holder as per Customs Brokers Licensing Regulations, 2018?", "options": [{"letter": "A", "text": "A person who has passed the examination referred to in Regulation 13"}, {"letter": "B", "text": "A person having status of Authorised Economic Operator"}, {"letter": "C", "text": "A person who has passed the examination referred to in Regulation 6"}, {"letter": "D", "text": "A person who has not passed the examination referred to in Regulation 6"}], "answer": "C", "answer_text": "", "explanation": "CBLR 2018 नुसार F Card Holder म्हणजे: 👉 Regulation 6 मध्ये referred examination पास केलेली व्यक्ती. F Card holder licensed Customs Broker च्या employee म्हणून customs clearance related functions perform करू शकतो.", "golden": "F Card → Regulation 6 Examination Passed"}, {"no": 120, "q": "Q120. Who is the “Specified Authority” under Controlled Delivery (Customs) Regulations, 2022?", "options": [{"letter": "A", "text": "Commissioner of Customs of the concerned Port/Airport"}, {"letter": "B", "text": "Additional Director General of Directorate General of Revenue Intelligence"}, {"letter": "C", "text": "Chief Commissioner of Customs of the concerned Port/Airport"}, {"letter": "D", "text": "Deputy Director General of Directorate General of Revenue Intelligence"}], "answer": "B", "answer_text": "Additional Director General, DRI", "explanation": "Controlled Delivery Regulations, 2022 नुसार Specified Authority: 👉 Principal Additional Director General / Additional Director General, Directorate General of Revenue Intelligence (DRI) आहे. ही authority controlled delivery operations approve आणि oversee करते.", "golden": "Controlled Delivery → Specified Authority → ADG DRI"}, {"no": 121, "q": "Q121. The import of replicas of contemporary or modern firearms are subject to submission of which documents?", "options": [{"letter": "A", "text": "Certificate of innocuousness from the manufacturing company of the country of export"}, {"letter": "B", "text": "Undertaking from importer that replicas are incapable of expelling or launching a bullet/projectile"}, {"letter": "C", "text": "Either A or B"}, {"letter": "D", "text": "Both A and B are mandatory"}], "answer": "D", "answer_text": "Both A and B", "explanation": "Modern/contemporary firearms च्या replicas import करताना दोन्ही documents आवश्यक आहेत: Certificate of innocuousness Importer चे undertaking की replica मधून bullet/projectile fire करता येत नाही.", "golden": "Firearm Replica → Certificate + Undertaking = Both mandatory"}, {"no": 122, "q": "Q122. What would be the late presentation charges when Bill of Entry is not filed within the specified time, where duty is not payable due to exemption?", "options": [{"letter": "A", "text": "Up to ₹25,000"}, {"letter": "B", "text": "Up to ₹50,000"}, {"letter": "C", "text": "Up to ₹75,000"}, {"letter": "D", "text": "Up to ₹40,000"}], "answer": "B", "answer_text": "Up to ₹50,000", "explanation": "Duty exempt असले तरी Bill of Entry वेळेत file न केल्यास late presentation charges लागू होतात. Maximum charge: 👉 ₹50,000", "golden": "Exempt Goods + Late BOE → Maximum ₹50,000"}, {"no": 123, "q": "Q123. Which statement is correct under the FTDR Act, 1992 regarding IEC?", "options": [{"letter": "A", "text": "IEC number is necessary for import/export of services or technology."}, {"letter": "B", "text": "IEC is necessary for import/export of services or technology only if provider is taking benefits under FTP."}, {"letter": "C", "text": "IEC is not necessary for import/export of specified services or specified technology."}, {"letter": "D", "text": "None of the above."}], "answer": "B", "answer_text": "", "explanation": "Services/technology च्या import/export साठी IEC सामान्यतः आवश्यक असतो जेव्हा provider Foreign Trade Policy अंतर्गत benefit घेत आहे.", "golden": "Services/Technology + FTP Benefit → IEC Required"}, {"no": 124, "q": "Q124. Under the Cosmetics Rules, 2020, who is the Central Licensing Authority?", "options": [{"letter": "A", "text": "Concerned State Government"}, {"letter": "B", "text": "Drugs Controller General of India"}, {"letter": "C", "text": "Commissioner of Customs"}, {"letter": "D", "text": "Food Corporation of India"}], "answer": "B", "answer_text": "Drugs Controller General of India", "explanation": "Cosmetics Rules, 2020 अंतर्गत Central Licensing Authority म्हणून: 👉 Drugs Controller General of India (DCGI) designated आहे.", "golden": "Cosmetics → Central Licensing Authority → DCGI"}, {"no": 125, "q": "Q125. In which situation shall facility of deferred payment of duty NOT apply to an eligible importer?", "options": [{"letter": "A", "text": "Failure more than once in six consecutive months"}, {"letter": "B", "text": "Failure more than once in two consecutive months"}, {"letter": "C", "text": "Failure more than once in three consecutive months"}, {"letter": "D", "text": "Failure more than once in nine consecutive months"}], "answer": "C", "answer_text": "", "explanation": "Deferred Payment of Import Duty Rules, 2016 नुसार importer ने: 👉 3 consecutive months मध्ये due date ला duty full pay करण्यास more than once failure केल्यास deferred payment facility मिळत नाही.", "golden": "Deferred Payment → More than once default in 3 consecutive months = Facility lost Q126–130"}, {"no": 126, "q": "Q126. What is true for EPCG Scheme?", "options": [{"letter": "A", "text": "Capital goods include computer systems and software which are part of capital goods."}, {"letter": "B", "text": "Authorisation is valid for import for 36 months."}, {"letter": "C", "text": "Export Obligation is equivalent to 8 times of duties, taxes and cess saved."}, {"letter": "D", "text": "All above options are correct."}], "answer": "A", "answer_text": "", "explanation": "Paper मध्ये A हा correct answer दिलेला आहे. B आणि C चुकीचे आहेत: Authorisation validity → 24 months, not 36 months. EO → 6 times, not 8 times of duties/taxes/cess saved.", "golden": "EPCG → Import validity 24 months → EO 6×"}, {"no": 127, "q": "Q127. As per SEZ Rules, 2006, “Specified Officer” posted in SEZ includes which rank?", "options": [{"letter": "A", "text": "Assistant Commissioner of Customs"}, {"letter": "B", "text": "Deputy Commissioner of Customs"}, {"letter": "C", "text": "Joint Commissioner of Customs"}, {"letter": "D", "text": "All of the above"}], "answer": "D", "answer_text": "All of the above", "explanation": "Specified Officer मध्ये: ✔️ Assistant Commissioner ✔️ Deputy Commissioner ✔️ Joint Commissioner या ranks चे Customs officers समाविष्ट होऊ शकतात.", "golden": "SEZ Specified Officer → AC + DC + JC"}, {"no": 128, "q": "Q128. Which of the following is NOT correct under Deferred Payment of Import Duty Rules, 2016?", "options": [{"letter": "A", "text": "Default more than once in 3 consecutive months disqualifies deferred payment."}, {"letter": "B", "text": "Eligible importer shall pay duty electronically."}, {"letter": "C", "text": "These rules were made in 2016."}, {"letter": "D", "text": "For BOE returned for payment from 16th to 29th March, duty shall be paid by 1st April."}], "answer": "D", "answer_text": "", "explanation": "Option D चुकीचा आहे. March मध्ये 16th ते 31st दरम्यान returned BOE बाबत prescribed payment date 31st March आहे, 1st April नाही.", "golden": "March BOE → 16th–31st → Payment by 31st March"}, {"no": 129, "q": "Q129. In case of Hindu Undivided Family (HUF), who shall sign the application for Advance Ruling?", "options": [{"letter": "A", "text": "Principal Officer"}, {"letter": "B", "text": "Any adult member even if Karta is available"}, {"letter": "C", "text": "Karta of that family"}, {"letter": "D", "text": "Any member of the family"}], "answer": "C", "answer_text": "Karta", "explanation": "HUF च्या बाबतीत Advance Ruling application: 👉 Karta ने sign करायचा असतो.", "golden": "HUF + Advance Ruling → Karta"}, {"no": 130, "q": "Q130. Which officer cannot exercise the powers under Section 105 of Customs Act, 1962?", "options": [{"letter": "A", "text": "Commissioner of Customs"}, {"letter": "B", "text": "Commissioner (Appeals)"}, {"letter": "C", "text": "Deputy Commissioner of Customs"}, {"letter": "D", "text": "All the above officers"}], "answer": "B", "answer_text": "Commissioner (Appeals)", "explanation": "Section 105 search of premises शी संबंधित आहे. Commissioner आणि Deputy Commissioner executive/search powers exercise करू शकतात. पण Commissioner (Appeals) हा appellate/quasi-judicial authority असल्यामुळे Section 105 ची search power exercise करत नाही.", "golden": "Sec.105 → Search Premises → Commissioner (Appeals) NOT Q131–135"}, {"no": 131, "q": "Q131. What is the correct full form of INCOTERM – DDP?", "options": [{"letter": "A", "text": "Delivered at Dedicated Place"}, {"letter": "B", "text": "Delivery Done through Post"}, {"letter": "C", "text": "Delivered Duty Paid"}, {"letter": "D", "text": "Duty Delivered Paid"}], "answer": "C", "answer_text": "Delivered Duty Paid", "explanation": "DDP = Delivered Duty Paid या Incoterm मध्ये seller ची responsibility सर्वाधिक असते—destination पर्यंत transportation, duties, taxes आणि customs formalities seller handle करतो.", "golden": "DDP → Delivered Duty Paid"}, {"no": 132, "q": "Q132. What are the purposes to prohibit importation/exportation of goods into/from India under Section 11?", "options": [{"letter": "A", "text": "Maintenance of security of India"}, {"letter": "B", "text": "Prevention of shortage of goods"}, {"letter": "C", "text": "Maintenance of standards for classification, grading or marketing of goods in international trade"}, {"letter": "D", "text": "All of the above"}], "answer": "D", "answer_text": "All of the above", "explanation": "Section 11 Central Government ला public interest मध्ये import/export prohibit करण्याची power देते. यामध्ये: ✔️ Security of India ✔️ Prevention of shortage ✔️ International trade standards यांचा समावेश होतो.", "golden": "Sec.11 → Security + Shortage + Trade Standards"}, {"no": 133, "q": "Q133. As per FTP 2023, import policy condition for second-hand Desktop Computers is—", "options": [{"letter": "A", "text": "Freely Importable"}, {"letter": "B", "text": "Restricted and Importable against Authorisation"}, {"letter": "C", "text": "Restricted and importable against authorisation subject to Electronics & IT Goods compulsory registration conditions"}, {"letter": "D", "text": "Import prohibited"}], "answer": "B", "answer_text": "Restricted and Importable against Authorisation", "explanation": "FTP 2023 नुसार second-hand desktop computers: 👉 Restricted category मध्ये आहेत आणि import साठी DGFT authorisation आवश्यक आहे.", "golden": "Second-hand Desktop Computers → Restricted → Authorisation"}, {"no": 134, "q": "Q134. Duties of Customs shall be levied under Section ____ of Customs Act, 1962.", "options": [{"letter": "A", "text": "Section 2(14)"}, {"letter": "B", "text": "Section 1"}, {"letter": "C", "text": "Section 14"}, {"letter": "D", "text": "Section 12"}], "answer": "D", "answer_text": "Section 12", "explanation": "Section 12 हा Customs Act चा मुख्य charging section आहे. तो imported/exported goods वर customs duty levy करण्याची basic authority देतो. लक्षात ठेवा: Sec.12 → Levy/charge of customs duty Sec.14 → Valuation Sec.15 → Rate of duty/date for imported goods", "golden": "Customs Duty Charging Section → Sec.12"}, {"no": 135, "q": "Q135. Settlement Commission may grant immunity from prosecution for an offence—", "options": [{"letter": "A", "text": "At any stage irrespective of date"}, {"letter": "B", "text": "No such immunity can be granted"}, {"letter": "C", "text": "Where prosecution proceedings have NOT been instituted before date of receipt of application"}, {"letter": "D", "text": "Where prosecution proceedings have already been launched"}], "answer": "C", "answer_text": "", "explanation": "Settlement Commission ला specified conditions मध्ये prosecution immunity देण्याची power आहे. पण application मिळण्यापूर्वीच prosecution proceedings instituted झाल्या असतील तर ही immunity लागू होत नाही.", "golden": "Settlement Commission → Immunity → Prosecution NOT instituted before application Q136–140"}, {"no": 136, "q": "Q136. Any person making false declaration in the transaction of any business relating to Customs shall be punishable with imprisonment for a term which may extend to ____ years under Section ____.", "options": [{"letter": "A", "text": "3, 132"}, {"letter": "B", "text": "3, 135"}, {"letter": "C", "text": "2, 132"}, {"letter": "D", "text": "2, 135"}], "answer": "C", "answer_text": "2 years, Section 132", "explanation": "Customs Act Section 132 false declaration/statement/document शी संबंधित आहे. Punishment: 👉 Imprisonment up to 2 years, or fine, or both.", "golden": "False Declaration → Sec.132 → 2 Years"}, {"no": 137, "q": "Q137. Anti-dumping duty is levied on import of goods under which section?", "options": [{"letter": "A", "text": "Section 8B, Customs Tariff Act, 1975"}, {"letter": "B", "text": "Section 9, Customs Tariff Act, 1975"}, {"letter": "C", "text": "Section 9A, Customs Tariff Act, 1975"}, {"letter": "D", "text": "Section 3, Customs Tariff Act, 1975"}], "answer": "C", "answer_text": "Section 9A", "explanation": "Dumped goods मुळे domestic industry ला injury होत असल्यास Anti-Dumping Duty लावली जाते. यासाठी legal provision: 👉 Section 9A, Customs Tariff Act, 1975", "golden": "Anti-Dumping Duty → Sec.9A"}, {"no": 138, "q": "Q138. IGST on import of goods is levied under which section of Customs Tariff Act, 1975?", "options": [{"letter": "A", "text": "Section 3 + Section 5 CGST Act"}, {"letter": "B", "text": "Section 3 + Section 5 IGST Act"}, {"lett
