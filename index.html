of Customs"}], "answer": "D", "answer_text": "Principal Commissioner/Commissioner of Customs", "explanation": "Customs Act Section 110(2) नुसार prescribed period मध्ये show cause notice न दिल्यास seized goods release करण्याची provision आहे. पण sufficient cause असल्यास Principal Commissioner/Commissioner period extend करू शकतो.", "golden": "SCN Extension for Seized Goods → Principal Commissioner/Commissioner"}, {"no": 119, "q": "Q119. Which of the following is true about SWIFT?", "options": [{"letter": "A", "text": "i, ii and iii"}, {"letter": "B", "text": "Only i"}, {"letter": "C", "text": "Only ii"}, {"letter": "D", "text": "Only iii"}], "answer": "A", "answer_text": "i, ii and iii", "explanation": "SWIFT = Single Window Interface for Facilitating Trade. याचा उद्देश customs clearance process simplify आणि digitize करणे. तीनही statements बरोबर: Online documents Regulatory permissions online Government interface/dwell time/cost कमी करणे", "golden": "SWIFT → Single Window + Online Permissions + Faster Clearance"}, {"no": 120, "q": "Q120. Customs Broker Licensing Regulations, 2018 shall apply to—", "options": [{"letter": "A", "text": "Only i"}, {"letter": "B", "text": "Both i and ii"}, {"letter": "C", "text": "i, ii and iii"}, {"letter": "D", "text": "Only ii"}], "answer": "C", "answer_text": "i, ii and iii", "explanation": "CBLR 2018 फक्त licence holder पुरते limited नाही. Customs Broker च्या कामाशी संबंधित: Licensed Customs Broker त्याचा employee त्याच्याकडून engaged person यांच्यावर relevant provisions लागू होतात.", "golden": "CBLR 2018 → CB + Employees + Engaged Persons"}, {"no": 121, "q": "Q121. In First Check Assessment—", "options": [{"letter": "A", "text": "Goods are first examined and assessment is done thereafter"}, {"letter": "B", "text": "Goods are examined after assessment and payment of duty"}, {"letter": "C", "text": "Goods are cleared first and assessment is done later"}, {"letter": "D", "text": "None of the Above"}], "answer": "A", "answer_text": "Goods are first examined and assessment is done thereafter", "explanation": "First Check Assessment मध्ये goods चे physical examination आधी केले जाते आणि त्यानंतर assessment केले जाते. जेव्हा classification, valuation किंवा exemption फक्त documents पाहून ठरवता येत नाही, तेव्हा First Check उपयोगी ठरतो.", "golden": "First Check = Examination First → Assessment Later"}, {"no": 122, "q": "Q122. In absence of actual freight & insurance charges, what percentage of FOB is taken?", "options": [{"letter": "A", "text": "Freight = 18%, Insurance = 1%"}, {"letter": "B", "text": "Freight = 20%, Insurance = 1.125%"}, {"letter": "C", "text": "Freight = 20%, Insurance = 2%"}, {"letter": "D", "text": "None of the Above"}], "answer": "B", "answer_text": "Freight 20%, Insurance 1.125%", "explanation": "Actual freight/insurance उपलब्ध नसल्यास source नुसार: Freight = 20% of FOB Insurance = 1.125% of FOB यातून CIF/assessable value calculation केली जाते.", "golden": "No actual freight → 20% FOB No actual insurance → 1.125% FOB"}, {"no": 123, "q": "Q123. What is the maximum quantum of penalty under Customs (Finalization of Provisional Assessment) Regulations, 2018?", "options": [{"letter": "A", "text": "₹50,000"}, {"letter": "B", "text": "₹1,00,000"}, {"letter": "C", "text": "₹5,00,000"}, {"letter": "D", "text": "₹10,00,000"}], "answer": "A", "answer_text": "₹50,000", "explanation": "या Regulations च्या provision चे contravention झाल्यास maximum penalty ₹50,000 पर्यंत असू शकते.", "golden": "Finalization of Provisional Assessment Regulations → Max Penalty ₹50,000"}, {"no": 124, "q": "Q124. The exchange rate in respect of Ex-bond Bill of Entry is taken as—", "options": [{"letter": "A", "text": "Rate as on date of presentation of Warehouse BE"}, {"letter": "B", "text": "Rate as on date of presentation of Ex-bond BE"}, {"letter": "C", "text": "Rate as on actual clearance of goods"}, {"letter": "D", "text": "None of the Above"}], "answer": "A", "answer_text": "", "explanation": "Source नुसार Ex-bond Bill of Entry साठी exchange rate Into-Bond/Warehouse Bill of Entry सादर केलेल्या तारखेचा घेतला जातो.", "golden": "Ex-bond BE → Exchange Rate = Warehouse/Into-Bond BE date"}, {"no": 125, "q": "Q125. What is the rate of Social Welfare Surcharge (SWS) levied on import of goods?", "options": [{"letter": "A", "text": "10% of the assessable value"}, {"letter": "B", "text": "10% of the Basic Customs Duty"}, {"letter": "C", "text": "10% of assessable value plus BCD"}, {"letter": "D", "text": "None of the Above"}], "answer": "B", "answer_text": "10% of Basic Customs Duty", "explanation": "SWS = Social Welfare Surcharge Source नुसार SWS साधारणपणे BCD च्या 10% प्रमाणे calculate केला जातो. उदा. BCD = ₹10,000 SWS @ 10% = ₹1,000", "golden": "SWS = 10% of BCD"}, {"no": 126, "q": "Q126. If exporter finds that drawback paid is less than what is due, then he—", "options": [{"letter": "A", "text": "Can only file a letter of protest"}, {"letter": "B", "text": "Cannot claim the difference"}, {"letter": "C", "text": "May file a supplementary drawback claim"}, {"letter": "D", "text": "None of the Above"}], "answer": "C", "answer_text": "May file a supplementary drawback claim", "explanation": "जर exporter ला actual eligible drawback पेक्षा कमी drawback मिळाला असेल, तर prescribed conditions/time limit मध्ये Supplementary Drawback Claim file करता येतो.", "golden": "Less Drawback Received → Supplementary Drawback Claim"}, {"no": 127, "q": "Q127. Can seized goods be provisionally released pending adjudication?", "options": [{"letter": "A", "text": "Yes, if the seizing officer thinks so"}, {"letter": "B", "text": "No, only after adjudication"}, {"letter": "C", "text": "Yes, on taking bond with security and fulfilment of conditions imposed by the adjudicating authority"}, {"letter": "D", "text": "Yes, if the concerned importer/exporter wants so"}], "answer": "C", "answer_text": "", "explanation": "Section 110A नुसार seized goods adjudication पूर्ण होण्यापूर्वी provisional release करता येतात. पण: Bond Security Adjudicating Authority ने लावलेल्या conditions पूर्ण कराव्या लागतात.", "golden": "Seized Goods → Provisional Release → Bond + Security + Conditions"}, {"no": 128, "q": "Q128. On what basis is quantum of security determined for provisional assessment as per CBIC Circular No. 38/2016-Cus?", "options": [{"letter": "A", "text": "Duty differential"}, {"letter": "B", "text": "CIF value of goods"}, {"letter": "C", "text": "Assessable value of goods"}, {"letter": "D", "text": "Market value of goods"}], "answer": "A", "answer_text": "Duty Differential", "explanation": "Provisional assessment मध्ये final duty आणि provisional duty यांच्यात जो फरक आहे त्याला duty differential म्हणतात. Security त्या differential duty च्या आधारावर ठरवली जाते.", "golden": "Provisional Assessment Security → Duty Differential"}, {"no": 129, "q": "Q129. Under EPCG scheme, export obligation is based on—", "options": [{"letter": "A", "text": "Duty saved on imports"}, {"letter": "B", "text": "Value of import"}, {"letter": "C", "text": "Only IGST saved on imports"}, {"letter": "D", "text": "Only Basic Customs Duty saved on imports"}], "answer": "A", "answer_text": "Duty saved on imports", "explanation": "EPCG = Export Promotion Capital Goods. EPCG मध्ये capital goods वर मिळालेल्या duty benefit/duty saved च्या आधारावर export obligation ठरते.", "golden": "EPCG Export Obligation → Duty Saved"}, {"no": 130, "q": "Q130. Goods worth ₹1,00,000 are imported and sold on high seas for ₹1,50,000. On what value should Customs duty be charged?", "options": [{"letter": "A", "text": "₹1,90,000"}, {"letter": "B", "text": "₹1,50,000"}, {"letter": "C", "text": "₹1,00,000 plus 2%"}, {"letter": "D", "text": "₹1,50,000 plus 2%"}], "answer": "B", "answer_text": "₹1,50,000", "explanation": "High Seas Sale मध्ये import करण्यापूर्वी goods दुसऱ्या buyer ला high seas वर विकले गेले आहेत. Source नुसार Customs valuation साठी last sale price म्हणजे ₹1,50,000 transaction value म्हणून घेतला जातो, subject to proper documentation.", "golden": "High Seas Sale → Last Sale Price"}, {"no": 131, "q": "Q131. Export goods FOB value ₹1,00,000. Drawback received ₹10,000. Export proceeds realized only ₹60,000. How much drawback should be recovered?", "options": [{"letter": "A", "text": "₹4,000"}, {"letter": "B", "text": "₹10,000"}, {"letter": "C", "text": "₹6,000"}, {"letter": "D", "text": "No recovery"}], "answer": "A", "answer_text": "₹4,000", "explanation": "FOB realized = 60% म्हणून unrealized = 40% Drawback = ₹10,000 Recovery = 40% × ₹10,000 = ₹4,000", "golden": "Export proceeds not fully realized → Drawback proportionately recoverable"}, {"no": 132, "q": "Q132. Compulsory Compliance Requirement (CCR) instructions in Bill of Entry generated by RMS are applicable to—", "options": [{"letter": "A", "text": "Only i"}, {"letter": "B", "text": "Only ii"}, {"letter": "C", "text": "Only iii"}, {"letter": "D", "text": "All i, ii and iii"}], "answer": "D", "answer_text": "All i, ii and iii", "explanation": "CCR = Compulsory Compliance Requirement. RMS मध्ये Bill of Entry वर दिलेल्या CCR instructions चे पालन: Importer Customs Broker Customs Officer सर्व संबंधित stakeholders ना करावे लागते.", "golden": "RMS CCR → Importer + CB + Customs Officer"}, {"no": 133, "q": "Q133. Where duty is not payable due to exemption, charges for delayed presentation of Bill of Entry shall not exceed—", "options": [{"letter": "A", "text": "₹25,000"}, {"letter": "B", "text": "₹50,000"}, {"letter": "C", "text": "₹75,000"}, {"letter": "D", "text": "₹1,00,000"}], "answer": "B", "answer_text": "₹50,000", "explanation": "Duty exemption असल्यामुळे duty liability नसली तरी Bill of Entry उशिरा file केल्यास late charges लागू होऊ शकतात. Source नुसार maximum ₹50,000.", "golden": "No Duty due to Exemption + Late BOE → Max ₹50,000"}, {"no": 134, "q": "Q134. As per Rule 10 of Customs Valuation Rules, 2007, which is NOT to be added to transaction value?", "options": [{"letter": "A", "text": "Buying commission"}, {"letter": "B", "text": "Cost of packing"}, {"letter": "C", "text": "Brokerage"}, {"letter": "D", "text": "Royalty related to imported goods payable as a condition of sale"}], "answer": "A", "answer_text": "Buying Commission", "explanation": "Rule 10 मध्ये transaction value मध्ये काही costs add केले जातात. पण importer ने त्याच्या buying agent ला दिलेली buying commission transaction value मध्ये add केली जात नाही.", "golden": "Buying Commission → Not Added"}, {"no": 135, "q": "Q135. “Where goods imported in a package are liable to confiscation, the package and other goods imported in that package shall also be liable to confiscation.”", "options": [{"letter": "A", "text": "Statement is wrong"}, {"letter": "B", "text": "Statement is correct"}, {"letter": "C", "text": "Only the goods should be confiscated"}, {"letter": "D", "text": "Only the package should be confiscated"}], "answer": "B", "answer_text": "Statement is correct", "explanation": "Section 118 नुसार package मधील एखादा item confiscation ला liable असेल तर त्या package मधील इतर goods/package देखील prescribed circumstances मध्ये confiscation ला liable होऊ शकतात.", "golden": "Section 118 → Package + Contents → Confiscation"}, {"no": 136, "q": "Q136. The rate of exchange applicable for imported goods is fixed/notified by—", "options": [{"letter": "A", "text": "CBIC"}, {"letter": "B", "text": "SBI"}, {"letter": "C", "text": "RBI"}, {"letter": "D", "text": "Commissioner of Customs"}], "answer": "A", "answer_text": "CBIC", "explanation": "Customs valuation साठी foreign currency चे INR मध्ये conversion करण्यासाठी applicable exchange rates CBIC notify करते.", "golden": "Customs Exchange Rate → CBIC"}, {"no": 137, "q": "Q137. The procedure for IGM amendment provides that—", "options": [{"letter": "A", "text": "It requires adjudication in all cases"}, {"letter": "B", "text": "Adjudication takes place only in cases of major amendments"}, {"letter": "C", "text": "IGM can be amended at any time before clearance of goods from Customs area by shipping line on its own"}, {"letter": "D", "text": "None of the Above"}], "answer": "B", "answer_text": "", "explanation": "IGM amendment मध्ये: Minor amendment → Without adjudication Major amendment → Adjudication required उदा. consignee name, port of discharge किंवा cargo details सारख्या major changes साठी adjudication लागू होऊ शकते.", "golden": "IGM Minor → No adjudication IGM Major → Adjudication"}, {"no": 138, "q": "Q138. Can an importer file Warehousing Bill of Entry and warehouse goods requiring FSSAI NOC without obtaining NOC first?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes, NOC from FSSAI is not required"}, {"letter": "C", "text": "Yes, but FSSAI NOC must be obtained before ex-bonding; ex-bonding only after NOC"}, {"letter": "D", "text": "None of the Above"}], "answer": "C", "answer_text": "", "explanation": "Source नुसार FSSAI NOC आवश्यक असलेले goods warehouse मध्ये ठेवता येतात NOC आधी घेतलेली नसली तरी. पण home consumption साठी ex-bond clearance करण्यापूर्वी FSSAI NOC आवश्यक आहे.", "golden": "FSSAI Goods → Warehousing possible before NOC → Ex-bond only after NOC"}, {"no": 139, "q": "Q139. For determination of importability of goods, which date is relevant?", "options": [{"letter": "A", "text": "Date of Bill of Lading"}, {"letter": "B", "text": "Date of presentation of Bill of Entry"}, {"letter": "C", "text": "Date of assessment"}, {"letter": "D", "text": "Date of final entry"}], "answer": "A", "answer_text": "Date of Bill of Lading", "explanation": "Source नुसार import policy/restriction लागू करताना goods ची date of shipment महत्त्वाची आहे, जी साधारणपणे Bill of Lading date ने दर्शवली जाते.", "golden": "Importability → Shipment Date → Bill of Lading"}, {"no": 140, "q": "Q140. Importer imports goods for personal use and does not have IEC. What needs to be done?", "options": [{"letter": "A", "text": "A person importing for personal use need not have IEC"}, {"letter": "B", "text": "Goods need adjudication and release only after fine and penalty"}, {"letter": "C", "text": "Keep goods in warehouse, apply for IEC and clear after IEC received"}, {"letter": "D", "text": "None of the Above"}], "answer": "A", "answer_text": "", "explanation": "Personal/non-commercial import साठी source नुसार IEC compulsory नाही. Commercial import/export साठी IEC आवश्यक असतो.", "golden": "Personal Use Import → IEC Not Required"}, {"no": 141, "q": "Q141. The validity of a Customs Broker licence, unless suspended or revoked, issued under CBLR, 2018 is—", "options": [{"letter": "A", "text": "5 years from date of issue"}, {"letter": "B", "text": "There is no expiry of licence"}, {"letter": "C", "text": "10 years from date of issue"}, {"letter": "D", "text": "To be renewed every year"}], "answer": "C", "answer_text": "10 years", "explanation": "या 2019 examination source नुसार Customs Broker licence ची validity 10 years आहे. ⚠️ हे 2019 paper च्या source answer प्रमाणे आहे; current rules वेगळे असू शकतात.", "golden": "2019 Source → CB Licence = 10 Years"}, {"no": 142, "q": "Q142. Exporter files Shipping Bill on 15.03.2019, LEO given and goods shipped on 25.03.2019. Duty rate was 10% on 15.03.2019 and changed to 12% from 17.03.2019. What is applicable rate?", "options": [{"letter": "A", "text": "10%"}, {"letter": "B", "text": "12%"}, {"letter": "C", "text": "1%"}, {"letter": "D", "text": "None of the Above"}], "answer": "B", "answer_text": "12%", "explanation": "Export duty साठी Section 16 लागू होतो. Source नुसार export duty rate LEO date वर लागू होतो. LEO = 20.03.2019 त्या दिवशी rate = 12% म्हणून applicable rate = 12%.", "golden": "Export Duty → LEO Date"}, {"no": 143, "q": "Q143. Import of fresh potato seeds requires import permit under—", "options": [{"letter": "A", "text": "Plants Quarantine (Regulation of Imports into India) Order, 2003"}, {"letter": "B", "text": "CITES"}, {"letter": "C", "text": "Biodiversity Act"}, {"letter": "D", "text": "Wildlife (Protection) Act, 1972"}], "answer": "A", "answer_text": "", "explanation": "Plant material/seed imports साठी phytosanitary requirements लागू होतात. Fresh potato seeds साठी Plant Quarantine (Regulation of Import into India) Order, 2003 relevant आहे.", "golden": "Plant/Seed Import → Plant Quarantine Order"}, {"no": 144, "q": "Q144. The rate of duty in respect of Ex-bond Bill of Entry is taken as—", "options": [{"letter": "A", "text": "Rate on date of presentation of Ex-bond BE"}, {"letter": "B", "text": "Rate on date of presentation of Warehouse BE"}, {"letter": "C", "text": "Rate on actual clearance for home consumption"}, {"letter": "D", "text": "None of the Above"}], "answer": "A", "answer_text": "Rate on presentation of Ex-bond BE", "explanation": "Warehouse मधून goods home consumption साठी काढताना Ex-bond Bill of Entry file केला जातो. Source नुसार duty rate Ex-bond BE presentation date वर लागू होतो.", "golden": "Ex-bond BE → Duty Rate = Ex-bond BE Presentation Date"}, {"no": 145, "q": "Q145. Bill of Entry filed on 15.03.2019 and assessed on 16.03.2019. By when must duty be paid to avoid interest?", "options": [{"letter": "A", "text": "By 17.03.2019"}, {"letter": "B", "text": "By 18.03.2019"}, {"letter": "C", "text": "By 16.03.2019"}, {"letter": "D", "text": "None of the Above"}], "answer": "B", "answer_text": "By 18.03.2019", "explanation": "Source नुसार duty payment साठी two working days ची period आहे. Assessment = 16.03.2019 17.03.2019 = Sunday/holiday. म्हणून payment deadline = 18.03.2019.", "golden": "Assessment 16 March + Sunday → Payment by 18 March"}, {"no": 146, "q": "Q146. Whether Customs duty is paid on containers of durable nature in which goods are imported?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "Yes, but duty paid is refunded when containers are re-exported"}, {"letter": "C", "text": "No, provided container is re-exported within six months/extended period and bond is executed"}, {"letter": "D", "text": "None of the Above"}], "answer": "C", "answer_text": "", "explanation": "Notification No. 104/94-Customs नुसार prescribed durable containers साठी exemption मिळू शकते, जर ते: 6 months मध्ये re-export केले किंवा permitted extended period मध्ये re-export केले required bond execute केला तर customs duty लागू होत नाही.", "golden": "Durable Containers → Re-export within 6 months → Duty Exemption"}, {"no": 147, "q": "Q147. What if importer importing from a related supplier fails to submit documents for SVB inquiries?", "options": [{"letter": "A", "text": "Security deposit @ 5% of declared assessable value imposed by Commissioner for period not exceeding next 3 months"}, {"letter": "B", "text": "Security deposit @ 1%"}, {"letter": "C", "text": "Department shall resort to enforcement measures like search"}, {"letter": "D", "text": "None of the Above"}], "answer": "A", "answer_text": "", "explanation": "SVB = Special Valuation Branch. Related-party imports मध्ये importer ने required documents दिले नाहीत तर source नुसार EDD (Extra Duty Deposit) 5% लागू होऊ शकतो. कालावधी source नुसार up to 3 months आहे.", "golden": "SVB Documents not submitted → EDD 5%"}, {"no": 148, "q": "Q148. An Advance Authorization Scheme aims—", "options": [{"letter": "A", "text": "To allow duty-free inputs for any industry"}, {"letter": "B", "text": "To allow duty-free imports of inputs which are physically incorporated in export product"}, {"letter": "C", "text": "To allow import of inputs at concessional rate of duty"}, {"letter": "D", "text": "None of the Above"}], "answer": "B", "answer_text": "", "explanation": "Advance Authorisation चा मुख्य उद्देश export product मध्ये physically incorporated inputs duty-free import करण्याची सुविधा देणे आहे. Exporter ला specified export obligation पूर्ण करावी लागते.", "golden": "Advance Authorisation → Duty-free Inputs → Physically incorporated in Export Product"}, {"no": 149, "q": "Q149. When can the proper officer of Customs seize the goods?", "options": [{"letter": "A", "text": "When the goods are liable for confiscation"}, {"letter": "B", "text": "When officer thinks that they should be imported"}, {"letter": "C", "text": "When they are not registered for inspection"}, {"letter": "D", "text": "When examination norms are not followed"}], "answer": "A", "answer_text": "When goods are liable for confiscation", "explanation": "Section 110(1) नुसार proper officer ला goods liable to confiscation आहेत असे reason to believe असल्यास ते seize करता येतात.", "golden": "Section 110 → Seizure → Reason to believe goods liable to confiscation"}, {"no": 150, "q": "Q150. Which of the following has scheme?", "options": [{"letter": "A", "text": "Advance Authorisation"}, {"letter": "B", "text": "Duty Free Import Authorisation (DFIA)"}, {"letter": "C", "text": "MEIS and SEIS scheme"}, {"letter": "D", "text": "None of the Above"}], "answer": "C", "answer_text": "MEIS and SEIS scheme", "explanation": "Source मध्ये MEIS आणि SEIS हे reward/incentive schemes म्हणून दिले आहेत. MEIS = Merchandise Exports from India Scheme SEIS = Service Exports from India Scheme या schemes चा उद्देश exports ला incentives देणे हा होता.", "golden": "MEIS → Merchandise Exports SEIS → Service Exports"}], "2020": [{"no": 1, "q": "Q1. Whether Drawback can be claimed for goods exported by post?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}, {"letter": "C", "text": "Yes, if the goods are capital goods"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "Yes", "explanation": "Goods post ने export केले तरी prescribed procedure आणि documentation पूर्ण केल्यास Duty Drawback claim करता येतो.", "golden": "Export by Post → Drawback can be claimed"}, {"no": 2, "q": "Q2. License granted to a person under Customs Broker Licensing Regulations, 2018 can be:", "options": [{"letter": "A", "text": "Only i"}, {"letter": "B", "text": "Both i and ii"}, {"letter": "C", "text": "None of these"}, {"letter": "D", "text": "Only ii"}], "answer": "C", "answer_text": "None of these", "explanation": "Customs Broker licence ही त्या specific person/entity च्या qualification, experience आणि examination वर आधारित असते. म्हणून licence: Sell करता येत नाही Transfer करता येत नाही", "golden": "CB Licence → Non-transferable + Non-saleable"}, {"no": 3, "q": "Q3. What is the time-limit prescribed for issuance of demand notice under Section 28 of Customs Act, 1962 in cases where fraud, suppression of facts, willful mis-statement is not involved?", "options": [{"letter": "A", "text": "Six Months"}, {"letter": "B", "text": "One Year"}, {"letter": "C", "text": "Five Years"}, {"letter": "D", "text": "Two Years"}], "answer": "D", "answer_text": "Two Years", "explanation": "जर duty short-paid/non-paid झाली आणि fraud, suppression of facts किंवा willful misstatement involved नसेल, तर Section 28 अंतर्गत demand notice साठी source नुसार 2 years ची limitation आहे.", "golden": "Section 28 — No fraud → 2 Years"}, {"no": 4, "q": "Q4. When it is not practicable to take physical possession of seized goods, what is the option available with proper officer?", "options": [{"letter": "A", "text": "He can cancel the seizure"}, {"letter": "B", "text": "He can ask the owner to carry them"}, {"letter": "C", "text": "He can serve an order to the owner that he shall not deal with the goods in any manner without permission"}, {"letter": "D", "text": "He can impose fine in lieu of seizure"}], "answer": "C", "answer_text": "", "explanation": "काही goods ची physical seizure practically शक्य नसते—उदा. मोठी machinery, bulk goods इ. अशा वेळी proper officer goods physically घेऊन न जाता owner ला goods dispose/deal करू नयेत असा order देऊ शकतो.", "golden": "Physical seizure not practicable → Order not to deal with goods"}, {"no": 5, "q": "Q5. Declaration of Standard Unit Quantity Code (UQC) by importer is—", "options": [{"letter": "A", "text": "Mandatory in all cases"}, {"letter": "B", "text": "Optional"}, {"letter": "C", "text": "Mandatory only for capital goods"}, {"letter": "D", "text": "Mandatory only for pre-packaged material goods"}], "answer": "A", "answer_text": "Mandatory in all cases", "explanation": "UQC = Unit Quantity Code. Bill of Entry मध्ये goods ची quantity standard unit मध्ये declare करण्यासाठी UQC वापरला जातो. Source answer नुसार importer साठी mandatory in all cases.", "golden": "UQC → Mandatory"}, {"no": 6, "q": "Q6. Bill of Lading is a—", "options": [{"letter": "A", "text": "Receipt given by carrier to consignor"}, {"letter": "B", "text": "Receipt given by Customs Officer"}, {"letter": "C", "text": "Receipt given by exporting Authority"}, {"letter": "D", "text": "Receipt given by Port Authority"}], "answer": "A", "answer_text": "", "explanation": "Bill of Lading (B/L) हा shipping document आहे. तो carrier ने consignor/exporter ला goods receive केल्याचा receipt म्हणून काम करतो. त्याचबरोबर तो: Receipt Evidence of contract of carriage Document of title असे तीन प्रमुख functions करतो.", "golden": "B/L → Receipt + Contract Evidence + Document of Title"}, {"no": 7, "q": "Q7. Tariff Value is not fixed for—", "options": [{"letter": "A", "text": "Brass scrap"}, {"letter": "B", "text": "Poppy seeds"}, {"letter": "C", "text": "Palm Oils"}, {"letter": "D", "text": "Copper scrap"}], "answer": "D", "answer_text": "Copper scrap", "explanation": "Tariff Value काही specified commodities साठी Government/CBIC कडून notified केली जाते. Source मध्ये दिलेल्या options मध्ये Copper scrap साठी tariff value fixed नसल्याचे answer दिले आहे.", "golden": "Tariff Value → Only specified notified goods"}, {"no": 8, "q": "Q8. The duty is payable by the custodian in case of pilfered goods only if—", "options": [{"letter": "A", "text": "After unloading thereof"}, {"letter": "B", "text": "After unloading thereof but before order of clearance by proper officer for deposit in warehouse or home consumption"}, {"letter": "C", "text": "After clearance order"}, {"letter": "D", "text": "Before unloading thereof"}], "answer": "B", "answer_text": "", "explanation": "Goods port मध्ये unload झाल्यानंतर, पण Customs clearance/warehousing order मिळण्यापूर्वी pilfer झाले तर custodian वर duty liability येते.", "golden": "Pilferage → After unloading + Before clearance → Custodian"}, {"no": 9, "q": "Q9. In case of valuation of imported goods, the last method of valuation resorted to when all the earlier methods don't help is—", "options": [{"letter": "A", "text": "Deductive Method"}, {"letter": "B", "text": "Computed Method"}, {"letter": "C", "text": "Transaction Value Method"}, {"letter": "D", "text": "Residual Method"}], "answer": "D", "answer_text": "Residual Method", "explanation": "Customs Valuation Rules मध्ये valuation methods sequentially वापरले जातात: Transaction Value Identical Goods Similar Goods Deductive Value Computed Value Residual Method पहिल्या methods ने value ठरली नाही तर शेवटी Residual Method वापरतात.", "golden": "Last Valuation Method → Residual Method 🧮 Q10. Duty Drawback Calculation A person exports 100 pieces of jackets made of silk for ₹5,000 FOB per piece and claims duty drawback. Drawback Rate = 4.8% Drawback Cap = ₹107.40 per piece Calculate drawback. A. ₹24,000 B. ₹10,740 C. ₹48,000 D. None of the Above ✅ Correct Answer: B — ₹10,740 Explanation: FOB value: 100 × ₹5,000 = ₹5,00,000 4.8% drawback: ₹5,00,000 × 4.8% = ₹24,000 पण drawback cap आहे: ₹107.40 × 100 = ₹10,740 म्हणून actual drawback = lesser amount 👉 ₹24,000 vs ₹10,740 👉 ₹10,740  Drawback = Lower of Rate-based amount OR Cap amount"}, {"no": 11, "q": "Q11. Who is competent authority to give orders for arrest of a person under Section 104 of the Act?", "options": [{"letter": "A", "text": "Preventive Officer of Customs"}, {"letter": "B", "text": "Principal Commissioner/Commissioner of Customs"}, {"letter": "C", "text": "Additional/Joint Commissioner of Customs"}, {"letter": "D", "text": "Assistant Commissioner of Customs"}], "answer": "B", "answer_text": "Principal Commissioner/Commissioner", "explanation": "Customs Act Section 104 अंतर्गत arrest order देण्याचा competent authority source नुसार Principal Commissioner/Commissioner of Customs आहे.", "golden": "Section 104 Arrest → Principal Commissioner/Commissioner"}, {"no": 12, "q": "Q12. Item-wise export policy is given under—", "options": [{"letter": "A", "text": "Customs Law Manual"}, {"letter": "B", "text": "ITC (HS)"}, {"letter": "C", "text": "Handbook of Procedure"}, {"letter": "D", "text": "Customs Tariff"}], "answer": "B", "answer_text": "ITC (HS)", "explanation": "ITC (HS) मध्ये goods चे classification आणि त्यांची import/export policy दिली जाते. यामध्ये item: Free Restricted Prohibited Canalised इत्यादी policy categories मध्ये येऊ शकतो.", "golden": "Item-wise Export Policy → ITC (HS)"}, {"no": 13, "q": "Q13. Under which Section of Customs Act, 1962, the Bill of Entry can be amended after the clearance of imported goods on the basis of documentary evidence which was in existence at the time the goods were cleared?", "options": [{"letter": "A", "text": "Section 30"}, {"letter": "B", "text": "Section 41"}, {"letter": "C", "text": "Section 147"}, {"letter": "D", "text": "Section 149"}], "answer": "D", "answer_text": "Section 149", "explanation": "Section 149 Customs documents मध्ये amendment करण्याची provision देते. Goods clearance झाल्यानंतरही amendment शक्य आहे, पण त्यासाठी documentary evidence that existed at the time of clearance आवश्यक आहे.", "golden": "Post-clearance Amendment → Section 149"}, {"no": 14, "q": "Q14. Which one of the following Regulatory agencies is not at present involved in issuing online clearance for imported goods under SWIFT?", "options": [{"letter": "A", "text": "CLRI"}, {"letter": "B", "text": "FSSAI"}, {"letter": "C", "text": "Wild Life Crime Control Bureau"}, {"letter": "D", "text": "Plant Quarantine"}], "answer": "A", "answer_text": "CLRI", "explanation": "SWIFT = Single Window Interface for Facilitating Trade. Various Participating Government Agencies (PGAs) online clearance/NOC देतात. Source नुसार CLRI (Central Leather Research Institute) SWIFT मध्ये online clearance issuing agency म्हणून integrated नाही.", "golden": "SWIFT → Multiple PGAs online clearance Source answer → CLRI"}, {"no": 15, "q": "Q15. Can shipments under Advance Authorisation, DFIA, Drawback scheme or reward schemes under Chapter 3 of FTP be counted for fulfilment of EO under EPCG Scheme?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Only 75% of export remittance would be counted"}, {"letter": "C", "text": "Yes"}, {"letter": "D", "text": "Only 50% of export remittance would be counted"}], "answer": "C", "answer_text": "Yes", "explanation": "EPCG = Export Promotion Capital Goods. Source नुसार Advance Authorisation, DFIA, Drawback आणि Chapter 3 reward schemes अंतर्गत केलेले eligible exports EPCG Export Obligation (EO) fulfilment साठी count होऊ शकतात, subject to prescribed conditions.", "golden": "EPCG EO → Eligible exports under other schemes can count"}, {"no": 16, "q": "Q16. The date for payment of duty specified under Deferred Payment of Import Duty Rules, 2016. Which among following is NOT true?", "options": [{"letter": "A", "text": "Bill of Entry returned for payment from 1st to 15th day of month → duty by 16th"}, {"letter": "B", "text": "Bill of Entry returned for payment from 1st day till last day of any month → duty within one month"}, {"letter": "C", "text": "Bill of Entry returned from 16th day till last day of any month → duty by 1st day of following month"}, {"letter": "D", "text": "For March, Bill of Entry returned from 16th to 31st → duty by 31st March"}], "answer": "B", "answer_text": "", "explanation": "Deferred Payment Rules मध्ये payment dates specifically prescribed आहेत. 1–15 → 16th 16–last day → 1st day of next month March साठी special provision आहे. म्हणून “within one month” हा statement चुकीचा आहे.", "golden": "1–15 → 16th 16–month end → 1st next month March → 31st March"}, {"no": 17, "q": "Q17. An individual can import a new vehicle provided the vehicle is having—", "options": [{"letter": "A", "text": "FOB value of US$40,000 or more + type approval certificate of internationally accredited agency"}, {"letter": "B", "text": "FOB value US$30,000 or more + certificate"}, {"letter": "C", "text": "FOB value US$50,000 or more + certificate"}, {"letter": "D", "text": "Individual cannot import a car"}], "answer": "A", "answer_text": "", "explanation": "Source नुसार individual ला new vehicle import करण्यासाठी: FOB value US$40,000 or more Internationally accredited agency चे type approval certificate आवश्यक आहे.", "golden": "New Vehicle by Individual → US$40,000+ + Type Approval Certificate"}, {"no": 18, "q": "Q18. The Importer or Exporter shall be liable to pay interest on any amount payable to Central Government consequent to final assessment at the rate of—", "options": [{"letter": "A", "text": "15%, first day of the month of provisional assessment till date of payment"}, {"letter": "B", "text": "18%, first day of month till date of payment"}, {"letter": "C", "text": "15%, first day of month till date of final assessment"}, {"letter": "D", "text": "6%, first day of month till date of payment"}], "answer": "A", "answer_text": "", "explanation": "Provisional assessment नंतर final assessment मध्ये additional duty payable असल्यास त्या differential duty वर interest लागू होतो. Source नुसार: 15% interest आणि calculation provisional assessment झालेल्या महिन्याच्या पहिल्या दिवसापासून payment date पर्यंत.", "golden": "Provisional → Final Assessment → Differential Duty → 15% Interest"}, {"no": 19, "q": "Q19. Which of the following is NOT required to be submitted by an applicant for Authorized Economic Operator (AEO)?", "options": [{"letter": "A", "text": "Security Plan"}, {"letter": "B", "text": "Process Map"}, {"letter": "C", "text": "Business Plan"}, {"letter": "D", "text": "Self-Assessment"}], "answer": "C", "answer_text": "Business Plan", "explanation": "AEO application मध्ये applicant कडून compliance/security related information required असते. Source नुसार: Security Plan ✔️ Process Map ✔️ Self-Assessment ✔️ Business Plan ❌ म्हणून answer C.", "golden": "AEO Application → Security Plan + Process Map + Self-Assessment Business Plan → Not required"}, {"no": 20, "q": "Q20. Advanced Authorization Scheme is—", "options": [{"letter": "A", "text": "Duty exemption scheme"}, {"letter": "B", "text": "Reward scheme"}, {"letter": "C", "text": "Duty refund scheme"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "Duty exemption scheme", "explanation": "Advance Authorisation scheme मध्ये export product तयार करण्यासाठी लागणारे specified inputs duty-free import करता येतात. Exporter ने prescribed Export Obligation पूर्ण करणे आवश्यक असते.", "golden": "Advance Authorisation → Duty Exemption → Inputs → Export Obligation"}, {"no": 21, "q": "Q21. Which of the following statements are true with regard to First Check Appraisement of imported goods?", "options": [{"letter": "A", "text": "Statements (i) and (ii) are only true"}, {"letter": "B", "text": "Statements (i) and (iii) are only true"}, {"letter": "C", "text": "Statements (ii) and (iii) are only true"}, {"letter": "D", "text": "Statements (i), (ii) and (iii) are true"}], "answer": "D", "answer_text": "i, ii and iii", "explanation": "First Check Assessment म्हणजे assessment करण्यापूर्वी goods चे physical examination केले जाते. तीनही परिस्थितीमध्ये First Check होऊ शकतो: Goods assessment पूर्वी examine करणे आवश्यक आहे. Importer First Check ची request करू शकतो. Proper/Assessing Officer ला examination आवश्यक वाटल्यास तो First Check करू शकतो.", "golden": "First Check = Examination BEFORE Assessment"}, {"no": 22, "q": "Q22. Maximum punishment under the Customs Act, 1962 is imprisonment of—", "options": [{"letter": "A", "text": "Seven years"}, {"letter": "B", "text": "Five years"}, {"letter": "C", "text": "Three years"}, {"letter": "D", "text": "Two years"}], "answer": "A", "answer_text": "Seven years", "explanation": "Customs Act मधील serious offences साठी imprisonment ची maximum term 7 years पर्यंत जाऊ शकते.", "golden": "Customs Act → Maximum imprisonment = 7 Years"}, {"no": 23, "q": "Q23. Payment of customs duty of ₹10,000/- or more in case of Bill of Entry by electronic mode is—", "options": [{"letter": "A", "text": "Mandatory in all cases"}, {"letter": "B", "text": "Optional"}, {"letter": "C", "text": "Mandatory only for all AEOs"}, {"letter": "D", "text": "Mandatory only for AEO T-3 importers"}], "answer": "A", "answer_text": "Mandatory in all cases", "explanation": "Bill of Entry वर customs duty ₹10,000 किंवा त्यापेक्षा जास्त असल्यास electronic payment mandatory आहे. याचा उद्देश customs duty payment अधिक fast, transparent आणि efficient करणे आहे.", "golden": "Duty ₹10,000+ → Electronic Payment Mandatory"}, {"no": 24, "q": "Q24. The rate of duty in respect of Ex-bond Bill of Entry is taken as—", "options": [{"letter": "A", "text": "Rate of duty as on date of presentation of Ex-bond BE"}, {"letter": "B", "text": "Rate of duty as on date of presentation of Warehouse BE"}, {"letter": "C", "text": "Rate of duty as on date of actual clearance for home consumption"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "", "explanation": "Bonded warehouse मधून goods home consumption साठी काढताना Ex-bond Bill of Entry file केला जातो. Source नुसार applicable duty rate Ex-bond BE presentation date चा असतो.", "golden": "Ex-bond BE → Duty Rate = Presentation Date"}, {"no": 25, "q": "Q25. Non-compliance of summons issued under Section 108 of Customs Act, 1962 is an offence under—", "options": [{"letter": "A", "text": "Civil law"}, {"letter": "B", "text": "Criminal law"}, {"letter": "C", "text": "Both civil and criminal"}, {"letter": "D", "text": "None"}], "answer": "B", "answer_text": "Criminal law", "explanation": "Section 108 अंतर्गत Customs officer ला व्यक्तीला inquiry साठी summon करण्याचा अधिकार आहे. Summons मिळूनही त्याचे पालन न केल्यास ते criminal offence म्हणून treated केले जाते.", "golden": "Section 108 Summons → Non-compliance = Criminal offence"}, {"no": 26, "q": "Q26. Which among the following is not a fully convertible currency?", "options": [{"letter": "A", "text": "Indian Rupee"}, {"letter": "B", "text": "US Dollar"}, {"letter": "C", "text": "Saudi Riyal"}, {"letter": "D", "text": "AED"}], "answer": "A", "answer_text": "Indian Rupee", "explanation": "Source नुसार Indian Rupee ही fully convertible currency नाही. ती current account transactions साठी convertible आहे; पण capital account वर restrictions आहेत. US Dollar, Saudi Riyal आणि AED या currencies fully convertible म्हणून source मध्ये दिल्या आहेत.", "golden": "Not Fully Convertible → Indian Rupee"}, {"no": 27, "q": "Q27. Which one of the following items does not attract Export Duty?", "options": [{"letter": "A", "text": "Bauxite (natural)"}, {"letter": "B", "text": "Iron Ore"}, {"letter": "C", "text": "Marble Blocks"}, {"letter": "D", "text": "Raw Wool"}], "answer": "C", "answer_text": "Marble Blocks", "explanation": "Source नुसार Bauxite आणि Iron Ore वर applicable export duty असू शकते. Raw Wool वरही specific classification/policy नुसार duty लागू होऊ शकते. या options मध्ये Marble Blocks वर export duty नाही.", "golden": "2019/2020 source → Marble Blocks = No Export Duty"}, {"no": 28, "q": "Q28. Who is the proper officer under Bill of Entry (Electronic Integrated Declaration and Paperless Process) Regulations, 2018 to waive charges for Late Presentation of Bill of Entry?", "options": [{"letter": "A", "text": "Deputy/Assistant Commissioner of Customs"}, {"letter": "B", "text": "Additional/Joint Commissioner of Customs"}, {"letter": "C", "text": "Superintendent of Customs"}, {"letter": "D", "text": "Principal Commissioner/Commissioner of Customs"}], "answer": "B", "answer_text": "Additional/Joint Commissioner of Customs", "explanation": "Late presentation charges waive करण्याचा specific authority source नुसार Additional/Joint Commissioner of Customs कडे आहे.", "golden": "Late BOE Charges Waiver → Addl./Joint Commissioner"}, {"no": 29, "q": "Q29. What is the amount of pre-deposit in case of an appeal being filed before Commissioner of Customs (Appeals) where both duty & penalty are disputed?", "options": [{"letter": "A", "text": "7.5% of Duty and Penalty"}, {"letter": "B", "text": "7.5% of Duty"}, {"letter": "C", "text": "No requirement of any deposit"}, {"letter": "D", "text": "10% of Duty and Penalty"}], "answer": "B", "answer_text": "7.5% of Duty", "explanation": "Commissioner (Appeals) कडे first appeal करताना pre-deposit requirement लागू होते. Source नुसार duty आणि penalty दोन्ही dispute असले तरी 7.5% of duty amount pre-deposit करणे आवश्यक आहे; penalty वर स्वतंत्र 7.5% नाही.", "golden": "First Appeal → 7.5% of Duty"}, {"no": 30, "q": "Q30. Which duty can be paid by the duty-free scrip issued under MEIS/SEIS Scheme?", "options": [{"letter": "A", "text": "(i) and (ii)"}, {"letter": "B", "text": "(ii) and (iii)"}, {"letter": "C", "text": "(i) and (iii)"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "(i) and (ii)", "explanation": "Source नुसार MEIS/SEIS scrip चा उपयोग: ✅ Customs Duty ✅ Central Excise Duty साठी करता येतो. पण: ❌ IGST ❌ Compensation Cess साठी वापरता येत नाही.", "golden": "MEIS/SEIS Scrip → Customs + Central Excise Not → IGST/Cess"}, {"no": 31, "q": "Q31. Implementation of e-Sanchit involves—", "options": [{"letter": "A", "text": "Paperless processing of documents wherein supporting documents can be uploaded online"}, {"letter": "B", "text": "Online assessment"}, {"letter": "C", "text": "Uploading of manually assessed Bill of Entry in EDI"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "", "explanation": "e-Sanchit हा Customs चा paperless initiative आहे. Supporting documents जसे: Invoice Packing List Certificates Other supporting documents online upload करता येतात.", "golden": "e-Sanchit → Paperless + Online Supporting Documents"}, {"no": 32, "q": "Q32. Import goods were provisionally assessed on 01.01.2019 and finally assessed on 15.03.2019. The period for claiming refund u/s 27 of Customs Act, 1962 shall begin from—", "options": [{"letter": "A", "text": "01.01.2019"}, {"letter": "B", "text": "17.03.2019"}, {"letter": "C", "text": "15.03.2019"}, {"letter": "D", "text": "31.03.2019"}], "answer": "B", "answer_text": "17.03.2019", "explanation": "Source मध्ये सांगितले आहे की refund limitation relevant date पासून सुरू होते आणि final assessment नंतर duty payment झाल्याची date relevant आहे. येथे final assessment 15.03.2019 आणि duty payment 17.03.2019 आहे. म्हणून source answer: 👉 17.03.2019", "golden": "Provisional Assessment → Finalisation → Refund relevant date = Duty payment date (as per source)"}, {"no": 33, "q": "Q33. When can a person make an application to the Settlement Commission under Customs Act, 1962?", "options": [{"letter": "A", "text": "Before issue of Show Cause Notice"}, {"letter": "B", "text": "Before Adjudication of Show Cause Notice"}, {"letter": "C", "text": "Before filing Appeal"}, {"letter": "D", "text": "Within 60 days from date of Adjudication Order"}], "answer": "B", "answer_text": "Before Adjudication of Show Cause Notice", "explanation": "Settlement Commission कडे application करण्यासाठी SCN issued झालेला असणे आवश्यक आहे. पण त्या SCN वर final adjudication order झाल्यानंतर application करता येत नाही. म्हणून: SCN issued → Application → Adjudication before settlement", "golden": "Settlement Commission → After SCN + Before Adjudication"}, {"no": 34, "q": "Q34. Which of the following is not included in the definition of “baggage” under Customs Act, 1962?", "options": [{"letter": "A", "text": "Motor Vehicle"}, {"letter": "B", "text": "Free allowance"}, {"letter": "C", "text": "Laptop"}, {"letter": "D", "text": "Video Camera"}], "answer": "A", "answer_text": "Motor Vehicle", "explanation": "Customs Act मध्ये baggage म्हणजे passenger च्या travel सोबत असलेले personal belongings. Laptop, video camera इत्यादी baggage/personal effects मध्ये येऊ शकतात. पण Motor Vehicle baggage definition मध्ये समाविष्ट नाही.", "golden": "Baggage → Personal belongings Motor Vehicle → Not Baggage"}, {"no": 35, "q": "Q35. Which of the following is a duty remission scheme?", "options": [{"letter": "A", "text": "Advance Authorization (AA)"}, {"letter": "B", "text": "Duty Free Import Authorization (DFIA) scheme"}, {"letter": "C", "text": "Duty Drawback Scheme"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Duty Drawback Scheme", "explanation": "Duty Drawback म्हणजे exported goods तयार करण्यासाठी वापरलेल्या inputs वर आधी भरलेले eligible duties/taxes refund/remit करणे. म्हणून ते duty remission scheme आहे. Advance Authorisation आणि DFIA हे duty-free input/import authorization schemes आहेत.", "golden": "Duty Remission Scheme → Duty Drawback"}, {"no": 36, "q": "Q36. Pre-shipment inspection certificate in case of import of metallic scrap is issued by—", "options": [{"letter": "A", "text": "CBIC"}, {"letter": "B", "text": "Overseas offices of DGFT"}, {"letter": "C", "text": "Overseas offices of CBIC"}, {"letter": "D", "text": "Authorized pre-shipment inspection agencies"}], "answer": "D", "answer_text": "Authorized pre-shipment inspection agencies", "explanation": "Metallic waste/scrap import साठी prescribed Pre-Shipment Inspection Certificate (PSIC) आवश्यक आहे. हे certificate DGFT-authorised Pre-Shipment Inspection Agencies (PSIAs) कडून issue केले जाते.", "golden": "Metallic Scrap → PSIC → Authorised PSIA"}, {"no": 37, "q": "Q37. Compliance of labelling conditions for imported products has to be ensured by importer—", "options": [{"letter": "A", "text": "Before such products enter Indian Customs waters"}, {"letter": "B", "text": "Before such products are cleared for home consumption"}, {"letter": "C", "text": "Before such products leave foreign territory"}, {"letter": "D", "text": "Within thirty days of clearance of such products by Customs"}], "answer": "B", "answer_text": "Before clearance for home consumption", "explanation": "Imported packaged products साठी required labelling requirements पूर्ण झाल्या आहेत याची खात्री home consumption clearance पूर्वी करणे आवश्यक आहे. उदा.: MRP Manufacturer details Country of origin Net quantity", "golden": "Imported Product Labelling → Before Home Consumption Clearance"}, {"no": 38, "q": "Q38. Which one of the following is a minor amendment?", "options": [{"letter": "A", "text": "Conversion from local to T.P./SMTP and vice-versa"}, {"letter": "B", "text": "Commodity description"}, {"letter": "C", "text": "Changing the date of the Bill of Lading mentioned in the Import Manifest"}, {"letter": "D", "text": "Changing the Importer’s/Consignee name"}], "answer": "A", "answer_text": "", "explanation": "Source नुसार local to T.P./SMTP and vice-versa conversion हा minor amendment आहे. बाकी options मध्ये ownership, legal या important details मध्ये change होत असल्यामुळे ते major amendment स्वरूपाचे आहेत. TP = Transshipment Permit SMTP = Sub Manifest Transshipment Permit", "golden": "Minor Amendment → Local ↔ TP/SMTP"}, {"no": 39, "q": "Q39. Appeal against order in original passed by Commissioner of Customs lies with—", "options": [{"letter": "A", "text": "Chief Commissioner of Customs"}, {"letter": "B", "text": "High Court"}, {"letter": "C", "text": "CESTAT"}, {"letter": "D", "text": "Commissioner (Appeals)"}], "answer": "C", "answer_text": "CESTAT", "explanation": "Commissioner of Customs ने Order-in-Original (O-I-O) पास केला असल्यास appeal hierarchy नुसार appeal CESTAT कडे जाते. CESTAT = Customs, Excise and Service Tax Appellate Tribunal", "golden": "Commissioner O-I-O → CESTAT"}, {"no": 40, "q": "Q40. In second check assessment—", "options": [{"letter": "A", "text": "Goods are first examined and assessment is done thereafter"}, {"letter": "B", "text": "Goods are examined after assessment"}, {"letter": "C", "text": "Goods are cleared first and assessment is done later"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "Goods are examined after assessment", "explanation": "Second Check Assessment मध्ये: पहिले → Assessment नंतर → Examination हे First Check च्या अगदी opposite आहे.", "golden": "First Check → Examination → Assessment Second Check → Assessment → Examination"}, {"no": 41, "q": "Q41. Market price in relation to any goods as per the Customs Act, 1962 means—", "options": [{"letter": "A", "text": "FOB value of the goods"}, {"letter": "B", "text": "CIF value of the goods"}, {"letter": "C", "text": "Wholesale price of goods in ordinary course of trade in India"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Wholesale price of goods in ordinary course of trade in India", "explanation": "Customs Act मधील “Market Price” म्हणजे भारतात ordinary course of trade मध्ये goods ज्या wholesale price ला विकले जातात किंवा विक्रीसाठी offer केले जातात तो price.", "golden": "Market Price → Wholesale Price in India"}, {"no": 42, "q": "Q42. Which convention aims to regulate international trade in wild animals and plants and ensure their survival?", "options": [{"letter": "A", "text": "International Union for Conservation of Nature and Natural Resources (IUCN)"}, {"letter": "B", "text": "Convention on International Trade in Endangered Species of Wild Fauna and Flora (CITES)"}, {"letter": "C", "text": "Wild Life (Protection) Act, 1972"}, {"letter": "D", "text": "TRAFFIC"}], "answer": "B", "answer_text": "CITES", "explanation": "CITES = Convention on International Trade in Endangered Species of Wild Fauna and Flora. याचा मुख्य उद्देश endangered wild animals आणि plants यांच्या international trade वर regulation ठेवणे आहे.", "golden": "Endangered Species + International Trade → CITES"}, {"no": 43, "q": "Q43. In case where goods are bought on High Seas Sale basis by the importer, for purpose of assessment, a minimum of ____ is added as HSS Commission.", "options": [{"letter": "A", "text": "2% of CIF value"}, {"letter": "B", "text": "4% of CIF value"}, {"letter": "C", "text": "2% of FOB value"}, {"letter": "D", "text": "3.25% of CIF value"}], "answer": "A", "answer_text": "2% of CIF value", "explanation": "High Seas Sale (HSS) म्हणजे goods Indian Customs frontier cross करण्यापूर्वीच एका buyer कडून दुसऱ्या buyer ला विकणे. Source नुसार assessment साठी minimum 2% of CIF value HSS commission म्हणून add केले जाते.", "golden": "HSS Commission → Minimum 2% of CIF"}, {"no": 44, "q": "Q44. In respect of arrival of an aircraft, the person in charge (Master/Agent) has to deliver an Arrival Manifest—", "options": [{"letter": "A", "text": "Within 24 hours of arrival"}, {"letter": "B", "text": "Within 12 hours of arrival"}, {"letter": "C", "text": "Prior to arrival of the aircraft"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Prior to arrival", "explanation": "Aircraft चा Arrival Manifest Customs कडे aircraft arrive होण्यापूर्वी electronically submit करायचा असतो. यामुळे Customs ला advance मध्ये: Cargo details Passenger details Crew details मिळतात आणि risk assessment करता येते.", "golden": "Aircraft Arrival Manifest → Before Arrival"}, {"no": 45, "q": "Q45. Special Valuation Branch (SVB) institution is—", "options": [{"letter": "A", "text": "To aid the assessment group in valuing goods being imported/exported"}, {"letter": "B", "text": "To maintain database of values of all goods imported/exported"}, {"letter": "C", "text": "For transactions involving special relationships between buyer and seller"}, {"letter": "D", "text": "All of the above"}], "answer": "C", "answer_text": "", "explanation": "SVB = Special Valuation Branch. SVB चा मुख्य उद्देश related/specially related buyer-seller transactions मध्ये declared transaction value relationship मुळे प्रभावित झाली आहे का हे तपासणे. A आणि B हे SVB चे मुख्य काम नाही.", "golden": "SVB → Related Party / Special Relationship Transactions"}, {"no": 46, "q": "Q46. The conditions under which “Warehoused goods” can be exported without payment of import duty are:", "options": [{"letter": "A", "text": "i, ii and iii"}, {"letter": "B", "text": "Only i"}, {"letter": "C", "text": "i and ii"}, {"letter": "D", "text": "Only iii"}], "answer": "A", "answer_text": "i, ii and iii", "explanation": "Warehoused goods export करताना तीनही conditions पूर्ण करणे आवश्यक आहे: Shipping Bill Applicable export duty/fine/penalty Proper officer चा clearance order", "golden": "Warehoused Goods Export → SB + Duty/Fine/Penalty + Clearance Order"}, {"no": 47, "q": "Q47. How much fee is prescribed for getting certified copies of Shipping Bill/Bill of Entry as per Levy of Fees (Customs Documents) Amendment Regulations, 2017?", "options": [{"letter": "A", "text": "₹1,000/-"}, {"letter": "B", "text": "₹500/-"}, {"letter": "C", "text": "₹100/-"}, {"letter": "D", "text": "₹200/-"}], "answer": "C", "answer_text": "₹100/-", "explanation": "Certified copy of Shipping Bill किंवा Bill of Entry मिळवण्यासाठी prescribed fee ₹100 per document आहे.", "golden": "Certified Copy of SB/BE → ₹100"}, {"no": 48, "q": "Q48. EPCG Authorization is issued by—", "options": [{"letter": "A", "text": "Central Board of Indirect Taxes & Customs"}, {"letter": "B", "text": "Director General of Foreign Trade"}, {"letter": "C", "text": "Ministry of Finance"}, {"letter": "D", "text": "Reserve Bank of India"}], "answer": "B", "answer_text": "DGFT", "explanation": "EPCG = Export Promotion Capital Goods. EPCG हा Foreign Trade Policy अंतर्गत scheme आहे आणि EPCG Authorization DGFT कडून issue केले जाते.", "golden": "EPCG Authorization → DGFT"}, {"no": 49, "q": "Q49. EPCG scheme can be availed by—", "options": [{"letter": "A", "text": "Only i"}, {"letter": "B", "text": "Only ii"}, {"letter": "C", "text": "Only iii"}, {"letter": "D", "text": "i, ii and iii"}], "answer": "D", "answer_text": "i, ii and iii", "explanation": "EPCG scheme चा benefit: Manufacturer exporters Merchant exporters Eligible service providers सर्व घेऊ शकतात, subject to prescribed conditions.", "golden": "EPCG → Manufacturer + Merchant + Service Provider"}, {"no": 50, "q": "Q50. Request for amendment in Arrival Manifest can be made by—", "options": [{"letter": "A", "text": "Importer"}, {"letter": "B", "text": "Customs Broker"}, {"letter": "C", "text": "Shipping line or shipping agent"}, {"letter": "D", "text": "Anyone"}], "answer": "C", "answer_text": "Shipping line or shipping agent", "explanation": "Arrival Manifest file करण्याची जबाबदारी person-in-charge of conveyance ची असते. Sea/air cargo मध्ये shipping line किंवा authorised shipping agent manifest file/amend करण्यासाठी responsible असतो.", "golden": "Arrival Manifest Amendment → Shipping Line/Agent"}, {"no": 51, "q": "Q51. What do you mean by the canalized items of import?", "options": [{"letter": "A", "text": "Items that can be imported only through canal"}, {"letter": "B", "text": "Items that can be imported only through post"}, {"letter": "C", "text": "Items that can be imported through specified agency"}, {"letter": "D", "text": "Items that can be imported only through land customs stations"}], "answer": "C", "answer_text": "Through specified agency", "explanation": "Canalized goods म्हणजे अशी goods ज्यांचा import फक्त Government ने authorised केलेल्या specified agency मार्फत करता येतो. उदा. काही strategically important commodities.", "golden": "Canalized Import → Specified/Authorised Agency"}, {"no": 52, "q": "Q52. If reassessment under Section 17(4) differs from self-assessment regarding valuation, classification, exemption etc., which is true?", "options": [{"letter": "A", "text": "Importer has to pay reassessed duty whether he accepts it or not"}, {"letter": "B", "text": "Speaking order has to be issued within 15 days from reassessment if importer does not confirm acceptance in writing"}, {"letter": "C", "text": "Speaking order must compulsorily be issued in all cases"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "", "explanation": "जर Customs officer चा reassessment importer च्या self-assessment पेक्षा वेगळा असेल आणि importer तो change writing मध्ये accept करत नसेल, तर proper officer ने speaking order issue करायचा असतो. Source नुसार time limit 15 days आहे.", "golden": "Reassessment differs + No written acceptance → Speaking Order within 15 days"}, {"no": 53, "q": "Q53. In related party transactions, where imports take place through Mumbai/Delhi/Chennai/Kolkata/Bangalore Custom Houses, importer is free to select—", "options": [{"letter": "A", "text": "SVB of Customs House most proximate to corporate office, as convenient to him"}, {"letter": "B", "text": "Any SVB of his choice"}, {"letter": "C", "text": "SVB decided by jurisdictional Commissioner only"}, {"letter": "D", "text": "SVB at place of import only"}], "answer": "A", "answer_text": "", "explanation": "Related-party import असल्यास specified major Customs Houses मधून import होत असेल, importer ला त्याच्या corporate office च्या जवळचा SVB select करण्याची facility आहे. Source मध्ये Circular 05/2016 चा reference आहे.", "golden": "Related Party → SVB nearest to Corporate Office"}, {"no": 54, "q": "Q54. Which type of Bill of Entry is presented for taking goods before assessment due to urgency like perishable goods, pets, dead body, lifesaving drugs etc.?", "options": [{"letter": "A", "text": "Provisional Bill of Entry"}, {"letter": "B", "text": "Normal Bill of Entry for home consumption"}, {"letter": "C", "text": "Kachcha Bill of Entry"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Kachcha Bill of Entry", "explanation": "Urgent/perishable nature च्या goods साठी Kachcha Bill of Entry ची facility दिली जाते. Examples: Perishable goods Pets Dead body Life-saving drugs", "golden": "Urgent/Perishable Goods → Kachcha Bill of Entry"}, {"no": 55, "q": "Q55. What is the maximum depreciation extended to the import of used and second-hand machinery?", "options": [{"letter": "A", "text": "40%"}, {"letter": "B", "text": "50%"}, {"letter": "C", "text": "60%"}, {"letter": "D", "text": "70%"}], "answer": "D", "answer_text": "70%", "explanation": "Used/second-hand machinery चे valuation करताना prescribed depreciation लागू होतो. Source नुसार maximum depreciation 70% आहे. म्हणजे original value मधून जास्तीत जास्त 70% depreciation दिल्यानंतर उरलेली value duty calculation साठी consider केली जाते.", "golden": "Used/Second-hand Machinery → Maximum Depreciation = 70%"}, {"no": 56, "q": "Q56. The essence of AEO programme is to promote and facilitate—", "options": [{"letter": "A", "text": "Business to Business partnership"}, {"letter": "B", "text": "Customs to Business partnership"}, {"letter": "C", "text": "WCO to Business partnership"}, {"letter": "D", "text": "Cooperation among Customs formations within the country"}], "answer": "B", "answer_text": "Customs to Business partnership", "explanation": "AEO = Authorized Economic Operator. AEO programme चा मुख्य उद्देश Customs आणि compliant/trusted business यांच्यामध्ये partnership आणि trust वाढवणे आहे.", "golden": "AEO → Customs-to-Business Partnership"}, {"no": 57, "q": "Q57. If a show cause notice is not issued within the prescribed time after goods are seized under Customs Act, 1962—", "options": [{"letter": "A", "text": "Goods are returned to the person"}, {"letter": "B", "text": "Goods are confiscated"}, {"letter": "C", "text": "Goods are disposed off"}, {"letter": "D", "text": "Goods are auctioned"}], "answer": "A", "answer_text": "Goods are returned", "explanation": "Section 110(2) नुसार seizure नंतर prescribed period मध्ये SCN issue झाला नाही तर goods person कडे return करावे लागतात. Source नुसार normal period 6 months असून prescribed conditions मध्ये extension मिळू शकते.", "golden": "Seizure + No SCN in time → Goods Returned"}, {"no": 58, "q": "Q58. For getting duty exemption on re-import notification, compliance of which condition is mandatory?", "options": [{"letter": "A", "text": "FOB value of export goods should be less than value of imported goods"}, {"letter": "B", "text": "Assessable value of imported goods should be more than FOB value of exports"}, {"letter": "C", "text": "Goods imported must be identified as goods exported"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "", "explanation": "Re-import exemption घेण्यासाठी imported goods हे पूर्वी export केलेले तेच goods आहेत हे identify करता आले पाहिजे. Identification करण्यासाठी: Serial number Marks Specifications Export documents Shipping Bill Invoice यांचा उपयोग होऊ शकतो.", "golden": "Re-import → Same goods identification compulsory"}, {"no": 59, "q": "Q59. International transshipment of cargo needs to be affected within ____ from “Entry Inward” of importing ship.", "options": [{"letter": "A", "text": "One week"}, {"letter": "B", "text": "Fifteen days"}, {"letter": "C", "text": "Thirty days"}, {"letter": "D", "text": "Sixty days"}], "answer": "C", "answer_text": "Thirty Days", "explanation": "Source नुसार international transshipment cargo Entry Inward पासून 30 days मध्ये complete करणे आवश्यक आहे.", "golden": "International Transshipment → 30 Days from Entry Inward"}, {"no": 60, "q": "Q60. What is the present rate of interest for delayed payment of refund by department under Customs Act?", "options": [{"letter": "A", "text": "18%"}, {"letter": "B", "text": "6%"}, {"letter": "C", "text": "12%"}, {"letter": "D", "text": "15%"}], "answer": "B", "answer_text": "6%", "explanation": "Customs Act Section 27A नुसार eligible refund वेळेत न दिल्यास delayed refund वर interest payable आहे. Source नुसार rate: 👉 6% per annum Refund prescribed period मध्ये, source नुसार 3 months मध्ये न मिळाल्यास interest लागू होतो.", "golden": "Delayed Customs Refund → 6% Interest"}, {"no": 61, "q": "Q61. Which of the following is correct?", "options": [{"letter": "A", "text": "MEIS benefit is eligible for supplies to SEZs"}, {"letter": "B", "text": "MEIS benefit is eligible for exports from SEZs"}, {"letter": "C", "text": "MEIS benefit is eligible for deemed exports"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "MEIS benefit is eligible for exports from SEZs", "explanation": "MEIS = Merchandise Exports from India Scheme. Source नुसार MEIS benefit exports from SEZs साठी available होता. पण: Supplies to SEZs ❌ Deemed exports ❌ लक्षात ठेवा, MEIS नंतर RoDTEP ने replace केला.", "golden": "MEIS → Exports from SEZs"}, {"no": 62, "q": "Q62. Which of the following about IEC issued by DGFT is correct?", "options": [{"letter": "A", "text": "IEC is no longer required after introduction of GST"}, {"letter": "B", "text": "IEC is ten-digit number separately issued by DGFT"}, {"letter": "C", "text": "PAN itself is now the IEC"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "PAN itself is now the IEC", "explanation": "GST implementation नंतर DGFT provisions नुसार entity चा PAN हा IEC म्हणून treated केला जातो. पूर्वी separate 10-digit IEC number issue केला जात होता. ⚠️ Source-specific point: हा 2020 paper/source मधील answer आहे.", "golden": "IEC → PAN"}, {"no": 63, "q": "Q63. Revision Application to be filed against the order passed by Commissioner (Appeals) involving drawback lies with—", "options": [{"letter": "A", "text": "Central Government"}, {"letter": "B", "text": "CESTAT"}, {"letter": "C", "text": "Supreme Court"}, {"letter": "D", "text": "High Court"}], "answer": "A", "answer_text": "Central Government", "explanation": "Customs Act Section 129DD नुसार Commissioner (Appeals) चा order जर drawback claim शी संबंधित असेल, तर Revision Application Central Government कडे करता येते.", "golden": "Drawback + Commissioner (Appeals) → Revision → Central Government"}, {"no": 64, "q": "Q64. A vessel arrives at 10 AM on 15.03.2019, the Bill of Entry has to be presented by the importer—", "options": [{"letter": "A", "text": "Before 10 AM on 16.03.2019"}, {"letter": "B", "text": "Before end of 16.03.2019"}, {"letter": "C", "text": "Before 10 AM on 17.03.2019"}, {"letter": "D", "text": "Before end of 17.03.2019"}], "answer": "B", "answer_text": "Before end of 16.03.2019", "explanation": "Source नुसार Bill of Entry Entry Inward च्या date पासून one working day मध्ये file करायचा. Vessel arrival/Entry Inward = 15.03.2019 म्हणून deadline = 16.03.2019 च्या end पर्यंत.", "golden": "Entry Inward → BOE within 1 working day"}, {"no": 65, "q": "Q65. Adjustment in transaction value as per Rule 10 of Customs Valuation Rules includes—", "options": [{"letter": "A", "text": "(i), (ii) & (iii)"}, {"letter": "B", "text": "All except (iv)"}, {"letter": "C", "text": "All except (iii)"}, {"letter": "D", "text": "All except (iii) & (iv)"}], "answer": "D", "answer_text": "All except (iii) & (iv)", "explanation": "Rule 10 मध्ये transaction value मध्ये काही additions करावे लागतात. Included: Buyer कडून free assistance/tools/dies इ. ✔️ Moulds/dies supplied at reduced/no cost ✔️ Not included: Buying commission paid to local agent ❌ Engineering/design work undertaken in India ❌ म्हणून D.", "golden": "Buying Commission → Not added Engineering/Design in India → Not added"}, {"no": 66, "q": "Q66. In CBIC Citizen Charter, “Citizen” stands for—", "options": [{"letter": "A", "text": "All stakeholders"}, {"letter": "B", "text": "Citizens of India"}, {"letter": "C", "text": "All CBIC Officers"}, {"letter": "D", "text": "All Taxpayers"}], "answer": "A", "answer_text": "All stakeholders", "explanation": "CBIC Citizen Charter मधील Citizen म्हणजे फक्त Indian citizens नाही. त्यात Customs/GST/Central Excise शी संबंधित: Importers Exporters Taxpayers Customs Brokers Logistics providers इतर stakeholders यांचा समावेश होतो.", "golden": "Citizen Charter → All Stakeholders"}, {"no": 67, "q": "Q67. Tariff value is fixed by CBIC at USD 3596 per metric ton. Goods have been imported at USD 3800 FOB per MT. On which value the goods are to be assessed?", "options": [{"letter": "A", "text": "USD 3800"}, {"letter": "B", "text": "USD 3596"}, {"letter": "C", "text": "USD 3800 + Insurance + Freight"}, {"letter": "D", "text": "USD 3596 + Insurance + Freight"}], "answer": "B", "answer_text": "USD 3596", "explanation": "Customs Act Section 14(2) अंतर्गत CBIC ने जर Tariff Value notify केली असेल, तर assessment त्या notified tariff value वर होते. Actual FOB = USD 3800 असला तरी source नुसार: 👉 Assessable value = USD 3596/MT", "golden": "Notified Tariff Value → Assessment on Tariff Value"}, {"no": 68, "q": "Q68. Import of second-hand capital goods under EPCG is—", "options": [{"letter": "A", "text": "Not permitted"}, {"letter": "B", "text": "Permitted"}, {"letter": "C", "text": "Permitted with permission granted by Chief Commissioner of Customs"}, {"letter": "D", "text": "Permitted with permission granted by RA of DGFT"}], "answer": "A", "answer_text": "Not permitted", "explanation": "Source नुसार EPCG scheme अंतर्गत second-hand capital goods import permitted नाही. EPCG मध्ये eligible capital goods च्या import वर export obligation असते.", "golden": "EPCG → Second-hand Capital Goods = Not Permitted"}, {"no": 69, "q": "Q69. The sub-heading as per the Customs Tariff consists of ______ digits.", "options": [{"letter": "A", "text": "8"}, {"letter": "B", "text": "7"}, {"letter": "C", "text": "6"}, {"letter": "D", "text": "55"}], "answer": "C", "answer_text": "6 digits", "explanation": "HS classification मध्ये: Heading = 4 digits Sub-heading = 6 digits India पुढे tariff item साठी 8 digits वापरते.", "golden": "Sub-heading = 6 digits Tariff Item = 8 digits"}, {"no": 70, "q": "Q70. A contract can be registered before importation under Project Import Regulations, 1986 if it would—", "options": [{"letter": "A", "text": "Increase the existing installed capacity substantially"}, {"letter": "B", "text": "Increase the existing installed capacity by not less than 25 percent"}, {"letter": "C", "text": "Increase the existing installed capacity by not less than 50 percent"}, {"letter": "D", "text": "It is not necessary to increase the existing installed capacity"}], "answer": "A", "answer_text": "Increase the existing installed capacity substantially", "explanation": "Project Import Regulations, 1986 अंतर्गत contract pre-registration करण्यासाठी project मुळे existing installed capacity मध्ये substantial increase होणे आवश्यक आहे.", "golden": "Project Import → Substantial Increase in Installed Capacity"}, {"no": 71, "q": "Q71. The goods being exported under Brand Rate (Rule 6) should be classified under—", "options": [{"letter": "A", "text": "9807"}, {"letter": "B", "text": "Respective Drawback Schedule"}, {"letter": "C", "text": "Respective Customs Tariff at four digits"}, {"letter": "D", "text": "9801"}], "answer": "A", "answer_text": "9807", "explanation": "Source नुसार Brand Rate mechanism अंतर्गत exported goods Heading 9807 मध्ये classified केले जातात. Brand Rate तेव्हा relevant असतो जेव्हा All Industry Rate (AIR) exporter च्या actual incidence ला adequately cover करत नाही.", "golden": "Brand Rate → Heading 9807"}, {"no": 72, "q": "Q72. Duty in case of import of brass scrap is payable on which value?", "options": [{"letter": "A", "text": "FOB"}, {"letter": "B", "text": "C & F"}, {"letter": "C", "text": "CIF"}, {"letter": "D", "text": "Tariff value"}], "answer": "D", "answer_text": "Tariff Value", "explanation": "Source नुसार brass scrap साठी CBIC/Government ने Tariff Value notify केलेली असल्यास duty त्या notified tariff value वर calculate केली जाते.", "golden": "Brass Scrap → Tariff Value"}, {"no": 73, "q": "Q73. Once the goods imported by an importer have been confiscated by the department and redemption fine is not paid by the importer, the title of such goods lies with—", "options": [{"letter": "A", "text": "Importer"}, {"letter": "B", "text": "Government"}, {"letter": "C", "text": "Custodian, who can auction the same"}, {"letter": "D", "text": "Customs Broker"}], "answer": "B", "answer_text": "Government", "explanation": "Customs Act Section 126 नुसार confiscation झाल्यानंतर goods चे title Central Government मध्ये vest होते. Importer ने redemption fine भरला नाही तर goods Government property होतात.", "golden": "Confiscation → Title → Government"}, {"no": 74, "q": "Q74. As per FEMA, 1999, what is the permissible period for bringing the remittance of export proceeds?", "options": [{"letter": "A", "text": "6 months"}, {"letter": "B", "text": "9 months"}, {"letter": "C", "text": "3 months"}, {"letter": "D", "text": "12 months"}], "answer": "B", "answer_text": "9 months", "explanation": "Source नुसार FEMA अंतर्गत सामान्य export proceeds realization/repatriation period 9 months आहे. ⚠️ हा 2020 source/paper-specific answer आहे.", "golden": "Export Proceeds → 9 Months"}, {"no": 75, "q": "Q75. Exports of goods as per IGST Act, 2017 are—", "options": [{"letter": "A", "text": "Exempted"}, {"letter": "B", "text": "Zero-rated"}, {"letter": "C", "text": "Taxable"}, {"letter": "D", "text": "Non-taxable"}], "answer": "B", "answer_text": "Zero-rated", "explanation": "IGST Act मध्ये exports ना zero-rated supply मानले जाते. याचा फायदा असा की exporter: LUT/Bond अंतर्गत tax न भरता export करू शकतो, किंवा IGST भरून refund claim करू शकतो, subject to applicable rules.", "golden": "Export → Zero-rated Supply"}, {"no": 76, "q": "Q76. Can an importer request for First Check?", "options": [{"letter": "A", "text": "No, First Check is prerogative of assessing officer"}, {"letter": "B", "text": "No, RMS decides itself"}, {"letter": "C", "text": "Yes, if he does not have complete information regarding the goods"}, {"letter": "D", "text": "No, importer cannot decide"}], "answer": "C", "answer_text": "Yes", "explanation": "Importer कडे goods बद्दल complete information नसल्यास तो First Check request करू शकतो. First Check मध्ये: Examination → Assessment म्हणजे physical examination आधी आणि assessment नंतर.", "golden": "Importer can request First Check → Incomplete information"}, {"no": 77, "q": "Q77. Which copy of a Shipping Bill is submitted in DGFT by exporter for claiming MEIS benefits?", "options": [{"letter": "A", "text": "Export Promotion (EP) Copy"}, {"letter": "B", "text": "Shipping Bill is electronically transmitted from Customs to DGFT"}, {"letter": "C", "text": "No Shipping Bill is required to be submitted; CA certificate is sufficient"}, {"letter": "D", "text": "Instead of Shipping Bill, EGM copy is required"}], "answer": "B", "answer_text": "", "explanation": "MEIS benefit साठी exporter ला physical Shipping Bill DGFT कडे manually submit करण्याची गरज नसते. Shipping Bill information electronically Customs कडून DGFT ला transmit होते.", "golden": "MEIS → Shipping Bill electronically transmitted to DGFT"}, {"no": 78, "q": "Q78. Maximum duration available for filing appeal with High Court against order passed by CESTAT is—", "options": [{"letter": "A", "text": "30 days"}, {"letter": "B", "text": "60 days"}, {"letter": "C", "text": "90 days"}, {"letter": "D", "text": "180 days"}], "answer": "D", "answer_text": "180 days", "explanation": "Customs Act Section 130 नुसार CESTAT च्या order विरुद्ध High Court मध्ये appeal करण्यासाठी source मध्ये 180 days ची maximum period दिली आहे.", "golden": "CESTAT → High Court Appeal → 180 Days"}, {"no": 79, "q": "Q79. Which of the following laws are related to the Infringement of Intellectual Property Rights (IPR)?", "options": [{"letter": "A", "text": "(i), (iii) and (iv) are only"}, {"letter": "B", "text": "(i), (ii) and (iii) are only"}, {"letter": "C", "text": "(i) and (ii) are only"}, {"letter": "D", "text": "All the above"}], "answer": "D", "answer_text": "All the above", "explanation": "चारही laws IPR शी directly related आहेत: Trade Marks Act, 1999 → Trademarks Patents Act, 1970 → Patents/Inventions Designs Act, 2000 → Industrial Designs GI Act, 1999 → Geographical Indications", "golden": "Trademark + Patent + Design + GI → IPR"}, {"no": 80, "q": "Q80. An exporter can claim the Brand Rate of Drawback (Rule 6) if the All-Industry Rate on an export commodity is—", "options": [{"letter": "A", "text": "Less than 80% of the actual duty incidence suffered in manufacture of the export goods"}, {"letter": "B", "text": "Less than 95% of the actual duty incidence suffered in manufacture of the export goods"}, {"letter": "C", "text": "Less than 90% of the actual duty incidence suffered in manufacture of the export goods"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "Less than 80%", "explanation": "Source नुसार जर All Industry Rate (AIR) हा exporter ने actual manufacturing मध्ये bear केलेल्या duty incidence च्या 80% पेक्षा कमी असेल, तर Brand Rate claim करता येतो. उदा.: Actual duty incidence = ₹100 AIR = ₹75 ₹75 हा ₹100 च्या 80% पेक्षा कमी आहे, त्यामुळे Brand Rate लागू होऊ शकतो.", "golden": "AIR < 80% of Actual Duty Incidence → Brand Rate"}, {"no": 81, "q": "Q81. MEIS Scheme is post-export or pre-export?", "options": [{"letter": "A", "text": "Post-Export"}, {"letter": "B", "text": "Pre-export"}, {"letter": "C", "text": "Conversion scheme"}, {"letter": "D", "text": "Both Post & Pre Export"}], "answer": "A", "answer_text": "Post-Export", "explanation": "MEIS = Merchandise Exports from India Scheme. या scheme मध्ये export केल्यानंतर eligible exports वर benefit मिळत होता. त्यामुळे ही post-export incentive scheme होती. ⚠️ Paper-specific: MEIS नंतर 1 January 2021 पासून RoDTEP ने replace केला.", "golden": "MEIS → Post-Export Scheme"}, {"no": 82, "q": "Q82. What is the time-limit within which the containers of durable nature are to be re-exported as per Notification No. 104/94-Customs?", "options": [{"letter": "A", "text": "6 months or extended period"}, {"letter": "B", "text": "One Year"}, {"letter": "C", "text": "3 months"}, {"letter": "D", "text": "6 months"}], "answer": "A", "answer_text": "6 months or extended period", "explanation": "Notification No. 104/94-Customs अंतर्गत durable containers duty-free import करण्याची सुविधा आहे, पण ते prescribed period मध्ये re-export करणे आवश्यक आहे. Normal period = 6 months आणि sufficient cause असल्यास extension मिळू शकते.", "golden": "Durable Container → 6 Months / Extended Period"}, {"no": 83, "q": "Q83. In respect of export through ATA Carnet, which type of shipping bill has to be filed?", "options": [{"letter": "A", "text": "Free Shipping Bill"}, {"letter": "B", "text": "Manual Shipping Bill"}, {"letter": "C", "text": "ATA Carnet itself is considered as shipping bill"}, {"letter": "D", "text": "None"}], "answer": "C", "answer_text": "ATA Carnet itself is considered as Shipping Bill", "explanation": "ATA Carnet हा international customs document आहे. ATA Carnet वापरून temporary export/import करता येते. Source नुसार separate Shipping Bill आवश्यक नसून ATA Carnet itself acts as Shipping Bill.", "golden": "ATA Carnet → Itself treated as Shipping Bill"}, {"no": 84, "q": "Q84. Proper Authority to grant license to a Private Custom Bonded Warehouse?", "options": [{"letter": "A", "text": "Assistant Commissioner of Customs"}, {"letter": "B", "text": "Dy. Commissioner of Customs"}, {"letter": "C", "text": "Principal Commissioner/Commissioner of Customs"}, {"letter": "D", "text": "CBIC"}], "answer": "C", "answer_text": "", "explanation": "Customs Act Section 58 नुसार private bonded warehouse साठी licence देण्याचा authority: 👉 Principal Commissioner / Commissioner of Customs असतो.", "golden": "Private Bonded Warehouse Licence → Pr. Commissioner/Commissioner"}, {"no": 85, "q": "Q85. What is the maximum quantum of penalty that can be imposed for contravention of any provision of Bill of Entry (Electronic Integrated Declaration and Paperless Processing) Regulations, 2018?", "options": [{"letter": "A", "text": "₹50,000/-"}, {"letter": "B", "text": "₹1,00,000/-"}, {"letter": "C", "text": "₹5,000/-"}, {"letter": "D", "text": "Up to the value of the goods"}], "answer": "A", "answer_text": "₹50,000", "explanation": "या Regulations च्या provision चे contravention झाल्यास proper officer कडून maximum ₹50,000 penalty impose केली जाऊ शकते.", "golden": "BE Electronic/Paperless Regulations → Maximum Penalty ₹50,000 📘 Q86–90"}, {"no": 86, "q": "Q86. Normally, within how much time information shall be given to seeker under the RTI Act, 2005?", "options": [{"letter": "A", "text": "45 days normally & 24 hrs for life & liberty"}, {"letter": "B", "text": "60 days normally & 48 hrs for life & liberty"}, {"letter": "C", "text": "90 days normally & within one week for life & liberty"}, {"letter": "D", "text": "30 days normally & 48 hrs for life & liberty"}], "answer": "D", "answer_text": "", "explanation": "RTI Act अंतर्गत सामान्यतः information request वर response: 30 days पण request जर एखाद्या व्यक्तीच्या life or liberty शी संबंधित असेल तर: 48 hours", "golden": "RTI → 30 Days Life & Liberty → 48 Hours"}, {"no": 87, "q": "Q87. Determination of Country of Origin does not affect—", "options": [{"letter": "A", "text": "Levy of Anti-Dumping Duty (ADD)"}, {"letter": "B", "text": "Valuation of Goods"}, {"letter": "C", "text": "FTA Benefit"}, {"letter": "D", "text": "None of these**"}], "answer": "D", "answer_text": "None of these", "explanation": "Country of Origin अनेक customs matters मध्ये महत्त्वाचे आहे. ते: Anti-Dumping Duty ✔️ Valuation/trade treatment ✔️ FTA preferential benefit ✔️ यावर परिणाम करू शकते. म्हणून “does not affect” असे कोणतेही option योग्य नाही.", "golden": "Country of Origin → ADD + FTA + Customs Treatment"}, {"no": 88, "q": "Q88. For Duty Drawback under Section 74, one condition is that goods should be exported within two years. Who has power to extend the period of two years?", "options": [{"letter": "A", "text": "Assistant/Deputy Commissioner"}, {"letter": "B", "text": "Commissioner"}, {"letter": "C", "text": "CBIC"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "CBIC", "explanation": "Section 74 मध्ये re-exported imported goods साठी drawback ची provision आहे. Goods prescribed period मध्ये export करायचे असतात. Two-year period extend करण्याचा power CBIC कडे आहे.", "golden": "Section 74 → 2 Years → Extension by CBIC"}, {"no": 89, "q": "Q89. Under Customs and Central Excise Duties Drawback Rules, 2017, where an exporter claims that the amount of rate of drawback is less, he may mak
