e an application for determination of amount of drawback to—", "options": [{"letter": "A", "text": "Pr. Commissioner/Commissioner of Central Excise/CGST having jurisdiction where manufacturer is located"}, {"letter": "B", "text": "Commissioner of SGST having jurisdiction where manufacturer is located"}, {"letter": "C", "text": "Pr. Commissioner/Commissioner of Customs having jurisdiction over place of export"}, {"letter": "D", "text": "Director, Customs, Govt. of India"}], "answer": "C", "answer_text": "", "explanation": "जर exporter ला वाटत असेल की applicable drawback rate त्याच्या actual duty incidence पेक्षा कमी आहे, तर Brand Rate determination साठी application करता येते. Source नुसार application: 👉 Principal Commissioner/Commissioner of Customs having jurisdiction over place of export यांच्याकडे केली जाते.", "golden": "Brand Rate → Customs Commissioner at Place of Export"}, {"no": 90, "q": "Q90. If any smuggled goods are concealed in a vehicle—", "options": [{"letter": "A", "text": "Only the goods can be seized"}, {"letter": "B", "text": "Only the vehicle can be seized"}, {"letter": "C", "text": "Both goods and vehicle can be seized"}, {"letter": "D", "text": "Neither goods nor vehicle can be seized"}], "answer": "C", "answer_text": "Both goods and vehicle can be seized", "explanation": "Customs Act Section 115 नुसार smuggled goods एखाद्या vehicle मध्ये concealed असतील तर: ✅ Smuggled goods ✅ Vehicle used for transportation दोन्ही seizure/confiscation ला liable होऊ शकतात.", "golden": "Smuggled Goods + Vehicle → Both can be seized 📘 Q91–100"}, {"no": 91, "q": "Q91. If any goods are attempted to be exported by sea or air from any place other than a Customs port or airport appointed for loading of such goods, such goods are—", "options": [{"letter": "A", "text": "Permitted for export if a Shipping Bill is filed"}, {"letter": "B", "text": "Permitted for export if applicable fine is paid"}, {"letter": "C", "text": "Liable for confiscation"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Liable for confiscation", "explanation": "Customs Act Section 113 नुसार goods जर designated Customs port/airport व्यतिरिक्त दुसऱ्या ठिकाणाहून export करण्याचा attempt केला तर goods confiscation ला liable होतात.", "golden": "Export from unauthorized place → Confiscation"}, {"no": 92, "q": "Q92. While calculating value under Rule 7 (Deductive method) of Customs Valuation Rules, 2007, which price is taken as basis?", "options": [{"letter": "A", "text": "Selling price in India"}, {"letter": "B", "text": "Purchasing price in country of export"}, {"letter": "C", "text": "Selling price in country of origin"}, {"letter": "D", "text": "Selling price in any country"}], "answer": "A", "answer_text": "Selling price in India", "explanation": "Deductive Value Method – Rule 7 मध्ये imported goods भारतात ज्या price ला विकले जातात, त्या selling price in India पासून काही allowable deductions करून customs value ठरवली जाते.", "golden": "Rule 7 → Selling Price in India"}, {"no": 93, "q": "Q93. Which of the following are covered in the definition of “export” as per Customs and Central Excise Duties Drawback Rules, 2017?", "options": [{"letter": "A", "text": "i, ii and iii"}, {"letter": "B", "text": "Only i"}, {"letter": "C", "text": "Only i and ii"}, {"letter": "D", "text": "Only i and iii"}], "answer": "A", "answer_text": "i, ii and iii", "explanation": "Drawback Rules मध्ये “export” ची definition broad आहे. यात: India → outside India ✔️ DTA → SEZ ✔️ Foreign-going vessel/aircraft ला stores म्हणून goods देणे ✔️ म्हणून तीनही correct.", "golden": "Drawback “Export” → i + ii + iii"}, {"no": 94, "q": "Q94. What does the acronym SION in respect of Advanced Authorization Scheme stand for?", "options": [{"letter": "A", "text": "Standard Input Output norms"}, {"letter": "B", "text": "Standard Industry Output norms"}, {"letter": "C", "text": "Standard Input Output nomenclature"}, {"letter": "D", "text": "Subjective Input Output norms"}], "answer": "A", "answer_text": "Standard Input Output Norms", "explanation": "SION = Standard Input Output Norms. हे norms सांगतात की specific export product तयार करण्यासाठी किती quantity/type of input required आहे. Advance Authorisation मध्ये duty-free inputs च्या quantity determination साठी SION महत्त्वाचे आहे.", "golden": "SION = Standard Input Output Norms"}, {"no": 95, "q": "Q95. Facility of deferred payment of customs duty has been provided at present to which category of importers?", "options": [{"letter": "A", "text": "ACP"}, {"letter": "B", "text": "AEO"}, {"letter": "C", "text": "AEO-T2 & T3"}, {"letter": "D", "text": "DPD"}], "answer": "C", "answer_text": "AEO-T2 & T3", "explanation": "Deferred Payment of Customs Duty म्हणजे eligible importer ला goods clearance वेळी लगेच duty न भरता prescribed schedule प्रमाणे नंतर duty pay करण्याची facility. Source नुसार ही facility: 👉 AEO Tier-2 & Tier-3 importers साठी आहे.", "golden": "Deferred Duty Payment → AEO T2 & T3"}, {"no": 96, "q": "Q96. A machine is imported for ₹1,00,000 CIF. BCD = 10%. SWS = 10%. Calculate SWS.", "options": [{"letter": "A", "text": "₹10,000/-"}, {"letter": "B", "text": "₹11,000/-"}, {"letter": "C", "text": "₹1,000/-"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "₹1,000", "explanation": "", "golden": "SWS = 10% of BCD ₹10,000 BCD → ₹1,000 SWS"}, {"no": 97, "q": "Q97. What happens if the warehoused goods are removed without payment of applicable Customs Duty or in contravention of Section 71?", "options": [{"letter": "A", "text": "All (i), (ii) and (iii)"}, {"letter": "B", "text": "(i) and (ii)"}, {"letter": "C", "text": "(ii) and (iii)"}, {"letter": "D", "text": "Only (iii)"}], "answer": "A", "answer_text": "All i, ii and iii", "explanation": "Customs Act Section 72 अंतर्गत warehoused goods improperly remove केले किंवा Section 71 चे contravention झाले तर: Full Customs Duty ✔️ Interest ✔️ Confiscation/Fine/Penalty ✔️ लागू होऊ शकतात.", "golden": "Warehouse Contravention → Duty + Interest + Confiscation/Fine/Penalty"}, {"no": 98, "q": "Q98. MEIS benefit is given on—", "options": [{"letter": "A", "text": "FOB value of exports"}, {"letter": "B", "text": "Realised FOB value of exports"}, {"letter": "C", "text": "FOB value of exports or Realised FOB value of exports, whichever is less"}, {"letter": "D", "text": "FOB value of exports or Realised FOB value of exports, whichever is more"}], "answer": "C", "answer_text": "", "explanation": "MEIS benefit calculate करताना: FOB value आणि Realised FOB value यापैकी whichever is less consider केला जातो. उदा.: FOB = ₹10 lakh Realised FOB = ₹8 lakh Benefit base = ₹8 lakh", "golden": "MEIS → Lower of FOB or Realised FOB"}, {"no": 99, "q": "Q99. What is the correct sequence for deciding value of import goods as per Customs Valuation Rules, 2007?", "options": [{"letter": "A", "text": "Transaction Value → Transaction Value of Identical Goods → Transaction Value of Similar Goods → Deductive Value"}, {"letter": "B", "text": "Transaction Value of Identical Goods → Transaction Value → Similar Goods → Deductive Value"}, {"letter": "C", "text": "Transaction Value → Similar Goods → Identical Goods → Deductive Value"}, {"letter": "D", "text": "Transaction Value → Identical Goods → Deductive Value → Similar Goods"}], "answer": "A", "answer_text": "", "explanation": "Customs valuation hierarchy: 1️⃣ Rule 3 — Transaction Value ↓ 2️⃣ Rule 4 — Identical Goods ↓ 3️⃣ Rule 5 — Similar Goods ↓ 4️⃣ Rule 7 — Deductive Value म्हणून A योग्य.", "golden": "TV → Identical → Similar → Deductive 🧮 Q100 — Important Calculation"}, {"no": 100, "q": "Q100. An importer files a warehousing Bill of Entry wherein details are:", "options": [{"letter": "A", "text": "₹1,00,000/-"}, {"letter": "B", "text": "₹1,50,000/-"}, {"letter": "C", "text": "₹1,11,000/-"}, {"letter": "D", "text": "₹1,21,000/-"}], "answer": "B", "answer_text": "₹1,50,000", "explanation": "Customs Tariff Act Section 3(8A) नुसार warehoused goods जेव्हा warehouse मधून home consumption साठी clear केले जातात, तेव्हा IGST calculation साठी relevant transaction value at the time of clearance consider केली जाते. येथे importer ने goods warehouse मध्ये असतानाच: 👉 ₹1,50,000 ला sell केले. म्हणून IGST base = ₹1,50,000 Original assessable value ₹1,00,000 किंवा BCD/SWS add करून ₹1,11,000 घेणार नाही.", "golden": "Warehoused Goods + HSS/Sale before clearance → IGST on transaction value at clearance"}, {"no": 101, "q": "Q101. An importer files a Warehousing Bill of Entry with:", "options": [{"letter": "A", "text": "₹1,00,000"}, {"letter": "B", "text": "₹1,50,000"}, {"letter": "C", "text": "₹1,11,000"}, {"letter": "D", "text": "₹1,21,000"}], "answer": "B", "answer_text": "₹1,50,000", "explanation": "Goods warehouse मध्ये असताना ₹1,50,000 ला विकले आहेत. त्यामुळे clearance वेळी IGST साठी relevant transaction value ₹1,50,000 आहे.", "golden": "Warehoused goods sold before clearance → IGST value = ₹1,50,000"}, {"no": 102, "q": "Q102. Which is the document to be delivered by the person in-charge of a vehicle exporting goods through Land Customs Station (LCS)?", "options": [{"letter": "A", "text": "Export Report"}, {"letter": "B", "text": "EGM"}, {"letter": "C", "text": "Both EGM as well as Export Report"}, {"letter": "D", "text": "None"}], "answer": "A", "answer_text": "Export Report", "explanation": "Land Customs Station मधून goods export होत असतील तर vehicle च्या person-in-charge ने Export Report proper officer कडे द्यायचा असतो.", "golden": "LCS Export → Export Report"}, {"no": 103, "q": "Q103. Import of which of the following is not subjected to provisions of Wildlife (Protection) Act, 1972?", "options": [{"letter": "A", "text": "Snakes"}, {"letter": "B", "text": "Cactus"}, {"letter": "C", "text": "Whales"}, {"letter": "D", "text": "Parrots"}], "answer": "B", "answer_text": "Cactus", "explanation": "Snakes, whales आणि parrots हे wildlife/faunal species आहेत आणि specified species बाबत Wildlife Act/CITES provisions लागू होऊ शकतात. या प्रश्नाच्या source answer नुसार Cactus योग्य answer आहे.", "golden": "2020 Paper → Wildlife Act question → Cactus"}, {"no": 104, "q": "Q104. In the context of containers, TEU stands for—", "options": [{"letter": "A", "text": "Trade Exports Units"}, {"letter": "B", "text": "Trade Equivalent Units"}, {"letter": "C", "text": "Twenty Feet Equivalent Units"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Twenty Feet Equivalent Units", "explanation": "TEU = Twenty-foot Equivalent Unit. Container shipping मध्ये standard measurement म्हणून वापरले जाते. 20-foot container = 1 TEU 40-foot container = 2 TEU", "golden": "TEU → Twenty-foot Equivalent Unit"}, {"no": 105, "q": "Q105. Where the audit is conducted at the premises of the auditee, the proper officer shall complete audit within—", "options": [{"letter": "A", "text": "30 days from the date of starting of audit"}, {"letter": "B", "text": "30 days from the date audit documents are made available"}, {"letter": "C", "text": "15 days from the date audit documents are made available"}, {"letter": "D", "text": "15 days from the date of starting of audit"}], "answer": "A", "answer_text": "30 days from the date of starting of audit", "explanation": "Customs Audit Regulations, 2018 नुसार premises-based audit साधारणतः audit सुरू झाल्याच्या तारखेपासून 30 days मध्ये complete करायचा आहे.", "golden": "Premises-based Customs Audit → 30 Days from Start 📘 Q106–110"}, {"no": 106, "q": "Q106. Whether all Customs Brokers' employees issued photo identity card under Form H are authorized to sign the declarations filed before Customs?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes, if authorized so by the Customs Broker"}, {"letter": "C", "text": "Yes, if allowed so by Customs"}, {"letter": "D", "text": "Yes, if registered under the BCBA"}], "answer": "A", "answer_text": "No", "explanation": "Customs Broker च्या प्रत्येक employee कडे Form H photo ID असले तरी त्यांना आपोआप Customs declarations वर sign करण्याचा अधिकार मिळत नाही.", "golden": "Form H ID ≠ Automatic signing authority"}, {"no": 107, "q": "Q107. In which of the following cases, Anti-Dumping Duty may be imposed?", "options": [{"letter": "A", "text": "Exporting country has sent unwanted and rejected goods into importing country"}, {"letter": "B", "text": "Exporter has deliberately exported the goods"}, {"letter": "C", "text": "An exporter exports goods at a price less than the Normal Value at which it sells them in its home market"}, {"letter": "D", "text": "An exporter sells cheap goods to the market in importing country"}], "answer": "C", "answer_text": "", "explanation": "Dumping म्हणजे exporter ने goods भारतात/ importing country मध्ये त्यांच्या Normal Value पेक्षा कमी price ला export करणे. यामुळे domestic industry ला injury होत असल्यास Anti-Dumping Duty impose केली जाऊ शकते.", "golden": "Export Price < Normal Value → Dumping → Anti-Dumping Duty"}, {"no": 108, "q": "Q108. Goods are pilfered after unloading and before the proper officer has made an order for clearance. Can importer be asked to pay duty on such goods?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}, {"letter": "C", "text": "Yes, if ordered by Commissioner of Customs"}, {"letter": "D", "text": "Yes, if ordered by proper officer"}], "answer": "A", "answer_text": "No", "explanation": "Customs Act Section 13 नुसार goods unload झाल्यानंतर पण proper officer ने clearance order देण्यापूर्वी pilfer झाले असल्यास त्या pilfered goods वर importer कडून duty recover केली जात नाही.", "golden": "Pilferage after unloading + Before clearance order → No duty from importer"}, {"no": 109, "q": "Q109. Definition of “Customs Station” under Customs Act, 1962 includes:", "options": [{"letter": "A", "text": "Only i"}, {"letter": "B", "text": "i and ii"}, {"letter": "C", "text": "i, ii and iii"}, {"letter": "D", "text": "Only iii"}], "answer": "B", "answer_text": "i and ii", "explanation": "Customs Station मध्ये: ✔️ Land Customs Station ✔️ Foreign Post Office यांचा समावेश होतो. पण Customs Bonded Warehouse हे Customs Station नाही; ते bonded storage facility आहे.", "golden": "Customs Station → LCS + Foreign Post Office Warehouse ≠ Customs Station"}, {"no": 110, "q": "Q110. What is the percentage of drawback on export goods which were imported and used after import in India, if exported within a period of ____ from date of import?", "options": [{"letter": "A", "text": "100%"}, {"letter": "B", "text": "75%"}, {"letter": "C", "text": "50%"}, {"letter": "D", "text": "Nil"}], "answer": "B", "answer_text": "75%", "explanation": "Section 74 मध्ये imported goods भारतात import केल्यानंतर वापरले आणि नंतर re-export केले असल्यास prescribed conditions पूर्ण केल्यावर drawback मिळतो. Source answer नुसार या period मध्ये export केल्यास drawback 75% आहे.", "golden": "Section 74 → Used Imported Goods Re-export → 75% Drawback 📘 Q111–115"}, {"no": 111, "q": "Q111. Who pays charges for test or re-test of goods drawn by Customs?", "options": [{"letter": "A", "text": "No fee is charged"}, {"letter": "B", "text": "Importer or exporter"}, {"letter": "C", "text": "Customs"}, {"letter": "D", "text": "None"}], "answer": "B", "answer_text": "Importer or Exporter", "explanation": "Customs कडून goods चे laboratory test/re-test केले असल्यास त्याचा prescribed testing cost संबंधित importer/exporter कडून भरला जातो.", "golden": "Customs Test/Re-test → Importer/Exporter pays"}, {"no": 112, "q": "Q112. A tax of ₹6 per litre of crude oil would be an example of—", "options": [{"letter": "A", "text": "Compound tariff"}, {"letter": "B", "text": "Specific tariff"}, {"letter": "C", "text": "Ad valorem tariff"}, {"letter": "D", "text": "MRP-based tariff"}], "answer": "B", "answer_text": "Specific Tariff", "explanation": "Specific tariff म्हणजे goods च्या quantity/unit वर fixed amount. उदा.: ₹6 per litre हे value च्या percentage मध्ये नाही. Ad valorem असते: 10% of value.", "golden": "₹ per litre / ₹ per kg / ₹ per piece → Specific Tariff"}, {"no": 113, "q": "Q113. Kimberley Process Certification Scheme is associated with import of which commodity?", "options": [{"letter": "A", "text": "Rough Diamond"}, {"letter": "B", "text": "Gold"}, {"letter": "C", "text": "Gold Jewellery"}, {"letter": "D", "text": "Precious Stone"}], "answer": "A", "answer_text": "Rough Diamond", "explanation": "Kimberley Process Certification Scheme (KPCS) चा उद्देश conflict diamonds चा international trade रोखणे हा आहे. मुख्यतः rough diamonds च्या trade वर certification system लागू आहे.", "golden": "Kimberley Process → Rough Diamonds"}, {"no": 114, "q": "Q114. As per Customs Broker Licensing Regulations, 2018, a Customs Broker is under obligation to—", "options": [{"letter": "A", "text": "Only i and ii"}, {"letter": "B", "text": "Only ii and iii"}, {"letter": "C", "text": "Only i and iii"}, {"letter": "D", "text": "i, ii and iii"}], "answer": "A", "answer_text": "Only i and ii", "explanation": "Customs Broker वर client-related due diligence obligations आहेत. Source answer नुसार: ✔️ Client कडून authorization घेणे ✔️ Client ची identity verify करणे हे आवश्यक आहे.", "golden": "CB Due Diligence → Authorization + Identity Verification"}, {"no": 115, "q": "Q115. If actual amount of freight is not available, what percentage of FOB value is added towards freight for purpose of import valuation?", "options": [{"letter": "A", "text": "20%"}, {"letter": "B", "text": "21.125%"}, {"letter": "C", "text": "1.125%"}, {"letter": "D", "text": "1%"}], "answer": "A", "answer_text": "20%", "explanation": "Actual freight charges उपलब्ध नसल्यास Customs Valuation Rules नुसार 20% of FOB freight म्हणून add केले जाते. उदा.: FOB = ₹1,00,000 Freight = 20% = ₹20,000", "golden": "Actual Freight unavailable → Add 20% of FOB 📘 Q116–120"}, {"no": 116, "q": "Q116. A bicycle without seats will be classified as—", "options": [{"letter": "A", "text": "Part of Bicycle, being incomplete"}, {"letter": "B", "text": "Bicycle"}, {"letter": "C", "text": "Residual Heading"}, {"letter": "D", "text": "Articles of MS"}], "answer": "B", "answer_text": "Bicycle", "explanation": "Customs Tariff मध्ये GRI 2(a) नुसार incomplete/unfinished article जर complete article चे essential character धारण करत असेल, तर त्याला complete article प्रमाणे classify केले जाते. Seat नसली तरी bicycle चे essential character आहे. म्हणून: 👉 Bicycle", "golden": "Incomplete article + Essential Character → Complete article classification"}, {"no": 117, "q": "Q117. Social Welfare Surcharge (SWS) is levied on—", "options": [{"letter": "A", "text": "Only (i)"}, {"letter": "B", "text": "(i) and (ii)"}, {"letter": "C", "text": "(i), (ii) and (iii)"}, {"letter": "D", "text": "All (i), (ii), (iii) and (iv)"}], "answer": "A", "answer_text": "Only (i)", "explanation": "SWS हा सामान्यतः Basic Customs Duty च्या 10% प्रमाणे levy होतो. तो: IGST वर ❌ Anti-Dumping Duty वर ❌ Compensation Cess वर ❌ या प्रश्नाच्या source answer नुसार फक्त BCD वर आहे.", "golden": "SWS → 10% of BCD"}, {"no": 118, "q": "Q118. Customs Broker Licensing Regulations, 2018 मध्ये “Customs Broker” ची definition कोणत्या कामांना cover करते?", "options": [{"letter": "A", "text": "Only i and ii"}, {"letter": "B", "text": "i, ii and iii"}, {"letter": "C", "text": "Only ii and iii"}, {"letter": "D", "text": "Only i and iii"}], "answer": "B", "answer_text": "i, ii and iii", "explanation": "Customs Broker हा importer/exporter च्या behalf वर Customs-related business handle करणारा licensed agent आहे. Source definition मध्ये: Goods import/export Conveyance entry/departure Customs Station वरील संबंधित audit work यांचा समावेश आहे.", "golden": "Customs Broker → Import/Export + Conveyance + Customs Station work"}, {"no": 119, "q": "Q119. With implementation of online facility, supporting documents relating to export can be uploaded through—", "options": [{"letter": "A", "text": "E-SANCHIT"}, {"letter": "B", "text": "SWIFT"}, {"letter": "C", "text": "SPARROW"}, {"letter": "D", "text": "CSTIN"}], "answer": "A", "answer_text": "E-SANCHIT", "explanation": "e-Sanchit हे Customs चे electronic document-upload facility आहे. Exporter/importer supporting documents online upload करू शकतो.", "golden": "Supporting Documents Upload → e-SANCHIT"}, {"no": 120, "q": "Q120. Definition of “Conveyance” under Customs Act, 1962 includes—", "options": [{"letter": "A", "text": "i and ii"}, {"letter": "B", "text": "i and iii"}, {"letter": "C", "text": "ii and iii"}, {"letter": "D", "text": "i, ii and iii"}], "answer": "D", "answer_text": "i, ii and iii", "explanation": "Customs Act, 1962 मधील Conveyance मध्ये: ✔️ Vessel ✔️ Aircraft ✔️ Vehicle तीन्ही येतात.", "golden": "Conveyance = Vessel + Aircraft + Vehicle"}, {"no": 121, "q": "Q121. Which of the following transshipment costs are to be added in the assessment value of import goods?", "options": [{"letter": "A", "text": "Indian Ports to ICDs"}, {"letter": "B", "text": "Indian Port to Indian Port"}, {"letter": "C", "text": "Indian Port to CFS"}, {"letter": "D", "text": "None"}], "answer": "D", "answer_text": "None", "explanation": "Indian Customs मध्ये goods import झाल्यानंतर Indian Port → ICD/CFS/another Indian Port असा inland movement/transshipment झाल्यास त्याचा खर्च assessable value मध्ये add केला जात नाही. हा post-importation expense मानला जातो.", "golden": "Indian Port नंतरचा Transshipment Cost → Not added"}, {"no": 122, "q": "Q122. Where smuggled goods are mixed with other goods in such manner that the smuggled goods cannot be separated from such other goods—", "options": [{"letter": "A", "text": "The whole of the goods shall be liable to confiscation"}, {"letter": "B", "text": "The smuggled goods have to be separated"}, {"letter": "C", "text": "The statement is wrong"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "", "explanation": "Customs Act Section 119 नुसार smuggled goods इतर goods मध्ये अशा प्रकारे mixed केले असतील की ते वेगळे करता येत नाहीत, तर संपूर्ण goods confiscation ला liable होऊ शकतात.", "golden": "Smuggled goods cannot be separated → Whole goods liable to confiscation"}, {"no": 123, "q": "Q123. Which among the following Agency in India is authorised under ATA Carnet for movement of goods under ATA Carnet?", "options": [{"letter": "A", "text": "Associated Chambers of Commerce and Industry of India"}, {"letter": "B", "text": "Federation of Indian Chamber of Commerce and Industry"}, {"letter": "C", "text": "Commerce and Industry"}, {"letter": "D", "text": "Confederation of Indian Industry"}], "answer": "B", "answer_text": "FICCI", "explanation": "ATA Carnet temporary import/export साठी वापरले जाते. भारतामध्ये ATA Carnet साठी guaranteeing/issuing agency म्हणून: FICCI = Federation of Indian Chambers of Commerce & Industry काम करते.", "golden": "ATA Carnet → FICCI"}, {"no": 124, "q": "Q124. Import of second-hand photocopiers as per Foreign Trade Policy is—", "options": [{"letter": "A", "text": "Freely importable"}, {"letter": "B", "text": "Restricted and is importable only against authorization"}, {"letter": "C", "text": "Prohibited"}, {"letter": "D", "text": "None"}], "answer": "B", "answer_text": "", "explanation": "FTP 2015–20 नुसार second-hand photocopiers Restricted category मध्ये होते. म्हणून DGFT कडून required authorization घेणे आवश्यक होते.", "golden": "Second-hand Photocopier → Restricted → Authorization"}, {"no": 125, "q": "Q125. An exporter exports goods worth ₹1,00,000 FOB. Export proceeds are realized to the extent of ₹90,000. MEIS rate for the goods exported is 5%. What should be the MEIS amount?", "options": [{"letter": "A", "text": "₹5,000"}, {"letter": "B", "text": "₹4,500"}, {"letter": "C", "text": "₹4,000"}, {"letter": "D", "text": "₹5,500"}], "answer": "B", "answer_text": "₹4,500", "explanation": "", "golden": "MEIS → Lower/Realised FOB × Rate"}, {"no": 126, "q": "Q126. Prohibited Goods as per Foreign Trade Policy (2015–2020)—", "options": [{"letter": "A", "text": "Are freely importable and can be cleared for home consumption"}, {"letter": "B", "text": "Cannot be cleared for home consumption"}, {"letter": "C", "text": "Can be cleared after adjudication & payment of fine/penalty/duty"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "", "explanation": "Prohibited goods म्हणजे ज्यांचा import/export lawfully prohibited आहे. अशा goods ना सामान्यतः home consumption साठी clear करता येत नाही, even by simply paying fine/penalty.", "golden": "Prohibited Goods → Cannot be cleared for Home Consumption"}, {"no": 127, "q": "Q127. The import of cylinders/valves shall be of a type and standard as specified in Schedule 1 of the Gas Cylinders Rules, 2004 and would require approval from—", "options": [{"letter": "A", "text": "Chief Controller of Explosives"}, {"letter": "B", "text": "Jurisdictional Pr. Chief/Chief Commissioner of Customs"}, {"letter": "C", "text": "Jurisdictional Pr. Commissioner/Commissioner of Customs"}, {"letter": "D", "text": "Pollution Control Board"}], "answer": "A", "answer_text": "Chief Controller of Explosives", "explanation": "Gas cylinders आणि valves साठी prescribed safety standards लागू आहेत. त्यासाठी approval देणारी authority: Chief Controller of Explosives आहे.", "golden": "Gas Cylinders/Valves → Chief Controller of Explosives"}, {"no": 128, "q": "Q128. The amount of penalty that can be imposed on a F-card holder for failure to comply with provisions of Regulation 18 of Customs Broker Licensing Regulations, 2018 is—", "options": [{"letter": "A", "text": "Not exceeding ₹50,000"}, {"letter": "B", "text": "Not exceeding ₹10,000"}, {"letter": "C", "text": "Not exceeding ₹1,00,000"}, {"letter": "D", "text": "No penalty can be imposed on F-card holder"}], "answer": "A", "answer_text": "Not exceeding ₹50,000", "explanation": "CBLR 2018 मधील Regulation 18 अंतर्गत F-card holder ने regulations चे compliance न केल्यास penalty: 👉 Maximum ₹50,000 असू शकते.", "golden": "F-card Holder → Maximum Penalty ₹50,000"}, {"no": 129, "q": "Q129. Where any smuggled goods are sold by a person having knowledge or reason to believe that the goods are smuggled goods, the sale-proceeds thereof shall be liable to confiscation.", "options": [{"letter": "A", "text": "The statement is false"}, {"letter": "B", "text": "The statement is true"}, {"letter": "C", "text": "The statement is partly true"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "The statement is true", "explanation": "Customs Act Section 121 नुसार smuggled goods विकल्यास आणि seller ला goods smuggled असल्याचे knowledge/reason to believe असल्यास त्या goods च्या sale proceeds देखील confiscation ला liable होतात.", "golden": "Smuggled Goods Sale → Sale Proceeds also liable to confiscation 📘 Q130–136"}, {"no": 130, "q": "Q130. The rate of duty and tariff valuation of export goods shall be the rate and tariff valuation in force on—", "options": [{"letter": "A", "text": "Date on which EGM is filed"}, {"letter": "B", "text": "Date on which Shipping Bill is filed"}, {"letter": "C", "text": "Date of order permitting clearance of goods"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "", "explanation": "Customs Act Section 16 नुसार export goods साठी applicable duty rate आणि tariff value ठरवताना order permitting clearance ची date relevant आहे.", "golden": "Export Duty → Date of Clearance Order"}, {"no": 132, "q": "Q132. When a Bill of Entry has been presented before the date of Entry Inwards of the vessel, on which date shall the Bill of Entry be deemed to have been presented?", "options": [{"letter": "A", "text": "Date of Entry Inwards"}, {"letter": "B", "text": "Date of presentation of Bill of Entry"}, {"letter": "C", "text": "Date of assessment"}, {"letter": "D", "text": "Date of payment of duty"}], "answer": "A", "answer_text": "Date of Entry Inwards", "explanation": "जर Bill of Entry vessel च्या Entry Inwards पूर्वी file केली असेल, तर Section 15 नुसार ती Entry Inwards च्या date ला presented मानली जाते.", "golden": "Advance BOE → Deemed Presentation = Entry Inwards Date"}, {"no": 133, "q": "Q133. Can the owner of any warehoused goods, after warehousing—", "options": [{"letter": "A", "text": "Only (i)"}, {"letter": "B", "text": "Only (i) and (ii)"}, {"letter": "C", "text": "(i), (ii) and (iii)"}, {"letter": "D", "text": "All (i), (ii), (iii) and (iv)"}], "answer": "D", "answer_text": "", "explanation": "Customs Act Section 64 अंतर्गत warehoused goods च्या owner ला prescribed conditions subject to: Goods inspect करता येतात ✔️ Prospective buyer ला दाखवता येतात ✔️ Samples घेता येतात ✔️ Warehouse मध्ये असतानाही goods sell करता येतात ✔️", "golden": "Warehoused Goods → Inspect + Sample + Show Buyer + Sell"}, {"no": 134, "q": "Q134. Return of State and Central Tax Levies (RoSCTL) can be claimed—", "options": [{"letter": "A", "text": "Along with Duty Drawback"}, {"letter": "B", "text": "Only if Duty Drawback is not claimed"}, {"letter": "C", "text": "Only if brand rate of drawback is claimed"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "Along with Duty Drawback", "explanation": "RoSCTL = Rebate of State and Central Taxes and Levies. Garments आणि made-ups च्या exports साठी RoSCTL scheme होती. Source नुसार RoSCTL benefit Duty Drawback सोबत claim करता येतो.", "golden": "RoSCTL → Can be claimed along with Drawback"}, {"no": 135, "q": "Q135. Which of the following is correct in respect of goods reported as freely importable unclaimed goods?", "options": [{"letter": "A", "text": "Goods may be auctioned by Customs"}, {"letter": "B", "text": "Goods may be auctioned by Custodian"}, {"letter": "C", "text": "Goods may be confiscated and auctioned by Customs"}, {"letter": "D", "text": "None"}], "answer": "B", "answer_text": "Custodian", "explanation": "Customs Act Section 48 नुसार freely importable goods prescribed period मध्ये uncleared/unclaimed राहिल्यास custodian proper procedure follow करून goods sell/auction करू शकतो.", "golden": "Unclaimed Free Goods → Custodian → Auction/Sale"}, {"no": 136, "q": "Q136. Can Anti-Dumping Duty and Safeguard Duty paid on imported raw material used in manufacture of export goods be allowed as duty drawback?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes, these are considered while fixing AIRs"}, {"letter": "C", "text": "Yes, only under brand rate"}, {"letter": "D", "text": "Yes"}], "answer": "C", "answer_text": "Yes, only under Brand Rate", "explanation": "Anti-Dumping Duty आणि Safeguard Duty हे normal All Industry Rate (AIR) drawback मध्ये consider केले जात नाहीत. पण actual incidence establish करून Brand Rate mechanism अंतर्गत claim करता येतो.", "golden": "ADD/Safeguard Duty → Not AIR → Brand Rate possible"}, {"no": 137, "q": "Q137. The proper officer shall give advance notice to the auditee before start of audit under Customs Act, 1962 of a period not less than—", "options": [{"letter": "A", "text": "30 days"}, {"letter": "B", "text": "3 days"}, {"letter": "C", "text": "15 days"}, {"letter": "D", "text": "60 days"}], "answer": "C", "answer_text": "15 days", "explanation": "Customs Audit Regulations नुसार audit सुरू करण्यापूर्वी auditee ला not less than 15 days advance notice देणे आवश्यक आहे.", "golden": "Customs Audit Notice → Minimum 15 Days"}, {"no": 138, "q": "Q138. Why SCOMET items are not freely exportable as per Foreign Trade Policy?", "options": [{"letter": "A", "text": "These are manufactured solely from agricultural products"}, {"letter": "B", "text": "These are precious metals like gold and silver"}, {"letter": "C", "text": "These contain previous metals and are highly sensitive"}, {"letter": "D", "text": "These are dual-use items and technologies"}], "answer": "D", "answer_text": "Dual-use items and technologies", "explanation": "SCOMET = Special Chemicals, Organisms, Materials, Equipment and Technologies. यातील अनेक items dual-use असतात—म्हणजे civilian तसेच military applications मध्ये वापरले जाऊ शकतात. म्हणून त्यांची export control केली जाते.", "golden": "SCOMET → Dual-use Goods & Technologies"}, {"no": 139, "q": "Q139. As per Foreign Trade Policy, import of second-hand goods other than capital goods is—", "options": [{"letter": "A", "text": "Freely importable"}, {"letter": "B", "text": "Restricted and is importable only against authorization"}, {"letter": "C", "text": "Prohibited"}, {"letter": "D", "text": "Commissioner of Customs is authorised to permit such import"}], "answer": "B", "answer_text": "", "explanation": "FTP नुसार second-hand goods, other than capital goods, restricted category मध्ये येतात. म्हणून prescribed DGFT authorization आवश्यक आहे.", "golden": "Second-hand Goods ≠ Capital Goods → Restricted + Authorization"}, {"no": 140, "q": "Q140. Import of goods sent for repair/testing as per Foreign Trade Policy is—", "options": [{"letter": "A", "text": "Freely importable without any authorization"}, {"letter": "B", "text": "Restricted and is importable only against authorization"}, {"letter": "C", "text": "Prohibited"}, {"letter": "D", "text": "None"}], "answer": "A", "answer_text": "Freely importable without authorization", "explanation": "भारतामधून goods repair/testing साठी बाहेर पाठवले आणि prescribed conditions/documentation पूर्ण करून ते परत import केले, तर source नुसार re-import freely permitted आहे.", "golden": "Goods sent abroad for Repair/Testing → Re-import Freely"}], "2021": [{"no": 1, "q": "Q1. Within how many days should international transshipment be effected after entry inward of the importing ship?", "options": [{"letter": "A", "text": "15 days"}, {"letter": "B", "text": "30 days"}, {"letter": "C", "text": "60 days"}, {"letter": "D", "text": "90 days"}], "answer": "B", "answer_text": "30 days", "explanation": "Customs Act, 1962 मधील Section 48 नुसार international transshipment importing ship च्या Entry Inward पासून 30 days मध्ये complete करणे आवश्यक आहे.", "golden": "International Transshipment → 30 Days"}, {"no": 2, "q": "Q2. As per Sea Cargo Manifest and Transshipment Regulations, 2018, where it is not possible to deliver the arrival manifest electronically, with whose approval can the manifest be submitted manually?", "options": [{"letter": "A", "text": "Commissioner of Customs"}, {"letter": "B", "text": "Additional Commissioner of Customs"}, {"letter": "C", "text": "Joint Commissioner of Customs"}, {"letter": "D", "text": "Assistant Commissioner of Customs"}], "answer": "A", "answer_text": "Commissioner of Customs", "explanation": "Technical limitations किंवा operational constraints मुळे electronic filing शक्य नसल्यास manual submission करता येते; त्यासाठी Commissioner of Customs ची prior approval आवश्यक आहे.", "golden": "SCMTR → Manual Manifest → Commissioner Approval"}, {"no": 3, "q": "Q3. For how much period is the initial registration required for delivering Arrival Manifest and Departure Manifest valid from the date of issue of such registration?", "options": [{"letter": "A", "text": "1 year"}, {"letter": "B", "text": "2 years"}, {"letter": "C", "text": "3 years"}, {"letter": "D", "text": "4 years"}], "answer": "C", "answer_text": "3 years", "explanation": "SCMTR, 2018 अंतर्गत initial registration ची validity 3 years आहे. तीन वर्षांनंतर prescribed procedure नुसार renewal करावे लागते.", "golden": "SCMTR Registration → 3 Years"}, {"no": 4, "q": "Q4. Even a NIL declaration has to be filed in case of a certain category of cargo by the authorized sea carrier. Which of the following goods does not figure in this list?", "options": [{"letter": "A", "text": "Arms and Ammunition"}, {"letter": "B", "text": "Dangerous Drugs"}, {"letter": "C", "text": "Gold"}, {"letter": "D", "text": "Diamonds"}], "answer": "D", "answer_text": "Diamonds", "explanation": "Specified high-risk cargo categories साठी NIL declaration ची requirement आहे. Source मध्ये: Arms & Ammunition ✔️ Dangerous Drugs ✔️ Gold ✔️ पण Diamonds या list मध्ये नाहीत.", "golden": "NIL Declaration List → Diamonds नाही Q5–Q10"}, {"no": 5, "q": "Q5. To which category of goods do the provisions of Chapter VIII of the Customs Act, 1962 regarding goods in transit apply?", "options": [{"letter": "A", "text": "Baggage"}, {"letter": "B", "text": "Goods imported by post"}, {"letter": "C", "text": "Stores"}, {"letter": "D", "text": "None of these"}], "answer": "D", "answer_text": "None of these", "explanation": "Chapter VIII मुख्यतः goods in transit म्हणजे India मधून दुसऱ्या destination country कडे जाणाऱ्या goods शी संबंधित आहे. Baggage, postal goods आणि stores यांच्यासाठी वेगळ्या provisions आहेत.", "golden": "Chapter VIII → Goods in Transit"}, {"no": 6, "q": "Q6. Which authority is empowered to cancel a licence granted under Section 58A to a specific warehouse?", "options": [{"letter": "A", "text": "Principal Commissioner of Customs"}, {"letter": "B", "text": "Additional Commissioner of Customs"}, {"letter": "C", "text": "Deputy Commissioner of Customs"}, {"letter": "D", "text": "Chief Commissioner of Customs"}], "answer": "A", "answer_text": "Principal Commissioner of Customs", "explanation": "Customs Act Section 58B नुसार specific warehouse licence cancel करण्याचा authority Principal Commissioner of Customs आहे.", "golden": "Specific Warehouse Licence Cancellation → Principal Commissioner"}, {"no": 7, "q": "Q7. For how long do the warehoused capital goods intended for use in any 100% export-oriented undertaking remain in the warehouse?", "options": [{"letter": "A", "text": "Up to 90 days from date of deposit"}, {"letter": "B", "text": "Up to 6 months from date of deposit"}, {"letter": "C", "text": "Up to 1 year from date of deposit"}, {"letter": "D", "text": "Till the clearance from the warehouse"}], "answer": "D", "answer_text": "Till clearance from the warehouse", "explanation": "100% Export Oriented Undertaking (EOU) साठी intended warehoused capital goods prescribed conditions subject to warehouse मध्ये राहू शकतात till clearance.", "golden": "EOU Capital Goods → Till clearance from warehouse"}, {"no": 8, "q": "Q8. Which authority is empowered under the Customs Act, 1962 to extend the initial warehousing period of goods?", "options": [{"letter": "A", "text": "Principal Commissioner of Customs"}, {"letter": "B", "text": "Additional Commissioner of Customs"}, {"letter": "C", "text": "Joint Commissioner of Customs"}, {"letter": "D", "text": "Deputy Commissioner of Customs"}], "answer": "A", "answer_text": "Principal Commissioner of Customs", "explanation": "Section 61 अंतर्गत warehousing period extend करण्याचा power Principal Commissioner/Commissioner of Customs कडे आहे.", "golden": "Warehousing Period Extension → Principal Commissioner/Commissioner"}, {"no": 9, "q": "Q9. Under the Customs Act, 1962, which authority can waive the interest of more than two crores payable on warehoused goods?", "options": [{"letter": "A", "text": "Commissioner of Customs"}, {"letter": "B", "text": "Principal Commissioner of Customs"}, {"letter": "C", "text": "Chief Commissioner of Customs"}, {"letter": "D", "text": "Central Board of Indirect Taxes and Customs"}], "answer": "D", "answer_text": "CBIC", "explanation": "Warehoused goods वर payable interest waive करण्याचा power CBIC कडे आहे.", "golden": "Interest Waiver > ₹2 Crore → CBIC"}, {"no": 10, "q": "Q10. Which of the following actions cannot be carried out by the owner of the warehouse without permission of the proper officer?", "options": [{"letter": "A", "text": "Inspect the goods"}, {"letter": "B", "text": "Show the goods for sale"}, {"letter": "C", "text": "Remove the goods from one warehouse to another warehouse"}, {"letter": "D", "text": "All of the above"}], "answer": "C", "answer_text": "Remove goods from one warehouse to another", "explanation": "Warehouse owner ला goods inspect करणे किंवा prospective buyer ला goods दाखवणे permitted आहे. पण एका warehouse मधून दुसऱ्या warehouse मध्ये goods transfer/remove करण्यासाठी proper officer ची permission आवश्यक आहे.", "golden": "Warehouse → One warehouse to another → Proper Officer Permission Q11–Q15"}, {"no": 11, "q": "Q11. Who can permit us to carry on any manufacturing process in the warehouse?", "options": [{"letter": "A", "text": "Commissioner of Customs"}, {"letter": "B", "text": "Additional Commissioner of Customs"}, {"letter": "C", "text": "Joint Commissioner of Customs"}, {"letter": "D", "text": "Assistant Commissioner of Customs"}], "answer": "A", "answer_text": "Commissioner of Customs", "explanation": "Customs Act Section 65 नुसार warehouse मध्ये manufacturing किंवा other operations करण्याची permission Commissioner of Customs देऊ शकतो.", "golden": "Manufacturing in Warehouse → Commissioner"}, {"no": 12, "q": "Q12. Who has the power to exempt the imported materials used in the manufacturing process of goods in the warehouse from whole or part of the excess rate of duty?", "options": [{"letter": "A", "text": "Central Government"}, {"letter": "B", "text": "Central Board of Indirect Taxes and Customs"}, {"letter": "C", "text": "Customs, Excise and Service Tax Appellate Tribunal"}, {"letter": "D", "text": "Jurisdictional Principal Chief Commissioner of Customs"}], "answer": "A", "answer_text": "Central Government", "explanation": "Section 66 नुसार imported materials manufacturing मध्ये वापरले असल्यास, prescribed conditions पूर्ण झाल्यावर Central Government notification द्वारे whole किंवा part of excess duty मधून exemption देऊ शकते.", "golden": "Section 66 → Exemption → Central Government"}, {"no": 13, "q": "Q13. Which of the following is not a requisite condition for removal of goods from warehouse for export as per Section 69(1) of Customs Act, 1962?", "options": [{"letter": "A", "text": "Payment of import duty"}, {"letter": "B", "text": "Payment of export duty payable in respect of such goods"}, {"letter": "C", "text": "Payment of fine and penalties payable in respect of such goods"}, {"letter": "D", "text": "An order of clearance of such goods has been made by the proper officer"}], "answer": "A", "answer_text": "Payment of import duty", "explanation": "Section 69 नुसार warehoused goods export करण्यासाठी import duty भरावी लागत नाही. म्हणून Payment of Import Duty ही requisite condition नाही. इतर applicable: Export duty ✔️ Fine/Penalty ✔️ Proper officer clearance order ✔️", "golden": "Warehouse → Export → No Import Duty"}, {"no": 14, "q": "Q14. Which of the following cases is not included in “Goods improperly removed from warehouse” as per Section 72?", "options": [{"letter": "A", "text": "Warehoused goods removed in contravention of Section 71"}, {"letter": "B", "text": "Warehoused goods not removed at expiry of warehousing period"}, {"letter": "C", "text": "Goods covered by a bond but not duly accounted for to satisfaction of proper officer"}, {"letter": "D", "text": "None of these"}], "answer": "D", "answer_text": "None of these", "explanation": "Section 72 मध्ये वरील तीन्ही परिस्थिती goods improperly removed from warehouse म्हणून covered आहेत. म्हणून “not included” असे कोणतेही A/B/C नाही.", "golden": "Section 72 → All A, B & C covered"}, {"no": 15, "q": "Q15. As per Regulation 10 of the Sea Cargo Manifest and Transshipment Regulations, 2018, on which type of goods can an authorized carrier charge rent or demurrage?", "options": [{"letter": "A", "text": "In case of goods detained"}, {"letter": "B", "text": "In case of goods seized"}, {"letter": "C", "text": "In case of goods confiscated"}, {"letter": "D", "text": "None of these"}], "answer": "D", "answer_text": "None of these", "explanation": "Customs authorities ने detained, seized किंवा confiscated केलेल्या goods वर authorized sea carrier rent/demurrage charge करू शकत नाही.", "golden": "Detained + Seized + Confiscated → No carrier rent/demurrage Q16–Q20"}, {"no": 16, "q": "Q16. What type of return regarding receipt, storage operations and removal of goods in the warehouse has to be filed by the licensee of a warehouse with the bond officer?", "options": [{"letter": "A", "text": "Daily return"}, {"letter": "B", "text": "Weekly return"}, {"letter": "C", "text": "Monthly return"}, {"letter": "D", "text": "Fortnightly return"}], "answer": "C", "answer_text": "Monthly return", "explanation": "Warehouse licensee ने receipt, storage आणि removal of goods याबाबत monthly return bond officer कडे submit करायचा असतो.", "golden": "Warehouse Return → Monthly"}, {"no": 17, "q": "Q17. For how much amount of solvency certificate from a Scheduled Bank must an applicant submit when applying for a licence of public warehouse?", "options": [{"letter": "A", "text": "₹50 lakh"}, {"letter": "B", "text": "₹1 crore"}, {"letter": "C", "text": "₹2 crore"}, {"letter": "D", "text": "₹5 crore"}], "answer": "C", "answer_text": "₹2 crore", "explanation": "Public warehouse licence साठी applicant ने Scheduled Bank कडून ₹2 crore solvency certificate submit करणे आवश्यक आहे.", "golden": "Public Warehouse → Solvency Certificate = ₹2 Crore"}, {"no": 18, "q": "Q18. For how much period does a licence granted to a public warehouse remain valid?", "options": [{"letter": "A", "text": "Unless it is cancelled"}, {"letter": "B", "text": "3 years from the date of issue"}, {"letter": "C", "text": "5 years from the date of issue"}, {"letter": "D", "text": "10 years from the date of issue"}], "answer": "A", "answer_text": "Unless it is cancelled", "explanation": "Public Warehouse Licensing Regulations नुसार licence ची validity fixed 3/5/10 years अशी नाही. ती cancel होईपर्यंत valid राहते.", "golden": "Public Warehouse Licence → Valid till cancelled"}, {"no": 19, "q": "Q19. Which of the following statements in respect of private warehouse is correct?", "options": [{"letter": "A", "text": "A licence granted to a person cannot be transferred to another person"}, {"letter": "B", "text": "A licence granted can be transferred to another person with permission of the jurisdictional Commissioner"}, {"letter": "C", "text": "A licence can be transferred to another person with permission of the jurisdictional Principal Commissioner"}, {"letter": "D", "text": "A licence granted can be transferred to another person with permission of the jurisdictional Chief Commissioner"}], "answer": "C", "answer_text": "With permission of the jurisdictional Principal Commissioner", "explanation": "Private warehouse licence साधारणपणे दुसऱ्या व्यक्तीकडे transfer करता येत नाही. पण prescribed conditions मध्ये jurisdictional Principal Commissioner of Customs ची permission घेऊन transfer करता येतो.", "golden": "Private Warehouse Licence Transfer → Principal Commissioner Permission"}, {"no": 20, "q": "Q20. What is the time period for advance notice to conduct the audit at the premises of the auditee?", "options": [{"letter": "A", "text": "Not less than 7 days"}, {"letter": "B", "text": "Not less than 15 days"}, {"letter": "C", "text": "Not less than 30 days"}, {"letter": "D", "text": "Not less than 45 days"}], "answer": "B", "answer_text": "Not less than 15 days", "explanation": "Customs Audit Regulations, 2018 नुसार premises वर audit सुरू करण्यापूर्वी auditee ला कमीत कमी 15 days advance notice देणे आवश्यक आहे.", "golden": "Customs Audit → Advance Notice = 15 Days"}, {"no": 21, "q": "Q21. In how many days from the date of starting the audit at the premises must the audit be completed?", "options": [{"letter": "A", "text": "Within 10 days"}, {"letter": "B", "text": "Within 20 days"}, {"letter": "C", "text": "Within 30 days"}, {"letter": "D", "text": "Within 60 days"}], "answer": "C", "answer_text": "Within 30 days", "explanation": "Customs Audit Regulations, 2018 नुसार auditee च्या premises वर audit सुरू झाल्यानंतर audit 30 days मध्ये complete करायचा आहे.", "golden": "Audit started → Complete within 30 Days"}, {"no": 22, "q": "Q22. Which authority has been assigned the task of conducting examination for Customs Broker as per Customs Broker Licensing Regulations, 2018?", "options": [{"letter": "A", "text": "National Academy of Customs, Indirect Taxes and Narcotics (NACIN)"}, {"letter": "B", "text": "Directorate General of Performance Management (DGPM)"}, {"letter": "C", "text": "Directorate General of Human Resource Development (DGHRD)"}, {"letter": "D", "text": "Directorate General of Systems and Data Management (DGSDM)"}], "answer": "A", "answer_text": "NACIN", "explanation": "Customs Broker examination conduct करण्याची responsibility NACIN कडे आहे. NACIN = National Academy of Customs, Indirect Taxes and Narcotics", "golden": "Customs Broker Exam → NACIN"}, {"no": 23, "q": "Q23. What is the initial validity period of Customs Broker Licence granted under Regulation 7 of the Customs Broker Licensing Regulations, 2018?", "options": [{"letter": "A", "text": "3 years"}, {"letter": "B", "text": "5 years"}, {"letter": "C", "text": "10 years"}, {"letter": "D", "text": "15 years"}], "answer": "C", "answer_text": "10 years", "explanation": "तुमच्या 2021 paper/source मध्ये Customs Broker licence ची initial validity 10 years दिली आहे. ⚠️ Exam-specific: या प्रश्नातील source explanation मध्ये current provisions बद्दल वेगळा उल्लेख आहे; त्यामुळे तुमच्या paper साठी answer C = 10 years लक्षात ठेवा.", "golden": "2021 Paper → CB Licence Initial Validity = 10 Years"}, {"no": 24, "q": "Q24. Which of the following categories of employees can be authorized by Customs Broker to sign the declaration of Bills of Entry and Shipping Bills?", "options": [{"letter": "A", "text": "Only F-Card holder"}, {"letter": "B", "text": "Only F-Card and G-Card holders"}, {"letter": "C", "text": "Only G-Card and H-Card holders"}, {"letter": "D", "text": "F-Card, G-Card and H-Card holders"}], "answer": "B", "answer_text": "F-Card and G-Card holders", "explanation": "Customs Broker च्या behalf वर declarations sign करण्यासाठी source नुसार: ✔️ F-Card holder ✔️ G-Card holder authorized होऊ शकतात. H-Card holder हा support staff category मध्ये येतो आणि declaration sign करू शकत नाही.", "golden": "Sign BE/SB → F-Card + G-Card H-Card → No"}, {"no": 25, "q": "Q25. What is the maximum limit of penalty that can be imposed by Deputy Commissioner of Customs on a G-Card holder who contravenes any provisions of the Customs Brokers Licensing Regulations, 2018?", "options": [{"letter": "A", "text": "Ten thousand rupees"}, {"letter": "B", "text": "Twenty thousand rupees"}, {"letter": "C", "text": "Twenty-five thousand rupees"}, {"letter": "D", "text": "Fifty thousand rupees"}], "answer": "A", "answer_text": "₹10,000", "explanation": "G-Card holder ने CBLR provisions चे contravention केल्यास source नुसार Deputy Commissioner of Customs कडून maximum: 👉 ₹10,000 penalty impose केली जाऊ शकते.", "golden": "G-Card Holder → Max Penalty ₹10,000 📘 Q26–30"}, {"no": 26, "q": "Q26. What is the minimum requirement in terms of possession of assets in value by a person who wants to apply for a Customs Broker License?", "options": [{"letter": "A", "text": "Not less than ₹5 lakh"}, {"letter": "B", "text": "Not less than ₹10 lakh"}, {"letter": "C", "text": "Not less than ₹50 lakh"}, {"letter": "D", "text": "Not less than ₹1 crore"}], "answer": "A", "answer_text": "Not less than ₹5 lakh", "explanation": "Customs Broker licence साठी applicant कडे prescribed financial standing असणे आवश्यक आहे. Source नुसार minimum asset value: 👉 ₹5 lakh", "golden": "CB Licence → Minimum Assets ₹5 Lakh"}, {"no": 27, "q": "Q27. What is the Appellate Authority for a Customs Broker or F-Card holder who is aggrieved by an order passed by Commissioner of Customs?", "options": [{"letter": "A", "text": "Chief Commissioner of Customs"}, {"letter": "B", "text": "Three-member committee headed by Chief Commissioner of Customs"}, {"letter": "C", "text": "Customs, Central Excise and Service Tax Appellate Tribunal"}, {"letter": "D", "text": "High Court"}], "answer": "C", "answer_text": "CESTAT", "explanation": "Commissioner of Customs च्या order विरुद्ध Customs Broker/F-Card holder ला appeal करायची असल्यास: CESTAT = Customs, Excise and Service Tax Appellate Tribunal हा appellate authority आहे.", "golden": "Commissioner Order → CB/F-Card Appeal → CESTAT"}, {"no": 28, "q": "Q28. If any imported goods have damaged or have deteriorated at any time before or during the unloading of the goods in India—", "options": [{"letter": "A", "text": "As the goods are already imported, full customs duty needs to be paid"}, {"letter": "B", "text": "The custodian needs to pay the duty for the damaged part for their negligence"}, {"letter": "C", "text": "Importer will get abatement for the customs duty on the damaged content"}, {"letter": "D", "text": "None of these"}], "answer": "C", "answer_text": "Importer gets abatement", "explanation": "Section 22 of Customs Act, 1962 नुसार imported goods unloading पूर्वी किंवा unloading दरम्यान damaged/deteriorated झाले असल्यास importer ला त्या damaged portion साठी duty abatement मिळू शकते. म्हणजे पूर्ण original quantity/value वर duty भरावी लागत नाही.", "golden": "Damage before/during unloading → Duty Abatement"}, {"no": 29, "q": "Q29. If Bill of Entry is presented before the grant of Entry Inwards, the date for calculation of rate of duty and tariff valuation will be—", "options": [{"letter": "A", "text": "Date of grant of Entry Inwards"}, {"letter": "B", "text": "Date of filing Bill of Entry"}, {"letter": "C", "text": "Date of filing IGM"}, {"letter": "D", "text": "None of these"}], "answer": "A", "answer_text": "Date of grant of Entry Inwards", "explanation": "जर Bill of Entry Entry Inwards मिळण्यापूर्वी file केला असेल, तर duty rate आणि tariff valuation साठी Entry Inwards ची date relevant मानली जाते.", "golden": "BOE before Entry Inwards → Relevant Date = Entry Inwards"}, {"no": 30, "q": "Q30. Which of the following Shipping Bill is filed by exporter for exporting goods for showcasing them?", "options": [{"letter": "A", "text": "Shipping Bill for claims of Duty Drawback"}, {"letter": "B", "text": "Duty Free Shipping Bill"}, {"letter": "C", "text": "ATA Carnet Shipping Bill"}, {"letter": "D", "text": "None of these"}], "answer": "C", "answer_text": "ATA Carnet", "explanation": "Exhibition, trade show किंवा showcasing साठी goods temporary export करताना ATA Carnet वापरला जातो. ATA Carnet goods ला temporary export/re-import करण्यासाठी customs formalities सोप्या करते.", "golden": "Exhibition/Showcasing → ATA Carnet"}, {"no": 31, "q": "Q31. If the import takes place through the Custom Houses of Mumbai/Delhi/Chennai/Kolkata/Bangalore, the importer is free to select—", "options": [{"letter": "A", "text": "Special Valuation Branch of the Custom House of import or the one which is most proximate to the corporate office"}, {"letter": "B", "text": "Any SVB of his choice"}, {"letter": "C", "text": "Importer has to do it through the import port only"}, {"letter": "D", "text": "It would be decided by jurisdictional Commissioner"}], "answer": "A", "answer_text": "", "explanation": "Related-party transactions मध्ये importer ला specified Customs Houses मधून import असल्यास SVB of import house किंवा corporate office जवळचा SVB select करण्याची सुविधा source मध्ये दिली आहे.", "golden": "SVB → Import House OR nearest to Corporate Office"}, {"no": 32, "q": "Q32. Under Rule 4 of Export Customs Valuation Rules, the proper officer shall make certain adjustment in—", "options": [{"letter": "A", "text": "Difference in dates of exportation"}, {"letter": "B", "text": "Difference in commercial value"}, {"letter": "C", "text": "Difference in composition, quality and design between the goods to be assessed and the goods with which they are compared"}, {"letter": "D", "text": "All of these"}], "answer": "D", "answer_text": "All of these", "explanation": "Comparable export goods वापरून valuation करताना differences असल्यास adjustments करावे लागतात. उदा.: Export dates मधील difference ✔️ Commercial level/value difference ✔️ Composition, quality, design difference ✔️ म्हणून All of these.", "golden": "Rule 4 Export Valuation → Dates + Commercial Value + Composition/Quality/Design"}, {"no": 33, "q": "Q33. What is the time of conversion of foreign currency for the purpose of determining assessable value and tax liability in imports where the invoice is in foreign currency?", "options": [{"letter": "A", "text": "Exchange rate prevailing at the time of contract"}, {"letter": "B", "text": "Exchange rate as on the date of filing of Bill of Entry"}, {"letter": "C", "text": "Exchange rate prevailing as on the date of Entry Inwards"}, {"letter": "D", "text": "None of these"}], "answer": "B", "answer_text": "Exchange rate on date of filing Bill of Entry", "explanation": "Customs valuation साठी foreign currency चे INR मध्ये conversion करताना CBIC-notified exchange rate वापरला जातो. Source नुसार relevant date: 👉 Date of filing Bill of Entry", "golden": "Import Exchange Rate → BOE Filing Date"}, {"no": 34, "q": "Q34. In absence of actual freight and insurance charges, the percentage of FOB taken for the purpose of computing Assessable Value is—", "options": [{"letter": "A", "text": "Freight = 18%, Insurance = 1%"}, {"letter": "B", "text": "Freight = 20%, Insurance = 1.125%"}, {"letter": "C", "text": "Freight = 20%, Insurance = 1%"}, {"letter": "D", "text": "Freight = 18%, Insurance = 15%"}], "answer": "B", "answer_text": "Freight 20%, Insurance 1.125%", "explanation": "Actual freight आणि insurance available नसतील तर source नुसार: Freight = 20% of FOB Insurance = 1.125% of FOB", "golden": "No actual Freight → 20% FOB No actual Insurance → 1.125% FOB"}, {"no": 35, "q": "Q35. Goods under Project Import are classifiable under which tariff heading?", "options": [{"letter": "A", "text": "9801"}, {"letter": "B", "text": "Respective heading of the goods being imported"}, {"letter": "C", "text": "9901"}, {"letter": "D", "text": "None of these"}], "answer": "A", "answer_text": "9801", "explanation": "Project Import Scheme अंतर्गत eligible project goods ना Customs Tariff मधील Heading 9801 अंतर्गत classify केले जाते. यामुळे project साठी imported machinery/equipment इत्यादींना consolidated classification मिळते.", "golden": "Project Import → Heading 9801"}, {"no": 36, "q": "Q36. Iron scrap is classifiable under which of the following chapter?", "options": [{"letter": "A", "text": "Chapter 73"}, {"letter": "B", "text": "Chapter 48"}, {"letter": "C", "text": "Chapter 59"}, {"letter": "D", "text": "Chapter 15"}], "answer": "A", "answer_text": "Chapter 73", "explanation": "तुमच्या 2021 paper/source मध्ये Iron scrap साठी answer Chapter 73 दिले आहे. ⚠️ येथे source च्या explanation मध्ये tariff heading बद्दल काही internally inconsistent wording आहे; त्यामुळे paper answer A लक्षात ठेवा.", "golden": "2021 Paper → Iron Scrap → Chapter 73"}, {"no": 37, "q": "Q37. Which of the following goods are liable for confiscation?", "options": [{"letter": "A", "text": "Stores"}, {"letter": "B", "text": "Goods declared in the IGM and Bill of Entry"}, {"letter": "C", "text": "Prohibited goods brought into Indian Customs Waters"}, {"letter": "D", "text": "Manifested goods stored at the bottom of a conveyance"}], "answer": "C", "answer_text": "Prohibited goods brought into Indian Customs Waters", "explanation": "Prohibited goods जर Indian Customs Waters मध्ये आणले गेले तर Customs Act अंतर्गत ते confiscation ला liable होऊ शकतात.", "golden": "Prohibited Goods → Indian Customs Waters → Confiscation"}, {"no": 38, "q": "Q38. Which of the following is not to be referred for the purpose of classification in case of imported goods?", "options": [{"letter": "A", "text": "Chapter Note in Customs Tariff"}, {"letter": "B", "text": "Section Note in Customs Tariff"}, {"letter": "C", "text": "HSN Explanatory Note"}, {"letter": "D", "text": "Foreign Trade Policy"}], "answer": "D", "answer_text": "Foreign Trade Policy", "explanation": "Tariff classification करताना मुख्यतः: ✔️ Section Notes ✔️ Chapter Notes ✔️ HSN Explanatory Notes ✔️ General Rules for Interpretation यांचा reference घेतला जातो. FTP हे classification चे primary legal source नाही.", "golden": "Classification → Section Note + Chapter Note + HSN FTP → Not classification reference"}, {"no": 39, "q": "Q39. Which of the following is/are the mandatory documents required for export of goods from India?", "options": [{"letter": "A", "text": "Bill of Lading"}, {"letter": "B", "text": "Commercial Invoice"}, {"letter": "C", "text": "Shipping Bill"}, {"letter": "D", "text": "All of these"}], "answer": "D", "answer_text": "All of these", "explanation": "Source नुसार export documentation मध्ये: Shipping Bill → Customs export declaration Commercial Invoice → Transaction/value details Bill of Lading/Airway Bill → Shipment/carriage document महत्त्वाचे आहेत. म्हणून answer D.", "golden": "Export Documents → Shipping Bill + Commercial Invoice + B/L"}, {"no": 40, "q": "Q40. Which of the following regarding Social Surcharge is not correct?", "options": [{"letter": "A", "text": "It is levied in terms of Section 110 of Finance Act"}, {"letter": "B", "text": "It would be collected on the aggregate of duties, taxes and cesses under Section 12 of Customs Act, 1962"}, {"letter": "C", "text": "These have to be collected in cash not by debit in duty scrip"}, {"letter": "D", "text": "None of these"}], "answer": "D", "answer_text": "None of these", "explanation": "तुमच्या source मध्ये A, B आणि C statements पैकी कोणतेही statement incorrect नसल्यामुळे answer: 👉 D — None of these दिलेला आहे.", "golden": "Social Surcharge → Source मध्ये A+B+C correct → Answer D"}, {"no": 41, "q": "Q41. Import of scrap cannot take place through which port/ICD?", "options": [{"letter": "A", "text": "Chennai"}, {"letter": "B", "text": "Mumbai"}, {"letter": "C", "text": "Ludhiana"}, {"letter": "D", "text": "Delhi"}], "answer": "D", "answer_text": "Delhi", "explanation": "Scrap import साठी Customs ने specified ports/ICDs prescribe केलेले आहेत. या प्रश्नाच्या paper मध्ये Delhi हा योग्य पर्याय दिला आहे.", "golden": "Scrap Import → Delhi = Not permitted"}, {"no": 42, "q": "Q42. Which of the following is a major amendment in Customs documentation?", "options": [{"letter": "A", "text": "Commodity description"}, {"letter": "B", "text": "Changing importer's address only"}, {"letter": "C", "text": "Correction of spellings"}, {"letter": "D", "text": "Conversion from one unit of measurement to another"}], "answer": "A", "answer_text": "Commodity description", "explanation": "Customs documentation मध्ये commodity description मधील बदल हा important amendment मानला जातो. अशा major amendment साठी prescribed approval/process लागू होतो.", "golden": "Major Amendment → Commodity Description"}, {"no": 43, "q": "Q43. Prior Bill of Entry can be filed at any time up to how many days prior to the expected date of arrival of aircraft/vessel?", "options": [{"letter": "A", "text": "60 days"}, {"letter": "B", "text": "30 days"}, {"letter": "C", "text": "15 days"}, {"letter": "D", "text": "10 days"}], "answer": "B", "answer_text": "30 days", "explanation": "Importer ला advance मध्ये Bill of Entry file करण्याची सुविधा आहे. Paper नुसार: 👉 Expected arrival च्या 30 days आधीपर्यंत Prior Bill of Entry file करता येतो.", "golden": "Prior BOE → Up to 30 Days before arrival"}, {"no": 44, "q": "Q44. Reversal of order of applying Deductive Method (Rule 7) and Computed Method (Rule 8) can be done—", "options": [{"letter": "A", "text": "Six months by importer"}, {"letter": "B", "text": "Can't be reversed"}, {"letter": "C", "text": "Department can reverse it"}, {"letter": "D", "text": "On request by importer after approval by proper officer"}], "answer": "D", "answer_text": "", "explanation": "Rule 6 अंतर्गत सामान्यतः Deductive Method (Rule 7) आणि Computed Value Method (Rule 8) यांचा क्रम असतो. Importer च्या request वर, proper officer च्या approval ने हा क्रम reverse करता येतो.", "golden": "Rule 7 ↔ Rule 8 reversal → Importer request + Proper Officer approval"}, {"no": 45, "q": "Q45. The importer and supplier are considered to be related if—", "options": [{"letter": "A", "text": "They are legally recognised partners in business"}, {"letter": "B", "text": "They are employer and employee"}, {"letter": "C", "text": "They are directly or indirectly controlled by a third person"}, {"letter": "D", "text": "All of these"}], "answer": "D", "answer_text": "All of these", "explanation": "Customs Valuation Rules मध्ये buyer आणि seller related आहेत का हे ठरवण्यासाठी अनेक situations दिलेल्या आहेत. या प्रश्नातील: Legally recognised partners ✔️ Employer–employee ✔️ Directly/indirectly controlled by third person ✔️ म्हणून All of these.", "golden": "Related Party → Partnership + Employer/Employee + Common Control"}, {"no": 46, "q": "Q46. For the purpose of calculating transaction value, which of the following is not included?", "options": [{"letter": "A", "text": "Commission and brokerage"}, {"letter": "B", "text": "Engineering"}, {"letter": "C", "text": "Design work"}, {"letter": "D", "text": "Vessel demurrage"}], "answer": "D", "answer_text": "Vessel demurrage", "explanation": "Transaction value मध्ये काही specified additions केले जातात, जसे commission/brokerage आणि certain engineering/design costs. परंतु vessel demurrage हा या calculation मध्ये add करण्यासाठी relevant नाही.", "golden": "Transaction Value → Vessel Demurrage not added"}, {"no": 47, "q": "Q47. Which of the following is not correct in respect of examination of goods?", "options": [{"letter": "A", "text": "Imported goods cannot be examined prior to assessment"}, {"letter": "B", "text": "Imported goods may be interdicted by RMS"}, {"letter": "C", "text": "Goods are examined for verification of description and quantity"}, {"letter": "D", "text": "Samples are drawn in certain cases"}], "answer": "A", "answer_text": "", "explanation": "Imported goods assessmentपूर्वी examine केले जाऊ शकतात. त्यामुळे “cannot be examined prior to assessment” हे statement incorrect आहे. RMS risk-based examination/interdiction करू शकते.", "golden": "Examination → Assessmentपूर्वीही होऊ शकते"}, {"no": 48, "q": "Q48. Which of the following is the purpose of Advance Ruling?", "options": [{"letter": "A", "text": "To set right law"}, {"letter": "B", "text": "To provide certainty in advance to the importer with respect to questions raised"}, {"letter": "C", "text": "To provide certainty to all importers on dispute issues"}, {"letter": "D", "text": "To make advance laws"}], "answer": "B", "answer_text": "", "explanation": "Advance Ruling चा मुख्य उद्देश importer ला एखाद्या proposed import transaction बाबत आधीच certainty देणे हा आहे.", "golden": "Advance Ruling → Certainty in Advance"}, {"no": 49, "q": "Q49. Which of the following duties are not leviable on imports into India?", "options": [{"letter": "A", "text": "CGST"}, {"letter": "B", "text": "Basic Customs Duty"}, {"letter": "C", "text": "Integrated Tax"}, {"letter": "D", "text": "Compensation Cess"}], "answer": "A", "answer_text": "CGST", "explanation": "Imports वर: BCD ✔️ IGST ✔️ Applicable Compensation Cess ✔️ लागू होऊ शकतात. पण CGST import वर separately levy होत नाही.", "golden": "Import → BCD + IGST; CGST separately नाही"}, {"no": 50, "q": "Q50. What if the re-assessment done by the department is contrary to the self-assessment done by the importer?", "options": [{"letter": "A", "text": "Self-assessment done by importer shall prevail"}, {"letter": "B", "text": "Re-assessment done by department shall prevail"}, {"letter": "C", "text": "Either importer accepts re-assessment in writing OR department issues speaking order within 15 days"}, {"letter": "D", "text": "None of these"}], "answer": "C", "answer_text": "", "explanation": "Customs Act Section 17(5) नुसार importer च्या self-assessment पेक्षा reassessment वेगळे असल्यास importer ला reassessment writing मध्ये accept करता येते. जर accept केले नाही तर proper officer ने speaking order issue करावा लागतो. Paper explanation नुसार time limit 15 days आहे.", "golden": "Reassessment differs → Written acceptance OR Speaking Order"}, {"no": 51, "q": "Q51. Is the Brand Rate of drawback disbursed by?", "options": [{"letter": "A", "text": "Commissioner of Central Excise having jurisdiction over the manufacturer/supporting manufacturer"}, {"letter": "B", "text": "The Customs House from where the goods are exported"}, {"letter": "C", "text": "DGFT"}, {"letter": "D", "text": "Ministry of Commerce"}], "answer": "B", "answer_text": "Customs House from where goods are exported", "explanation": "Brand Rate drawback च्या payment/disbursement साठी exporting Customs House relevant आहे.", "golden": "Brand Rate → Export Customs House"}, {"no": 52, "q": "Q52. What is/are the different types of post-clearance audit?", "options": [{"letter": "A", "text": "Transaction-based Audit"}, {"letter": "B", "text": "Theme-based Audit"}, {"letter": "C", "text": "Premises-based Audit"}, {"letter": "D", "text": "All of these"}], "answer": "D", "answer_text": "All of these", "explanation": "Post-Clearance Audit मध्ये: Transaction-based Audit Theme-based Audit Premises-based Audit असे types आहेत.", "golden": "PCA → Transaction + Theme + Premises"}, {"no": 53, "q": "Q53. What is the correct sequence for deciding the value of export goods as per Customs Valuation (Determination of Value of Export Goods) Rules, 2007?", "options": [{"letter": "A", "text": "Transaction value → value by comparison → computed value → residual method"}, {"letter": "B", "text": "Value by comparison → transaction value → computed value → residual method"}, {"letter": "C", "text": "Transaction value → computed value → value by comparison → residual method"}, {"letter": "D", "text": "Transaction value → value by comparison → residual method → computed value"}], "answer": "D", "answer_text": "", "explanation": "Export valuation मध्ये prescribed hierarchy follow केली जाते. Paper मध्ये sequence: Transaction Value → Comparison → Residual → Computed दिलेला आहे.", "golden": "Export Valuation → TV → Comparison → Residual → Computed"}, {"no": 54, "q": "Q54. Offences under Customs Act, 1962 for which a person by general or special order of Principal Commissioner/Commissioner of Customs can be arrested under Section—", "options": [{"letter": "A", "text": "132"}, {"letter": "B", "text": "133"}, {"letter": "C", "text": "135"}, {"letter": "D", "text": "All of these"}], "answer": "D", "answer_text": "All of these", "explanation": "Customs Act मधील Sections 132, 133 आणि 135 अंतर्गत specified offences साठी arrest provisions लागू होतात. म्हणून तीनही sections source answer मध्ये covered आहेत.", "golden": "Arrest-related offences → Sec. 132 + 133 + 135"}, {"no": 55, "q": "Q55. A person to be searched under Section 100 of the Customs Act, 1962 should be taken to the nearest—", "options": [{"letter": "A", "text": "Non-Gazetted Officer of Customs"}, {"letter": "B", "text": "Gazetted Officer of Customs"}, {"letter": "C", "text": "Any officer"}, {"letter": "D", "text": "None of these"}], "answer": "B", "answer_text": "Gazetted Officer of Customs", "explanation": "Section 100 अंतर्गत search करताना व्यक्तीला nearest Gazetted Officer of Customs कडे नेण्याची provision आहे.", "golden": "Section 100 Search → Nearest Gazetted Officer"}, {"no": 56, "q": "Q56. On whom the power to search suspected persons under Section 100 applies?", "options": [{"letter": "A", "text": "Any person who has landed from or is about to board, or is on board any vessel within Indian Customs waters"}, {"letter": "B", "text": "Any person in Customs area"}, {"letter": "C", "text": "Any person who has landed from or is about to board a foreign-going aircraft"}, {"letter": "D", "text": "All of these"}], "answer": "D", "answer_text": "All of these", "explanation": "Section 100 अंतर्गत Customs ला specified circumstances मध्ये suspected persons search करण्याचा power आहे. या प्रश्नातील A, B आणि C सर्व situations source मध्ये covered आहेत.", "golden": "Section 100 → All specified persons in Customs jurisdiction"}, {"no": 57, "q": "Q57. Which section of the Customs Act, 1962 empowers the proper officer of Customs to stop and search conveyance?", "options": [{"letter": "A", "text": "105"}, {"letter": "B", "text": "107"}, {"letter": "C", "text": "106"}, {"letter": "D", "text": "106A"}], "answer": "C", "answer_text": "Section 106", "explanation": "Section 106 Customs officer ला conveyance थांबवण्याचा आणि search करण्याचा power देते. उदा. vessel, aircraft किंवा vehicle.", "golden": "Stop + Search Conveyance → Section 106"}, {"no": 58, "q": "Q58. Under power to stop and search conveyances under Customs Act, 1962, the proper officer may—", "options": [{"letter": "A", "text": "Rummage and search any part of aircraft, vehicle or vessel"}, {"letter": "B", "text": "Examine and search any goods in aircraft, vehicle or vessel"}, {"letter": "C", "text": "Break open lock of any door/package if keys are withheld"}, {"letter": "D", "text": "All of these"}], "answer": "D", "answer_text": "All of these", "explanation": "Section 106 अंतर्गत proper officer ला: ✔️ Conveyance चा कोणताही भाग search करता येतो ✔️ Goods examine/search करता येतात ✔️ आवश्यक परिस्थितीत lock/package open करण्याची power आहे म्हणून All of these.", "golden": "Section 106 → Search + Examine Goods + Break Open Lock"}, {"no": 59, "q": "Q59. Under power to screen or X-ray suspected persons for detecting secreted goods, the proper officer may take such a person before the nearest—", "options": [{"letter": "A", "text": "Gazetted Officer of Customs"}, {"letter": "B", "text": "Magistrate"}, {"letter": "C", "text": "Non-Gazetted Officer of Customs"}, {"letter": "D", "text": "None of these"}], "answer": "B", "answer_text": "Magistrate", "explanation": "Customs Act च्या संबंधित provision नुसार suspected person च्या body मध्ये secreted goods असल्याचा संशय असल्यास X-ray/screening करण्यासाठी त्याला nearest Magistrate समोर नेण्याची provision आहे.", "golden": "X-ray/Screening of Person → Nearest Magistrate"}, {"no": 60, "q": "Q60. Under Section 111 of the Customs Act, 1962, which of the following goods brought from a place outside India shall be liable to confiscation?", "options": [{"letter": "A", "text": "Any dutiable or prohibited goods found concealed in any manner in any conveyance"}, {"letter": "B", "text": "Any dutiable or prohibited goods brought into bay, gulf, creek or tidal river for purpose of being landed at a place other than a Customs port"}, {"letter": "C", "text": "Any dutiable or prohibited goods found concealed in any manner in any package either before or after unloading"}, {"letter": "D", "text": "All of these"}], "answer": "D", "answer_text": "All of these", "explanation": "Section 111 मध्ये अनेक circumstances दिल्या आहेत ज्यामध्ये imported goods confiscation ला liable होतात. वरील: Concealed goods in conveyance ✔️ Unauthorized place वर landing साठी आणलेले goods ✔️ Package मध्ये concealed goods ✔️ म्हणून All of these.", "golden": "Section 111 → Improperly imported/concealed goods → Confiscation"}, {"no": 61, "q": "Q61. Under the Customs Act, 1962, the penalty for short-levy or non-levy of duty in certain cases is imposed under which section?", "options": [{"letter": "A", "text": "114AA"}, {"letter": "B", "text": "116"}, {"letter": "C", "text": "114A"}, {"letter": "D", "text": "114"}], "answer": "C", "answer_text": "Section 114A", "explanation": "Section 114A मध्ये fraud, collusion, wilful misstatement किंवा suppression of facts मुळे duty short-levied किंवा non-levied झाल्यास penalty ची provision आहे. साधारणपणे penalty duty evaded इतकी असू शकते.", "golden": "Short levy/non-levy + Fraud/Suppression → Section 114A"}, {"no": 62, "q": "Q62. Section 120 of the Customs Act, 1962 deals with—", "options": [{"letter": "A", "text": "Confiscation of packages and their contents"}, {"letter": "B", "text": "Confiscation of sale proceeds of smuggled goods"}, {"letter": "C", "text": "Confiscation of smuggled goods notwithstanding any change in form etc."}, {"letter": "D", "text": "Confiscation of goods used for concealing smuggled goods"}], "answer": "C", "answer_text": "", "explanation": "Section 120 मध्ये smuggled goods चे form, identity किंवा composition बदलले तरी ते confiscation ला liable राहतात. उदा. smuggled goods दुसऱ्या goods मध्ये blend/repack केले तरी original smuggled character मुळे confiscation होऊ शकते.", "golden": "Section 120 → Smuggled goods despite change in form"}, {"no": 63, "q": "Q63. An application in the Settlement Commission shall be disposed of if—", "options": [{"letter": "A", "text": "Applicant has filed a Bill of Entry"}, {"letter": "B", "text": "No application is pending in Appellate Tribunal or any Court"}, {"letter": "C", "text": "No application has been made for interpretation of classification under Customs Tariff Act"}, {"letter": "D", "text": "All of these"}], "answer": "D", "answer_text": "All of these", "explanation": "Settlement Commission application साठी prescribed conditions पूर्ण असणे आवश्यक आहे. Paper/source नुसार: Bill of Entry/Shipping Bill filed ✔️ Appellate Tribunal/Court मध्ये संबंधित proceeding pending नसणे ✔️ Classification interpretation बाबत application नसणे ✔️ म्हणून All of these.", "golden": "Settlement Commission → All prescribed conditions must be satisfied"}, {"no": 64, "q": "Q64. When can an application in Settlement Commission be withdrawn?", "options": [{"letter": "A", "text": "Within 7 days of making application"}, {"letter": "B", "text": "It cannot be withdrawn by the applicant"}, {"letter": "C", "text": "Within 14 days of making application"}, {"letter": "D", "text": "None of these"}], "answer": "B", "answer_text": "It cannot be withdrawn", "explanation": "Section 127B(4) नुसार Settlement Commission कडे application केल्यानंतर applicant स्वतःहून ती application withdraw करू शकत नाही.", "golden": "Settlement Commission Application → Cannot be withdrawn"}, {"no": 65, "q": "Q65. The power of Settlement Commission under Customs Act, 1962 to order provisional attachment to protect revenue is vested under which section?", "options": [{"letter": "A", "text": "127F"}, {"letter": "B", "text": "127C"}, {"letter": "C", "text": "127D"}, {"letter": "D", "text": "127G"}], "answer": "C", "answer_text": "Section 127D", "explanation": "Section 127D Settlement Commission ला revenue protect करण्यासाठी provisional attachment of property करण्याची power देते.", "golden": "Provisional Attachment → Section 127D"}, {"no": 66, "q": "Q66. The order passed in respect of which matters by Settlement Commission is—", "options": [{"letter": "A", "text": "Can be reopened by itself"}, {"letter": "B", "text": "Can be reopened under Customs Act, 1962"}, {"letter": "C", "text": "Can be reopened in CESTAT"}, {"letter": "D", "text": "Cannot be reopened in any proceedings"}], "answer": "D", "answer_text": "Cannot be reopened", "explanation": "Settlement Commission चा order final and conclusive असतो. Source explanation नुसार तो Customs Act अंतर्गत पुढील proceedings मध्ये reopen करता येत नाही.", "golden": "Settlement Commission Order → Final & Conclusive"}, {"no": 67, "q": "Q67. The proceedings before Settlement Commission are—", "options": [{"letter": "A", "text": "Judicial proceedings"}, {"letter": "B", "text": "Quasi-judicial proceedings"}, {"letter": "C", "text": "Executive proceedings"}, {"letter": "D", "text": "None of these"}], "answer": "A", "answer_text": "Judicial proceedings", "explanation": "Customs Act च्या Section 127M संदर्भात Settlement Commission समोरील proceedings judicial proceedings म्हणून treated आहेत.", "golden": "Settlement Commission → Judicial Proceedings"}, {"no": 68, "q": "Q68. Whether applicant under Section 127G of Customs Act, 1962 is entitled to inspect or obtain copies of any report made by any Customs officer to Settlement Commission?", "options": [{"letter": "A", "text": "Not entitled"}, {"letter": "B", "text": "Under RTI"}, {"letter": "C", "text": "Yes, entitled"}, {"letter": "D", "text": "By making a representation"}], "answer": "A", "answer_text": "Not entitled", "explanation": "Customs officer ने Settlement Commission ला दिलेला report applicant ला as a matter of right inspect/copy करता येत नाही. Paper/source नुसार असे reports confidential स्वरूपाचे आहेत.", "golden": "Officer's Report to Settlement Commission → Applicant not entitled"}, {"no": 69, "q": "Q69. The Appellate Tribunal — CESTAT has been constituted by the Central Government under Customs Act, 1962 under which section?", "optio
