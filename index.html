<main><div class="toolbar"><input id="search" class="search" placeholder="Question / option search करा…"><button id="reset" class="btn">↻ Reset</button></div><div id="app"></div></main>
<script>
const DATA={"2019": [{"no": 1, "q": "Q1. What is the time limit for filing refund claim for refund of duty u/s 27 of the Customs Act, 1962?", "options": [{"letter": "A", "text": "One month from the relevant date"}, {"letter": "B", "text": "Three months from the relevant date"}, {"letter": "C", "text": "Six months from the relevant date"}, {"letter": "D", "text": "One year from the relevant date"}], "answer": "D", "answer_text": "One year from the relevant date", "explanation": "Customs Act, Section 27 नुसार सामान्यतः duty refund claim करण्याची limitation 1 year आहे. Duty under protest भरले असल्यास सामान्य one-year limitation लागू होत नाही.", "golden": "Section 27 Refund → 1 Year"}, {"no": 2, "q": "Q2. Definition of imported goods as per Customs Act, 1962 includes:", "options": [{"letter": "A", "text": "Only i"}, {"letter": "B", "text": "Only ii"}, {"letter": "C", "text": "i and ii"}, {"letter": "D", "text": "None of the Above"}], "answer": "A", "answer_text": "Only i", "explanation": "Imported goods म्हणजे भारताबाहेरून भारतात आणलेले goods. पण ते goods home consumption साठी clear झाल्यानंतर त्यांना imported goods म्हणून मानले जात नाही.", "golden": "Imported Goods = Brought into India from outside India"}, {"no": 3, "q": "Q3. If the imported goods are found to be undeclared, can Customs Broker be penalized?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes, in all cases"}, {"letter": "C", "text": "Yes, only if he is found to be aiding or abetting the doing or omission of an act which renders such goods liable to confiscation"}, {"letter": "D", "text": "No, even if he is found to be aiding or abetting..."}], "answer": "C", "answer_text": "", "explanation": "फक्त goods undeclared आहेत म्हणून Broker प्रत्येक वेळी liable होत नाही. पण Broker ने aiding or abetting केले आणि त्यामुळे goods confiscation साठी liable झाले, तर penalty लागू होऊ शकते.", "golden": "CB liable → Aiding / Abetting in confiscation-related act"}, {"no": 4, "q": "Q4. Which of the following tax is levied on imports?", "options": [{"letter": "A", "text": "CGST only"}, {"letter": "B", "text": "SGST only"}, {"letter": "C", "text": "IGST"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "IGST", "explanation": "Import ला inter-State supply मानले जाते. त्यामुळे import वर IGST + Basic Customs Duty लागू होते. CGST आणि SGST import वर स्वतंत्रपणे लागू होत नाहीत.", "golden": "Import → IGST"}, {"no": 5, "q": "Q5. Can goods restricted as per Foreign Trade Policy be imported?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes, with prior permission of Commissioner of Customs"}, {"letter": "C", "text": "Yes, only when licence has been issued by DGFT"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Yes, only when licence has been issued by DGFT", "explanation": "Restricted goods import करण्यासाठी DGFT licence/authorisation आवश्यक आहे.", "golden": "Restricted Goods → DGFT Licence"}, {"no": 6, "q": "Q6. Which laboratories work directly under Central Board of Indirect Taxes and Customs?", "options": [{"letter": "A", "text": "NABL"}, {"letter": "B", "text": "Chennai Mettexlab"}, {"letter": "C", "text": "National Metallurgical Lab"}, {"letter": "D", "text": "CRCL"}], "answer": "D", "answer_text": "CRCL", "explanation": "CRCL = Central Revenues Control Laboratory. Customs/GST samples चे chemical analysis, classification आणि इतर technical examination साठी CRCL महत्त्वाची आहे.", "golden": "CBIC Laboratory → CRCL"}, {"no": 7, "q": "Q7. Which date is relevant for availing export incentives as per Foreign Trade Policy?", "options": [{"letter": "A", "text": "LEO date"}, {"letter": "B", "text": "Date of loading on vessel"}, {"letter": "C", "text": "Date of examination"}, {"letter": "D", "text": "Date of assessment"}], "answer": "A", "answer_text": "LEO Date", "explanation": "LEO = Let Export Order. Customs officer documents verify करून LEO दिल्यानंतर goods export करण्याची clearance मिळते. Source नुसार export incentives साठी LEO date relevant आहे.", "golden": "Export Incentive → LEO Date"}, {"no": 8, "q": "Q8. The tariff item as per the Customs Tariff consists of ___ digits.", "options": [{"letter": "A", "text": "8"}, {"letter": "B", "text": "7"}, {"letter": "C", "text": "6"}, {"letter": "D", "text": "5"}], "answer": "A", "answer_text": "8 digits", "explanation": "Customs Tariff classification मध्ये: Chapter → 2 digits Heading → 4 digits Sub-heading → 6 digits Tariff Item → 8 digits", "golden": "Tariff Item = 8 Digit"}, {"no": 9, "q": "Q9. Declaration of Standard Unit Quantity Code (SUQC) by importer is—", "options": [{"letter": "A", "text": "Mandatory in all cases"}, {"letter": "B", "text": "Optional"}, {"letter": "C", "text": "Mandatory only for capital goods"}, {"letter": "D", "text": "Mandatory only for packaged goods"}], "answer": "A", "answer_text": "Mandatory in all cases", "explanation": "SUQC म्हणजे Standard Unit Quantity Code. Bill of Entry मध्ये goods ची quantity prescribed unit मध्ये declare करण्यासाठी याचा उपयोग होतो.", "golden": "SUQC → Mandatory"}, {"no": 10, "q": "Q10. Provisional release of seized goods can be allowed by—", "options": [{"letter": "A", "text": "Inspector of Customs"}, {"letter": "B", "text": "The Adjudicating Authority"}, {"letter": "C", "text": "Any officer of Customs"}, {"letter": "D", "text": "Intelligence Officer of DRI"}], "answer": "B", "answer_text": "The Adjudicating Authority", "explanation": "Customs Act Section 110A नुसार seized goods ची provisional release करण्याचा आदेश Adjudicating Authority देऊ शकते. Bond/security/payment of duty अशा conditions लागू होऊ शकतात.", "golden": "Seized Goods Provisional Release → Adjudicating Authority"}, {"no": 11, "q": "Q11. The Nodal Ministry to deal with the trans-boundary movement of hazardous wastes is—", "options": [{"letter": "A", "text": "Ministry of Environment and Forest"}, {"letter": "B", "text": "Ministry of Finance"}, {"letter": "C", "text": "Ministry of Home Affairs"}, {"letter": "D", "text": "Ministry of Agriculture"}], "answer": "A", "answer_text": "Ministry of Environment and Forest", "explanation": "Hazardous waste च्या trans-boundary movement साठी Ministry of Environment, Forest and Climate Change (MoEFCC) nodal ministry आहे.", "golden": "Hazardous Waste → MoEFCC"}, {"no": 12, "q": "Q12. From which date is interest payable by the importer on amount payable consequent to the final assessment?", "options": [{"letter": "A", "text": "From the 1st day of the month in which the duty is provisionally assessed"}, {"letter": "B", "text": "From the last day of the month in which the duty is provisionally assessed"}, {"letter": "C", "text": "From the 1st day of the month in which the duty is finally assessed"}, {"letter": "D", "text": "From the last day of the month in which the duty is finally assessed"}], "answer": "A", "answer_text": "Source answer", "explanation": "Source explanation Section 18 च्या provisional assessment संदर्भात सांगते की final assessment नंतर payable amount वर interest calculation provisional assessment झालेल्या महिन्याच्या 1st day पासून मोजली जाते.", "golden": "Interest → 1st day of month of provisional assessment (as given in source)"}, {"no": 13, "q": "Q13. The amount of penalty that can be imposed on a G-card holder under Regulation 18 of Customs Broker Licensing Regulations, 2018 is—", "options": [{"letter": "A", "text": "Not exceeding ₹50,000"}, {"letter": "B", "text": "Not exceeding ₹10,000"}, {"letter": "C", "text": "Not exceeding ₹1,00,000"}, {"letter": "D", "text": "No penalty can be imposed"}], "answer": "B", "answer_text": "Not exceeding ₹10,000", "explanation": "Source नुसार Regulation 18 अंतर्गत G-card holder ने regulation चे contravention केल्यास Deputy Commissioner/Assistant Commissioner कडून ₹10,000 पर्यंत penalty लावता येते.", "golden": "G-Card Penalty → Maximum ₹10,000"}, {"no": 14, "q": "Q14. Goods were provisionally assessed on 01.01.2019 and finally assessed and duty adjusted on 15.03.2019. Limitation of one year for refund u/s 27 shall begin from—", "options": [{"letter": "A", "text": "01.01.2019"}, {"letter": "B", "text": "15.03.2019"}, {"letter": "C", "text": "Date of filing Bill of Entry"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "15.03.2019", "explanation": "Provisional assessment असल्यामुळे refund limitation final assessment आणि duty adjustment झालेल्या तारखेपासून सुरू होते. येथे ती तारीख 15.03.2019 आहे.", "golden": "Provisional Assessment → Refund limitation starts from Final Assessment/Duty Adjustment"}, {"no": 15, "q": "Q15. Who is the proper officer to give Out of Charge (OOC) for imported goods under Section 47?", "options": [{"letter": "A", "text": "Preventive Officer/Examiner/Inspector"}, {"letter": "B", "text": "Deputy/Assistant Commissioner"}, {"letter": "C", "text": "Appraiser/Superintendent"}, {"letter": "D", "text": "Custodian of imported goods"}], "answer": "C", "answer_text": "Appraiser/Superintendent", "explanation": "OOC = Out of Charge. Assessment, examination आणि duty payment पूर्ण झाल्यानंतर imported goods release करण्यासाठी OOC दिले जाते.", "golden": "OOC → Appraiser/Superintendent (as per source)"}, {"no": 16, "q": "Q16. Under Deferred Payment of Import Duty Rules, 2016, Bill of Entry returned for payment from 1st to 15th day of a month has to be paid by which day?", "options": [{"letter": "A", "text": "17th day"}, {"letter": "B", "text": "16th day"}, {"letter": "C", "text": "18th day"}, {"letter": "D", "text": "21st day"}], "answer": "B", "answer_text": "16th day", "explanation": "1 ते 15 तारखेच्या दरम्यान duty payment साठी Bill of Entry return झाल्यास duty त्याच महिन्याच्या 16 तारखेपर्यंत भरायची.", "golden": "1–15 → Pay by 16th"}, {"no": 17, "q": "Q17. After assessment, if payment of duty is delayed by importer, what is applicable rate of interest?", "options": [{"letter": "A", "text": "13%"}, {"letter": "B", "text": "15%"}, {"letter": "C", "text": "18%"}, {"letter": "D", "text": "None of the Above"}], "answer": "B", "answer_text": "15%", "explanation": "Source नुसार delayed payment of duty वर Central Government ने notified केलेला interest rate 15% आहे.", "golden": "Delayed Customs Duty → 15% (2019 source answer)"}, {"no": 18, "q": "Q18. First Check Assessment can be carried out on the request/directions of—", "options": [{"letter": "A", "text": "Importer"}, {"letter": "B", "text": "Proper Officer"}, {"letter": "C", "text": "Customs Broker"}, {"letter": "D", "text": "Custodian"}], "answer": "B", "answer_text": "Proper Officer", "explanation": "First Check मध्ये assessment करण्यापूर्वी goods चे physical examination/testing केले जाते. जेव्हा documents वरून योग्य assessment करता येत नाही तेव्हा first check उपयोगी पडतो.", "golden": "First Check → Examination before Assessment"}, {"no": 19, "q": "Q19. What if an importer does not present Bill of Entry within the specified time?", "options": [{"letter": "A", "text": "₹5,000 per day"}, {"letter": "B", "text": "₹3,000 first day + ₹10,000 second day onwards"}, {"letter": "C", "text": "₹3,000 per day for first 3 days and ₹10,000 per day from 4th day onwards"}, {"letter": "D", "text": "None of the Above"}], "answer": "C", "answer_text": "", "explanation": "Source नुसार late presentation charges: First 3 days → ₹3,000 per day 4th day onwards → ₹10,000 per day", "golden": "Late BOE → ₹3,000 × first 3 days; ₹10,000 × 4th day onwards"}, {"no": 20, "q": "Q20. Item-wise import policy is given under?", "options": [{"letter": "A", "text": "Foreign Trade Policy"}, {"letter": "B", "text": "ITC (HS)"}, {"letter": "C", "text": "Handbook of Procedure"}, {"letter": "D", "text": "Customs Tariff"}], "answer": "B", "answer_text": "ITC (HS)", "explanation": "ITC(HS) = Indian Trade Classification (Harmonized System). प्रत्येक item साठी HS code आणि त्याची import/export policy — Free, Restricted इत्यादी — येथे दिली जाते.", "golden": "Item-wise Import Policy → ITC (HS)"}, {"no": 21, "q": "Q21. What is the difference between Standing Order and Public/Facility Notice issued by Custom Houses?", "options": [{"letter": "A", "text": "No difference"}, {"letter": "B", "text": "Standing Order is for the trade and Public/Facility Notice is for the officers"}, {"letter": "C", "text": "Standing Order is for the officers and Public/Facility Notice is for the trade"}, {"letter": "D", "text": "None of the Above"}], "answer": "C", "answer_text": "", "explanation": "Standing Order हे Customs Department मधील officers साठी instructions/procedure देण्यासाठी असते. Public Notice / Facility Notice हे trade community म्हणजे Importers, Exporters आणि Customs Brokers यांना माहिती देण्यासाठी असते.", "golden": "Standing Order → Officers Public/Facility Notice → Trade"}, {"no": 22, "q": "Q22. The minor amendments to IGM—", "options": [{"letter": "A", "text": "Are done by proper officer without adjudication not below the rank of Assistant/Deputy Commissioner"}, {"letter": "B", "text": "Are done with adjudication by Assistant/Deputy Commissioner"}, {"letter": "C", "text": "Are done with adjudication by Supdt./Appraiser"}, {"letter": "D", "text": "Are done without adjudication by Supdt./Appraiser"}], "answer": "D", "answer_text": "", "explanation": "IGM = Import General Manifest. IGM मध्ये clerical mistake किंवा minor factual correction असेल तर minor amendment करता येते. Source नुसार अशी minor amendment without adjudication Superintendent/Appraiser करू शकतो.", "golden": "Minor IGM Amendment → Supdt./Appraiser → Without Adjudication"}, {"no": 23, "q": "Q23. Appeal against order in original passed by Assistant Commissioner of Customs lies with—", "options": [{"letter": "A", "text": "Chief Commissioner of Customs"}, {"letter": "B", "text": "Commissioner of Customs"}, {"letter": "C", "text": "CESTAT"}, {"letter": "D", "text": "Commissioner (Appeals)"}], "answer": "D", "answer_text": "Commissioner (Appeals)", "explanation": "Assistant Commissioner किंवा Deputy Commissioner सारख्या authority च्या order विरुद्ध appeal Commissioner (Appeals) कडे जाते.", "golden": "AC/DC Order → Commissioner (Appeals)"}, {"no": 24, "q": "Q24. An Advance Bill of Entry is presented on 27th October, 2017 and Entry Inwards to the vessel is given on 2nd November, 2017. What should be the rate of duty?", "options": [{"letter": "A", "text": "Rate of duty as on 27th October 2017"}, {"letter": "B", "text": "Rate of duty as on 2nd November 2017"}, {"letter": "C", "text": "Rate which is higher of the two"}, {"letter": "D", "text": "None of the above"}], "answer": "B", "answer_text": "Rate as on 2nd November 2017", "explanation": "Advance Bill of Entry आधी file केला असला तरी applicable rate of duty ठरवताना Entry Inwards date महत्त्वाची आहे. येथे: Advance BOE → 27-10-2017 Entry Inwards → 02-11-2017 म्हणून duty rate 02-11-2017 चा लागू होतो.", "golden": "Rate of Duty → Entry Inwards Date"}, {"no": 25, "q": "Q25. At present which of the following is NOT includible in the value of the imported goods?", "options": [{"letter": "A", "text": "Cost of transport up to the place of importation"}, {"letter": "B", "text": "Cost of insurance up to the place of importation"}, {"letter": "C", "text": "Ship demurrage charges"}, {"letter": "D", "text": "Landing charges"}], "answer": "D", "answer_text": "Landing charges", "explanation": "Customs Valuation Rules नुसार assessable value ठरवताना transportation आणि insurance सारखे charges consider होतात. Source नुसार landing charges separately add केले जात नाहीत.", "golden": "Landing Charges → Not separately includible"}, {"no": 26, "q": "Q26. E-Sanchit is—", "options": [{"letter": "A", "text": "Paperless processing of documents wherein supporting documents can be uploaded online"}, {"letter": "B", "text": "Online assessment"}, {"letter": "C", "text": "Uploading of manual assessment Bill of Entry in EDI"}, {"letter": "D", "text": "None of the Above"}], "answer": "A", "answer_text": "", "explanation": "e-Sanchit हा Customs चा paperless document processing system आहे. Importer, Exporter किंवा Customs Broker supporting documents online upload करू शकतात.", "golden": "e-Sanchit → Paperless + Online Document Upload"}, {"no": 27, "q": "Q27. The Brand Rate of Duty Drawback is fixed by—", "options": [{"letter": "A", "text": "Jurisdictional Central Excise Authority"}, {"letter": "B", "text": "Jurisdictional GST Authority"}, {"letter": "C", "text": "Jurisdictional Customs House from where the goods are exported"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "", "explanation": "जेव्हा All Industry Rate (AIR) applicable नसतो किंवा actual duties पूर्णपणे cover करत नाही, तेव्हा Brand Rate fixation केली जाते. Source नुसार jurisdictional Customs House, जिथून goods export होतात, Brand Rate ठरवते.", "golden": "Brand Rate → Jurisdictional Customs House"}, {"no": 28, "q": "Q28. Whether an importer has to compulsorily take the services of a Customs Broker?", "options": [{"letter": "A", "text": "Yes, as per Customs Act"}, {"letter": "B", "text": "Yes, as per Customs Brokers Regulations"}, {"letter": "C", "text": "No, Importer can self-clear the consignment as well"}, {"letter": "D", "text": "None of the Above"}], "answer": "C", "answer_text": "", "explanation": "Importer साठी Customs Broker घेणे compulsory नाही. Importer स्वतः: Bill of Entry file करू शकतो Customs formalities complete करू शकतो Self-clearance करू शकतो Broker घेणे हे सुविधा आणि expertise साठी असते.", "golden": "Customs Broker → Not compulsory; Self-clearance possible"}, {"no": 29, "q": "Q29. Tariff Value is fixed by—", "options": [{"letter": "A", "text": "DGFT"}, {"letter": "B", "text": "CBIC"}, {"letter": "C", "text": "Ministry of Commerce"}, {"letter": "D", "text": "None of the Above"}], "answer": "B", "answer_text": "CBIC", "explanation": "Customs Act, Section 14(2) अंतर्गत notified goods साठी Tariff Value fix करण्याचा अधिकार CBIC कडे आहे.", "golden": "Tariff Value → CBIC"}, {"no": 30, "q": "Q30. No drawback is admissible where the amount of drawback worked out is higher than the—", "options": [{"letter": "A", "text": "Present market value of the goods exported"}, {"letter": "B", "text": "Actual taxes paid on the goods being exported"}, {"letter": "C", "text": "FOB value of the goods"}, {"letter": "D", "text": "CIP value of the goods"}], "answer": "A", "answer_text": "", "explanation": "Duty drawback amount हा exported goods च्या present market value पेक्षा जास्त असू शकत नाही.", "golden": "Drawback > Present Market Value → No drawback admissible"}, {"no": 31, "q": "Q31. In case of imported articles of food, who shall take its sample?", "options": [{"letter": "A", "text": "The authorised officer of the FSSAI"}, {"letter": "B", "text": "The authorised officer of DGFT"}, {"letter": "C", "text": "The authorised officer of Police"}, {"letter": "D", "text": "The authorised officer of the Food Import Council"}], "answer": "A", "answer_text": "Authorised Officer of FSSAI", "explanation": "FSSAI = Food Safety and Standards Authority of India. Imported food ची inspection, sampling आणि food safety compliance साठी FSSAI authorised officer जबाबदार असतो.", "golden": "Imported Food → FSSAI"}, {"no": 32, "q": "Q32. For re-export under Section 74 of the Customs Act, 1962, the identity of the goods has to be established with respect to import documents to the satisfaction of—", "options": [{"letter": "A", "text": "The Assessing Officer"}, {"letter": "B", "text": "The Examination Officer"}, {"letter": "C", "text": "The Commissioner"}, {"letter": "D", "text": "The Assistant/Deputy Commissioner"}], "answer": "D", "answer_text": "Assistant/Deputy Commissioner", "explanation": "Section 74 अंतर्गत imported goods re-export केल्यावर drawback मिळू शकतो. पण re-export केलेले goods तेच goods आहेत जे आधी import केले होते, हे establish करणे आवश्यक आहे. Source नुसार identity Assistant/Deputy Commissioner च्या satisfaction ला establish करायची.", "golden": "Section 74 → Identity of goods → AC/DC satisfaction"}, {"no": 33, "q": "Q33. Cases concerning import of samples and prototypes from related sellers shall not be taken up for inquiries by SVB—", "options": [{"letter": "A", "text": "True without any condition"}, {"letter": "B", "text": "False without any condition"}, {"letter": "C", "text": "True subject to certain condition"}, {"letter": "D", "text": "False subject to certain condition"}], "answer": "A", "answer_text": "True without any condition", "explanation": "Source नुसार related seller कडून samples/prototypes testing, R&D किंवा demonstration साठी import केले असल्यास SVB inquiry साठी ते cases घेतले जात नाहीत. SVB = Special Valuation Branch.", "golden": "Related Seller + Samples/Prototypes → SVB inquiry नाही (source answer)"}, {"no": 34, "q": "Q34. When item XYZ is imported into India, it attracts Basic Customs Duty of 10%. It also attracts IGST @18% and compensation cess. What would be the total duty payable if transaction value of XYZ is ₹100?", "options": [{"letter": "A", "text": "₹43"}, {"letter": "B", "text": "₹41.2"}, {"letter": "C", "text": "₹45.3"}, {"letter": "D", "text": "₹42"}], "answer": "A", "answer_text": "₹43", "explanation": "या प्रश्नात source च्या explanation मध्ये calculation दिलेली आहे आणि final answer ₹43 दिलेला आहे. Customs import calculation मध्ये आधी BCD, त्यानंतर applicable base वर IGST आणि compensation cess calculate होतात. ⚠️ या scanned source मधील calculation/explanation काही ठिकाणी OCR मुळे अस्पष्ट आहे; त्यामुळे मी source चा दिलेला answer ₹43 तसाच ठेवत आहे.", "golden": "Import Duty Calculation → BCD → IGST → Compensation Cess"}, {"no": 35, "q": "Q35. The duty drawback, under Section 74 of the Customs Act, 1962, for re-export of goods is available if—", "options": [{"letter": "A", "text": "Goods are entered for export within two years from the date of payment of duty on importation thereof"}, {"letter": "B", "text": "Goods are entered for export within one year from the date of payment of duty"}, {"letter": "C", "text": "Goods are entered for export within six months from the date of payment of duty"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "Within two years", "explanation": "Section 74 मध्ये imported goods नंतर re-export केल्यास drawback मिळू शकतो. Source नुसार goods import duty payment च्या date पासून 2 years मध्ये export साठी entered झाले पाहिजेत.", "golden": "Section 74 → Re-export → 2 Years"}, {"no": 36, "q": "Q36. What is the maximum percentage of duty allowable as drawback for re-export of imported goods?", "options": [{"letter": "A", "text": "9%"}, {"letter": "B", "text": "95%"}, {"letter": "C", "text": "98%"}, {"letter": "D", "text": "100%"}], "answer": "C", "answer_text": "98%", "explanation": "Section 74 अंतर्गत imported goods re-export केल्यास maximum 98% of import duty paid drawback मिळू शकतो, subject to prescribed conditions.", "golden": "Section 74 → Maximum Drawback = 98%"}, {"no": 37, "q": "Q37. ‘Acid Blacks Azo Dyes’ are classified under which of the following chapters?", "options": [{"letter": "A", "text": "Chapter 32"}, {"letter": "B", "text": "Chapter 72"}, {"letter": "C", "text": "Chapter 59"}, {"letter": "D", "text": "Chapter 62"}], "answer": "A", "answer_text": "Chapter 32", "explanation": "Acid Black Azo Dyes हे synthetic organic colouring materials आहेत. Customs Tariff मध्ये Chapter 32 मध्ये dyes, colouring matter, pigments इत्यादींचे classification येते.", "golden": "Dyes / Colouring Matter → Chapter 32"}, {"no": 38, "q": "Q38. Can drawback under Section 74 of the Customs Act, 1962 be allowed for the goods which cannot be identified at the time of export with respect to import documents?", "options": [{"letter": "A", "text": "Yes, if proper Shipping Bill is filed"}, {"letter": "B", "text": "Yes, if proper records are maintained and produced"}, {"letter": "C", "text": "No"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "No", "explanation": "Section 74 drawback साठी re-export केलेले goods हे previously imported goods आहेत, हे identify करता आले पाहिजे. Import documents शी identity establish होत नसेल तर drawback मिळणार नाही.", "golden": "Section 74 → Identification of goods is compulsory"}, {"no": 39, "q": "Q39. Consider the following statements:", "options": [{"letter": "A", "text": "Only i"}, {"letter": "B", "text": "Only ii"}, {"letter": "C", "text": "Both i and ii"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "Only i", "explanation": "HS classification च्या General Rules for Interpretation मध्ये specific description ला general description पेक्षा preference दिली जाते. Statement i = Correct. Statement ii = Incorrect, कारण equally meriting headings असल्यास Rule 3(c) नुसार last in numerical order लागू होते, first नाही.", "golden": "Specific description → Preferred Equal headings → Last numerical order"}, {"no": 40, "q": "Q40. The findings of SVB incorporating all relevant facts, submissions made by the importer that has been approved by the Principal Commissioner/Commissioner, and forwarded to the concerned appraising groups for further action is called the—", "options": [{"letter": "A", "text": "Investigation Report (IR)"}, {"letter": "B", "text": "Show Cause Notice (SCN)"}, {"letter": "C", "text": "SVB Report (SR)"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "Investigation Report (IR)", "explanation": "SVB = Special Valuation Branch. Related-party transactions मध्ये declared transaction value योग्य आहे का हे तपासण्यासाठी SVB investigation करते. Investigation पूर्ण झाल्यानंतर findings, facts आणि importer submissions एकत्र करून तयार होणाऱ्या report ला Investigation Report (IR) म्हणतात.", "golden": "SVB Investigation → Investigation Report (IR)"}, {"no": 41, "q": "Q41. Examination in relation to any goods includes—", "options": [{"letter": "A", "text": "Only Measurement"}, {"letter": "B", "text": "Only Weighment"}, {"letter": "C", "text": "Both A and B"}, {"letter": "D", "text": "None of the Above"}], "answer": "C", "answer_text": "Both A and B", "explanation": "Customs examination मध्ये goods चे measurement आणि weighment दोन्ही येतात. यामुळे Bill of Entry/Shipping Bill मध्ये declared quantity आणि actual goods verify करता येतात.", "golden": "Examination = Measurement + Weighment"}, {"no": 42, "q": "Q42. Can the penalty for late presentation of Bill of Entry be waived in genuine cases?", "options": [{"letter": "A", "text": "No, penalty is mandatory"}, {"letter": "B", "text": "Yes, if the proper officer is satisfied that there was sufficient cause for such delay"}, {"letter": "C", "text": "Yes, if the proper officer feels so"}, {"letter": "D", "text": "None of the Above"}], "answer": "B", "answer_text": "", "explanation": "Bill of Entry उशिरा file केल्यास late presentation penalty/charges लागू होऊ शकतात. पण sufficient cause असल्याचे proper officer ला समाधानकारक वाटल्यास penalty waive होऊ शकते.", "golden": "Genuine/Sufficient Cause → Penalty may be waived"}, {"no": 43, "q": "Q43. IGM is filed by—", "options": [{"letter": "A", "text": "Importer"}, {"letter": "B", "text": "Customs Broker"}, {"letter": "C", "text": "Person-in-charge of the vessel"}, {"letter": "D", "text": "None of the Above"}], "answer": "C", "answer_text": "Person-in-charge of the vessel", "explanation": "IGM = Import General Manifest. Vessel/aircraft/vehicle मध्ये आलेल्या imported cargo ची माहिती Customs ला देण्याची जबाबदारी person-in-charge ची असते.", "golden": "IGM → Person-in-charge"}, {"no": 44, "q": "Q44. Once the goods are confiscated, the ownership vests with—", "options": [{"letter": "A", "text": "There is no change in the ownership"}, {"letter": "B", "text": "The Government"}, {"letter": "C", "text": "Jointly with the Government and the original Owner"}, {"letter": "D", "text": "None of the Above"}], "answer": "B", "answer_text": "The Government", "explanation": "Customs Act Section 126 नुसार goods confiscate झाल्यानंतर त्यांचे ownership Central Government मध्ये absolutely vest होते. Original owner चे rights संपतात.", "golden": "Confiscation → Ownership vests in Central Government"}, {"no": 45, "q": "Q45. Whether second-hand goods, other than capital goods, can be imported into India?", "options": [{"letter": "A", "text": "Yes; can be freely imported"}, {"letter": "B", "text": "No, they are prohibited"}, {"letter": "C", "text": "Yes, against authorisation issued by DGFT"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Yes, against authorisation issued by DGFT", "explanation": "Source नुसार second-hand goods, capital goods वगळता, restricted आहेत. त्यामुळे DGFT कडून required authorisation घेऊन import करता येतो.", "golden": "Second-hand goods (other than capital goods) → Restricted → DGFT Authorisation"}, {"no": 46, "q": "Q46. How much time has been given (without extension) for submission of information/documents under Customs (Finalization of Provisional Assessment) Regulations, 2018 for finalization of assessment?", "options": [{"letter": "A", "text": "One month"}, {"letter": "B", "text": "Six months"}, {"letter": "C", "text": "Three months"}, {"letter": "D", "text": "Twelve months"}], "answer": "A", "answer_text": "One month", "explanation": "Proper officer ने information/documents मागितल्यानंतर importer/exporter ने ते one month मध्ये submit करायचे असतात. Source नुसार extension वेगळी बाब आहे.", "golden": "Finalization of Provisional Assessment → Documents → 1 Month"}, {"no": 47, "q": "Q47. Import of hazardous wastes into India is—", "options": [{"letter": "A", "text": "Prohibited"}, {"letter": "B", "text": "Conditionally allowed"}, {"letter": "C", "text": "Freely allowed"}, {"letter": "D", "text": "Restricted to certain ports"}], "answer": "A", "answer_text": "Prohibited", "explanation": "Source मध्ये hazardous waste import prohibited असे दिले आहे. Hazardous substances मुळे human health आणि environment वर धोका असल्याने restrictions आहेत.", "golden": "Hazardous Waste → Prohibited"}, {"no": 48, "q": "Q48. Whether there is any upper limit on the penalty for delayed presentation of Bill of Entry?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes, Rs. 100000/-"}, {"letter": "C", "text": "Yes, duty payable in respect of that particular Bill of Entry"}, {"letter": "D", "text": "None of the Above"}], "answer": "C", "answer_text": "", "explanation": "Late presentation साठी penalty असली तरी source नुसार तिची upper limit त्या particular Bill of Entry वर payable duty इतकी आहे.", "golden": "Late BOE Penalty → Maximum = Duty payable on that BOE"}, {"no": 49, "q": "Q49. How much fee is prescribed for amendment of Shipping Bill/Bill of Entry, except prior Bill of Entry, as per Levy of Fees (Customs Documents) Amendment Regulations, 2017?", "options": [{"letter": "A", "text": "Rs. 1000/- per document"}, {"letter": "B", "text": "Rs. 500/-"}, {"letter": "C", "text": "Rs. 100/-"}, {"letter": "D", "text": "None of the Above"}], "answer": "A", "answer_text": "Rs. 1,000 per document", "explanation": "Shipping Bill किंवा Bill of Entry मध्ये amendment करण्यासाठी prescribed fee ₹1,000 per document आहे. Source मध्ये prior Bill of Entry साठी exception दिले आहे.", "golden": "Amendment Fee → ₹1,000/document"}, {"no": 50, "q": "Q50. Why does the Customs Department ask for a Bond for warehousing?", "options": [{"letter": "A", "text": "To collect applicable duty"}, {"letter": "B", "text": "To safeguard the goods"}, {"letter": "C", "text": "To secure applicable duty"}, {"letter": "D", "text": "All the above"}], "answer": "C", "answer_text": "To secure applicable duty", "explanation": "Section 59 अंतर्गत warehousing साठी bond घेतला जातो. त्याचा मुख्य उद्देश government revenue म्हणजे applicable duty सुरक्षित ठेवणे आहे. Bonded warehouse मध्ये goods ठेवले असताना duty लगेच भरलेली नसते.", "golden": "Warehousing Bond → Secure Duty"}, {"no": 51, "q": "Q51. The Merchandise Exports from India Scheme (MEIS) is a—", "options": [{"letter": "A", "text": "Import substitution scheme"}, {"letter": "B", "text": "Export substitution scheme"}, {"letter": "C", "text": "Export reward scheme"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Export reward scheme", "explanation": "MEIS = Merchandise Exports from India Scheme. Source नुसार MEIS अंतर्गत specified exports साठी exporters ना incentives/rewards दिले जात होते.", "golden": "MEIS → Export Reward Scheme"}, {"no": 52, "q": "Q52. ‘Coal’ is classifiable under which of the following chapters?", "options": [{"letter": "A", "text": "Chapter 93"}, {"letter": "B", "text": "Chapter 84"}, {"letter": "C", "text": "Chapter 27"}, {"letter": "D", "text": "Chapter 12"}], "answer": "C", "answer_text": "Chapter 27", "explanation": "Coal हे mineral fuels category मध्ये येते. Customs Tariff मध्ये Chapter 27 मध्ये mineral fuels, mineral oils आणि related products येतात.", "golden": "Coal → Chapter 27"}, {"no": 53, "q": "Q53. Who is the proper officer under Section 149 to amend the Bill of Entry after goods have been cleared from Customs?", "options": [{"letter": "A", "text": "Deputy/Assistant Commissioner of Customs"}, {"letter": "B", "text": "Additional/Joint Commissioner of Customs"}, {"letter": "C", "text": "Commissioner of Customs"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "Deputy/Assistant Commissioner of Customs", "explanation": "Section 149 अंतर्गत clearance नंतर document amendment करण्यासाठी source मध्ये Deputy/Assistant Commissioner of Customs proper officer दिला आहे. महत्त्वाचे: amendment साठी relevant documentary evidence असणे आवश्यक आहे.", "golden": "Section 149 → Post-clearance amendment → AC/DC"}, {"no": 54, "q": "Q54. Why imported food items are referred to FSSAI authorities?", "options": [{"letter": "A", "text": "It is responsible for food safety in India"}, {"letter": "B", "text": "It prevents pollution"}, {"letter": "C", "text": "It is supervising body for all radioactive materials"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "It is responsible for food safety in India", "explanation": "FSSAI = Food Safety and Standards Authority of India. Imported food भारतीय food safety standards पूर्ण करते का, यासाठी FSSAI checking करते.", "golden": "Imported Food → FSSAI"}, {"no": 55, "q": "Q55. The findings of SVB incorporating all relevant facts, submissions made by the importer that has been approved by the Principal Commissioner/Commissioner, and forwarded to the concerned appraising groups for further action is called the—", "options": [{"letter": "A", "text": "Investigation Report (IR)"}, {"letter": "B", "text": "Show Cause Notice (SCN)"}, {"letter": "C", "text": "SVB Report (SR)"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "Investigation Report (IR)", "explanation": "SVB = Special Valuation Branch. Related-party import transactions मध्ये valuation तपासल्यानंतर findings आणि importer submissions चा report तयार होतो. Source मध्ये त्याला Investigation Report (IR) म्हटले आहे.", "golden": "SVB → Investigation Report (IR)"}, {"no": 56, "q": "Q56. What is the time limit for filing refund claim under Section 27 where duty was paid under protest?", "options": [{"letter": "A", "text": "No time limit"}, {"letter": "B", "text": "Three months from the relevant date"}, {"letter": "C", "text": "Six months from the relevant date"}, {"letter": "D", "text": "Twelve months from the relevant date"}], "answer": "A", "answer_text": "No time limit", "explanation": "Source नुसार सामान्य Section 27 refund claim साठी limitation असते. पण duty paid under protest असल्यास त्या normal limitation चा benefit मिळतो; dispute pending असेपर्यंत limitation suspended राहते. Source मध्ये final decision नंतर claim करण्याबाबतही explanation दिले आहे.", "golden": "Duty paid under protest → Normal limitation does not apply"}, {"no": 57, "q": "Q57. The acronym FSSAI stands for—", "options": [{"letter": "A", "text": "Food Standards and Safety Authority of India"}, {"letter": "B", "text": "Food Safety and Standards Authority of India"}, {"letter": "C", "text": "Food Standards and Service Authority of India"}, {"letter": "D", "text": "Food Safety and Service Authority of India"}], "answer": "B", "answer_text": "Food Safety and Standards Authority of India", "explanation": "FSSAI चे full form: Food Safety and Standards Authority of India हे Food Safety and Standards Act, 2006 अंतर्गत स्थापित regulatory authority आहे.", "golden": "FSSAI = Food Safety and Standards Authority of India"}, {"no": 58, "q": "Q58. Facility of deferred payment of customs duty has been provided at present to which category of importers?", "options": [{"letter": "A", "text": "ACP"}, {"letter": "B", "text": "AEO"}, {"letter": "C", "text": "AEO-T2"}, {"letter": "D", "text": "DPD"}], "answer": "C", "answer_text": "AEO-T2", "explanation": "Source answer नुसार deferred payment facility AEO Tier-2 category शी जोडलेली आहे. AEO = Authorized Economic Operator.", "golden": "Deferred Customs Duty → AEO-T2"}, {"no": 59, "q": "Q59. What is Bonding of goods under Section 59 of the Customs Act, 1962?", "options": [{"letter": "A", "text": "Storage of goods at a specified place on which applicable duty has not been paid"}, {"letter": "B", "text": "Storage of goods at a specified place on which applicable duty has been paid"}, {"letter": "C", "text": "Clearance of goods after import"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "", "explanation": "Bonding/Warehousing म्हणजे imported goods ना specified bonded warehouse मध्ये ठेवणे, जिथे applicable customs duty लगेच भरलेली नसते. Duty नंतर clearance वेळी applicable rules नुसार भरली जाते.", "golden": "Bonding → Goods stored without payment of duty"}, {"no": 60, "q": "Q60. ‘Redemption fine’ is in lieu of—", "options": [{"letter": "A", "text": "Seizure"}, {"letter": "B", "text": "Disposal"}, {"letter": "C", "text": "Confiscation"}, {"letter": "D", "text": "Auction"}], "answer": "C", "answer_text": "Confiscation", "explanation": "Section 125 अंतर्गत goods confiscation ला liable असतील, तर काही परिस्थितीत adjudicating authority owner ला goods redeem करण्याची संधी देते. त्यासाठी redemption fine भरावा लागतो. सोप्या भाषेत: Confiscation ऐवजी → Redemption Fine भरून goods release/redeem करण्याची संधी.", "golden": "Redemption Fine → In lieu of Confiscation"}, {"no": 61, "q": "Q61. While applying Rule 4 of Customs Valuation Rules, if more than one transaction value of identical goods is found, which value shall be taken?", "options": [{"letter": "A", "text": "Lowest"}, {"letter": "B", "text": "Average"}, {"letter": "C", "text": "Highest"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "Lowest", "explanation": "Customs Valuation Rules, 2007 मधील Rule 4 identical goods च्या transaction value शी संबंधित आहे. एकापेक्षा जास्त comparable transaction values available असतील, तर source नुसार lowest value घेतली जाते.", "golden": "Identical Goods + Multiple Values → Lowest Value"}, {"no": 62, "q": "Q62. A machine is imported for ₹1,00,000 CIF. BCD = 10%, SWS = 10%, IGST = 18%. Calculate IGST.", "options": [{"letter": "A", "text": "₹18,000"}, {"letter": "B", "text": "₹19,980"}, {"letter": "C", "text": "₹19,800"}, {"letter": "D", "text": "None of the Above"}], "answer": "B", "answer_text": "₹19,980", "explanation": "Calculation: CIF Value = ₹1,00,000 BCD @ 10% = ₹10,000 SWS @ 10% of BCD = ₹1,000 IGST base = ₹1,00,000 + ₹10,000 + ₹1,000 = ₹1,11,000 IGST @ 18%: ₹1,11,000 × 18% = ₹19,980", "golden": "IGST Base = Assessable Value + BCD + applicable SWS"}, {"no": 63, "q": "Q63. What happens if the importer does not clear the goods, which are freely importable?", "options": [{"letter": "A", "text": "The custodian may auction the goods if they remain uncleared for 30 days"}, {"letter": "B", "text": "Customs may confiscate the goods if they remain uncleared for 30 days"}, {"letter": "C", "text": "Customs may auction the goods if they remain uncleared for 30 days"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "", "explanation": "Customs Act Section 48 मध्ये uncleared goods बाबत procedure आहे. Goods unloading झाल्यानंतर prescribed period मध्ये clear/warehouse/tranship न झाल्यास custodian proper permission/notice नंतर goods sell/auction करू शकतो.", "golden": "Uncleared Goods → Custodian → Sale/Auction"}, {"no": 64, "q": "Q64. Whether Duty Drawback under Section 75 is available for export of goods not manufactured in India?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}, {"letter": "C", "text": "Yes, if some components used in manufacture of such goods were exported from India"}, {"letter": "D", "text": "Yes, if they are reworked"}], "answer": "B", "answer_text": "No", "explanation": "Source नुसार Section 75 drawback हा goods manufactured in India and exported या situation शी संबंधित आहे. भारतामध्ये manufacture न केलेल्या traded/re-exported goods ना Section 75 manufacturing drawback मिळत नाही.", "golden": "Section 75 → Manufactured in India + Export"}, {"no": 65, "q": "Q65. What is the time limit within which containers of durable nature are to be re-exported as per Notification No. 104/94-Customs?", "options": [{"letter": "A", "text": "Six months or extended period"}, {"letter": "B", "text": "One year"}, {"letter": "C", "text": "Three months"}, {"letter": "D", "text": "None of the Above"}], "answer": "A", "answer_text": "Six months or extended period", "explanation": "Notification No. 104/94-Customs नुसार temporary use साठी imported durable containers साधारणपणे 6 months मध्ये re-export करायचे असतात. Source नुसार prescribed conditions पूर्ण असल्यास extension मिळू शकते.", "golden": "Notification 104/94 → 6 Months + Extension"}, {"no": 66, "q": "Q66. Shipping Bill presented by an exporter is deemed to be an application for refund of IGST paid on export goods when—", "options": [{"letter": "A", "text": "LEO is granted"}, {"letter": "B", "text": "Goods are registered for examination"}, {"letter": "C", "text": "Goods are loaded on to the vessel"}, {"letter": "D", "text": "EGM & valid return in Form GSTR-3B are filed"}], "answer": "D", "answer_text": "", "explanation": "Source नुसार IGST refund process साठी दोन महत्त्वाच्या गोष्टी: Carrier कडून EGM (Export General Manifest) file होणे Exporter कडून valid GSTR-3B return file होणे या conditions पूर्ण झाल्यावर Shipping Bill deemed refund application म्हणून काम करते.", "golden": "IGST Export Refund → EGM + GSTR-3B"}, {"no": 67, "q": "Q67. ‘Leather Jacket’ is classifiable under which Chapter?", "options": [{"letter": "A", "text": "Chapter 50"}, {"letter": "B", "text": "Chapter 45"}, {"letter": "C", "text": "Chapter 42"}, {"letter": "D", "text": "Chapter 52"}], "answer": "C", "answer_text": "Chapter 42", "explanation": "Leather articles, handbags, saddlery/harness आणि संबंधित leather products Chapter 42 मध्ये येतात. Leather jacket हा leather apparel असल्यामुळे source answer Chapter 42 आहे.", "golden": "Leather Jacket → Chapter 42"}, {"no": 68, "q": "Q68. In case the importer is not satisfied with the test report, can he request for re-test?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "Yes, only after filing appeal against the test report"}, {"letter": "C", "text": "Yes, only in case of drugs and cosmetics"}, {"letter": "D", "text": "No"}], "answer": "A", "answer_text": "Yes", "explanation": "Importer ला laboratory test report बाबत genuine objection असल्यास re-test request करता येते. Source नुसार त्यासाठी आधी appeal file करणे compulsory नाही आणि हे फक्त drugs/cosmetics पुरते limited नाही.", "golden": "Unsatisfactory Test Report → Re-test can be requested"}, {"no": 69, "q": "Q69. A Customs Broker licence can be—", "options": [{"letter": "A", "text": "Only i"}, {"letter": "B", "text": "Both i and ii"}, {"letter": "C", "text": "None of i and ii"}, {"letter": "D", "text": "Only ii"}], "answer": "C", "answer_text": "None of i and ii", "explanation": "Customs Broker Licensing Regulations, 2018 नुसार Customs Broker licence non-transferable and non-saleable आहे. म्हणजे licence: दुसऱ्या broker ला sell करता येत नाही दुसऱ्या broker ला transfer करता येत नाही", "golden": "CB Licence → Non-transferable + Non-saleable"}, {"no": 70, "q": "Q70. Whether MEIS/SEIS scrips can be used for payment of IGST and Compensation Cess?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "Yes, subject to permission of DGFT"}, {"letter": "C", "text": "Yes, subject to permission of proper officer"}, {"letter": "D", "text": "No"}], "answer": "D", "answer_text": "No", "explanation": "Source नुसार MEIS/SEIS scrips चा उपयोग IGST किंवा Compensation Cess payment साठी करता येत नाही.", "golden": "MEIS/SEIS Scrip → IGST & Compensation Cess payment नाही 📘 Q71–80"}, {"no": 71, "q": "Q71. “Importer” as per the Customs Act, 1962 includes—", "options": [{"letter": "A", "text": "Only i"}, {"letter": "B", "text": "Only ii"}, {"letter": "C", "text": "Only iii"}, {"letter": "D", "text": "i, ii and iii"}], "answer": "D", "answer_text": "i, ii and iii", "explanation": "Customs Act, Section 2 मधील Importer definition broad आहे. यात: Owner Beneficial owner स्वतःला importer म्हणून represent करणारी व्यक्ती यांचा समावेश होतो.", "golden": "Importer = Owner + Beneficial Owner + Person holding himself out as importer"}, {"no": 72, "q": "Q72. Which export benefits can also be taken while exporting under EPCG Scheme?", "options": [{"letter": "A", "text": "Only i"}, {"letter": "B", "text": "Only ii"}, {"letter": "C", "text": "Only iii"}, {"letter": "D", "text": "i, ii and iii"}], "answer": "D", "answer_text": "i, ii and iii", "explanation": "EPCG = Export Promotion Capital Goods Scheme. Source नुसार EPCG अंतर्गत export करताना prescribed conditions subject to इतर export benefits जसे: Advance Authorisation DFIA Duty Drawback घेता येऊ शकतात. पण double benefit घेता येणार नाही—applicable conditions comply करणे आवश्यक आहे.", "golden": "EPCG + Other Export Benefits → Allowed subject to conditions"}, {"no": 73, "q": "Q73. “New Pneumatic Rubber Tyres” are classifiable under which Chapter?", "options": [{"letter": "A", "text": "Chapter 59"}, {"letter": "B", "text": "Chapter 68"}, {"letter": "C", "text": "Chapter 19"}, {"letter": "D", "text": "Chapter 40"}], "answer": "D", "answer_text": "Chapter 40", "explanation": "Rubber आणि rubber articles Chapter 40 मध्ये येतात. New pneumatic rubber tyres साठी relevant heading 4011 आहे.", "golden": "New Pneumatic Rubber Tyres → Chapter 40"}, {"no": 74, "q": "Q74. Status of Bill of Entry can be tracked by importer on the—", "options": [{"letter": "A", "text": "CBIC Site"}, {"letter": "B", "text": "ICEGATE site"}, {"letter": "C", "text": "India portal site"}, {"letter": "D", "text": "None of the Above"}], "answer": "B", "answer_text": "ICEGATE", "explanation": "ICEGATE = Indian Customs Electronic Gateway. Importer आपल्या Bill of Entry ची: Filing status Assessment Duty payment Clearance status इत्यादी माहिती track करू शकतो.", "golden": "Bill of Entry Status → ICEGATE"}, {"no": 75, "q": "Q75. Import of second-hand goods other than capital goods is—", "options": [{"letter": "A", "text": "Restricted"}, {"letter": "B", "text": "Prohibited"}, {"letter": "C", "text": "Freely importable"}, {"letter": "D", "text": "Importable with certain conditions"}], "answer": "A", "answer_text": "Restricted", "explanation": "Source नुसार second-hand goods, other than capital goods, restricted category मध्ये येतात. म्हणून DGFT requirements/authorisation लागू होऊ शकते.", "golden": "Second-hand Goods (other than Capital Goods) → Restricted"}, {"no": 76, "q": "Q76. A self-assessed Bill of Entry—", "options": [{"letter": "A", "text": "Can be re-assessed by proper officer of Customs"}, {"letter": "B", "text": "Cannot be re-assessed by proper officer"}, {"letter": "C", "text": "Can be reassessed only after permission of Chief Commissioner"}, {"letter": "D", "text": "Can be re-assessed only after serving notice to importer"}], "answer": "A", "answer_text": "", "explanation": "Customs Act Section 17(4) नुसार self-assessed Bill of Entry मध्ये assessment incorrect/incomplete असल्याचे proper officer ला वाटल्यास तो re-assess करू शकतो.", "golden": "Self Assessment → Proper Officer can Re-assess"}, {"no": 77, "q": "Q77. Which Export Promotion Scheme is formulated and administered by Ministry of Finance?", "options": [{"letter": "A", "text": "DEPB"}, {"letter": "B", "text": "Duty Drawback"}, {"letter": "C", "text": "EPCG"}, {"letter": "D", "text": "DFIA"}], "answer": "B", "answer_text": "Duty Drawback", "explanation": "Source नुसार Duty Drawback Scheme Ministry of Finance अंतर्गत formulated/administered आहे. EPCG/DFIA सारख्या schemes DGFT framework शी संबंधित आहेत.", "golden": "Ministry of Finance → Duty Drawback"}, {"no": 78, "q": "Q78. What is ITC (HS)?", "options": [{"letter": "A", "text": "Important Trade Classification (Harmonized System)"}, {"letter": "B", "text": "Import Trade Classification (Harmonized and Systematic)"}, {"letter": "C", "text": "Import Trade Classes (Harmonized System)"}, {"letter": "D", "text": "Import Trade Classification (Harmonized System)"}], "answer": "D", "answer_text": "", "explanation": "Source नुसार: ITC (HS) = Import Trade Classification (Harmonized System) भारतामध्ये import-export goods चे classification करण्यासाठी हे वापरले जाते. हे 8-digit classification system आहे. याचा उपयोग: Import/Export policy Customs duty Trade statistics यासाठी होतो.", "golden": "ITC(HS) = Import Trade Classification (Harmonized System)"}, {"no": 79, "q": "Q79. Can an importer pay duty voluntarily to avoid payment of interest pending final assessment?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "No, he should request the department for early final assessment"}, {"letter": "C", "text": "Yes"}, {"letter": "D", "text": "None of the Above"}], "answer": "C", "answer_text": "Yes", "explanation": "Provisional assessment चालू असताना importer voluntarily additional duty pay करू शकतो. यामुळे final assessment पर्यंत duty amount वर लागणाऱ्या interest liability ला avoid/reduce करण्याचा फायदा होतो.", "golden": "Provisional Assessment → Voluntary Duty Payment → Interest Liability avoid"}, {"no": 80, "q": "Q80. Goods are warehoused and Ex-bond Bill of Entry is filed after 90 days but before one year.", "options": [{"letter": "A", "text": "Goods can be cleared without payment of duty"}, {"letter": "B", "text": "Goods can be removed for home consumption with permission of Commissioner"}, {"letter": "C", "text": "Goods should be released to the owner"}, {"letter": "D", "text": "Goods can be cleared only on payment of duty with applicable interest"}], "answer": "D", "answer_text": "", "explanation": "Source नुसार goods warehouse मध्ये ठेवले आहेत आणि 90 दिवसांनंतर पण one year च्या आत Ex-bond Bill of Entry file केली आहे, तर goods clear करता येतात; मात्र prescribed period नंतरच्या delay मुळे applicable interest भरावा लागतो.", "golden": "Warehoused Goods > 90 Days → Duty + Applicable Interest"}, {"no": 81, "q": "Q81. Can an importer relinquish the title to the goods and abandon the same?", "options": [{"letter": "A", "text": "No, once the goods have been imported, he cannot abandon the same"}, {"letter": "B", "text": "Yes, he can abandon the goods before the order for clearance has been given by the proper officer for home consumption or warehousing, provided no offence has been committed"}, {"letter": "C", "text": "Yes, only with the prior approval of Assistant Commissioner"}, {"letter": "D", "text": "None of the Above"}], "answer": "B", "answer_text": "", "explanation": "Customs Act Section 23 नुसार importer goods चा title relinquish करून goods abandon करू शकतो, पण: clearance order मिळण्यापूर्वी home consumption किंवा warehousing साठी आणि goods बाबत offence committed नसावा.", "golden": "Section 23 → Abandonment before clearance order"}, {"no": 82, "q": "Q82. Who pays the Customs Duty if goods are pilfered after they are unloaded but before they are cleared from the port?", "options": [{"letter": "A", "text": "Custodian"}, {"letter": "B", "text": "Importer"}, {"letter": "C", "text": "Customs Broker"}, {"letter": "D", "text": "No one because goods are not available"}], "answer": "A", "answer_text": "Custodian", "explanation": "Customs Act Section 45(3) नुसार goods port मध्ये उतरवल्यानंतर आणि clearance/warehousing आधी pilfer झाले तर custodian customs duty साठी liable असतो. Importer ला त्या परिस्थितीत जबाबदार धरले जात नाही.", "golden": "Pilferage before clearance → Custodian pays duty"}, {"no": 83, "q": "Q83. ISPM 15 standards apply to import and export of—", "options": [{"letter": "A", "text": "Plywood"}, {"letter": "B", "text": "Wooden Pallets"}, {"letter": "C", "text": "Wood Pulp"}, {"letter": "D", "text": "Sawn Wood"}], "answer": "B", "answer_text": "Wooden Pallets", "explanation": "ISPM 15 = International Standards for Phytosanitary Measures No. 15. International trade मध्ये वापरल्या जाणाऱ्या wood packaging material, जसे wooden pallets, crates आणि dunnage यांना ISPM 15 requirements लागू होतात. उद्देश: untreated wood मधून pests/diseases spread होऊ नयेत.", "golden": "ISPM 15 → Wooden Packaging/Pallets"}, {"no": 84, "q": "Q84. Goods are imported at Nhava Sheva Port and transported to ICD Tughlakabad. Whether freight from Nhava Sheva to ICD shall be added in assessable value?", "options": [{"letter": "A", "text": "Yes, 20% of FOB Value"}, {"letter": "B", "text": "Yes, actual freight amount from Nhava Sheva to ICD"}, {"letter": "C", "text": "No"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "No", "explanation": "Nhava Sheva हे place of importation आहे. त्यानंतर Nhava Sheva ते ICD Tughlakabad हा inland movement आहे. Source नुसार हा transshipment cost असल्यामुळे assessable value मध्ये add केला जात नाही.", "golden": "Place of Importation नंतरचा inland transshipment freight → Not included"}, {"no": 85, "q": "Q85. What needs to be paid if the warehoused goods remain in the warehouse beyond the permissible warehousing period?", "options": [{"letter": "A", "text": "Full amount of duty together with interest, fine and penalty"}, {"letter": "B", "text": "Full amount of duty along with applicable interest"}, {"letter": "C", "text": "Applicable fine and penalty"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "", "explanation": "Customs Act Section 72(1)(b) नुसार permissible warehousing period मध्ये goods clear झाले नाहीत तर importer वर: Full customs duty Interest Fine Penalty लागू होऊ शकतात.", "golden": "Warehousing period expired → Duty + Interest + Fine + Penalty"}, {"no": 86, "q": "Q86. Which is not relevant for the purpose of classification in case of imported goods?", "options": [{"letter": "A", "text": "Chapter Note in Customs Tariff"}, {"letter": "B", "text": "Section Note in Customs Tariff"}, {"letter": "C", "text": "HSN Explanatory Note"}, {"letter": "D", "text": "Foreign Trade Policy"}], "answer": "D", "answer_text": "Foreign Trade Policy", "explanation": "Customs classification साठी relevant references: Section Notes Chapter Notes HSN Explanatory Notes Foreign Trade Policy मुख्यतः import/export policy, licensing आणि restrictions साठी आहे; tariff classification करण्यासाठी relevant reference नाही.", "golden": "Classification → Section Note + Chapter Note + HSN FTP → Classification reference नाही"}, {"no": 87, "q": "Q87. EODC in respect of Advance Authorisation stands for—", "options": [{"letter": "A", "text": "Export Order for Duties and Cess"}, {"letter": "B", "text": "Export Order for Duty Certificate"}, {"letter": "C", "text": "Export Obligation Discharge Certificate"}, {"letter": "D", "text": "None of the Above"}], "answer": "C", "answer_text": "Export Obligation Discharge Certificate", "explanation": "EODC = Export Obligation Discharge Certificate. Advance Authorisation मध्ये exporter ला specified export obligation पूर्ण करावी लागते. ती पूर्ण केल्यानंतर EODC घेतले जाते.", "golden": "EODC = Export Obligation Discharge Certificate"}, {"no": 88, "q": "Q88. The goods imported are damaged due to heavy rains and floods while being in the custody of custodian. Which is correct?", "options": [{"letter": "A", "text": "The custodian has to pay the requisite duty"}, {"letter": "B", "text": "The proper officer can give abatement on duty payable for the damage caused"}, {"letter": "C", "text": "The duty has to be paid by importer as the goods have already been imported"}, {"letter": "D", "text": "None of the Above"}], "answer": "B", "answer_text": "", "explanation": "Customs Act Section 22 damaged किंवा deteriorated goods बाबत abatement of duty ची provision देते. Goods custodian च्या custody मध्ये असताना natural causes मुळे damage झाल्यास proper officer परिस्थितीनुसार duty payable मध्ये abatement देऊ शकतो.", "golden": "Damaged/Deteriorated Goods → Section 22 → Abatement of Duty"}, {"no": 89, "q": "Q89. As per the Legal Metrology (Packaged Commodities) Rules, 2011, which of the following need not be mandatorily declared on the package of imported food items?", "options": [{"letter": "A", "text": "Name of Country of Origin of Manufacture"}, {"letter": "B", "text": "Best before/use by date, month and year"}, {"letter": "C", "text": "Name and address of the Manufacturer"}, {"letter": "D", "text": "Bar Code or QR code"}], "answer": "D", "answer_text": "Bar Code or QR Code", "explanation": "Imported packaged food वर अनेक mandatory declarations असतात, जसे: Country of origin Best before/use by Manufacturer details पण Bar Code/QR Code या rules अंतर्गत mandatory declaration नाही.", "golden": "Legal Metrology mandatory declarations → Barcode/QR Code not mandatory"}, {"no": 90, "q": "Q90. A Bill of Entry can be presented not exceeding ____ days prior to the arrival of vessel?", "options": [{"letter": "A", "text": "14 days"}, {"letter": "B", "text": "30 days"}, {"letter": "C", "text": "60 days"}, {"letter": "D", "text": "None of the Above"}], "answer": "B", "answer_text": "30 days", "explanation": "Customs Act Section 46(3) नुसार Bill of Entry vessel च्या expected arrival च्या 30 days prior पर्यंत present करता येतो. यामुळे importer ला advance clearance process सुरू करता येतो.", "golden": "Advance Bill of Entry → Maximum 30 Days before arrival"}, {"no": 91, "q": "Q91. In case of import by air where cost of transport up to the place of importation is available, such cost shall not exceed which percentage of FOB value?", "options": [{"letter": "A", "text": "20%"}, {"letter": "B", "text": "21.125%"}, {"letter": "C", "text": "1.125%"}, {"letter": "D", "text": "1%"}], "answer": "A", "answer_text": "20%", "explanation": "Customs Valuation Rules, 2007 मधील Rule 10 नुसार air import मध्ये freight cost available असल्यास assessable value साठी freight FOB value च्या 20% पेक्षा जास्त घेतला जात नाही. उदा. FOB = ₹1,00,000 Maximum freight = ₹20,000", "golden": "Air Freight → Maximum 20% of FOB"}, {"no": 92, "q": "Q92. Whether part delivery of an import consignment in a Bill of Entry is possible?", "options": [{"letter": "A", "text": "Yes, in specified circumstances like non-receipt of some of the containers etc."}, {"letter": "B", "text": "Yes, as per the choice of importer/Customs Brokers"}, {"letter": "C", "text": "No, full consignment has to be delivered at one go"}, {"letter": "D", "text": "None of the Above"}], "answer": "A", "answer_text": "", "explanation": "Part delivery सामान्यतः automatic right नाही. पण exceptional circumstances, जसे काही containers receive न होणे, damage किंवा unloading delay, अशा परिस्थितीत proper officer परिस्थिती पाहून part delivery allow करू शकतो.", "golden": "Part Delivery → Allowed in specified/exceptional circumstances"}, {"no": 93, "q": "Q93. The rate of duty in respect of a Bill of Entry for home consumption is taken as—", "options": [{"letter": "A", "text": "The rate as on the presentation of BE for home consumption or date of entry inwards whichever is later"}, {"letter": "B", "text": "The rate as on the actual clearance of goods for home consumption"}, {"letter": "C", "text": "The rate as on the date of examination of goods"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "", "explanation": "Customs Act Section 15(1)(a) नुसार home consumption साठी applicable duty rate: Date of presentation of Bill of Entry OR Entry Inwards date — whichever is later.", "golden": "Rate of Duty → BE Presentation / Entry Inwards → Later Date"}, {"no": 94, "q": "Q94. How many attempts are allowed to a person to clear the examination prescribed under Regulation 6 of Customs Broker Licensing Regulations, 2018?", "options": [{"letter": "A", "text": "4 attempts"}, {"letter": "B", "text": "6 attempts"}, {"letter": "C", "text": "3 attempts"}, {"letter": "D", "text": "5 attempts"}], "answer": "B", "answer_text": "6 attempts", "explanation": "CBLR Regulation 6 नुसार Customs Broker licence मिळवण्यासाठी prescribed examination pass करण्यासाठी candidate ला maximum 6 attempts दिले जातात. Written examination ला appearance देखील attempt म्हणून count होते.", "golden": "CB Examination → Maximum 6 Attempts"}, {"no": 95, "q": "Q95. What is the rate of interest applicable if the refund is delayed beyond 3 months from the date of final assessment?", "options": [{"letter": "A", "text": "12%"}, {"letter": "B", "text": "15%"}, {"letter": "C", "text": "18%"}, {"letter": "D", "text": "6%"}], "answer": "D", "answer_text": "6%", "explanation": "Customs Act Section 27A नुसार refund application मिळाल्यापासून prescribed period मध्ये refund न दिल्यास delayed refund वर interest लागू होतो. Source मध्ये applicable rate 6% per annum दिला आहे.", "golden": "Delayed Customs Refund → 6% p.a."}, {"no": 96, "q": "Q96. All edible products can be imported only if their valid shelf life is not less than—", "options": [{"letter": "A", "text": "50% of original shelf life or 3 months before expiry, whichever is less"}, {"letter": "B", "text": "60% of original shelf life or 3 months before expiry, whichever is less"}, {"letter": "C", "text": "70% of original shelf life or 3 months before expiry, whichever is less"}, {"letter": "D", "text": "80% of original shelf life or 3 months before expiry, whichever is less"}], "answer": "B", "answer_text": "", "explanation": "Imported edible products साठी source मध्ये condition दिली आहे की import वेळी valid shelf life original shelf life च्या 60% किंवा expiry पूर्वी 3 months, यापैकी whichever is less असावी.", "golden": "Edible Products → 60% Shelf Life / 3 Months → Whichever is less"}, {"no": 97, "q": "Q97. Whether Customs Brokers’ employees issued photo identity card under Form F, G and H are authorized to sign declarations filed before Customs?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No, only Form F and G are authorised to sign the documents"}, {"letter": "C", "text": "No, only Form F and H are authorised to sign the documents"}, {"letter": "D", "text": "No, only Form G and H are authorised to sign the documents"}], "answer": "B", "answer_text": "Only Form F and G", "explanation": "CBLR Regulation 13 नुसार: Form F — Customs Broker licence holder/authorized person Form G — examination-qualified employee Source नुसार Form F आणि Form G holders declarations/documents sign करू शकतात. Form H support staff साठी आहे आणि तो declaration sign करण्यास authorised नाही.", "golden": "Signing Authority → Form F + Form G"}, {"no": 98, "q": "Q98. In case of import of textile, if pre-shipment certificate from a textile testing laboratory accredited to national accreditation agency of country of origin is not available, the sample is to be tested from—", "options": [{"letter": "A", "text": "Textile Committee of Ministry of Textiles"}, {"letter": "B", "text": "CRCL laboratory"}, {"letter": "C", "text": "FSSAI"}, {"letter": "D", "text": "IIT"}], "answer": "A", "answer_text": "Textile Committee of Ministry of Textiles", "explanation": "Textile imports साठी required pre-shipment certificate available नसल्यास source नुसार sample Textile Committee, Ministry of Textiles कडे testing साठी पाठवला जातो.", "golden": "Textile Testing → Textile Committee, Ministry of Textiles"}, {"no": 99, "q": "Q99. What is the duration for sanctioning refund under Section 27 after which interest on such refund is payable by the Department?", "options": [{"letter": "A", "text": "One month"}, {"letter": "B", "text": "Three months"}, {"letter": "C", "text": "Six months"}, {"letter": "D", "text": "One year"}], "answer": "B", "answer_text": "Three months", "explanation": "Section 27A नुसार refund application मिळाल्यानंतर 3 months मध्ये refund न दिल्यास delayed refund वर interest payable होतो. Source मध्ये interest rate 6% per annum दिला आहे.", "golden": "Refund → 3 Months → Delay नंतर Interest"}, {"no": 100, "q": "Q100. Ex-works Value = ₹90,000", "options": [{"letter": "A", "text": "₹60,000"}, {"letter": "B", "text": "₹50,000"}, {"letter": "C", "text": "₹18,000"}, {"letter": "D", "text": "₹20,000"}], "answer": "D", "answer_text": "₹20,000", "explanation": "Air import साठी freight maximum 20% of FOB value. येथे: Ex-works = ₹90,000 Inland Freight = ₹10,000 FOB = ₹90,000 + ₹10,000 = ₹1,00,000 20% of ₹1,00,000 = ₹20,000 Actual ocean freight ₹50,000 आहे, पण allowable freight ₹20,000 पर्यंतच घेतला जाईल.", "golden": "Air Import Freight = Maximum 20% of FOB"}, {"no": 101, "q": "Q101. Whether on finalisation of provisional assessment, if the importer is required to pay duty in addition to the provisionally assessed duty, he is required to pay interest?", "options": [{"letter": "A", "text": "Yes, only if he does not pay the amount within three months"}, {"letter": "B", "text": "Yes, the first day of the month in which the duty is provisionally assessed till the date of payment thereof"}, {"letter": "C", "text": "Yes, date of final assessment till the payment of duty"}, {"letter": "D", "text": "No"}], "answer": "B", "answer_text": "", "explanation": "जर provisional assessment नंतर final assessment मध्ये additional duty payable झाली, तर त्या differential duty वर interest लागू होतो. Source नुसार interest: Provisional assessment झालेल्या महिन्याच्या पहिल्या दिवसापासून → actual payment date पर्यंत मोजला जातो.", "golden": "Provisional Assessment + Higher Duty → Interest from 1st day of provisional assessment month"}, {"no": 102, "q": "Q102. In case of imported goods which are required to comply with Indian Quality Standards (IQS), the exporter of such goods from foreign country must be registered with—", "options": [{"letter": "A", "text": "CBIC"}, {"letter": "B", "text": "Principal Chief Commissioner of Customs"}, {"letter": "C", "text": "Bureau of Indian Standards (BIS)"}, {"letter": "D", "text": "Ministry of Finance"}], "answer": "C", "answer_text": "Bureau of Indian Standards (BIS)", "explanation": "BIS = Bureau of Indian Standards. Indian Quality Standards लागू असलेल्या specified imported products साठी foreign manufacturer/exporter ला prescribed BIS requirements पूर्ण कराव्या लागतात.", "golden": "Indian Quality Standards → BIS"}, {"no": 103, "q": "Q103. If the re-assessment done by the department is contrary to the self-assessment done by the importer, then—", "options": [{"letter": "A", "text": "Self-assessment done by the importer shall prevail"}, {"letter": "B", "text": "Re-assessment done by the department shall prevail"}, {"letter": "C", "text": "Either the importer has to accept the re-assessment in writing or the department has to issue speaking order within fifteen days of re-assessment"}, {"letter": "D", "text": "None of the Above"}], "answer": "C", "answer_text": "", "explanation": "Customs Act Section 17(4)/(5) नुसार proper officer ने importer च्या self-assessment पेक्षा वेगळे reassessment केले तर importer ला ते accept करणे किंवा disagreement असल्यास department ने prescribed speaking order issue करणे आवश्यक आहे. Source मध्ये 15 days चा उल्लेख आहे.", "golden": "Re-assessment differs from Self-assessment → Accept OR Speaking Order"}, {"no": 104, "q": "Q104. What are the mandatory documents that are required to be submitted while presentation of the Bill of Entry?", "options": [{"letter": "A", "text": "Invoice cum packing list, Bill of Lading/Air Way Bill and Country of Origin Certificate"}, {"letter": "B", "text": "Invoice cum packing list and Bill of Lading or Air Way Bill"}, {"letter": "C", "text": "Invoice cum packing list, Bill of Lading/Air Way Bill, Country of Origin Certificate, Safety Data and Certificate of Analysis"}, {"letter": "D", "text": "Invoice cum packing list, Bill of Lading/Air Way Bill, Country of Origin Certificate, Purchase Order and Letter of Credit"}], "answer": "B", "answer_text": "", "explanation": "Source नुसार mandatory basic documents: Invoice cum Packing List Bill of Lading / Air Way Bill Country of Origin Certificate, Safety Data, Letter of Credit इत्यादी documents goods/benefit/condition नुसार लागू होऊ शकतात; प्रत्येक case मध्ये mandatory नाहीत.", "golden": "BOE Basic Documents → Invoice/Packing List + BL/AWB"}, {"no": 105, "q": "Q105. No order confiscating any goods or imposing any penalty shall be made under the Customs Act, 1962 unless the owner of the goods or such person is—", "options": [{"letter": "A", "text": "Only i"}, {"letter": "B", "text": "Only ii"}, {"letter": "C", "text": "Only iii"}, {"letter": "D", "text": "i, ii and iii"}], "answer": "D", "answer_text": "i, ii and iii", "explanation": "Section 122A / principles of natural justice नुसार confiscation किंवा penalty करण्यापूर्वी person ला: Proposed action चे grounds सांगणारी notice Written representation ची opportunity Personal hearing दिली पाहिजे.", "golden": "Confiscation/Penalty → Notice + Representation + Personal Hearing"}, {"no": 106, "q": "Q106. As per the Bill of Entry (Electronic Integrated Declaration and Paperless Processing) Regulations, 2018, for how many years must a Customs Broker retain the assessed copy of the Bill of Entry and original supporting documents?", "options": [{"letter": "A", "text": "3 years"}, {"letter": "B", "text": "5 years"}, {"letter": "C", "text": "7 years"}, {"letter": "D", "text": "10 years"}], "answer": "B", "answer_text": "5 years", "explanation": "Customs Broker ने assessed Bill of Entry आणि original supporting documents 5 years retain करायचे आहेत. याचा उपयोग Customs authorities ना future verification/audit साठी होतो.", "golden": "CB Documents Retention → 5 Years"}, {"no": 107, "q": "Q107. In case of Advance Bill of Entry, the rate of exchange is to be taken as on which date?", "options": [{"letter": "A", "text": "Date of presentation"}, {"letter": "B", "text": "Date of final entry"}, {"letter": "C", "text": "Date of assessment"}, {"letter": "D", "text": "Date of payment of duty"}], "answer": "A", "answer_text": "Date of presentation", "explanation": "Source नुसार Advance Bill of Entry मध्ये exchange rate ठरवताना Bill of Entry first presented झालेली date घेतली जाते.", "golden": "Advance BOE → Exchange Rate = Date of Presentation 📘 Q108–120"}, {"no": 108, "q": "Q108. Which Valuation Rules are currently applicable for import of goods?", "options": [{"letter": "A", "text": "Customs Valuation Rules, 1963"}, {"letter": "B", "text": "Customs Valuation (Determination of Price of Imported Goods) Rules, 1988"}, {"letter": "C", "text": "Customs Valuation (Determination of Price of Imported Goods) Rules, 2007"}, {"letter": "D", "text": "Customs Valuation (Determination of Price of Export Goods) Rules, 2007"}], "answer": "C", "answer_text": "", "explanation": "Imported goods च्या valuation साठी Customs Valuation (Determination of Value of Imported Goods) Rules, 2007 हा relevant framework आहे. Source मध्ये option C च्या wording मध्ये “Determination of Price” असे आहे.", "golden": "Imported Goods Valuation → Customs Valuation Rules, 2007"}, {"no": 109, "q": "Q109. Who has the authority to compound offences under the Customs Act, 1962?", "options": [{"letter": "A", "text": "CBIC"}, {"letter": "B", "text": "Central Government"}, {"letter": "C", "text": "Principal Chief Commissioner of Customs / Chief Commissioner of Customs"}, {"letter": "D", "text": "Commissioner of Customs"}], "answer": "C", "answer_text": "", "explanation": "Customs Act Section 137(3) अंतर्गत offences compound करण्याचा authority source नुसार Principal Chief Commissioner / Chief Commissioner of Customs कडे आहे. Compounding म्हणजे prescribed amount भरून prosecution टाळण्याची/settle करण्याची statutory mechanism.", "golden": "Compounding of Customs Offence → Principal Chief Commissioner / Chief Commissioner"}, {"no": 110, "q": "Q110. What is the value of bond to be submitted by an importer while presenting a warehouse Bill of Entry?", "options": [{"letter": "A", "text": "Equivalent to the value of consignment"}, {"letter": "B", "text": "Double the duty assessed in the warehouse Bill of Entry"}, {"letter": "C", "text": "Triple the duty amount assessed in the warehouse Bill of Entry"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "Triple the duty amount assessed", "explanation": "Customs Act Section 59(1) नुसार warehousing साठी importer ला bond execute करावा लागतो. Source नुसार bond amount: 3 × duty assessed", "golden": "Warehousing Bond → 3 Times Duty"}, {"no": 111, "q": "Q111. A warehouse Bill of Entry is presented and goods are warehoused in Customs Bonded Warehouse. The goods are cleared after four months. Is interest payable on the duty?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "Yes, for the period after ninety days from warehousing of goods"}, {"letter": "C", "text": "Yes, for the period after sixty days from warehousing of goods"}, {"letter": "D", "text": "No"}], "answer": "B", "answer_text": "", "explanation": "Source नुसार warehoused goods 90 days पेक्षा जास्त warehouse मध्ये राहिल्यास interest payable होतो. येथे goods 4 months नंतर clear झाले आहेत. म्हणून 90 days नंतरच्या period वर interest लागू होतो.", "golden": "Warehousing > 90 Days → Interest"}, {"no": 112, "q": "Q112. The time limit for realisation of export proceeds is fixed by.... under ......", "options": [{"letter": "A", "text": "Ministry of Finance – Customs Act, 1962"}, {"letter": "B", "text": "RBI – FEMA, 1999"}, {"letter": "C", "text": "Ministry of Commerce – FTP, 2015-20"}, {"letter": "D", "text": "RBI – Customs Act, 1962"}], "answer": "B", "answer_text": "RBI – FEMA, 1999", "explanation": "Export proceeds भारतात realise/repatriate करण्याच्या foreign exchange requirements चे regulation RBI under FEMA, 1999 करते. FEMA = Foreign Exchange Management Act.", "golden": "Export Proceeds Realisation → RBI + FEMA"}, {"no": 113, "q": "Q113. A Bill of Entry is presented by an importer on 15.03.2019 and is facilitated by RMS as “No assessment and no examination”. When must duty be paid to avoid interest liability?", "options": [{"letter": "A", "text": "On 17.03.2019"}, {"letter": "B", "text": "On 16.03.2019"}, {"letter": "C", "text": "On 15.03.2019"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "On 15.03.2019", "explanation": "Bill of Entry RMS मध्ये No assessment and no examination असल्यास importer ने duty payment मध्ये delay करू नये. Source नुसार BOE 15.03.2019 रोजी filed आहे, म्हणून interest avoid करण्यासाठी duty त्याच दिवशी भरायची.", "golden": "RMS – No Assessment/No Examination → Duty same day"}, {"no": 114, "q": "Q114. What is a “Bank Guarantee”?", "options": [{"letter": "A", "text": "It is a type of FD"}, {"letter": "B", "text": "It is a sum paid to the importer"}, {"letter": "C", "text": "It is a guarantee against default"}, {"letter": "D", "text": "None of the above"}], "answer": "C", "answer_text": "It is a guarantee against default", "explanation": "Bank Guarantee म्हणजे bank कडून दिलेली financial guarantee. Applicant ने obligation/default केला तर specified conditions नुसार bank beneficiary ला payment करण्याची assurance देते. Customs मध्ये duty, exemption conditions, warehousing obligations इत्यादींसाठी BG वापरली जाऊ शकते.", "golden": "Bank Guarantee → Guarantee against Default"}, {"no": 115, "q": "Q115. IEC has to be obtained from which department?", "options": [{"letter": "A", "text": "DGFT"}, {"letter": "B", "text": "Customs"}, {"letter": "C", "text": "GST"}, {"letter": "D", "text": "None of the above"}], "answer": "A", "answer_text": "DGFT", "explanation": "IEC = Importer Exporter Code. IEC DGFT (Directorate General of Foreign Trade) कडून मिळतो. Import/export business साठी हा important registration/code आहे.", "golden": "IEC → DGFT"}, {"no": 116, "q": "Q116. Customs Duty on imports is paid on—", "options": [{"letter": "A", "text": "CIF value"}, {"letter": "B", "text": "CIF plus 1% value"}, {"letter": "C", "text": "FOB value"}, {"letter": "D", "text": "None of the Above"}], "answer": "A", "answer_text": "CIF value", "explanation": "Customs valuation मध्ये imported goods ची assessable value सामान्यतः CIF basis वर ठरते. CIF = Cost + Insurance + Freight", "golden": "Import Customs Value → CIF"}, {"no": 117, "q": "Q117. For contravention of any of the provisions of Customs (Finalization of Provisional Assessment) Regulations, 2018, penalty can be imposed on—", "options": [{"letter": "A", "text": "Only Customs Broker"}, {"letter": "B", "text": "Only authorized representative"}, {"letter": "C", "text": "Only Importer/Exporter"}, {"letter": "D", "text": "Customs Broker and/or Importer/Exporter and/or authorized representative"}], "answer": "D", "answer_text": "", "explanation": "Source नुसार contravention साठी responsibility परिस्थितीनुसार: Customs Broker Importer/Exporter Authorized Representative यांच्यावर लागू होऊ शकते. म्हणून D योग्य आहे.", "golden": "Contravention → CB and/or Importer/Exporter and/or Authorized Representative"}, {"no": 118, "q": "Q118. If no notice in respect of seized goods is given within the period of six months, who has the power to extend the period for giving notice?", "options": [{"letter": "A", "text": "Additional Commissioner of Customs"}, {"letter": "B", "text": "Assistant Commissioner of Customs"}, {"letter": "C", "text": "Joint Commissioner of Customs"}, {"letter": "D", "text": "Principal Commissioner/Commissioner
